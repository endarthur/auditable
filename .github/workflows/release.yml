name: Build & Sign Release

on:
  release:
    types: [created]

permissions:
  contents: write
  pages: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # All distributables are built here (only auditable.html is also committed;
      # works/works-all/editions/examples are de-committed and produced fresh).
      - name: Build all targets
        run: |
          node build.js
          node build.js --target=works
          node build.js --target=works-all
          node build.js --target=works-core
          node build.js --target=packages
          node build.js --target=auditable-py
          node build.js --target=auditable-geo
          node build.js --target=scan
          node build.js --target=lamina
          node gen_examples.js
          node gen_gallery.js
          node make_encrypted_example.mjs
          # The package catalog is a directory (registry.json + dist/*.gcupkg) — zip
          # it as one release asset for the Works repo to consume + serve same-origin.
          (cd packages && zip -qr ../packages.zip .)
        env:
          AUDITABLE_PUBLIC_KEY: ${{ vars.AUDITABLE_PUBLIC_KEY }}
          AUDITABLE_RELEASE: ${{ github.event.release.tag_name }}

      # Hard-fail if the signing key is absent — never ship an unsigned release.
      - name: Sign signed artifacts
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          if [ -z "$ED25519_PRIVATE_KEY" ]; then
            echo "::error::ED25519_PRIVATE_KEY is not set — refusing to publish an unsigned release."
            exit 1
          fi
          node sign.js auditable.html
          node sign.js works.html

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            auditable.html \
            works.html \
            works-all.html \
            works-core.html \
            packages.zip \
            lamina.html \
            editions/auditable-py.html \
            editions/auditable-geo.html \
            --clobber

      - name: Deploy to GitHub Pages
        env:
          AUDITABLE_PUBLIC_KEY: ${{ vars.AUDITABLE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          mkdir -p _pages/scan _pages/editions _pages/lib
          # Landing page + the notebook. (Works has its own home: gentropic.org/works,
          # published by the gentropic/works repo from this release — see the trigger below.)
          cp landing/index.html _pages/index.html
          cp auditable.html _pages/
          cp editions/auditable-py.html editions/auditable-geo.html _pages/editions/
          # Language-toy bundles, lazy-loaded by the landing page's playground.
          cp ext/adder/index.js _pages/lib/adder.js
          cp ext/soft/index.js _pages/lib/soft.js
          cp ext/atra/index.js _pages/lib/atra.js
          # Example notebooks + generated gallery → /examples/ (clickable).
          find examples -name '*.html' -exec cp --parents {} _pages/ \;
          # Scanner PWA.
          cp scan/index.html scan/manifest.json scan/sw.js _pages/scan/
          # Lightweight update manifest (version + release notes).
          node -e "
            const fs = require('fs');
            fs.writeFileSync('_pages/version.json', JSON.stringify({
              version: process.env.RELEASE_TAG,
              notes: process.env.RELEASE_BODY || ''
            }));
          "
          # Deploy as a fresh orphan commit — gh-pages never accumulates history.
          cd _pages
          git init
          git checkout -b gh-pages
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${{ github.event.release.tag_name }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages

      # Tell the Works repo to rebuild its PWA from this fresh release.
      - name: Trigger Works PWA rebuild
        env:
          GH_TOKEN: ${{ secrets.WORKS_DISPATCH_TOKEN }}
        run: gh workflow run publish.yml --repo gentropic/works --ref main

      # Tell the lamina repo to rebuild its PWA from this fresh release. Guarded:
      # if LAMINA_DISPATCH_TOKEN isn't set yet, skip rather than fail the release
      # (lamina's publish.yml also runs on its own push + falls back to its seed).
      - name: Trigger lamina PWA rebuild
        env:
          GH_TOKEN: ${{ secrets.LAMINA_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run publish.yml --repo gentropic/lamina --ref main
          else
            echo "LAMINA_DISPATCH_TOKEN unset — skipping lamina trigger (push-deploy still works)."
          fi
