name: Build & Sign Release

on:
  release:
    types: [created]

permissions:
  contents: write
  pages: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # All distributables are built here (only auditable.html is also committed;
      # works/works-all/editions/examples are de-committed and produced fresh).
      - name: Build all targets
        run: |
          node build.js
          node build.js --target=works
          node build.js --target=works-all
          node build.js --target=auditable-py
          node build.js --target=auditable-geo
          node build.js --target=scan
          node gen_examples.js
          node gen_gallery.js
          node make_encrypted_example.mjs
        env:
          AUDITABLE_PUBLIC_KEY: ${{ vars.AUDITABLE_PUBLIC_KEY }}
          AUDITABLE_RELEASE: ${{ github.event.release.tag_name }}

      # Hard-fail if the signing key is absent — never ship an unsigned release.
      - name: Sign signed artifacts
        env:
          ED25519_PRIVATE_KEY: ${{ secrets.ED25519_PRIVATE_KEY }}
        run: |
          if [ -z "$ED25519_PRIVATE_KEY" ]; then
            echo "::error::ED25519_PRIVATE_KEY is not set — refusing to publish an unsigned release."
            exit 1
          fi
          node sign.js auditable.html
          node sign.js works.html

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            auditable.html \
            works.html \
            works-all.html \
            editions/auditable-py.html \
            editions/auditable-geo.html \
            --clobber

      - name: Deploy to GitHub Pages
        env:
          AUDITABLE_PUBLIC_KEY: ${{ vars.AUDITABLE_PUBLIC_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          mkdir -p _pages/scan _pages/editions _pages/lib
          # Landing page + single-file apps (signed auditable + works ride to the site).
          cp landing/index.html _pages/index.html
          cp auditable.html _pages/
          cp works.html _pages/
          cp editions/auditable-py.html editions/auditable-geo.html _pages/editions/
          # Language-toy bundles, lazy-loaded by the landing page's playground.
          cp ext/adder/index.js _pages/lib/adder.js
          cp ext/soft/index.js _pages/lib/soft.js
          cp ext/atra/index.js _pages/lib/atra.js
          # Example notebooks + generated gallery → /examples/ (clickable).
          find examples -name '*.html' -exec cp --parents {} _pages/ \;
          # Scanner PWA.
          cp scan/index.html scan/manifest.json scan/sw.js _pages/scan/
          # Lightweight update manifest (version + release notes).
          node -e "
            const fs = require('fs');
            fs.writeFileSync('_pages/version.json', JSON.stringify({
              version: process.env.RELEASE_TAG,
              notes: process.env.RELEASE_BODY || ''
            }));
          "
          # Deploy as a fresh orphan commit — gh-pages never accumulates history.
          cd _pages
          git init
          git checkout -b gh-pages
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy ${{ github.event.release.tag_name }}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
