[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gcu-condenser"
version = "0.1.0"
description = "Block models and big point clouds in a Jupyter notebook — the @gcu/condenser streaming renderer as an anywidget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arthur Endlein Correia" }]
keywords = ["jupyter", "widget", "anywidget", "point cloud", "block model", "mining", "geology", "webgl"]
classifiers = [
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["anywidget>=0.9", "numpy>=1.21"]

[project.optional-dependencies]
# `uv pip install -e ".[dev]"` — everything the example notebook needs
dev = ["jupyterlab>=4", "pandas>=1.5"]

[project.urls]
Homepage = "https://gentropic.org/micro"
Source = "https://github.com/endarthur/auditable"

[tool.hatch.build.targets.wheel]
packages = ["gcu_condenser"]

# the bundled ES module IS the widget — it must ride in the wheel
[tool.hatch.build.targets.wheel.force-include]
"gcu_condenser/static/widget.js" = "gcu_condenser/static/widget.js"
