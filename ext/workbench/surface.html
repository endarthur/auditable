<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Data Workbench</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--au-surface); color: var(--au-fg);
    font: 12px/1.5 ui-sans-serif, 'Barlow', system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 6px 10px; border-bottom: 1px solid var(--au-border); background: var(--au-surface-raised);
  }
  header .title { font-weight: 600; }
  header .spacer { flex: 1; }
  header .status { color: var(--au-fg-soft); font-size: 11px; }
  input, button {
    background: var(--au-surface-bright); color: var(--au-fg);
    border: 1px solid var(--au-border); border-radius: 3px; padding: 3px 8px; font: inherit;
  }
  input.path { width: 280px; font-family: ui-monospace, 'Space Mono', monospace; font-size: 11px; }
  button { cursor: pointer; }
  button:hover { filter: brightness(1.1); }
  .scroll { flex: 1; overflow: auto; padding: 10px 12px; }
  section { margin-bottom: 18px; }
  h2 {
    font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--au-fg-soft); margin: 0 0 6px; font-weight: 600;
  }
  table { border-collapse: collapse; width: 100%; font-size: 11px; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid color-mix(in srgb, var(--au-border) 50%, transparent); white-space: nowrap; }
  th { color: var(--au-fg-soft); font-weight: 600; position: sticky; top: 0; background: var(--au-surface); }
  td.num { text-align: right; font-family: ui-monospace, 'Space Mono', monospace; }
  td.name { font-family: ui-monospace, 'Space Mono', monospace; color: var(--au-fg); }
  .tag {
    display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 10px;
    background: var(--au-surface-bright); color: var(--au-fg-soft); margin-right: 3px;
  }
  .tag.numeric { color: var(--au-info); }
  .tag.categorical { color: var(--au-action); }
  .tag.role { color: var(--au-success); }
  .tag.unit, .tag.analyte { color: var(--au-fg); }
  .conf { color: var(--au-fg-muted); font-size: 10px; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .cat { font-size: 11px; }
  .cat .v { font-family: ui-monospace, 'Space Mono', monospace; }
  .cat .c { color: var(--au-fg-muted); }
  .empty { color: var(--au-fg-soft); padding: 16px 4px; }
  .grid-facet { color: var(--au-fg-soft); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <span class="title">Data Workbench</span>
  <input class="path" id="path" placeholder="/projects/…csv or .omf" spellcheck="false">
  <button id="load">Analyze</button>
  <button id="save" title="Save as a workbench project (project.json + pipeline.json)">Save project</button>
  <span class="spacer"></span>
  <span class="status" id="status">point at a CSV in the workspace</span>
</header>
<div class="scroll" id="out">
  <div class="empty">No data loaded. Type a workspace path (a <code>.csv</code> or an OMF <code>.omf</code> block model, e.g. <code>/projects/blocks.omf</code>) and click Analyze.</div>
</div>
<script type="module">
import { connect } from '@gcu/abus';

/* @theme-init */

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = (v, d = 4) => (v === null || v === undefined || !Number.isFinite(v)) ? '—'
  : (Math.abs(v) >= 1e6 || (v !== 0 && Math.abs(v) < 1e-4)) ? v.toExponential(2) : Number(v.toFixed(d)).toString();

let bus = null;
let view = null;   // { m, summary, path, derives, filter, count, rawCount } — current analysis
let transforms = { derives: [], filter: '' };   // pending calc/filter ops (applied on Analyze)
const status = (s) => { $('status').textContent = s; };
const call = (member, args) => bus.call({ to: 'pipeline', path: '/', interface: 'Pipeline', member }, args);
const sig = (member, args) => bus.signal({ path: '/', interface: 'Surface', member }, args);
const vfsCall = (member, args) => bus.call({ to: 'works', path: '/', interface: 'VFS', member }, args);
const vfsRead = async (p) => { try { return await vfsCall('Read', [p, 'utf8']); } catch { return null; } };
const rid = () => Math.random().toString(36).slice(2, 10);
let projectDir = null;   // set when this surface backs a /projects/<name>/ workbench project
let dirty = false;
const setDirty = (d) => { if (dirty === d) return; dirty = d; sig('DirtyChanged', [d]); };

window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent) return;
  if (!ev.data || ev.data.type !== 'abus:welcome') return;
  try { bus = await connect(ev.data.port, { client: 'workbench' }); }
  catch (e) { status('connect failed: ' + e.message); return; }
  installThemeSubscription(bus);
  try { await bus.claim('workbench-' + (ev.data.tab && ev.data.tab.id || 'x')); } catch { /* */ }

  bus.expose('/', {
    Surface: {
      methods: { Flush: () => flush(), CanClose: () => true, Relocated: () => {} },
      signals: ['DirtyChanged', 'TitleChanged', 'Ready'],
    },
  });

  $('load').addEventListener('click', () => { const p = $('path').value.trim(); if (p) loadPath(p); });
  $('path').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('load').click(); });
  $('save').addEventListener('click', saveProject);

  const path = ev.data.tab && ev.data.tab.path;
  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' },
    [path ? 'Workbench · ' + path.split('/').pop() : 'Data Workbench']);
  bus.signal({ path: '/', interface: 'Surface', member: 'Ready' }, []);

  // A folder with a pipeline.json → restore the workbench project; otherwise the
  // path is a data file to analyze ephemerally (the tool mode).
  if (path) {
    const loaded = await loadProject(path);
    if (!loaded) { $('path').value = path; loadPath(path); }
  }
});

// A new file resets pending transforms; re-analysis (Transform → Analyze) keeps them.
function loadPath(p) { transforms = { derives: [], filter: '' }; projectDir = null; analyze(p); }

// ── workbench project (project.json {kind:workbench} + pipeline.json) ──────
// pipeline.json = { version, data, derives, filter }. Reload restores the data
// path + transforms; Save persists them; Flush writes on tab close.
async function loadProject(dir) {
  const pj = await vfsRead(dir + '/pipeline.json');
  if (!pj) return false;
  let spec; try { spec = JSON.parse(pj); } catch { return false; }
  projectDir = dir;
  transforms = { derives: spec.derives || [], filter: spec.filter || '' };
  sig('TitleChanged', ['Workbench · ' + dir.split('/').pop()]);
  if (spec.data) { $('path').value = spec.data; await analyze(spec.data); }
  setDirty(false);
  return true;
}
async function saveToDisk() {
  if (!projectDir || !view) return;
  await vfsCall('Write', [projectDir + '/pipeline.json',
    JSON.stringify({ version: 1, data: view.path, derives: transforms.derives, filter: transforms.filter }, null, 2)]);
  setDirty(false);
  status('saved · ' + projectDir);
}
async function saveProject() {
  if (!view || !view.path) { status('analyze a file first, then Save project'); return; }
  if (!projectDir) {
    const base = ((view.path.split('/').pop() || 'model').replace(/\.[^.]+$/, '')) || 'model';
    projectDir = '/projects/' + base;
    await vfsCall('MkDir', [projectDir]);
    await vfsCall('Write', [projectDir + '/project.json',
      JSON.stringify({ kind: 'workbench', id: 'p-' + rid(), title: base }, null, 2)]);
    sig('TitleChanged', ['Workbench · ' + base]);
  }
  await saveToDisk();
}
function flush() { if (projectDir) return saveToDisk(); }

// Pick the loader by extension — .omf block models go through load.omf (which
// expands the VolumeElement to a table), everything else through load.csv.
const loadType = (p) => (/\.omf$/i.test(p) ? 'load.omf' : 'load.csv');

// Build the transform chain for a graph: load → calc(per derive) → filter.
// Returns the node list + the id of the final table node and the (raw) sniff
// node — analysis nodes wire their table to `tableNode`, manifest to `manifestNode`.
function transformNodes(path, derives = transforms.derives, filter = transforms.filter) {
  const nodes = [
    { id: 'src', type: loadType(path), params: { path } },
    { id: 'snf', type: 'recon.sniff', wiring: { table: { node: 'src', port: 'table' } } },
  ];
  let last = 'src';
  (derives || []).forEach((d, i) => {
    nodes.push({ id: 'ca' + i, type: 'calc', params: { name: d.name, expr: d.expr }, wiring: { table: { node: last, port: 'table' } } });
    last = 'ca' + i;
  });
  if (filter && filter.trim()) {
    nodes.push({ id: 'flt', type: 'filter', params: { expr: filter }, wiring: { table: { node: last, port: 'table' } } });
    last = 'flt';
  }
  return { nodes, tableNode: last, manifestNode: 'snf' };
}

async function analyze(path) {
  status('analyzing ' + path + ' …');
  const t = transformNodes(path);
  const tbl = { node: t.tableNode, port: 'table' }, man = { node: t.manifestNode, port: 'manifest' };
  const deriveNames = transforms.derives.map((d) => d.name);
  const graph = { nodes: [
    ...t.nodes,
    { id: 'sum', type: 'summary', params: { extraNumeric: deriveNames }, wiring: { table: tbl, manifest: man } },
    { id: 'cnt', type: 'count', wiring: { table: tbl, manifest: man } },
    { id: 'raw', type: 'count', wiring: { table: { node: 'src', port: 'table' }, manifest: man } },
  ] };
  let manifest, summary, worker, count, rawCount;
  try {
    manifest = await call('Pull', [graph, t.manifestNode, 'manifest']);
    summary = await call('Pull', [graph, 'sum', 'summary']);
    count = await call('Pull', [graph, 'cnt', 'count']);
    rawCount = await call('Pull', [graph, 'raw', 'count']);
    worker = await call('WorkerInfo', []);
  } catch (e) { status('error: ' + esc(e.message)); return; }
  render(manifest, summary, path, count, rawCount);
  const mode = worker && worker.lastScanMode === 'parallel' ? `${worker.workers}-worker scan` : 'inline scan';
  status(`${manifest.columns.length} columns · ${mode} · ${path}`);
}

function render(m, summary, path, count, rawCount) {
  view = { m, summary, path, derives: transforms.derives, filter: transforms.filter, count, rawCount };
  const out = $('out');
  out.textContent = '';
  out.appendChild(transformSection(m));
  out.appendChild(schemaSection(m));
  out.appendChild(statsSection(m, summary));
  out.appendChild(gtSection(m, summary));
  out.appendChild(swathSection(m, summary));
  out.appendChild(catsSection(m, summary));
}

// Numeric column names available to grade/axis pickers — manifest numerics
// plus the derived (calc) columns, which are first-class everywhere.
function numericColNames(m) {
  return [...m.columns.filter((c) => c.type === 'numeric').map((c) => c.name), ...transforms.derives.map((d) => d.name)];
}
// Client-side syntax check (instant, no worker round-trip). Returns an error
// string or null. Identifiers resolve at run time, so this catches bad syntax,
// not unknown columns (deferred). Mirrors sluice.compileExpr's parse.
function validateExpr(expr) {
  if (!expr || !expr.trim()) return 'empty';
  try { /* eslint-disable-next-line no-new-func */ new Function('row', 'return (' + expr + ')'); return null; }
  catch (e) { return e.message; }
}

function transformSection(m) {
  const sec = el('section'); sec.appendChild(h2('Transform'));
  const note = el('div'); note.className = 'conf'; note.style.cssText = 'margin-bottom:6px';
  note.textContent = 'Derive columns + filter rows — one streaming scan. Helpers: cap, clamp, ifnull, ifnum, isnum, between, remap + Math.';
  sec.appendChild(note);

  const derivesWrap = el('div'); derivesWrap.id = 'derives-wrap';
  const validate = (input, mark) => () => {
    if (!input.value.trim()) { mark.textContent = ''; return; }
    const err = validateExpr(input.value);
    mark.textContent = err ? '✗' : '✓'; mark.title = err || 'ok';
    mark.style.color = err ? 'var(--au-fault)' : 'var(--au-go)';
  };
  function addDeriveRow(name = '', expr = '') {
    const row = el('div'); row.className = 'derive-row';
    row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:11px';
    const nameI = el('input'); nameI.placeholder = 'name'; nameI.value = name; nameI.dataset.role = 'name'; nameI.style.cssText = 'width:110px';
    const eq = el('span'); eq.textContent = '='; eq.style.color = 'var(--au-fg-soft)';
    const exprI = el('input'); exprI.placeholder = 'Au*0.6 + ifnull(Cu,0)'; exprI.value = expr; exprI.dataset.role = 'expr'; exprI.style.cssText = 'flex:1;min-width:160px';
    const mark = el('span'); mark.style.cssText = 'width:14px;text-align:center';
    exprI.addEventListener('input', validate(exprI, mark)); validate(exprI, mark)();
    const rm = el('button'); rm.textContent = '×'; rm.title = 'remove'; rm.addEventListener('click', () => row.remove());
    row.append(nameI, eq, exprI, mark, rm); derivesWrap.appendChild(row);
  }
  (transforms.derives || []).forEach((d) => addDeriveRow(d.name, d.expr));
  sec.appendChild(derivesWrap);
  const addBtn = el('button'); addBtn.textContent = '+ derived column'; addBtn.style.cssText = 'font-size:11px;margin:2px 0 8px';
  addBtn.addEventListener('click', () => addDeriveRow()); sec.appendChild(addBtn);

  const fwrap = el('div'); fwrap.style.cssText = 'display:flex;gap:6px;align-items:center;font-size:11px;margin-bottom:8px';
  const fI = el('input'); fI.id = 'filter-input'; fI.placeholder = "DOMAIN=='ore' && Au>0.3"; fI.value = transforms.filter || ''; fI.style.cssText = 'flex:1;min-width:200px';
  const fmark = el('span'); fmark.style.cssText = 'width:14px;text-align:center';
  fI.addEventListener('input', validate(fI, fmark)); validate(fI, fmark)();
  fwrap.append(label('filter', fI), fmark); sec.appendChild(fwrap);

  const bar = el('div'); bar.style.cssText = 'display:flex;gap:10px;align-items:center;font-size:11px';
  const apply = el('button'); apply.textContent = 'Apply + Analyze'; apply.addEventListener('click', applyTransform); bar.appendChild(apply);
  if (view && typeof view.count === 'number') {
    const rc = el('span'); rc.className = 'conf';
    rc.textContent = (view.filter && view.filter.trim())
      ? `${view.count.toLocaleString()} of ${view.rawCount.toLocaleString()} rows kept`
      : `${view.rawCount.toLocaleString()} rows`;
    bar.appendChild(rc);
  }
  sec.appendChild(bar);
  return sec;
}

function applyTransform() {
  const derives = [];
  for (const r of document.querySelectorAll('#derives-wrap .derive-row')) {
    const name = r.querySelector('[data-role=name]').value.trim();
    const expr = r.querySelector('[data-role=expr]').value.trim();
    if (name && expr && !validateExpr(expr)) derives.push({ name, expr });
  }
  const filter = $('filter-input').value.trim();
  if (filter && validateExpr(filter)) { status('filter expression has a syntax error'); return; }
  transforms = { derives, filter };
  setDirty(true);
  if (view && view.path) analyze(view.path);
}

function schemaSection(m) {
  const sec = el('section'); sec.appendChild(h2('Schema'));
  const t = el('table');
  t.innerHTML = '<thead><tr><th>column</th><th>type</th><th>role</th><th>unit</th><th>analyte</th></tr></thead>';
  const tb = el('tbody');
  for (const c of m.columns) {
    const conf = (k) => c.confidence && c.confidence[k] != null ? ` <span class="conf">${Math.round(c.confidence[k] * 100)}%</span>` : '';
    const tr = el('tr');
    tr.innerHTML =
      `<td class="name">${esc(c.name)}</td>` +
      `<td><span class="tag ${esc(c.type)}">${esc(c.type)}</span></td>` +
      `<td>${c.role ? `<span class="tag role">${esc(c.role)}</span>${conf('role')}` : ''}${c.constant ? '<span class="tag">const</span>' : ''}</td>` +
      `<td>${c.unit ? `<span class="tag unit">${esc(c.unit)}</span>${conf('unit')}` : ''}</td>` +
      `<td>${c.analyte ? `<span class="tag analyte">${esc(c.analyte)}</span>${conf('analyte')}` : ''}</td>`;
    tb.appendChild(tr);
  }
  for (const d of transforms.derives) {
    const tr = el('tr');
    tr.innerHTML = `<td class="name">${esc(d.name)}</td><td><span class="tag numeric">numeric</span></td>`
      + `<td><span class="tag role">derived</span></td><td></td><td><span class="conf">${esc(d.expr)}</span></td>`;
    tb.appendChild(tr);
  }
  t.appendChild(tb); sec.appendChild(t);
  const cc = m.coordCols || {};
  if (cc.x || cc.y || cc.z) {
    const g = el('div'); g.className = 'grid-facet';
    g.textContent = 'coordinates detected: ' + ['x', 'y', 'z'].filter((a) => cc[a]).map((a) => `${a.toUpperCase()}=${cc[a]}`).join('  ');
    sec.appendChild(g);
  }
  return sec;
}

function statsSection(m, summary) {
  const cols = [
    ...m.columns.filter((c) => c.type === 'numeric').map((c) => ({ name: c.name, unit: c.unit })),
    ...transforms.derives.map((d) => ({ name: d.name, unit: 'derived' })),
  ];
  const sec = el('section'); sec.appendChild(h2('Summary statistics'));
  if (!cols.length) { sec.appendChild(emptyDiv('no numeric columns')); return sec; }
  const t = el('table');
  t.innerHTML = '<thead><tr><th>column</th><th>count</th><th>mean</th><th>std</th><th>min</th><th>max</th><th>zeros</th></tr></thead>';
  const tb = el('tbody');
  for (const c of cols) {
    const s = (summary && summary[c.name]) || {};
    const tr = el('tr');
    tr.innerHTML =
      `<td class="name">${esc(c.name)}${c.unit ? ` <span class="conf">${esc(c.unit)}</span>` : ''}</td>` +
      `<td class="num">${s.count ?? 0}</td><td class="num">${fmt(s.mean)}</td><td class="num">${fmt(s.std)}</td>` +
      `<td class="num">${fmt(s.min)}</td><td class="num">${fmt(s.max)}</td><td class="num">${s.zeros ?? 0}</td>`;
    tb.appendChild(tr);
  }
  t.appendChild(tb); sec.appendChild(t); return sec;
}

function catsSection(m, summary) {
  const cols = m.columns.filter((c) => c.type === 'categorical');
  const sec = el('section'); sec.appendChild(h2('Categories'));
  if (!cols.length) { sec.appendChild(emptyDiv('no categorical columns')); return sec; }
  for (const c of cols) {
    const s = (summary && summary[c.name]) || {};
    const counts = s.counts || {};
    const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12);
    const blk = el('div'); blk.style.marginBottom = '10px';
    const head = el('div');
    head.innerHTML = `<span class="name">${esc(c.name)}</span> <span class="conf">${s.distinct ?? top.length} distinct${s.overflow ? '+' : ''}</span>`;
    blk.appendChild(head);
    const cats = el('div'); cats.className = 'cats';
    for (const [v, n] of top) {
      const d = el('div'); d.className = 'cat';
      d.innerHTML = `<span class="v">${esc(v)}</span> <span class="c">${n}</span>`;
      cats.appendChild(d);
    }
    blk.appendChild(cats); sec.appendChild(blk);
  }
  return sec;
}

// ── Grade-tonnage view ────────────────────────────────────────────────
function gtSection(m, summary) {
  const numeric = numericColNames(m);
  const sec = el('section'); sec.appendChild(h2('Grade-tonnage'));
  if (!numeric.length) { sec.appendChild(emptyDiv('no numeric columns to grade')); return sec; }

  const cc = m.coordCols || {};
  const dims = (cc.dx && cc.dy && cc.dz) ? [cc.dx, cc.dy, cc.dz] : null;

  const ctrl = el('div');
  ctrl.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:11px';
  const gradeSel = select(numeric, gradeGuess(m, numeric));
  const densSel = select(['(none)', ...numeric], densityGuess(numeric));
  const volInput = el('input'); volInput.type = 'number'; volInput.value = '1'; volInput.style.cssText = 'width:90px';
  const btn = el('button'); btn.textContent = 'Compute';
  ctrl.appendChild(label('grade', gradeSel));
  ctrl.appendChild(label('density', densSel));
  if (dims) { const n = el('span'); n.className = 'conf'; n.textContent = `volume = ${dims.join('·')}`; ctrl.appendChild(n); }
  else ctrl.appendChild(label('block volume', volInput));
  ctrl.appendChild(btn);
  sec.appendChild(ctrl);

  const result = el('div'); result.id = 'gt-result';
  result.appendChild(emptyDiv('pick a grade column and Compute.'));
  sec.appendChild(result);

  btn.addEventListener('click', () => computeGT({
    grade: gradeSel.value,
    density: densSel.value === '(none)' ? null : densSel.value,
    blockVolume: dims ? null : (parseFloat(volInput.value) || 1),
    dims,
  }));
  return sec;
}

function gradeGuess(m, numeric) {
  // A grade is a non-coordinate numeric column. (Note: recon may tag a column
  // named "Y" as the element Yttrium — an inherent single-letter clash — so we
  // exclude coord-/size-role columns rather than just picking the first analyte.)
  const isCoord = (name) => { const c = m.columns.find((x) => x.name === name); return c && /^(coord|size)-/.test(c.role || ''); };
  const cands = numeric.filter((n) => !isCoord(n));
  const byAnalyte = m.columns.find((c) => c.analyte && cands.includes(c.name));
  return (byAnalyte && byAnalyte.name) || cands[0] || numeric[0];
}
function densityGuess(numeric) {
  return numeric.find((n) => /dens|_sg$|sg$|gcm3/i.test(n)) || '(none)';
}

async function computeGT(opts) {
  const res = $('gt-result');
  if (!view) return;
  const s = (view.summary && view.summary[opts.grade]) || {};
  const gradeMin = Number.isFinite(s.min) ? s.min : 0;
  const gradeMax = Number.isFinite(s.max) ? s.max : 1;
  if (!(gradeMax > gradeMin)) { res.textContent = ''; res.appendChild(emptyDiv('that column has no grade range')); return; }
  res.textContent = ''; res.appendChild(emptyDiv('computing grade-tonnage…'));
  const t = transformNodes(view.path);
  const graph = { nodes: [
    ...t.nodes,
    { id: 'gt', type: 'gt',
      params: { grade: opts.grade, gradeMin, gradeMax, bins: 200, blockVolume: opts.blockVolume, dims: opts.dims, density: opts.density },
      wiring: { table: { node: t.tableNode, port: 'table' }, manifest: { node: t.manifestNode, port: 'manifest' } } },
  ] };
  let out;
  try { out = await call('Pull', [graph, 'gt', 'gt']); }
  catch (e) { res.textContent = ''; res.appendChild(emptyDiv('error: ' + e.message)); return; }
  renderGT(out, opts.grade);
}

function renderGT(gt, grade) {
  const res = $('gt-result'); res.textContent = '';
  const curve = gt.curve || [];
  if (!gt.count || !curve.length || !(curve[0].tonnage > 0)) { res.appendChild(emptyDiv('no tonnage in range')); return; }
  const W = 620, H = 200, pad = 12;
  const n = curve.length;
  const maxT = curve[0].tonnage;
  const maxG = Math.max(1e-12, ...curve.map((c) => c.grade));
  const x = (i) => pad + (i / (n - 1)) * (W - 2 * pad);
  const yT = (v) => (H - pad) - (v / maxT) * (H - 2 * pad);
  const yG = (v) => (H - pad) - (v / maxG) * (H - 2 * pad);
  const poly = (fn, key) => curve.map((c, i) => `${x(i).toFixed(1)},${fn(c[key]).toFixed(1)}`).join(' ');
  const svg =
    `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;border:1px solid var(--au-border);border-radius:3px;background:var(--au-surface)">` +
    `<polyline fill="none" stroke="var(--au-info)" stroke-width="1.5" points="${poly(yT, 'tonnage')}"/>` +
    `<polyline fill="none" stroke="var(--au-action)" stroke-width="1.5" points="${poly(yG, 'grade')}"/>` +
    `<text x="${pad}" y="${H - 2}" fill="var(--au-fg-muted)" font-size="9">${fmt(gt.gradeMin, 3)}</text>` +
    `<text x="${W - pad}" y="${H - 2}" fill="var(--au-fg-muted)" font-size="9" text-anchor="end">${fmt(gt.gradeMax, 3)}</text>` +
    '</svg>';
  const legend = `<div style="font-size:10px;margin:4px 0"><span style="color:var(--au-info)">■</span> tonnage (above cutoff) &nbsp; <span style="color:var(--au-action)">■</span> mean grade</div>`;
  // table at ~8 cutoffs
  const rows = [];
  for (let k = 0; k <= 7; k++) {
    const i = Math.min(n - 1, Math.round((k / 7) * (n - 1)));
    const c = curve[i];
    rows.push(`<tr><td class="num">${fmt(c.cutoff, 3)}</td><td class="num">${fmt(c.tonnage, 1)}</td><td class="num">${fmt(c.grade, 3)}</td><td class="num">${fmt(c.metal, 1)}</td></tr>`);
  }
  res.innerHTML = svg + legend +
    `<table style="margin-top:6px"><thead><tr><th>cutoff (${esc(grade)})</th><th>tonnage</th><th>mean grade</th><th>metal</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
}

function swathSection(m, summary) {
  const numeric = numericColNames(m);
  const sec = el('section'); sec.appendChild(h2('Swath'));
  const cc = m.coordCols || {};
  const axisOpts = [cc.x, cc.y, cc.z].filter(Boolean);
  const axes = axisOpts.length ? axisOpts : numeric;
  if (!axes.length || !numeric.length) { sec.appendChild(emptyDiv('need a coordinate axis + a numeric column')); return sec; }

  const defaultBw = (axis) => {
    const s = (summary && summary[axis]) || {};
    return (Number.isFinite(s.min) && Number.isFinite(s.max) && s.max > s.min) ? +((s.max - s.min) / 30).toPrecision(2) : 10;
  };
  const ctrl = el('div');
  ctrl.style.cssText = 'display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:11px';
  const axisSel = select(axes, axes[0]);
  const gradeSel = select(numeric, gradeGuess(m, numeric));
  const bwInput = el('input'); bwInput.type = 'number'; bwInput.style.cssText = 'width:90px'; bwInput.value = defaultBw(axisSel.value);
  axisSel.addEventListener('change', () => { bwInput.value = defaultBw(axisSel.value); });
  const btn = el('button'); btn.textContent = 'Compute';
  ctrl.appendChild(label('axis', axisSel));
  ctrl.appendChild(label('grade', gradeSel));
  ctrl.appendChild(label('bin width', bwInput));
  ctrl.appendChild(btn);
  sec.appendChild(ctrl);

  const result = el('div'); result.id = 'swath-result';
  result.appendChild(emptyDiv('pick an axis + grade and Compute.'));
  sec.appendChild(result);

  btn.addEventListener('click', () => computeSwath({ axis: axisSel.value, grade: gradeSel.value, binWidth: parseFloat(bwInput.value) || defaultBw(axisSel.value) }));
  return sec;
}

async function computeSwath(opts) {
  const res = $('swath-result'); if (!view) return;
  if (!(opts.binWidth > 0)) { res.textContent = ''; res.appendChild(emptyDiv('bin width must be > 0')); return; }
  res.textContent = ''; res.appendChild(emptyDiv('computing swath…'));
  const t = transformNodes(view.path);
  const graph = { nodes: [
    ...t.nodes,
    { id: 'sw', type: 'swath', params: { axis: opts.axis, grade: opts.grade, binWidth: opts.binWidth },
      wiring: { table: { node: t.tableNode, port: 'table' }, manifest: { node: t.manifestNode, port: 'manifest' } } },
  ] };
  let out;
  try { out = await call('Pull', [graph, 'sw', 'swath']); }
  catch (e) { res.textContent = ''; res.appendChild(emptyDiv('error: ' + e.message)); return; }
  renderSwath(out, opts);
}

function renderSwath(bins, opts) {
  const res = $('swath-result'); res.textContent = '';
  bins = (bins || []).filter((b) => b && b.value && b.value.g && b.value.g.count > 0);
  if (!bins.length) { res.appendChild(emptyDiv('no data in any bin')); return; }
  const W = 620, H = 200, pad = 12;
  const centers = bins.map((b) => b.center), means = bins.map((b) => b.value.g.mean), counts = bins.map((b) => b.value.g.count);
  const minX = Math.min(...centers), maxX = Math.max(...centers);
  const maxG = Math.max(1e-12, ...means), maxC = Math.max(1, ...counts);
  const x = (c) => pad + (maxX > minX ? (c - minX) / (maxX - minX) : 0.5) * (W - 2 * pad);
  const yG = (v) => (H - pad) - (v / maxG) * (H - 2 * pad);
  const yC = (v) => (H - pad) - (v / maxC) * (H - 2 * pad) * 0.4;     // count bars, lower 40%
  const bw = bins.length > 1 ? Math.max(1, (x(centers[1]) - x(centers[0])) * 0.8) : 8;
  const bars = bins.map((b, i) => `<rect x="${(x(centers[i]) - bw / 2).toFixed(1)}" y="${yC(counts[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - pad - yC(counts[i])).toFixed(1)}" fill="var(--au-border)"/>`).join('');
  const line = bins.map((b, i) => `${x(centers[i]).toFixed(1)},${yG(means[i]).toFixed(1)}`).join(' ');
  const svg =
    `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto;border:1px solid var(--au-border);border-radius:3px;background:var(--au-surface)">` +
    bars +
    `<polyline fill="none" stroke="var(--au-action)" stroke-width="1.5" points="${line}"/>` +
    `<text x="${pad}" y="${H - 2}" fill="var(--au-fg-muted)" font-size="9">${fmt(minX, 1)}</text>` +
    `<text x="${W - pad}" y="${H - 2}" fill="var(--au-fg-muted)" font-size="9" text-anchor="end">${fmt(maxX, 1)}</text>` +
    '</svg>';
  const legend = `<div style="font-size:10px;margin:4px 0"><span style="color:var(--au-action)">■</span> mean ${esc(opts.grade)} &nbsp; <span style="color:var(--au-border)">■</span> count &nbsp;·&nbsp; ${bins.length} bins of ${fmt(opts.binWidth, 2)} along ${esc(opts.axis)}</div>`;
  res.innerHTML = svg + legend;
}

function select(opts, value) {
  const s = el('select');
  s.style.cssText = 'background:var(--au-surface-bright);color:var(--au-fg);border:1px solid var(--au-border);border-radius:3px;padding:2px 4px;font:inherit;font-size:11px';
  for (const o of opts) { const op = el('option'); op.value = o; op.textContent = o; if (o === value) op.selected = true; s.appendChild(op); }
  return s;
}
function label(text, control) {
  const l = el('label'); l.style.cssText = 'display:inline-flex;gap:4px;align-items:center;color:var(--au-fg-soft)';
  l.appendChild(document.createTextNode(text)); l.appendChild(control); return l;
}

function el(t) { return document.createElement(t); }
function h2(t) { const h = el('h2'); h.textContent = t; return h; }
function emptyDiv(t) { const d = el('div'); d.className = 'empty'; d.textContent = t; return d; }
</script>
</body>
</html>
