<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@gcu/rails — demo</title>
<link rel="stylesheet" href="./rails.css">
<style>
  /* Minimal decorative theme — not part of rails.css. */
  :root {
    --bg: #0f1114; --surface: #16191e; --chrome: #1f242c;
    --border: #2a303a; --text: #d6dae1; --text-dim: #8a93a3; --text-faint: #5a6373;
    --accent: #6ab0ff; --accent-bg: rgba(106,176,255,0.14);
    --danger: #e07a6a;
    --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--border);
    display: flex; gap: 12px; align-items: center; background: var(--surface); flex-shrink: 0; }
  header h1 { margin: 0; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
  header .spacer { flex: 1; }
  header button { font: inherit; font-size: 11px; padding: 4px 10px; background: transparent;
    border: 1px solid var(--border); color: var(--text); cursor: pointer; border-radius: 3px; }
  header button:hover { background: var(--chrome); }
  main { flex: 1; position: relative; overflow: hidden; }

  /* Theme the rails classes. */
  .rails-rail { background: var(--surface); }
  .rails-rail-split, .rails-stack-split { border-top: 1px solid var(--border); }
  .rails-rail-split { border-left: 1px solid var(--border); border-top: none; }
  .rails-rail-split:hover, .rails-stack-split:hover { background: var(--accent-bg); }
  .rails-strip { background: var(--chrome); border-bottom: 1px solid var(--border);
    scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  .rails-strip::-webkit-scrollbar { height: 4px; }
  .rails-strip::-webkit-scrollbar-track { background: transparent; }
  .rails-strip::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .rails-strip::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  .rails-stack.rails-tabs-bottom .rails-strip { border-bottom: none; border-top: 1px solid var(--border); }
  .rails-tab { padding: 7px 12px; color: var(--text-dim); border-right: 1px solid var(--border);
    gap: 8px; transition: color 80ms, background 80ms; }
  .rails-tab.rails-active { background: var(--surface); color: var(--text);
    box-shadow: inset 0 2px 0 var(--accent); }
  .rails-tab:hover { color: var(--text); }
  .rails-x { opacity: 0.4; font-size: 14px; line-height: 0.5; width: 12px; text-align: center;
    transition: opacity 80ms; }
  .rails-tab-badge { font-size: 10px; line-height: 1; padding: 2px 5px; margin-left: 2px;
    border-radius: 8px; background: var(--border); color: var(--text-dim); }
  .rails-tab.rails-active .rails-tab-badge { background: var(--accent); color: var(--bg); }
  .rails-overflow-btn { background: var(--chrome); color: var(--text-dim); font-size: 14px;
    border: none; border-left: 1px solid var(--border); font-family: inherit; line-height: 1;
    transition: color 80ms, background 80ms; }
  .rails-overflow-btn:hover { background: var(--border); color: var(--text); }
  .rails-rail-collapse-btn { background: var(--chrome); color: var(--text-dim); font-size: 11px;
    border-left: 1px solid var(--border); transition: color 80ms, background 80ms; }
  .rails-rail-collapse-btn:hover { background: var(--border); color: var(--text); }
  .rails-rail-expand-btn { color: var(--text-dim); font-size: 11px; height: 28px;
    transition: color 80ms, background 80ms; }
  .rails-rail-expand-btn:hover { background: var(--border); color: var(--text); }
  .rails-x:hover { opacity: 1; color: var(--danger); }
  .rails-panel { background: var(--surface); }
  .rails-ghost { background: var(--chrome); border: 1px solid var(--border);
    padding: 5px 10px; border-radius: 3px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  .rails-zone.rails-active { background: var(--accent-bg); box-shadow: 0 0 0 1px var(--accent); }
  .rails-zone.rails-zone-insert.rails-active { background: var(--accent); box-shadow: none; }
  .rails-zone.rails-zone-float.rails-active { outline: 2px dashed var(--accent); outline-offset: -4px; }

  /* Float frame decorations — transparent body, opaque titlebar/strip,
     border outlines the whole thing. Slot is click-through to the panel. */
  .rails-float {
    border: 1px solid var(--border);
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
    border-radius: 3px;
  }
  .rails-float.rails-minimized .rails-stack,
  .rails-float.rails-minimized .rails-resize-handle { display: none; }
  .rails-float.rails-minimized { height: auto !important; }
  .rails-titlebar {
    background: var(--chrome);
    padding: 4px 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: grab;
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .rails-titlebar:active { cursor: grabbing; }
  .rails-titlebar-label { flex: 1; font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rails-titlebar-buttons { display: flex; gap: 2px; }
  .rails-titlebar-buttons button {
    width: 22px; height: 20px; border: none; background: transparent;
    color: var(--text-dim); cursor: pointer; border-radius: 2px;
    font-family: inherit; font-size: 12px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .rails-titlebar-buttons button:hover { background: var(--border); color: var(--text); }
  .rails-titlebar-buttons .rails-btn-close:hover { color: var(--danger); }

  /* Panel content theming. rails-panel is display:flex;flex-direction:column,
     so direct children need flex:1 + min-height:0 to fill reliably. */
  .demo-body { flex: 1; min-height: 0; padding: 16px; overflow: auto; line-height: 1.6;
    display: flex; flex-direction: column; }
  .demo-body > * { flex-shrink: 0; }
  .demo-body h2 { margin: 0 0 10px; font-size: 13px; color: var(--accent); font-weight: 500; }
  .demo-body p  { margin: 0 0 10px; color: var(--text-dim); font-size: 12px; }
  .demo-body code { background: var(--chrome); padding: 1px 5px; border-radius: 2px; font-size: 11px; }
  .demo-body textarea { flex: 1; min-height: 0; background: var(--bg); color: var(--text);
    border: none; padding: 14px; font: inherit; resize: none; outline: none; }
  .demo-body iframe { flex: 1; min-height: 0; border: none; background: white; width: 100%; }
  .demo-body canvas { flex: 1; min-height: 0; display: block; width: 100%; background: #0a0d12; }
  .rails-empty { color: var(--text-dim); }
</style>
</head>
<body>
<header>
  <h1>@gcu/rails · demo · iframe-safe reparenting</h1>
  <span class="spacer"></span>
  <button id="add-iframe">+ iframe</button>
  <button id="add-canvas">+ canvas</button>
  <button id="add-text">+ text</button>
  <button id="add-float">+ float</button>
  <button id="reopen-inspector">reopen inspector</button>
  <button id="close-all">close all</button>
</header>
<main id="workspace"></main>

<script type="module">
import { createRails } from './index.js';

const IFRAME_SRC = `<!doctype html><html><head><style>
  body { font-family: ui-monospace, monospace; padding: 18px; color: #222; background: #fafafa; margin: 0; font-size: 13px; line-height: 1.6; }
  .t { font-size: 22px; color: #6ab0ff; font-weight: 500; }
  .k { color: #8a93a3; }
  input { font: inherit; border: 1px solid #ccc; padding: 6px; width: 100%; margin-top: 4px; }
  button { font: inherit; padding: 6px 12px; border: 1px solid #888; background: white; cursor: pointer; }
  hr { border: none; border-top: 1px solid #e0e0e0; margin: 14px 0; }
</style></head><body>
  <div>iframe loaded at</div>
  <div class="t" id="t">--:--:--</div>
  <hr>
  <div class="k">drag this tab; timestamp should NOT change</div>
  <hr>
  <div class="k">click counter (persists through reparenting):</div>
  <div style="font-size: 18px;"><span id="c">0</span> <button id="b">click</button></div>
  <hr>
  <div class="k">input (focus + text survives reparenting):</div>
  <input id="i" placeholder="type something, then drag the tab" />
<script>
  const pad = (n, d=2) => String(n).padStart(d, '0');
  const d = new Date();
  document.getElementById('t').textContent =
    pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  let c = 0;
  document.getElementById('b').onclick = () => document.getElementById('c').textContent = ++c;
<\/script>
</body></html>`;

let nextId = 1;
const gid = p => p + '-new-' + (nextId++);

const factories = {
  html(tab) {
    const el = document.createElement('div');
    el.className = 'demo-body';
    el.innerHTML = tab.html || '<p>empty</p>';
    return el;
  },
  text(tab) {
    const el = document.createElement('div');
    el.className = 'demo-body';
    const ta = document.createElement('textarea');
    ta.value = tab.initial ?? `// ${tab.title}\n// content persists across every drag.\n\n`;
    ta.spellcheck = false;
    el.appendChild(ta);
    return el;
  },
  iframe(tab) {
    const el = document.createElement('div');
    el.className = 'demo-body';
    const f = document.createElement('iframe');
    f.srcdoc = IFRAME_SRC;
    f.sandbox = 'allow-scripts allow-same-origin';
    el.appendChild(f);
    return el;
  },
  canvas(tab) {
    const el = document.createElement('div');
    el.className = 'demo-body';
    const c = document.createElement('canvas');
    c.width = 600; c.height = 400;
    const ctx = c.getContext('2d');
    let frame = 0;
    const start = performance.now();
    let raf;
    const tick = () => {
      frame++;
      const t = (performance.now() - start) / 1000;
      ctx.fillStyle = '#0a0d12'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = '#6ab0ff'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (let i = 0; i < 80; i++) {
        const a = (i / 80) * Math.PI * 2 + t * 0.3;
        const r = 60 + 50 * Math.sin(t * 0.5 + i * 0.2);
        const x = c.width / 2 + Math.cos(a) * r;
        const y = c.height / 2 + Math.sin(a) * r * 0.8;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#8a93a3'; ctx.font = '11px ui-monospace, monospace';
      ctx.fillText('canvas frame: ' + frame, 14, 22);
      ctx.fillText('persists across reparents — no redraw loss', 14, 38);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    el.appendChild(c);
    // Stash cleanup so onPanelDestroy can stop the animation.
    el._dispose = () => cancelAnimationFrame(raf);
    return el;
  }
};

const rails = createRails(document.getElementById('workspace'), {
  dropZones: {
    'tab-append-body': false,   // no full-body drop target; easier to move floats around
  },
  initialState: {
    rails: [
      { id: 'r1', flex: 1, collapsible: true, stacks: [{
        id: 's1', flex: 1, active: 't1',
        tabs: [
          { id: 't1', kind: 'html', title: 'readme.md',
            html: `<h2>@gcu/rails — demo</h2>
              <p>drag tabs between strips. drop in rail/stack gaps to create new columns or stacks. drop anywhere in empty space to tear off into a <b>float</b>. drag a float's titlebar onto a rail zone to redock.</p>
              <p>panels live in a flat layer and reposition via <code>style.left/top/width/height</code> — never reparented. iframes, canvases, and form state survive every drag (rails, floats, and moves between them).</p>
              <p>float titlebar: drag to move, min/max/close buttons, 8 resize handles on edges and corners. <code>Esc</code> cancels any drag mid-flight.</p>
              <p>click a tab header to activate — no chrome rebuild. click any part of a float to raise it.</p>
              <p>left rail is <b>collapsible</b> — click the ◀ at its top. scratch.txt has a <b>badge</b>. inspector is <b>preserveOnClose</b> (close and reopen to see iframe state persist). drag many tabs here to see the overflow ⋯ button appear.</p>` },
          { id: 't2', kind: 'text', title: 'scratch.txt', badge: 3 },
          { id: 't-inspector', kind: 'iframe', title: 'inspector.html \u2197', preserveOnClose: true }
        ]
      }] },
      { id: 'r2', flex: 1.3, stacks: [
        { id: 's2', flex: 1, active: 't3', tabs: [
          { id: 't3', kind: 'iframe', title: 'iframe.html \u2197' }
        ] },
        { id: 's3', flex: 1, active: 't4', tabs: [
          { id: 't4', kind: 'canvas', title: 'canvas.fx' }
        ] }
      ] }
    ],
    floats: [
      { id: 'f1', x: 500, y: 500, w: 360, h: 240, z: 1,
        stack: { id: 'fs1', flex: 1, active: 'ft1', tabs: [
          { id: 'ft1', kind: 'text', title: 'seeded float', initial: '// this float is seeded in initialState\n// drag the titlebar, resize edges/corners, min/max/close.\n// drop onto any rail zone to redock.\n' }
        ] }
      }
    ]
  },
  renderPanel(tab) {
    return (factories[tab.kind] || factories.html)(tab);
  },
  renderEmpty() {
    const el = document.createElement('div');
    el.className = 'demo-body';
    el.innerHTML = '<p>workspace empty \u2014 use the + buttons to add content.</p>';
    return el;
  },
  onPanelDestroy(tab, el) {
    // Example: stop the canvas animation.
    el.querySelector('.demo-body')?._dispose?.();
    if (el._dispose) el._dispose();
  },
  canCloseTab(tab) {
    return true;
  },
  onChange(state) {
    // Autosave hook would go here.
  }
});

// Wire toolbar buttons.
document.getElementById('add-iframe').onclick = () => {
  rails.addTab({ id: gid('t'), kind: 'iframe', title: `iframe-${nextId} \u2197` });
};
document.getElementById('add-canvas').onclick = () => {
  rails.addTab({ id: gid('t'), kind: 'canvas', title: `canvas-${nextId}` });
};
document.getElementById('add-text').onclick = () => {
  rails.addTab({ id: gid('t'), kind: 'text', title: `scratch-${nextId}.txt` });
};
document.getElementById('add-float').onclick = () => {
  const id = gid('t');
  rails.addTab(
    { id, kind: 'canvas', title: `float-${nextId}` },
    { to: 'new-float', x: 200 + (nextId * 20) % 200, y: 140 + (nextId * 20) % 200, w: 400, h: 300 }
  );
};
// Consumer-side sample: minimal overflow menu. Rails emits strip:overflow
// with the list of clipped tabs and a screen-space anchor. Build any UI.
let overflowMenuEl = null;
function dismissOverflowMenu() {
  overflowMenuEl?.remove();
  overflowMenuEl = null;
  document.removeEventListener('pointerdown', dismissOverflowMenu);
  document.removeEventListener('keydown', onOverflowEsc);
}
function onOverflowEsc(e) { if (e.key === 'Escape') dismissOverflowMenu(); }

rails.on('strip:overflow', ({ stack, overflowTabs, x, y }) => {
  dismissOverflowMenu();
  const menu = document.createElement('div');
  menu.className = 'demo-overflow-menu';
  Object.assign(menu.style, {
    position: 'fixed', left: `${x - 200}px`, top: `${y}px`,
    minWidth: '200px', maxHeight: '300px', overflow: 'auto',
    background: 'var(--chrome)', border: '1px solid var(--border)',
    borderRadius: '3px', boxShadow: '0 6px 20px rgba(0,0,0,0.6)',
    zIndex: 20000, padding: '4px 0'
  });
  for (const tab of overflowTabs) {
    const item = document.createElement('div');
    item.textContent = tab.title;
    Object.assign(item.style, {
      padding: '6px 12px', fontSize: '11px', cursor: 'pointer',
      color: 'var(--text-dim)',
    });
    item.onmouseenter = () => { item.style.background = 'var(--border)'; item.style.color = 'var(--text)'; };
    item.onmouseleave = () => { item.style.background = ''; item.style.color = 'var(--text-dim)'; };
    item.onclick = () => {
      rails.activateTab(tab.id);
      // Scroll the activated tab into view in the strip.
      const strip = document.querySelector(`.rails-strip[data-stack-id="${stack.id}"]`);
      const tabEl = strip?.querySelector(`.rails-tab[data-tab-id="${tab.id}"]`);
      tabEl?.scrollIntoView({ block: 'nearest', inline: 'center' });
      dismissOverflowMenu();
    };
    menu.appendChild(item);
  }
  document.body.appendChild(menu);
  overflowMenuEl = menu;
  // Defer the outside-dismiss until next tick so the current click doesn't dismiss immediately.
  setTimeout(() => {
    document.addEventListener('pointerdown', dismissOverflowMenu);
    document.addEventListener('keydown', onOverflowEsc);
  }, 0);
});

document.getElementById('reopen-inspector').onclick = () => {
  // If already open, just activate. Otherwise re-add — rails reuses the cached
  // panel (no iframe reload) because inspector was closed with preserve.
  const state = rails.state;
  const exists = state.rails.some(r => r.stacks.some(s => s.tabs.some(t => t.id === 't-inspector')))
    || state.floats.some(f => f.stack.tabs.some(t => t.id === 't-inspector'));
  if (exists) rails.activateTab('t-inspector');
  else rails.addTab({ id: 't-inspector', kind: 'iframe', title: 'inspector.html \u2197', preserveOnClose: true });
};

document.getElementById('close-all').onclick = () => {
  rails.batch(() => {
    const state = rails.state;
    for (const rail of [...state.rails]) {
      for (const stack of [...rail.stacks]) {
        for (const tab of [...stack.tabs]) {
          rails.closeTab(tab.id);
        }
      }
    }
  });
};

// Expose for console poking.
window.rails = rails;
</script>
</body>
</html>
