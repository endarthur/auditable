<div class="works-shell">
  <div class="works-toolbar">
    <span class="works-brand">Works</span>
    <span class="works-toolbar-sep"></span>
    <button id="works-add-folder" title="open folder (FSAA)">+ folder</button>
    <button id="works-add-box" title="create virtual box">+ box</button>
    <button id="works-import" title="import box from file">import</button>
    <span class="works-toolbar-spacer"></span>
    <button id="works-save" title="save active notebook (Ctrl+S)">save</button>
  </div>

  <div class="works-sidebar" id="works-sidebar">
    <div class="works-tree" id="works-tree"></div>
  </div>

  <div class="works-resize" id="works-resize"></div>

  <div class="works-main">
    <div class="works-tabbar" id="works-tabbar"></div>
    <div class="works-viewport" id="works-viewport"></div>
  </div>

  <div class="works-statusbar">
    <span class="works-status-path" id="works-status-path"></span>
    <span class="works-status-msg" id="works-status-msg"></span>
    <span class="works-status-attr">
      <a href="https://endarthur.github.io" target="_blank">endarthur</a>
      <span>&middot;</span>
      <a href="https://gentropic.org" target="_blank">GCU</a>
    </span>
  </div>
</div>
