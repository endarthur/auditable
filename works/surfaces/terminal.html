<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Terminal</title>
<style>
/* @gcu/term CSS (structural term.css + default theme) — inlined at build */
/* @term-css */

/* @theme-tokens */

html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--au-surface); color: var(--au-fg); }
#termwrap { width: 100%; height: 100%; padding: 4px; box-sizing: border-box; overflow: hidden; }
.term-error { padding: 12px; color: var(--au-error); font: 12px Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div id="termwrap" class="termwrap">
  <div id="termhost" class="termhost">
    <div id="screen" class="screen" role="log" aria-live="polite" aria-atomic="false"></div>
    <textarea id="hidden" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
  </div>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';
import { bootSurface } from '../../ext/surface/index.js';
import { VFS, AbusBackend } from '../../ext/vfs/index.js';

/* @theme-init */
import { Terminal, DomRenderer, Input } from '../../ext/term/index.js';
import { createGeasClient, createTermAdapter, procToWorker, tokenize } from '../../ext/geas/index.js';
import { ProcessManager } from '../../ext/proc/index.js';
import { createReadline } from '../../ext/readline/index.js';

// Build the geas worker source from the inlined-lib-geas script the shell
// adds at decompress time. We use proc's inline-service mode: the user
// code is concatenated into proc's bootstrap blob so there's no cross-
// blob dynamic import — Chromium under file:// gives each blob URL its
// own unique opaque origin and module-mode workers can't import another
// blob URL. Inline mode keeps bootstrap + user code in a single blob.
async function spawnGeasProc(pm) {
  const raw = document.getElementById('inlined-lib-geas')?.textContent;
  if (!raw) throw new Error('terminal: no inlined geas source for the worker');
  // Strip the trailing `export { ... }` so the geas bundle's symbols
  // (createShell, isTyped, setupGeasWorker, geasProcEntry) land as
  // top-level bindings in the worker module. Then append the
  // _procRegisterEntry call.
  const stripped = raw.replace(/export\s*\{[^}]*\};?\s*$/, '');
  const inlineSource = stripped +
    '\n_procRegisterEntry(geasProcEntry({ createShell, isTyped, setupGeasWorker }));\n';
  return await pm.spawn({ inlineSource, command: 'geas-shell' });
}

function showError(msg) {
  document.body.innerHTML = '<div class="term-error">terminal error: '
    + String(msg).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
    + '</div>';
}

// Wait for the shell's abus:welcome.
bootSurface({
  connect,
  client: 'terminal',
  onConnect: (b) => installThemeSubscription(b),
  makeHost: () => ({}),   // terminals have no document; geas owns its own cwd
  mount: async ({ bus, tab: tabIn }) => {
  const tab = tabIn || {};
  const startCwd = tab.path && tab.path !== '/' ? tab.path : '/home';

  // @gcu/term — model + DOM renderer + input layer (replaces xterm.js). The grid is
  // sized to the pane by measuring one monospace cell against the live .screen font.
  const screenEl = document.getElementById('screen');
  const hiddenEl = document.getElementById('hidden');
  const wrapEl = document.getElementById('termwrap');

  function measureCell() {
    const probe = document.createElement('div');
    probe.className = 'screen';
    probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;white-space:pre;';
    probe.textContent = 'X'.repeat(80);
    document.body.appendChild(probe);
    const cellW = probe.getBoundingClientRect().width / 80;
    probe.textContent = 'X';
    const cellH = probe.getBoundingClientRect().height;
    probe.remove();
    return { cellW: cellW || 8, cellH: cellH || 18 };
  }
  function gridSize() {
    const { cellW, cellH } = measureCell();
    const cols = Math.max(40, Math.min(220, Math.floor((wrapEl.clientWidth - 14) / cellW) || 80));
    const rows = Math.max(12, Math.min(80, Math.floor((wrapEl.clientHeight - 14) / cellH) || 24));
    return { cols, rows };
  }

  const initial = gridSize();
  // convertEol: geas pipes program output straight in with no kernel TTY, so programs that
  // emit bare \n (tree, ls -1, …) need the emulator to do onlcr or they cascade down-right.
  const term = new Terminal(initial.cols, initial.rows, { convertEol: true });
  const renderer = new DomRenderer(term, screenEl);
  // The Input layer reads keystrokes from the hidden textarea and handles paste, IME,
  // and selection→clipboard natively (DOM rendering gives native browser selection) —
  // so no xterm-style clipboard plumbing. copyOnSelect gives the X11 select-to-copy feel.
  const input = new Input(term, screenEl, hiddenEl, renderer, { copyOnSelect: true });
  window._termInput = input;   // keep a ref (Input wires listeners in its ctor)

  // Render tick: blink the cursor at 530 ms; repaint when the model marks itself dirty.
  let lastBlink = performance.now();
  function tick(now) {
    if (now - lastBlink > 530) { renderer.cursorOn = !renderer.cursorOn; lastBlink = now; term.dirty = true; }
    if (term.dirty) { try { renderer.render(); } catch { /* transient paint */ } term.dirty = false; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Resize the grid to the pane (rails panes resize) — debounced re-measure.
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const g = gridSize();
      try { term.resize(g.cols, g.rows); renderer.resize(); } catch { /* */ }
    }, 100);
  });

  // Keyboard focus lives on the hidden textarea (the Input layer's source).
  hiddenEl.focus();
  screenEl.addEventListener('mousedown', () => setTimeout(() => hiddenEl.focus(), 0));

  const adapter = createTermAdapter({ terminal: term });

  // Surface-side VFS first — readline's path-completer + persistent
  // history both reach through it. /tmp comes through the / proxy from
  // the workspace's shared volatile mount (POSIX-shape, visible to all
  // surfaces + the file tree).
  const vfs = new VFS();
  vfs._mounts.set('/', new AbusBackend({ bus, service: 'works' }));

  // @gcu/readline line editor — replaces @gcu/geas's makeLineEditor.
  // Adds mid-line cursor, kill-ring, fish-style autosuggest, tab
  // completion, syntax highlighting, bracketed-paste, and persistent
  // history. History lives at /home/.gcu_history in the workspace; all
  // terminal surfaces in the same workspace share it across reloads.
  const HISTORY_PATH = '/home/.gcu_history';
  const HISTORY_MAX = 1000;
  let history = [];
  try {
    const raw = await vfs.readFile(HISTORY_PATH, 'utf8');
    history = raw.split('\n').filter((s) => s.length > 0);
    if (history.length > HISTORY_MAX) history = history.slice(-HISTORY_MAX);
  } catch { /* fresh workspace — no history file yet */ }
  async function persistHistory(line) {
    try {
      // Append-only; trim happens on next load. Cheap on every commit.
      const prev = history.slice(0, -1).join('\n');   // exclude just-pushed
      const body = (prev ? prev + '\n' : '') + line + '\n';
      await vfs.writeFile(HISTORY_PATH, body);
    } catch (e) {
      // Non-fatal — history doesn't write but the terminal keeps working.
      console.warn('[terminal] history write failed:', e.message);
    }
  }
  // Geas builtins → reachable in-process via tokenize but the builtin
  // names live in defaultBuiltins(); we cache the list once.
  const BUILTINS = [
    'cd', 'pwd', 'ls', 'cat', 'echo', 'export', 'env', 'exit', 'set',
    'read', 'which', 'command', 'local', 'return', 'shift', 'clear',
    'eval', 'source', 'getopts', 'test', 'true', 'false', 'seq', 'sleep',
    'date', 'mkdir', 'rm', 'touch', 'cp', 'mv', 'stat', 'find', 'tree',
    'head', 'tail', 'wc', 'grep', 'sort', 'uniq', 'cut', 'tee', 'xargs',
    'tr', 'du', 'df', 'base64', 'md5sum', 'sha256sum', 'pkg',
  ];
  const KEYWORDS = new Set([
    'if', 'then', 'else', 'elif', 'fi', 'for', 'in', 'do', 'done',
    'while', 'until', 'case', 'esac', 'function', 'select', 'time',
  ]);

  // ANSI colours via 256-colour palette — works under both light + dark
  // xterm.js themes without needing truecolor.
  const C_KEYWORD = '\x1b[38;5;215m';   // amber
  const C_BUILTIN = '\x1b[38;5;81m';    // teal
  const C_OPERATOR = '\x1b[38;5;208m';  // orange
  const C_STRING = '\x1b[38;5;114m';    // green
  const C_FLAG = '\x1b[38;5;245m';      // grey

  function highlight(line) {
    let tokens;
    try { tokens = tokenize(line); } catch { return []; }
    const spans = [];
    for (const t of tokens) {
      if (!t.pos) continue;
      const { start, end } = t.pos;
      if (start >= end) continue;
      const val = t.value;
      let ansi = null;
      if (t.type === 'OPERATOR') ansi = C_OPERATOR;
      else if (t.type === 'WORD') {
        if (KEYWORDS.has(val)) ansi = C_KEYWORD;
        else if (BUILTINS.includes(val)) ansi = C_BUILTIN;
        else if (typeof val === 'string' && val.startsWith('-')) ansi = C_FLAG;
        else if (typeof val === 'string' && /^["']/.test(val)) ansi = C_STRING;
      } else if (t.type === 'HEREDOC_BODY') ansi = C_STRING;
      if (ansi) spans.push({ start, end, ansi });
    }
    return spans;
  }

  // Resolve a possibly-relative path against the worker's current
  // cwd. createGeasClient maintains client.cwd, updated from each
  // `done` message — `cd /tmp` then Tab now completes against /tmp,
  // not the boot-time startCwd.
  function _resolvePath(p) {
    if (p.startsWith('/')) return p;
    const cwd = (client && client.cwd) || startCwd;
    const base = cwd.endsWith('/') ? cwd.slice(0, -1) : cwd;
    return base + '/' + p;
  }

  async function complete(line, cursor) {
    // Find the word under / left of the cursor.
    let prefixStart = cursor;
    while (prefixStart > 0 && /\S/.test(line[prefixStart - 1])) prefixStart--;
    const prefix = line.slice(prefixStart, cursor);
    const beforePrefix = line.slice(0, prefixStart);
    const isFirstWord = /^\s*$/.test(beforePrefix);

    if (isFirstWord) {
      return BUILTINS.filter((b) => b.startsWith(prefix)).sort();
    }

    // Path completion. Split the prefix at the last slash:
    //   dir/   →  parent='dir',  partial=''
    //   dir/x  →  parent='dir',  partial='x'
    //   x      →  parent='',     partial='x'
    const slash = prefix.lastIndexOf('/');
    const partial = slash === -1 ? prefix : prefix.slice(slash + 1);
    const parentPath = slash === -1 ? '' : prefix.slice(0, slash + 1);
    const fsBase = _resolvePath(parentPath || '.');

    let entries;
    try { entries = await vfs.readdir(fsBase, { stat: true }); }
    catch { return []; }

    // Match entries; append `/` for directories so a second Tab dives in.
    const matches = [];
    for (const e of entries) {
      if (!e.name.startsWith(partial)) continue;
      const suffix = e.type === 'directory' ? '/' : '';
      matches.push(parentPath + e.name + suffix);
    }
    matches.sort();
    // Return shape with anchor so readline replaces from the right spot.
    return { matches, anchor: prefixStart };
  }

  const readLine = createReadline(adapter, {
    history, highlight, complete,
    onPersistHistory: persistHistory,
  });

  // Spawn the worker + the geas client. proc owns the worker lifecycle
  // (PID, signals, kill); procToWorker wraps the Process as a Worker-
  // shaped object so createGeasClient can stay protocol-agnostic.
  let pm, proc, worker, client;
  try {
    pm = new ProcessManager();
    proc = await spawnGeasProc(pm);
    worker = procToWorker(proc);
    client = createGeasClient({
      worker,
      vfs,
      env: { HOME: '/home', PS1: '$ ' },
      cwd: startCwd,
      onStdout: adapter.write,
      onStderr: adapter.write,
      onBlock:  adapter.writeBlock,
      onWantInput: readLine,
      // Host-RPC bridge: lets worker-hosted builtins (e.g. `pkg`, `profile`)
      // reach the shell. Safelisted to the content-registry + distribution-
      // profile surfaces so a geas command can't drive arbitrary Shell
      // operations. Trust prompts (new sources, etc.) still run shell-side.
      host: (member, args) => {
        if (!/^(Registry|Profile)/.test(String(member))) throw new Error(`host: "${member}" not permitted`);
        return bus.call({ to: 'works', path: '/', interface: 'Shell', member }, args || []);
      },
    });
    await client.ready();
  } catch (e) {
    showError('geas init failed: ' + (e.message || e));
    return;
  }

  // The REPL — calls into the worker through client.exec, prints the
  // prompt between commands. Readline owns echo, history, kill-ring,
  // completion, highlight; readLine is serialised (REPL awaits exec;
  // exec may itself await readLine mid-script via onWantInput).
  (async () => {
    adapter.write('\x1b[2mwelcome to geas. cwd ' + startCwd + '\x1b[0m\r\n');
    for (;;) {
      let r;
      try { r = await readLine({ prompt: '$ ' }); }
      catch (e) { adapter.write('\r\n[readline error: ' + (e.message || e) + ']\r\n'); break; }
      if (r.eof) break;
      const line = (r.line || '').trim();
      if (!line) continue;
      try { await client.exec(line); }
      catch (e) { adapter.write('\r\nerror: ' + (e.message || e) + '\r\n'); }
    }
  })();

  const basename = (p) => p.split('/').filter(Boolean).pop() || p;
  const title = startCwd === '/home' ? 'Terminal' : 'Terminal — ' + basename(startCwd);
  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' }, [title]);

  // Test hooks — surface-internal, only intended for works-smoke.
  window._term = term;
  window._geasClient = client;
  window._surfaceVfs = vfs;   // smoke-test hook (write to /tmp before pkg install)

  hiddenEl.focus();
  },
});
</script>
</body>
</html>
