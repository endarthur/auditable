<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>doc</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--au-surface-deep);
    color: var(--au-fg);
    font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace;
    display: flex;
    flex-direction: column;
  }
  .menubar-host {
    flex: none;
    background: var(--au-surface);
    border-bottom: 1px solid var(--au-border);
  }
  .body {
    flex: 1; display: flex; min-height: 0;
  }
  /* Source pane — CM6 owns its inner DOM */
  .source {
    flex: 1; min-width: 0; display: flex;
    border-right: 1px solid var(--au-border);
    background: var(--au-surface-deep);
  }
  .source .cm-editor { flex: 1; height: 100%; background: var(--au-surface-deep); color: var(--au-fg); font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace; }
  .source .cm-scroller { font-family: inherit; line-height: 1.55; }
  .source .cm-content { padding: 12px 8px; caret-color: var(--au-action); }
  .source .cm-gutters { background: var(--au-surface); color: var(--au-fg-soft); border-right: 1px solid var(--au-border); }
  .source .cm-activeLineGutter, .source .cm-activeLine { background: var(--au-surface-bright); }
  .source .cm-cursor, .source .cm-dropCursor { border-left-color: var(--au-action); }
  .source .cm-selectionBackground, .source .cm-content ::selection { background: var(--au-selected-soft) !important; }

  /* ── Preview pane — paper-shaped page on a darker tray ──────────────
     The outer .preview container is the "tray" — a slightly darker
     surface so the page floats visibly. The inner .md is the page
     itself: lighter background, a soft drop-shadow, padding generous
     enough to feel like a manuscript, max-width that produces a
     comfortable reading column (~64ch is the typographic sweet spot).
  */
  .preview {
    flex: 1; min-width: 0; overflow: auto;
    background: var(--au-surface-deep);
    padding: 32px 24px;
    display: flex; justify-content: center;
  }
  .preview .md {
    flex: 0 1 min(72ch, 100%);
    align-self: flex-start;
    background: var(--au-surface);
    color: var(--au-fg);
    font: 15px/1.65 'Barlow', system-ui, -apple-system, sans-serif;
    padding: 48px 56px;
    border-radius: 2px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.18),
      0 4px 20px rgba(0,0,0,0.20);
    min-height: 50vh;
  }
  .preview .md > *:first-child { margin-top: 0; }
  .preview .md > * + * { margin-top: 1em; }
  .preview .md h1, .preview .md h2, .preview .md h3, .preview .md h4,
  .preview .md h5, .preview .md h6 {
    color: var(--au-action);
    font-family: 'Barlow', system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.005em;
  }
  /* Generous space ABOVE headings sets sections off; first heading
     overrides the rule above so it doesn't crash into the top margin. */
  .preview .md h1 + *, .preview .md h2 + *, .preview .md h3 + * { margin-top: 0.5em; }
  .preview .md h1 { font-size: 2em;    margin-top: 1.6em; border-bottom: 1px solid var(--au-border); padding-bottom: 0.25em; }
  .preview .md h2 { font-size: 1.55em; margin-top: 1.8em; }
  .preview .md h3 { font-size: 1.25em; margin-top: 1.6em; }
  .preview .md h4 { font-size: 1.1em;  margin-top: 1.4em; }
  .preview .md h5, .preview .md h6 { font-size: 1em; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1.4em; color: var(--au-fg-muted); }
  .preview .md p { margin: 0; }
  .preview .md strong { font-weight: 700; color: var(--au-fg); }
  .preview .md em { font-style: italic; }
  .preview .md code {
    background: var(--au-surface-raised);
    padding: 1px 5px; border-radius: 3px;
    font: 0.86em ui-monospace, 'Space Mono', Menlo, monospace;
    color: var(--au-info);
  }
  .preview .md pre {
    background: var(--au-surface-raised);
    padding: 12px 14px;
    border-radius: 3px;
    overflow: auto;
    font: 13px/1.5 ui-monospace, 'Space Mono', Menlo, monospace;
    border-left: 3px solid var(--au-border);
  }
  .preview .md pre code { background: none; padding: 0; font-size: 1em; color: var(--au-fg); }
  .preview .md blockquote {
    border-left: 3px solid var(--au-info);
    padding: 0.6em 1em;
    margin: 1em 0;
    color: var(--au-fg-muted);
    background: var(--au-info-soft);
    border-radius: 0 3px 3px 0;
    font-style: italic;
  }
  .preview .md a { color: var(--au-action); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--au-action) 40%, transparent); }
  .preview .md a:hover { border-bottom-color: var(--au-action); }
  .preview .md ul, .preview .md ol { padding-left: 1.5em; }
  .preview .md li { margin: 0.15em 0; }
  .preview .md hr {
    border: none;
    height: 1px;
    background: var(--au-border);
    margin: 2em 0;
  }
  .preview .md img { max-width: 100%; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .preview .md table.tpl-table {
    border-collapse: collapse; width: 100%; font-size: 0.92em;
    background: var(--au-surface-raised);
    border-radius: 3px; overflow: hidden;
    margin: 1em 0;
  }
  .preview .md table.tpl-table th, .preview .md table.tpl-table td {
    padding: 6px 10px; text-align: left;
    border-bottom: 1px solid var(--au-border);
  }
  .preview .md table.tpl-table tr:last-child td { border-bottom: none; }
  .preview .md table.tpl-table th { background: var(--au-surface-bright); font-weight: 600; font-family: 'Barlow', system-ui, sans-serif; color: var(--au-action); }
  .preview .md pre.tpl-json {
    background: var(--au-surface-raised);
    border-left: 3px solid var(--au-info);
  }
  .preview .md .tpl-missing {
    color: var(--au-error); background: var(--au-error-soft);
    padding: 1px 6px; border-radius: 3px;
    font: 0.86em ui-monospace, monospace;
  }
  .preview .md .template-error {
    border-left: 3px solid var(--au-error);
    padding: 8px 12px; margin: 8px 0;
    background: var(--au-error-soft); color: var(--au-error);
    font: 12px ui-monospace, monospace;
    border-radius: 0 3px 3px 0;
  }
  /* Empty-page treatment — first paint while frontmatter loads. */
  .preview .md:empty::after {
    content: '(empty document)';
    color: var(--au-fg-muted);
    font-style: italic;
  }

  /* ── View modes ────────────────────────────────────────────────────
     Three toggles in the View menu. CSS class on .body picks which
     panes render. Reading mode hides the source pane, widens the
     page to a more relaxed column, and bumps the body font up a
     notch — closer to "reading a paper" than "previewing markdown". */
  .body.mode-source  .preview { display: none; }
  .body.mode-source  .source { border-right: none; }
  .body.mode-reading .source { display: none; }
  .body.mode-reading .preview { padding: 48px 24px; }
  .body.mode-reading .preview .md {
    flex-basis: min(78ch, 100%);
    font-size: 16px;
    padding: 64px 72px;
  }

  .statusbar {
    flex: none; display: flex; gap: 18px; align-items: center;
    padding: 2px 12px; font-size: 11px; color: var(--au-fg-soft);
    background: var(--au-surface); border-top: 1px solid var(--au-border);
    min-height: 22px;
  }
  .statusbar .status-spacer { flex: 1; }
  .statusbar .status-dirty {
    display: inline-block; min-width: 0.7em; color: var(--au-action);
    font-family: ui-monospace, 'Space Mono', Menlo, monospace;
  }
  .statusbar .status-mode { font-family: ui-monospace, monospace; }

  /* CM6 search panel — visual treatment matches text surface */
  .source .cm-search.cm-panel {
    position: absolute !important;
    top: 4px !important; right: 6px !important;
    padding: 0 !important; margin: 0 !important;
    background: var(--au-surface-deep) !important;
    border: 1px solid var(--au-border) !important;
    border-radius: 3px !important;
    color: var(--au-fg) !important;
  }
  .source .cm-search.cm-panel input { background: var(--au-surface) !important; color: var(--au-fg) !important; border: 1px solid var(--au-border) !important; }
</style>
</head>
<body>
<!--
  doc surface — markdown editor with live HTML preview. Three view
  modes (source / split / reading) via View menu. {{path | filter}}
  template directives resolve against the project's VFS via
  @gcu/template; dependencies tracked for VFS.Changed re-render.
  Saves back to the source .md file (Surface.Flush + dirty cadence).
-->
<div class="menubar-host" id="menubar"></div>
<div class="body mode-split" id="body">
  <div class="source" id="source"></div>
  <div class="preview"><div class="md" id="preview"></div></div>
</div>
<div class="statusbar" id="statusbar">
  <span class="status-dirty" id="status-dirty"> </span>
  <span class="status-path" id="status-path">—</span>
  <span class="status-pos" id="status-pos">ln 1, col 1</span>
  <span class="status-mode" id="status-mode">split</span>
  <span class="status-spacer"></span>
  <span class="status-words" id="status-words">0 words</span>
  <span class="status-read" id="status-read">0 min</span>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';
import { MenuBar } from '../../ext/menu/index.js';
import { renderText, registerFilter } from '../../ext/template/index.js';
import { parse as parseYaml, YamlParseError } from '../../ext/yaml/index.js';

/* @theme-init */

/*__GCU_CM6_INLINE__*/

const {
  EditorView, EditorState, Compartment,
  lineNumbers, highlightActiveLine, drawSelection,
  history, undo, redo, indentWithTab,
  keymap, minimalSetup,
  openSearchPanel, closeSearchPanel, searchKeymap, search,
  bracketMatching, indentOnInput,
} = CM6;

const sourceRoot = document.getElementById('source');
const previewRoot = document.getElementById('preview');
const bodyEl = document.getElementById('body');
const sDirty = document.getElementById('status-dirty');
const sPath  = document.getElementById('status-path');
const sPos   = document.getElementById('status-pos');
const sMode  = document.getElementById('status-mode');
const sWords = document.getElementById('status-words');
const sRead  = document.getElementById('status-read');

const basename = (p) => p.split('/').filter(Boolean).pop() || p;
const dirOf    = (p) => { const i = p.lastIndexOf('/'); return i > 0 ? p.slice(0, i) : '/'; };
const esc = (s) => String(s).replace(/[&<>]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ── Minimal markdown renderer ─────────────────────────────────────────
//
// Same approach as preview.html — tiny subset (headings, fences, lists,
// quotes, links, bold/italic/code-inline). Not CommonMark. Good enough
// for readable rendering of the kind of markdown people write in
// reports. Inline-HTML lines (start with `<`) pass through verbatim so
// template-resolved blocks (<table>, <pre>, <img>) render correctly.
function renderMarkdown(text) {
  const lines = text.split('\n');
  const out = [];
  let inCode = false, listType = '';
  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = ''; } };
  for (const raw of lines) {
    const line = raw.replace(/\r$/, '');
    if (line.startsWith('```')) {
      closeList();
      if (inCode) { out.push('</code></pre>'); inCode = false; }
      else { out.push('<pre><code>'); inCode = true; }
      continue;
    }
    if (inCode) { out.push(esc(line) + '\n'); continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeList();
      const lvl = m[1].length;
      out.push(`<h${lvl}>${inlineMd(m[2])}</h${lvl}>`);
    } else if (line.startsWith('> ')) {
      closeList();
      out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
    } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if (line.trim() === '') {
      closeList();
    } else if (/^\s*</.test(line)) {
      // Raw HTML line — emit verbatim so template-resolved tables /
      // pres / imgs render instead of being paragraph-wrapped and
      // escaped.
      closeList();
      out.push(line);
    } else {
      closeList();
      out.push(`<p>${inlineMd(line)}</p>`);
    }
  }
  closeList();
  if (inCode) out.push('</code></pre>');
  return out.join('');
}

function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// ── YAML frontmatter ──────────────────────────────────────────────────
//
// A doc may start with a YAML block delimited by `---` lines:
//
//     ---
//     title: Q4 grade tonnage estimate
//     viewMode: reading
//     templateBase: data
//     ---
//
//     # …body markdown begins here…
//
// Recognized keys (all optional):
//   title         — display title for the tab + HTML export <title>
//   viewMode      — initial mode on open: source | split | reading
//   templateBase  — subfolder under the doc's dir that bare `{{path}}`
//                   directives resolve against; default is dirOf(file).
//                   Absolute paths (leading /) are honored verbatim.
//
// Frontmatter is the user's source — the editor pane shows it. The
// preview pipeline skips it (renders only the body) and applies meta
// to the surface state. Parse errors render an inline warning at the
// top of the preview but never block rendering of the body.
const FRONTMATTER_RE = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/;

function splitFrontmatter(source) {
  const m = FRONTMATTER_RE.exec(source);
  if (!m) return { meta: {}, body: source, error: null };
  let meta, error = null;
  try {
    const parsed = parseYaml(m[1]);
    meta = (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
  } catch (e) {
    meta = {};
    error = (e instanceof YamlParseError) ? e.message : String(e && e.message || e);
  }
  return { meta, body: source.slice(m[0].length), error };
}

// ── Template + render pipeline ────────────────────────────────────────
//
// Two-pass: 1) markdown → HTML (preserving {{...}} as literal text in
// HTML), 2) template engine resolves {{...}} → final HTML. The order
// matters: doing template-first would let template-resolved HTML get
// markdown-escaped on the second pass. Doing markdown-first lets the
// `^\s*<` rule above pass our resolved HTML through verbatim.
//
// Engine dependency tracking is wired so any tracked VFS write/delete
// triggers a re-render (debounced).

let bus = null;
let filePath = '';
let projectDir = '/';
let saved = '';
let dirty = false;
let flushTimer = null;
let view = null;
let renderTimer = null;
const deps = new Set();
let vfsUnsub = null;

// Renamed from `emit` to avoid colliding with `function emit(ast)` from
// @gcu/yaml — the lib is inlined into this surface's module scope (see
// works/js/surface-registry.js's _inlineLibsIntoSurface), so any
// top-level identifier in the inlined lib lives in the same scope as
// the surface code. yaml's emitter is one of ~60 top-level functions
// the bundle exposes.
const emitSig = (member, args) =>
  bus.signal({ path: '/', interface: 'Surface', member }, args);

function setDirty(d) {
  if (dirty === d) return;
  dirty = d;
  sDirty.textContent = dirty ? '●' : ' ';
  emitSig('DirtyChanged', [dirty]);
}

// Template engine calls A-Bus VFS reads under the hood — we wrap the
// shell's VFS service into a `vfs` shape that exposes readFile.
function makeBusVfs() {
  return {
    async readFile(path, mode) {
      const text = await bus.call(
        { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
        [path, mode === 'bytes' ? 'bytes' : 'utf8']);
      return text;
    },
  };
}

let busVfs = null;

// Project-local renderMarkdown filter override — when a template
// directive includes a `.md` file, we want THAT content to also
// markdown-render inline, not the engine's escaped fallback.
registerFilter('.md', 'default', async (text) => {
  if (typeof text !== 'string') text = String(text);
  return renderMarkdown(text);
});

// Last applied frontmatter title, so we only emit TitleChanged on change.
let lastTitle = '';
// True once we've applied frontmatter.viewMode for the first time on
// this doc — subsequent edits to viewMode in frontmatter are ignored
// (we don't want the user's manual toggle reverted on every save).
let initialViewModeApplied = false;

async function renderNow() {
  const source = view.state.doc.toString();
  const { meta, body, error: frontmatterError } = splitFrontmatter(source);
  updateWordCount(body);

  // Apply title from frontmatter (or fall back to filename) — fires the
  // shell signal only when it actually changes.
  const title = (typeof meta.title === 'string' && meta.title.trim())
    || basename(filePath).replace(/\.[^.]+$/, '');
  if (title !== lastTitle) {
    lastTitle = title;
    emitSig('TitleChanged', [title]);
  }

  // Apply initial view-mode preference from frontmatter, once.
  if (!initialViewModeApplied && typeof meta.viewMode === 'string') {
    if (['source', 'split', 'reading'].includes(meta.viewMode)) {
      setMode(meta.viewMode);
    }
    initialViewModeApplied = true;
  }

  // Resolve templateBase relative to dirOf(file). Absolute paths land
  // anywhere in the VFS; relative paths combine with the doc's dir.
  let cwd = dirOf(filePath);
  if (typeof meta.templateBase === 'string' && meta.templateBase.trim()) {
    const base = meta.templateBase.trim();
    cwd = base.startsWith('/')
      ? base.replace(/\/+$/, '')
      : (cwd === '/' ? '/' + base : cwd + '/' + base).replace(/\/+$/, '');
  }

  // Phase 1: markdown → HTML (with `{{...}}` directives preserved as text)
  const phase1 = renderMarkdown(body);
  // Phase 2: template engine resolves directives against project VFS
  let phase2;
  deps.clear();
  try {
    phase2 = await renderText(phase1, {
      vfs: busVfs,
      cwd,
      onDependency: (p) => deps.add(p),
    });
  } catch (e) {
    phase2 = `<div class="template-error">template error: ${esc(e.message)}</div>` + phase1;
  }

  // YAML errors render at the top of the preview but never block the body.
  const fmWarning = frontmatterError
    ? `<div class="template-error">frontmatter YAML error: ${esc(frontmatterError)}</div>`
    : '';
  previewRoot.innerHTML = fmWarning + phase2;
}

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderNow, 200);
}

function updateStatus() {
  if (!view) return;
  const head = view.state.selection.main.head;
  const line = view.state.doc.lineAt(head);
  sPos.textContent = 'ln ' + line.number + ', col ' + (head - line.from + 1);
}

// Word count / reading time on the BODY (post-frontmatter, pre-template).
// Splits on whitespace after stripping code fences, inline code, and
// markdown directive sigils so the count tracks prose, not syntax.
// Reading time at 250 wpm — the well-cited "comfortable reading"
// figure; rounded to the nearest minute, minimum 1.
function updateWordCount(body) {
  const prose = body
    .replace(/```[\s\S]*?```/g, '')        // fenced code
    .replace(/`[^`]*`/g, '')               // inline code
    .replace(/\{\{[^}]*\}\}/g, '')         // template directives
    .replace(/!?\[[^\]]*\]\([^)]*\)/g, '') // links + image refs
    .replace(/[#>*_~\-]/g, ' ');           // common markdown sigils
  const words = prose.match(/\b[\w'-]+\b/g);
  const n = words ? words.length : 0;
  sWords.textContent = n + (n === 1 ? ' word' : ' words');
  sRead.textContent = Math.max(1, Math.round(n / 250)) + ' min';
}

async function flush() {
  clearTimeout(flushTimer);
  const content = view.state.doc.toString();
  if (content === saved) return;
  await bus.call(
    { to: 'works', path: '/', interface: 'VFS', member: 'Write' },
    [filePath, content]);
  saved = content;
  setDirty(false);
}

async function loadFromDisk() {
  try {
    saved = (await bus.call(
      { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
      [filePath, 'utf8'])) || '';
  } catch { saved = ''; }
  view.dispatch({
    changes: { from: 0, to: view.state.doc.length, insert: saved },
  });
  setDirty(false);
  updateStatus();
  renderNow();
}

function makeEditor(initialText) {
  return new EditorView({
    parent: sourceRoot,
    state: EditorState.create({
      doc: initialText,
      extensions: [
        minimalSetup,
        history(),
        drawSelection(),
        highlightActiveLine(),
        bracketMatching(),
        indentOnInput(),
        search({ top: true }),
        lineNumbers(),
        EditorView.lineWrapping,
        keymap.of([
          indentWithTab,
          ...searchKeymap,
          { key: 'Ctrl-s', mac: 'Cmd-s', run: () => { flush(); return true; }, preventDefault: true },
          { key: 'Ctrl-z', mac: 'Cmd-z', run: undo },
          { key: 'Ctrl-Shift-z', mac: 'Cmd-Shift-z', run: redo },
          { key: 'Ctrl-y', mac: 'Cmd-y', run: redo },
          { key: 'Escape', run: (v) => closeSearchPanel(v) },
        ]),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            setDirty(view.state.doc.toString() !== saved);
            scheduleRender();
            clearTimeout(flushTimer);
            flushTimer = setTimeout(flush, 1500);
          }
          if (update.docChanged || update.selectionSet) updateStatus();
        }),
      ],
    }),
  });
}

// ── View mode toggle ──────────────────────────────────────────────────
let mode = 'split';
function setMode(m) {
  if (m !== 'source' && m !== 'split' && m !== 'reading') return;
  mode = m;
  bodyEl.classList.remove('mode-source', 'mode-split', 'mode-reading');
  bodyEl.classList.add('mode-' + mode);
  sMode.textContent = mode;
  // Reading mode benefits from re-render; CM6 needs a measure after layout shift.
  if (view) requestAnimationFrame(() => view.requestMeasure?.());
}

// ── Export HTML ───────────────────────────────────────────────────────
async function exportHtml() {
  const title = basename(filePath).replace(/\.[^.]+$/, '') || 'document';
  const innerHtml = previewRoot.innerHTML;
  const docHtml =
    '<!doctype html>\n<html><head><meta charset="utf-8">\n' +
    '<title>' + esc(title) + '</title>\n' +
    '<style>\n' +
    'body{font:14px/1.55 "Barlow",system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#222}\n' +
    'h1,h2,h3,h4{color:#b54e1a;margin-top:1.5em;font-weight:600}\n' +
    'h1{font-size:1.8em;border-bottom:1px solid #ccc;padding-bottom:0.2em}\n' +
    'code{background:#f1efe9;padding:1px 4px;border-radius:3px;font:12px ui-monospace,"Space Mono",monospace;color:#1b6b72}\n' +
    'pre{background:#f1efe9;padding:10px 12px;border-radius:4px;overflow:auto}\n' +
    'pre code{background:none;padding:0;color:#222}\n' +
    'blockquote{border-left:3px solid #1b6b72;padding:4px 12px;margin:0;color:#666;background:#eef5f6}\n' +
    'a{color:#b54e1a}\n' +
    'table{border-collapse:collapse;width:100%;font-size:0.92em}\n' +
    'th,td{padding:4px 8px;text-align:left;border-bottom:1px solid #ddd}\n' +
    'th{background:#f5f3ed;font-weight:600}\n' +
    'img{max-width:100%}\n' +
    '</style>\n</head><body>\n' +
    innerHtml +
    '\n</body></html>\n';
  const blob = new Blob([docHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = title + '.html';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Menubar ───────────────────────────────────────────────────────────
const menubarEl = document.getElementById('menubar');
let actions = {};
const bar = new MenuBar(menubarEl, () => [
  { label: 'File', items: () => [
    { label: 'Save',             action: 'file:save',   shortcut: 'Ctrl+S' },
    { label: 'Revert from disk', action: 'file:revert' },
    '---',
    { label: 'Export HTML…',     action: 'file:export-html' },
  ] },
  { label: 'Edit', items: () => [
    { label: 'Undo',             action: 'edit:undo',   shortcut: 'Ctrl+Z' },
    { label: 'Redo',             action: 'edit:redo',   shortcut: 'Ctrl+Shift+Z' },
    '---',
    { label: 'Find / Replace…',  action: 'edit:find',   shortcut: 'Ctrl+F' },
  ] },
  { label: 'View', items: () => [
    { label: (mode === 'source'  ? '✓ ' : '   ') + 'Source',  action: 'view:source' },
    { label: (mode === 'split'   ? '✓ ' : '   ') + 'Split',   action: 'view:split' },
    { label: (mode === 'reading' ? '✓ ' : '   ') + 'Reading', action: 'view:reading' },
  ] },
]);
bar.on('action', (a) => { const fn = actions[a]; if (fn) fn(); });

// ── A-Bus connect ─────────────────────────────────────────────────────
window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent) return;
  if (!ev.data || ev.data.type !== 'abus:welcome') return;
  const { port, tab } = ev.data;

  filePath = tab.path;
  projectDir = dirOf(filePath);
  sPath.textContent = filePath;

  try { bus = await connect(port, { client: 'doc-surface' }); }
  catch (e) {
    previewRoot.innerHTML = '<div class="template-error">connect failed: ' + esc(e.message) + '</div>';
    return;
  }
  installThemeSubscription(bus);
  try { await bus.claim('doc-' + (tab.id || 'unknown')); } catch {}

  busVfs = makeBusVfs();
  view = makeEditor('');
  await loadFromDisk();

  // VFS.Changed → re-render if any tracked dependency path moved.
  // Coalesce on the 200ms render debounce.
  vfsUnsub = bus.subscribe(
    { interface: 'VFS', member: 'Changed', from: 'works' },
    (msg) => {
      const ev = msg && msg.args && msg.args[0];
      const p = ev && (typeof ev === 'string' ? ev : ev.path);
      if (typeof p !== 'string') return;
      if (deps.has(p)) scheduleRender();
      // If the file we're editing changed on disk from somewhere else,
      // pull the new content. Naive overwrite — if the user has unsaved
      // local edits, those win until they save (Ctrl-S). A more robust
      // shape would diff or warn; v1 is permissive.
      if (p === filePath && !dirty) loadFromDisk();
    },
  );

  // Action handlers
  actions = {
    'file:save':         () => flush(),
    'file:revert':       () => loadFromDisk(),
    'file:export-html':  () => exportHtml(),
    'edit:undo':         () => undo(view),
    'edit:redo':         () => redo(view),
    'edit:find':         () => openSearchPanel(view),
    'view:source':       () => setMode('source'),
    'view:split':        () => setMode('split'),
    'view:reading':      () => setMode('reading'),
  };

  // Surface contract (§5.2)
  bus.expose('/', {
    Surface: {
      methods: {
        Flush:     () => flush(),
        CanClose:  () => true,
        Relocated: (p) => { filePath = p; projectDir = dirOf(p); sPath.textContent = p; },
      },
      signals: ['DirtyChanged', 'TitleChanged', 'Ready'],
    },
  });

  // Initial title — renderNow will replace this with the frontmatter
  // title (if any) on first paint; emit a fallback here so the tab has
  // a sensible label between Ready and the first render completing.
  emitSig('TitleChanged', [basename(filePath)]);
  emitSig('Ready', []);
});
</script>
</body>
</html>
