<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>doc</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--au-surface-deep);
    color: var(--au-fg);
    font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace;
    display: flex;
    flex-direction: column;
  }
  .menubar-host {
    flex: none;
    background: var(--au-surface);
    border-bottom: 1px solid var(--au-border);
  }

  /* ── Formatting toolbar ────────────────────────────────────────────
     One-row strip of buttons that wrap markdown around the current
     selection (or insert template stubs at the cursor). Visible
     whenever the source pane is — hidden in reading mode where there's
     no editor to format. */
  .toolbar {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
    padding: 4px 8px;
    background: var(--au-surface);
    border-bottom: 1px solid var(--au-border);
    font: 12px ui-monospace, 'Space Mono', Menlo, monospace;
  }
  .toolbar button {
    background: transparent; color: var(--au-fg);
    border: 1px solid transparent; border-radius: 3px;
    padding: 2px 8px; min-width: 26px; height: 24px;
    cursor: pointer; font: inherit;
  }
  .toolbar button:hover { background: var(--au-surface-bright); }
  .toolbar button:active { background: var(--au-surface-raised); }
  .toolbar .tb-sep {
    width: 1px; height: 16px; background: var(--au-border); margin: 0 4px;
  }
  .toolbar .tb-bold   { font-weight: 700; }
  .toolbar .tb-italic { font-style: italic; }
  .toolbar .tb-code   { color: var(--au-info); }
  .toolbar .tb-h      { color: var(--au-action); font-weight: 600; }
  /* Reading mode: editor is hidden, toolbar has nothing to do */
  .body.mode-reading + .toolbar,
  .toolbar.reading-hidden { display: none; }

  .body {
    flex: 1; display: flex; min-height: 0;
  }

  /* ── Resizable split divider ───────────────────────────────────────
     A thin draggable bar between source and preview. Width 6px so it's
     comfortable to grab; tinted on hover; cursor-resize affordance.
     Only visible in split mode (other modes hide one of the panes). */
  .divider {
    flex: none; width: 6px; cursor: col-resize;
    background: var(--au-border);
    opacity: 0.4;
    transition: opacity 0.12s, background 0.12s;
  }
  .divider:hover, .divider.dragging {
    opacity: 1; background: var(--au-action);
  }
  .body.mode-source  .divider,
  .body.mode-reading .divider { display: none; }
  /* While dragging, suppress text selection across the whole body so the
     drag doesn't accidentally select text under the cursor. */
  .body.dragging { user-select: none; }
  .body.dragging * { pointer-events: none; }
  .body.dragging .divider { pointer-events: auto; }
  /* Source pane — CM6 owns its inner DOM. flex-basis is set inline
     and mutated by the divider drag handler. */
  .source {
    min-width: 60px; display: flex;
    background: var(--au-surface-deep);
  }
  .source .cm-editor { flex: 1; height: 100%; background: var(--au-surface-deep); color: var(--au-fg); font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace; }
  .source .cm-scroller { font-family: inherit; line-height: 1.55; }
  .source .cm-content { padding: 12px 8px; caret-color: var(--au-action); }
  .source .cm-gutters { background: var(--au-surface); color: var(--au-fg-soft); border-right: 1px solid var(--au-border); }
  .source .cm-activeLineGutter, .source .cm-activeLine { background: var(--au-surface-bright); }
  .source .cm-cursor, .source .cm-dropCursor { border-left-color: var(--au-action); }
  .source .cm-selectionBackground, .source .cm-content ::selection { background: var(--au-selected-soft) !important; }

  /* ── Preview pane — paper-shaped page on a darker tray ──────────────
     The outer .preview container is the "tray" — a slightly darker
     surface so the page floats visibly. The inner .md is the page
     itself: lighter background, a soft drop-shadow, padding generous
     enough to feel like a manuscript, max-width that produces a
     comfortable reading column (~64ch is the typographic sweet spot).
  */
  .preview {
    flex: 1; min-width: 0; overflow: auto;
    background: var(--au-surface-deep);
    padding: 32px 24px;
    display: flex; justify-content: center;
  }
  .preview .md {
    flex: 0 1 min(72ch, 100%);
    align-self: flex-start;
    background: var(--au-surface);
    color: var(--au-fg);
    font: 15px/1.65 'Barlow', system-ui, -apple-system, sans-serif;
    padding: 48px 56px;
    border-radius: 2px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.18),
      0 4px 20px rgba(0,0,0,0.20);
    min-height: 50vh;
  }
  .preview .md > *:first-child { margin-top: 0; }
  .preview .md > * + * { margin-top: 1em; }
  .preview .md h1, .preview .md h2, .preview .md h3, .preview .md h4,
  .preview .md h5, .preview .md h6 {
    color: var(--au-action);
    font-family: 'Barlow', system-ui, sans-serif;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.005em;
  }
  /* Generous space ABOVE headings sets sections off; first heading
     overrides the rule above so it doesn't crash into the top margin. */
  .preview .md h1 + *, .preview .md h2 + *, .preview .md h3 + * { margin-top: 0.5em; }
  .preview .md h1 { font-size: 2em;    margin-top: 1.6em; border-bottom: 1px solid var(--au-border); padding-bottom: 0.25em; }
  .preview .md h2 { font-size: 1.55em; margin-top: 1.8em; }
  .preview .md h3 { font-size: 1.25em; margin-top: 1.6em; }
  .preview .md h4 { font-size: 1.1em;  margin-top: 1.4em; }
  .preview .md h5, .preview .md h6 { font-size: 1em; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1.4em; color: var(--au-fg-muted); }
  .preview .md p { margin: 0; }
  .preview .md strong { font-weight: 700; color: var(--au-fg); }
  .preview .md em { font-style: italic; }
  .preview .md code {
    background: var(--au-surface-raised);
    padding: 1px 5px; border-radius: 3px;
    font: 0.86em ui-monospace, 'Space Mono', Menlo, monospace;
    color: var(--au-info);
  }
  .preview .md pre {
    background: var(--au-surface-raised);
    padding: 12px 14px;
    border-radius: 3px;
    overflow: auto;
    font: 13px/1.5 ui-monospace, 'Space Mono', Menlo, monospace;
    border-left: 3px solid var(--au-border);
  }
  .preview .md pre code { background: none; padding: 0; font-size: 1em; color: var(--au-fg); }
  .preview .md blockquote {
    border-left: 3px solid var(--au-info);
    padding: 0.6em 1em;
    margin: 1em 0;
    color: var(--au-fg-muted);
    background: var(--au-info-soft);
    border-radius: 0 3px 3px 0;
    font-style: italic;
  }
  .preview .md a { color: var(--au-action); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--au-action) 40%, transparent); }
  .preview .md a:hover { border-bottom-color: var(--au-action); }
  .preview .md ul, .preview .md ol { padding-left: 1.5em; }
  .preview .md li { margin: 0.15em 0; }
  .preview .md hr {
    border: none;
    height: 1px;
    background: var(--au-border);
    margin: 2em 0;
  }
  .preview .md img { max-width: 100%; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
  .preview .md table.tpl-table {
    border-collapse: collapse; width: 100%; font-size: 0.92em;
    background: var(--au-surface-raised);
    border-radius: 3px; overflow: hidden;
    margin: 1em 0;
  }
  .preview .md table.tpl-table th, .preview .md table.tpl-table td {
    padding: 6px 10px; text-align: left;
    border-bottom: 1px solid var(--au-border);
  }
  .preview .md table.tpl-table tr:last-child td { border-bottom: none; }
  .preview .md table.tpl-table th { background: var(--au-surface-bright); font-weight: 600; font-family: 'Barlow', system-ui, sans-serif; color: var(--au-action); }
  .preview .md pre.tpl-json {
    background: var(--au-surface-raised);
    border-left: 3px solid var(--au-info);
  }
  .preview .md .tpl-missing {
    color: var(--au-error); background: var(--au-error-soft);
    padding: 1px 6px; border-radius: 3px;
    font: 0.86em ui-monospace, monospace;
  }
  .preview .md .template-error {
    border-left: 3px solid var(--au-error);
    padding: 8px 12px; margin: 8px 0;
    background: var(--au-error-soft); color: var(--au-error);
    font: 12px ui-monospace, monospace;
    border-radius: 0 3px 3px 0;
  }
  /* Empty-page treatment — first paint while frontmatter loads. */
  .preview .md:empty::after {
    content: '(empty document)';
    color: var(--au-fg-muted);
    font-style: italic;
  }

  /* ── View modes ────────────────────────────────────────────────────
     Three toggles in the View menu. CSS class on .body picks which
     panes render. Reading mode hides the source pane, widens the
     page to a more relaxed column, and bumps the body font up a
     notch — closer to "reading a paper" than "previewing markdown". */
  .body.mode-source  .preview { display: none; }
  .body.mode-source  .source { border-right: none; }
  .body.mode-reading .source { display: none; }
  .body.mode-reading .preview { padding: 48px 24px; }
  .body.mode-reading .preview .md {
    flex-basis: min(78ch, 100%);
    font-size: 16px;
    padding: 64px 72px;
  }

  .statusbar {
    flex: none; display: flex; gap: 18px; align-items: center;
    padding: 2px 12px; font-size: 11px; color: var(--au-fg-soft);
    background: var(--au-surface); border-top: 1px solid var(--au-border);
    min-height: 22px;
  }
  .statusbar .status-spacer { flex: 1; }
  .statusbar .status-dirty {
    display: inline-block; min-width: 0.7em; color: var(--au-action);
    font-family: ui-monospace, 'Space Mono', Menlo, monospace;
  }
  .statusbar .status-mode { font-family: ui-monospace, monospace; }

  /* CM6 search panel — visual treatment matches text surface */
  .source .cm-search.cm-panel {
    position: absolute !important;
    top: 4px !important; right: 6px !important;
    padding: 0 !important; margin: 0 !important;
    background: var(--au-surface-deep) !important;
    border: 1px solid var(--au-border) !important;
    border-radius: 3px !important;
    color: var(--au-fg) !important;
  }
  .source .cm-search.cm-panel input { background: var(--au-surface) !important; color: var(--au-fg) !important; border: 1px solid var(--au-border) !important; }
</style>
</head>
<body>
<!--
  doc surface — markdown editor with live HTML preview. Three view
  modes (source / split / reading) via View menu. {{path | filter}}
  template directives resolve against the project's VFS via
  @gcu/template; dependencies tracked for VFS.Changed re-render.
  Saves back to the source .md file (Surface.Flush + dirty cadence).
-->
<div class="menubar-host" id="menubar"></div>
<div class="toolbar" id="toolbar">
  <button data-fmt="bold"      class="tb-bold"   title="Bold (Ctrl+B)">B</button>
  <button data-fmt="italic"    class="tb-italic" title="Italic (Ctrl+I)">I</button>
  <button data-fmt="code"      class="tb-code"   title="Inline code (Ctrl+`)">&lt;/&gt;</button>
  <button data-fmt="strike"                       title="Strikethrough">S̶</button>
  <span class="tb-sep"></span>
  <button data-fmt="h1" class="tb-h" title="Heading 1">H1</button>
  <button data-fmt="h2" class="tb-h" title="Heading 2">H2</button>
  <button data-fmt="h3" class="tb-h" title="Heading 3">H3</button>
  <span class="tb-sep"></span>
  <button data-fmt="ul"        title="Bulleted list">•</button>
  <button data-fmt="ol"        title="Numbered list">1.</button>
  <button data-fmt="quote"     title="Blockquote">&ldquo;</button>
  <button data-fmt="hr"        title="Horizontal rule">—</button>
  <span class="tb-sep"></span>
  <button data-fmt="link"      title="Link">🔗</button>
  <button data-fmt="image"     title="Image (data file)">🖼</button>
  <button data-fmt="codeblock" title="Code block">{ }</button>
  <span class="tb-sep"></span>
  <button data-fmt="tpl"       title="Insert template directive {{path | filter}}">{{ }}</button>
</div>
<div class="body mode-split" id="body">
  <div class="source" id="source" style="flex: 1 1 50%; min-width: 60px;"></div>
  <div class="divider" id="divider" title="Drag to resize"></div>
  <div class="preview" style="flex: 1 1 50%; min-width: 60px;"><div class="md" id="preview"></div></div>
</div>
<div class="statusbar" id="statusbar">
  <span class="status-dirty" id="status-dirty"> </span>
  <span class="status-path" id="status-path">—</span>
  <span class="status-pos" id="status-pos">ln 1, col 1</span>
  <span class="status-mode" id="status-mode">split</span>
  <span class="status-spacer"></span>
  <span class="status-words" id="status-words">0 words</span>
  <span class="status-read" id="status-read">0 min</span>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';
import { bootSurface } from '../../ext/surface/index.js';
import { MenuBar } from '../../ext/menu/index.js';
import { render as mdRender, presets as mdPresets } from '../../ext/markdown/index.js';
import { renderText, registerFilter } from '../../ext/template/index.js';
import { parse as parseYaml, YamlParseError } from '../../ext/yaml/index.js';
import { writeEpub, extractDataUrlImages, splitByHeading } from '../../ext/epub/index.js';
// Named import only — the surface inliner's regex matches `import {…}`
// shape; `import * as ns` slips past it and lands as an unresolvable
// bare specifier at runtime. writeEpub only needs `createWriter`.
import { createWriter } from '../../ext/archive/index.js';

/* @theme-init */

/*__GCU_CM6_INLINE__*/

const {
  EditorView, EditorState, Compartment,
  lineNumbers, highlightActiveLine, drawSelection,
  history, undo, redo, indentWithTab,
  keymap, minimalSetup,
  openSearchPanel, closeSearchPanel, searchKeymap, search,
  bracketMatching, indentOnInput,
  markdown,
  autocompletion,
} = CM6;

const sourceRoot = document.getElementById('source');
const previewRoot = document.getElementById('preview');
const bodyEl = document.getElementById('body');
const sDirty = document.getElementById('status-dirty');
const sPath  = document.getElementById('status-path');
const sPos   = document.getElementById('status-pos');
const sMode  = document.getElementById('status-mode');
const sWords = document.getElementById('status-words');
const sRead  = document.getElementById('status-read');

const basename = (p) => p.split('/').filter(Boolean).pop() || p;
const dirOf    = (p) => { const i = p.lastIndexOf('/'); return i > 0 ? p.slice(0, i) : '/'; };
const esc = (s) => String(s).replace(/[&<>]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ── Markdown rendering ────────────────────────────────────────────────
// @gcu/markdown with the docs preset + html:true — the editor preview renders
// the author's OWN document (author-is-operator), and template-resolved
// blocks ({{…}} filters emit <table>/<pre>/<img>) must pass through raw.
// Replaced the ~50-line line-regex fork (SPEC §8.3); its raw-HTML-LINE
// pass-through generalizes to the engine's html:true.
function renderMarkdown(text) {
  return mdRender(text, { ...mdPresets.docs, html: true });
}

// ── YAML frontmatter ──────────────────────────────────────────────────
//
// A doc may start with a YAML block delimited by `---` lines:
//
//     ---
//     title: Q4 grade tonnage estimate
//     viewMode: reading
//     templateBase: data
//     ---
//
//     # …body markdown begins here…
//
// Recognized keys (all optional):
//   title         — display title for the tab + HTML export <title>
//   viewMode      — initial mode on open: source | split | reading
//   templateBase  — subfolder under the doc's dir that bare `{{path}}`
//                   directives resolve against; default is dirOf(file).
//                   Absolute paths (leading /) are honored verbatim.
//
// Frontmatter is the user's source — the editor pane shows it. The
// preview pipeline skips it (renders only the body) and applies meta
// to the surface state. Parse errors render an inline warning at the
// top of the preview but never block rendering of the body.
const FRONTMATTER_RE = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/;

function splitFrontmatter(source) {
  const m = FRONTMATTER_RE.exec(source);
  if (!m) return { meta: {}, body: source, error: null };
  let meta, error = null;
  try {
    const parsed = parseYaml(m[1]);
    meta = (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
  } catch (e) {
    meta = {};
    error = (e instanceof YamlParseError) ? e.message : String(e && e.message || e);
  }
  return { meta, body: source.slice(m[0].length), error };
}

// ── Template + render pipeline ────────────────────────────────────────
//
// Two-pass: 1) markdown → HTML (preserving {{...}} as literal text in
// HTML), 2) template engine resolves {{...}} → final HTML. The order
// matters: doing template-first would let template-resolved HTML get
// markdown-escaped on the second pass. Doing markdown-first lets the
// `^\s*<` rule above pass our resolved HTML through verbatim.
//
// Engine dependency tracking is wired so any tracked VFS write/delete
// triggers a re-render (debounced).

let bus = null;
let filePath = '';
let projectDir = '/';
let saved = '';
let dirty = false;
let flushTimer = null;
let view = null;
let renderTimer = null;
const deps = new Set();
let vfsUnsub = null;

// Renamed from `emit` to avoid colliding with `function emit(ast)` from
// @gcu/yaml — the lib is inlined into this surface's module scope (see
// works/js/surface-registry.js's _inlineLibsIntoSurface), so any
// top-level identifier in the inlined lib lives in the same scope as
// the surface code. yaml's emitter is one of ~60 top-level functions
// the bundle exposes.
const emitSig = (member, args) =>
  bus.signal({ path: '/', interface: 'Surface', member }, args);

function setDirty(d) {
  if (dirty === d) return;
  dirty = d;
  sDirty.textContent = dirty ? '●' : ' ';
  emitSig('DirtyChanged', [dirty]);
}

// Template engine calls A-Bus VFS reads under the hood — we wrap the
// shell's VFS service into a `vfs` shape that exposes readFile.
function makeBusVfs() {
  return {
    async readFile(path, mode) {
      const text = await bus.call(
        { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
        [path, mode === 'bytes' ? 'bytes' : 'utf8']);
      return text;
    },
  };
}

let busVfs = null;

// Project-local renderMarkdown filter override — when a template
// directive includes a `.md` file, we want THAT content to also
// markdown-render inline, not the engine's escaped fallback.
registerFilter('.md', 'default', async (text) => {
  if (typeof text !== 'string') text = String(text);
  return renderMarkdown(text);
});

// Last applied frontmatter title, so we only emit TitleChanged on change.
let lastTitle = '';
// True once we've applied frontmatter.viewMode for the first time on
// this doc — subsequent edits to viewMode in frontmatter are ignored
// (we don't want the user's manual toggle reverted on every save).
let initialViewModeApplied = false;

async function renderNow() {
  const source = view.state.doc.toString();
  const { meta, body, error: frontmatterError } = splitFrontmatter(source);
  updateWordCount(body);

  // Apply title from frontmatter (or fall back to filename) — fires the
  // shell signal only when it actually changes.
  const title = (typeof meta.title === 'string' && meta.title.trim())
    || basename(filePath).replace(/\.[^.]+$/, '');
  if (title !== lastTitle) {
    lastTitle = title;
    emitSig('TitleChanged', [title]);
  }

  // Apply initial view-mode preference from frontmatter, once.
  if (!initialViewModeApplied && typeof meta.viewMode === 'string') {
    if (['source', 'split', 'reading'].includes(meta.viewMode)) {
      setMode(meta.viewMode);
    }
    initialViewModeApplied = true;
  }

  // Resolve templateBase relative to dirOf(file). Absolute paths land
  // anywhere in the VFS; relative paths combine with the doc's dir.
  let cwd = dirOf(filePath);
  if (typeof meta.templateBase === 'string' && meta.templateBase.trim()) {
    const base = meta.templateBase.trim();
    cwd = base.startsWith('/')
      ? base.replace(/\/+$/, '')
      : (cwd === '/' ? '/' + base : cwd + '/' + base).replace(/\/+$/, '');
  }

  // Phase 1: markdown → HTML (with `{{...}}` directives preserved as text)
  const phase1 = renderMarkdown(body);
  // Phase 2: template engine resolves directives against project VFS
  let phase2;
  deps.clear();
  try {
    phase2 = await renderText(phase1, {
      vfs: busVfs,
      cwd,
      onDependency: (p) => deps.add(p),
    });
  } catch (e) {
    phase2 = `<div class="template-error">template error: ${esc(e.message)}</div>` + phase1;
  }

  // YAML errors render at the top of the preview but never block the body.
  const fmWarning = frontmatterError
    ? `<div class="template-error">frontmatter YAML error: ${esc(frontmatterError)}</div>`
    : '';
  previewRoot.innerHTML = fmWarning + phase2;
}

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(renderNow, 200);
}

function updateStatus() {
  if (!view) return;
  const head = view.state.selection.main.head;
  const line = view.state.doc.lineAt(head);
  sPos.textContent = 'ln ' + line.number + ', col ' + (head - line.from + 1);
}

// Word count / reading time on the BODY (post-frontmatter, pre-template).
// Splits on whitespace after stripping code fences, inline code, and
// markdown directive sigils so the count tracks prose, not syntax.
// Reading time at 250 wpm — the well-cited "comfortable reading"
// figure; rounded to the nearest minute, minimum 1.
function updateWordCount(body) {
  const prose = body
    .replace(/```[\s\S]*?```/g, '')        // fenced code
    .replace(/`[^`]*`/g, '')               // inline code
    .replace(/\{\{[^}]*\}\}/g, '')         // template directives
    .replace(/!?\[[^\]]*\]\([^)]*\)/g, '') // links + image refs
    .replace(/[#>*_~\-]/g, ' ');           // common markdown sigils
  const words = prose.match(/\b[\w'-]+\b/g);
  const n = words ? words.length : 0;
  sWords.textContent = n + (n === 1 ? ' word' : ' words');
  sRead.textContent = Math.max(1, Math.round(n / 250)) + ' min';
}

async function flush() {
  clearTimeout(flushTimer);
  const content = view.state.doc.toString();
  if (content === saved) return;
  await bus.call(
    { to: 'works', path: '/', interface: 'VFS', member: 'Write' },
    [filePath, content]);
  saved = content;
  setDirty(false);
}

async function loadFromDisk() {
  try {
    saved = (await bus.call(
      { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
      [filePath, 'utf8'])) || '';
  } catch { saved = ''; }
  view.dispatch({
    changes: { from: 0, to: view.state.doc.length, insert: saved },
  });
  setDirty(false);
  updateStatus();
  renderNow();
}

function makeEditor(initialText) {
  return new EditorView({
    parent: sourceRoot,
    state: EditorState.create({
      doc: initialText,
      extensions: [
        minimalSetup,
        history(),
        drawSelection(),
        highlightActiveLine(),
        bracketMatching(),
        indentOnInput(),
        search({ top: true }),
        lineNumbers(),
        EditorView.lineWrapping,
        markdown(),
        // {{path}} autocomplete — fires only when the caret is inside
        // a template directive. Defined below so the closure picks up
        // busVfs / bus / projectDir at runtime.
        autocompletion({
          override: [templatePathSource],
          activateOnTyping: true,
        }),
        keymap.of([
          indentWithTab,
          ...searchKeymap,
          { key: 'Ctrl-s', mac: 'Cmd-s', run: () => { flush(); return true; }, preventDefault: true },
          { key: 'Ctrl-z', mac: 'Cmd-z', run: undo },
          { key: 'Ctrl-Shift-z', mac: 'Cmd-Shift-z', run: redo },
          { key: 'Ctrl-y', mac: 'Cmd-y', run: redo },
          { key: 'Escape', run: (v) => closeSearchPanel(v) },
          // Toolbar shortcuts — bold / italic / inline code. Held until
          // the editor is constructed; defined as closures so they pick
          // up the formatCommands map from the surrounding scope.
          { key: 'Ctrl-b', mac: 'Cmd-b', run: () => { formatCommands.bold();   return true; }, preventDefault: true },
          { key: 'Ctrl-i', mac: 'Cmd-i', run: () => { formatCommands.italic(); return true; }, preventDefault: true },
          { key: 'Ctrl-`',                run: () => { formatCommands.code();   return true; }, preventDefault: true },
        ]),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            setDirty(view.state.doc.toString() !== saved);
            scheduleRender();
            clearTimeout(flushTimer);
            flushTimer = setTimeout(flush, 1500);
          }
          if (update.docChanged || update.selectionSet) updateStatus();
        }),
      ],
    }),
  });
}

// ── {{path}} autocomplete ────────────────────────────────────────────
//
// When the caret sits inside a `{{...}}` directive (before any `|`),
// fire VFS-backed path completion. The cwd is the doc's resolved
// template-base (frontmatter.templateBase against dirOf(filePath)),
// matching the template engine's resolution rules. Relative
// completions stay relative; the user can prefix `/` for absolute
// VFS paths from anywhere.
//
// CM6 completion sources can return a Promise — so the VFS readdir
// happens async and the autocomplete UI shows once the dir is read.
// Returns null when not inside a `{{`, so completion doesn't fire
// for normal markdown editing.
function templatePathSource(context) {
  const pos = context.pos;
  const doc = context.state.doc;
  // Look back at most a couple of lines for the `{{` opener — saves
  // walking the whole doc when the caret is far from any directive.
  const lookbackStart = Math.max(0, pos - 400);
  const before = doc.sliceString(lookbackStart, pos);
  const lastOpen = before.lastIndexOf('{{');
  if (lastOpen < 0) return null;
  // Make sure no `}}` sits between {{ and the caret — otherwise we're
  // outside any directive.
  const lastClose = before.lastIndexOf('}}');
  if (lastClose > lastOpen) return null;
  // Inside the directive. Get text from {{ to the caret.
  const inside = before.slice(lastOpen + 2);
  // After a `|` we're in filter-args territory — leave that alone.
  if (inside.indexOf('|') >= 0) return null;
  // Trim leading space the user might've typed for cosmetics.
  const partialRaw = inside.replace(/^\s+/, '');
  // The character position of `partial` in the document — used for
  // CompletionResult.from.
  const fromOffset = pos - partialRaw.length;

  // Resolve the cwd for THIS render. Reads from the live frontmatter
  // (so chapterHeading-style mid-edit changes pick up immediately).
  const source = doc.toString();
  const { meta } = splitFrontmatter(source);
  let cwd = projectDir;
  if (typeof meta.templateBase === 'string' && meta.templateBase.trim()) {
    const base = meta.templateBase.trim();
    cwd = base.startsWith('/')
      ? base.replace(/\/+$/, '')
      : ((cwd === '/' ? '' : cwd) + '/' + base).replace(/\/+/g, '/').replace(/\/+$/, '');
  }

  // Split the partial into a directory part (anything up to the last
  // `/`) and a name prefix. If partial starts with `/`, treat the
  // path as absolute (anchored at VFS root).
  let dirPath, namePrefix;
  if (partialRaw.startsWith('/')) {
    const slash = partialRaw.lastIndexOf('/');
    dirPath = partialRaw.slice(0, slash) || '/';
    namePrefix = partialRaw.slice(slash + 1);
  } else {
    const slash = partialRaw.lastIndexOf('/');
    if (slash >= 0) {
      dirPath = ((cwd === '/' ? '' : cwd) + '/' + partialRaw.slice(0, slash)).replace(/\/+/g, '/');
      namePrefix = partialRaw.slice(slash + 1);
    } else {
      dirPath = cwd || '/';
      namePrefix = partialRaw;
    }
  }

  // Position the replacement range to the LAST `/` after the directive
  // open (or just after `{{` if no slash). That way each path segment
  // gets completed in isolation; tabbing into a subdir completion
  // inserts only the subdir name, not the whole path.
  const replaceFrom = fromOffset + (partialRaw.lastIndexOf('/') + 1);

  if (!busVfs || typeof busVfs.readFile !== 'function') return null;

  return (async () => {
    let entries;
    try {
      entries = await busVfs.readdir
        ? await busVfs.readdir(dirPath)
        : await (busVfs.list ? busVfs.list(dirPath) : []);
    } catch {
      // VFS shape mismatch — the surface's busVfs only has readFile;
      // fall back to an A-Bus VFS.List call so we get directory
      // listings.
      try {
        entries = await bus.call(
          { to: 'works', path: '/', interface: 'VFS', member: 'List' },
          [dirPath, { stat: true }]);
      } catch { return null; }
    }
    if (!Array.isArray(entries)) return null;

    // Each entry: { name, type } (when stat=true). Or just a string
    // when the backend returned plain names. Normalize.
    const opts = [];
    for (const e of entries) {
      const name = typeof e === 'string' ? e : e.name;
      const isDir = typeof e === 'object' && e.type === 'directory';
      if (!name) continue;
      if (namePrefix && !name.toLowerCase().startsWith(namePrefix.toLowerCase())) continue;
      // Hide dotfiles unless the user is explicitly typing a `.` prefix
      if (name.startsWith('.') && !namePrefix.startsWith('.')) continue;
      opts.push({
        label:  name + (isDir ? '/' : ''),
        type:   isDir ? 'folder' : 'file',
        detail: isDir ? '' : _detailForExt(name),
        // Directories: don't auto-insert a trailing space, keep the
        // completion menu open so the user can keep navigating.
        apply:  isDir ? (view, _completion, from, to) => {
          view.dispatch({
            changes: { from, to, insert: name + '/' },
            selection: { anchor: from + name.length + 1 },
          });
        } : undefined,
      });
    }
    // Stable sort: dirs first, then alpha. Keeps "navigation flow"
    // intuitive — user can drill into a folder before picking a file.
    opts.sort((a, b) =>
      (a.type === 'folder' && b.type !== 'folder') ? -1
      : (b.type === 'folder' && a.type !== 'folder') ? 1
      : a.label.localeCompare(b.label));
    return { from: replaceFrom, options: opts, validFor: /^[\w.-]*$/ };
  })();
}

function _detailForExt(name) {
  const dot = name.lastIndexOf('.');
  if (dot < 0) return '';
  const ext = name.slice(dot).toLowerCase();
  const labels = {
    '.csv':  'csv table',
    '.tsv':  'tsv table',
    '.json': 'json',
    '.md':   'markdown',
    '.markdown': 'markdown',
    '.png':  'png',  '.jpg': 'jpeg', '.jpeg': 'jpeg', '.gif': 'gif',
    '.webp': 'webp', '.svg': 'svg',
    '.pdf':  'pdf',  '.txt': 'text',
  };
  return labels[ext] || ext.slice(1);
}

// ── Drag-from-tree → insert markdown ─────────────────────────────────
//
// Tree rows in the shell (works/js/file-ops.js attachTreeRowDnd) set
// dataTransfer with the custom MIME 'application/x-works-tree-path'
// plus a text/plain fallback. We listen at the .source pane level for
// drop events carrying that MIME, then insert a markdown snippet
// based on the dropped file's extension. cwd-relative when the file
// sits inside the doc's own directory; absolute when it lives
// elsewhere (so the link still resolves from anywhere).
const TREE_DND_MIME = 'application/x-works-tree-path';

// File extension → snippet generator. Keys are lowercase ext (with
// leading dot). The function receives the path-as-typed for the
// snippet (cwd-relative or absolute) and the basename for labels.
const _DROP_SNIPPETS = {
  '.csv':  (p) => `{{${p} | format table}}\n`,
  '.tsv':  (p) => `{{${p} | format table}}\n`,
  '.json': (p) => `{{${p} | pretty}}\n`,
  '.md':   (p, name) => `[${name.replace(/\.md$/i, '')}](${p})`,
  '.markdown': (p, name) => `[${name.replace(/\.markdown$/i, '')}](${p})`,
  '.png':  (p, name) => `![${name}](${p})\n`,
  '.jpg':  (p, name) => `![${name}](${p})\n`,
  '.jpeg': (p, name) => `![${name}](${p})\n`,
  '.gif':  (p, name) => `![${name}](${p})\n`,
  '.webp': (p, name) => `![${name}](${p})\n`,
  '.svg':  (p, name) => `![${name}](${p})\n`,
};

function _snippetForDrop(absPath) {
  const name = absPath.split('/').filter(Boolean).pop() || absPath;
  const dot = name.lastIndexOf('.');
  const ext = dot > 0 ? name.slice(dot).toLowerCase() : '';
  // Make the path doc-relative when it sits within the doc's project
  // dir — shorter snippet, naturally resolves the template engine's
  // cwd convention. Otherwise use the absolute VFS path.
  const cwd = projectDir.replace(/\/+$/, '') || '/';
  let p = absPath;
  if (cwd !== '/' && absPath.startsWith(cwd + '/')) {
    p = absPath.slice(cwd.length + 1);
  }
  const gen = _DROP_SNIPPETS[ext];
  if (gen) return gen(p, name);
  // Unknown extension → markdown link with the filename as text
  return `[${name}](${p})`;
}

// Wire drop handling on the source container.
//
// Cross-origin protection: the doc surface is a blob:null/<uuid>
// iframe (unique opaque origin), distinct from the shell's file://
// origin. Chromium hides custom-MIME (`application/x-*`) entries
// from `dataTransfer.types` during dragover under that protection,
// and may hide `getData()` results on drop too. To make drag-to-
// insert work across the boundary we do two things:
//
//   1. Permissive dragover — preventDefault for any drag whose
//      target is our source pane, so the cursor shows "copy" and
//      drop fires. Cost: harmless drops from outside Works (e.g.
//      OS files) also get accepted into this handler, but they
//      produce no path and we no-op.
//   2. postMessage handshake — the shell broadcasts the dragged
//      file's path to every iframe on dragstart, and clears it on
//      dragend. The drop handler reads from that side channel when
//      dataTransfer.getData() is blocked. (See works/js/file-ops.js
//      attachTreeRowDnd for the shell-side broadcast.)
// Cross-origin iframes don't see drag/drop events from the parent —
// Chromium's anti-phishing posture is to suppress them entirely.
// Shell-side delegation handles dragover/drop on the iframe ELEMENT
// (visible to the parent's JS) and postMessages a 'tree-drop' here
// with viewport-relative coords. We map those to a CM6 doc position
// via view.posAtCoords and insert the snippet.
//
// The 'tree-drag-start' / 'tree-drag-end' broadcasts from the shell
// still arrive for any surface that wants to show a drop-zone hint;
// the doc surface doesn't draw one (the whole pane is the target),
// but the receiving listener stays as a useful affordance hook.
window.addEventListener('message', (ev) => {
  if (!ev.data || ev.source !== window.parent) return;
  if (ev.data.type === 'tree-drop' && typeof ev.data.path === 'string') {
    _onTreeDrop(ev.data.path, ev.data.x, ev.data.y);
  }
});

function _onTreeDrop(path, x, y) {
  if (!view) return;
  const snippet = _snippetForDrop(path);
  let insertPos = view.state.selection.main.head;
  try {
    const pos = view.posAtCoords({ x: x, y: y });
    if (pos != null) insertPos = pos;
  } catch { /* fall through to current caret */ }
  view.dispatch({
    changes: { from: insertPos, to: insertPos, insert: snippet },
    selection: { anchor: insertPos + snippet.length },
  });
  view.focus();
}

// No-op wrapper kept so the welcome handler's existing call site
// stays the same shape — actual drag wiring lives in the shell now.
function _wireTreeDrop() { /* shell-side delegation, see message listener above */ }

// ── Toolbar — formatting commands ─────────────────────────────────────
//
// All commands operate on the editor's current selection. Inline marks
// (bold/italic/code/strike) wrap the selection in delimiters; block
// marks (h1/h2/h3, ul, ol, quote) prefix the selection's first line
// (and subsequent lines for lists); link/image/codeblock/hr insert at
// the caret. Toggle behavior: if the selection is already wrapped
// (e.g. `**foo**`), the inline command strips the delimiters. Keeps
// the editor focused after each command so keyboard-only flows work.
function getSelection() {
  const { from, to } = view.state.selection.main;
  return { from, to, text: view.state.doc.sliceString(from, to) };
}

function applyInline(open, close = open) {
  const { from, to, text } = getSelection();
  // Toggle off if the surrounding text already has the delimiters.
  const before = view.state.doc.sliceString(Math.max(0, from - open.length), from);
  const after = view.state.doc.sliceString(to, Math.min(view.state.doc.length, to + close.length));
  let insert, newFrom, newTo;
  if (before === open && after === close) {
    // Strip the delimiters
    insert = text;
    view.dispatch({
      changes: { from: from - open.length, to: to + close.length, insert },
      selection: { anchor: from - open.length, head: from - open.length + text.length },
    });
  } else {
    insert = open + (text || 'text') + close;
    newFrom = from + open.length;
    newTo = newFrom + (text || 'text').length;
    view.dispatch({
      changes: { from, to, insert },
      selection: { anchor: newFrom, head: newTo },
    });
  }
  view.focus();
}

function applyBlockPrefix(prefix) {
  const sel = view.state.selection.main;
  const startLine = view.state.doc.lineAt(sel.from);
  const endLine = view.state.doc.lineAt(sel.to);
  const changes = [];
  for (let n = startLine.number; n <= endLine.number; n++) {
    const line = view.state.doc.line(n);
    // If the line already starts with the same prefix, strip it (toggle off)
    if (line.text.startsWith(prefix)) {
      changes.push({ from: line.from, to: line.from + prefix.length, insert: '' });
    } else {
      // Strip any existing heading prefix first so toggling between levels works
      const m = line.text.match(/^(#{1,6}\s+|>\s+|[-*]\s+|\d+\.\s+)/);
      const stripLen = m ? m[1].length : 0;
      changes.push({ from: line.from, to: line.from + stripLen, insert: prefix });
    }
  }
  view.dispatch({ changes });
  view.focus();
}

function applyNumberedList() {
  const sel = view.state.selection.main;
  const startLine = view.state.doc.lineAt(sel.from);
  const endLine = view.state.doc.lineAt(sel.to);
  const changes = [];
  let n = 1;
  for (let i = startLine.number; i <= endLine.number; i++, n++) {
    const line = view.state.doc.line(i);
    const m = line.text.match(/^(#{1,6}\s+|>\s+|[-*]\s+|\d+\.\s+)/);
    const stripLen = m ? m[1].length : 0;
    changes.push({ from: line.from, to: line.from + stripLen, insert: n + '. ' });
  }
  view.dispatch({ changes });
  view.focus();
}

function insertAtCaret(text, selectFrom, selectTo) {
  const { from, to } = view.state.selection.main;
  view.dispatch({
    changes: { from, to, insert: text },
    selection: selectFrom != null
      ? { anchor: from + selectFrom, head: from + selectTo }
      : { anchor: from + text.length },
  });
  view.focus();
}

const formatCommands = {
  bold:      () => applyInline('**'),
  italic:    () => applyInline('*'),
  code:      () => applyInline('`'),
  strike:    () => applyInline('~~'),
  h1:        () => applyBlockPrefix('# '),
  h2:        () => applyBlockPrefix('## '),
  h3:        () => applyBlockPrefix('### '),
  ul:        () => applyBlockPrefix('- '),
  ol:        () => applyNumberedList(),
  quote:     () => applyBlockPrefix('> '),
  hr:        () => insertAtCaret('\n\n---\n\n'),
  link:      () => {
    const { text } = getSelection();
    const label = text || 'link text';
    const out = '[' + label + '](url)';
    // Select 'url' so the user can type the destination immediately.
    insertAtCaret(out, out.length - 4, out.length - 1);
  },
  image:     () => {
    const out = '![alt](image.png)';
    insertAtCaret(out, 2, 5);
  },
  codeblock: () => {
    const { text } = getSelection();
    const body = text || 'code';
    insertAtCaret('```\n' + body + '\n```\n', 4, 4 + body.length);
  },
  tpl:       () => {
    const out = '{{path | filter args}}';
    insertAtCaret(out, 2, 6);
  },
};

document.getElementById('toolbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-fmt]');
  if (!btn || !view) return;
  const cmd = formatCommands[btn.dataset.fmt];
  if (cmd) cmd();
});

// ── Movable split divider ─────────────────────────────────────────────
//
// Pointer-drag on .divider shifts flex-basis on the source/preview
// panes. Keep both panes alive (min-width: 60px on each) so the user
// can't accidentally lose either side; for "no source" or "no preview"
// the View menu's source/reading modes are the right path. Session-
// local — not persisted, since most docs don't earn their own ratio.
(() => {
  const dividerEl = document.getElementById('divider');
  const sourceEl  = document.getElementById('source');
  const previewEl = document.querySelector('.preview');
  const bodyEl    = document.getElementById('body');
  let startX = 0, startSourceW = 0, startPreviewW = 0;
  function onMove(e) {
    const dx = e.clientX - startX;
    const total = startSourceW + startPreviewW;
    const newSource = Math.max(60, Math.min(total - 60, startSourceW + dx));
    const newPreview = total - newSource;
    sourceEl.style.flex = `0 0 ${newSource}px`;
    previewEl.style.flex = `0 0 ${newPreview}px`;
  }
  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    dividerEl.classList.remove('dragging');
    bodyEl.classList.remove('dragging');
    // After the drag, switch back to flex-grow so window-resize keeps
    // the ratio rather than the absolute pixel widths we forced above.
    const total = sourceEl.offsetWidth + previewEl.offsetWidth;
    sourceEl.style.flex  = `${sourceEl.offsetWidth / total} 1 0`;
    previewEl.style.flex = `${previewEl.offsetWidth / total} 1 0`;
    if (view) view.requestMeasure?.();
  }
  dividerEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    startX = e.clientX;
    startSourceW = sourceEl.offsetWidth;
    startPreviewW = previewEl.offsetWidth;
    dividerEl.classList.add('dragging');
    bodyEl.classList.add('dragging');
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
})();

// ── View mode toggle ──────────────────────────────────────────────────
let mode = 'split';
function setMode(m) {
  if (m !== 'source' && m !== 'split' && m !== 'reading') return;
  mode = m;
  bodyEl.classList.remove('mode-source', 'mode-split', 'mode-reading');
  bodyEl.classList.add('mode-' + mode);
  sMode.textContent = mode;
  // Reading mode benefits from re-render; CM6 needs a measure after layout shift.
  if (view) requestAnimationFrame(() => view.requestMeasure?.());
}

// ── Export EPUB ───────────────────────────────────────────────────────
//
// Pulls metadata from the doc's frontmatter (title/author/lang/date/
// cover/chapterHeading), re-renders the body, extracts inline data-URL
// images into separate EPUB resources (Kindle compatibility), splits
// into multi-chapter via the chapterHeading frontmatter knob if set,
// loads the cover image from VFS if specified, then writes the EPUB
// via @gcu/epub.
async function exportEpub() {
  // Ensure the preview is current — the body we ship is whatever
  // markdown + template resolution just produced. await so the
  // download fires after.
  await renderNow();

  const source = view.state.doc.toString();
  const { meta } = splitFrontmatter(source);

  const titleFromMeta = (typeof meta.title === 'string' && meta.title.trim()) || null;
  const fileBaseName = basename(filePath).replace(/\.[^.]+$/, '') || 'document';
  const title = titleFromMeta || fileBaseName;

  // Metadata fold-through. Each entry optional, dropped when absent.
  const metadata = { title };
  if (typeof meta.author === 'string' && meta.author.trim()) metadata.author = meta.author.trim();
  if (typeof meta.lang === 'string' && meta.lang.trim())     metadata.lang   = meta.lang.trim();
  if (typeof meta.date === 'string' && meta.date.trim())     metadata.date   = meta.date.trim();
  if (typeof meta.description === 'string' && meta.description.trim()) metadata.description = meta.description.trim();
  if (typeof meta.publisher === 'string' && meta.publisher.trim())     metadata.publisher   = meta.publisher.trim();
  if (typeof meta.identifier === 'string' && meta.identifier.trim())   metadata.identifier  = meta.identifier.trim();

  // Step 1: extract every inline data: image into a separate EPUB
  // resource. Some readers (Kindle, older Calibre) don't handle data
  // URLs cleanly; this guarantees a portable EPUB.
  const { html: cleanBody, resources: imgResources } =
    extractDataUrlImages(previewRoot.innerHTML);

  // Step 2: chapter split. Frontmatter `chapterHeading: h1` (or h2..h6)
  // turns the doc into a multi-chapter book by splitting at each
  // configured heading. Absent → single chapter (status quo).
  let chapters;
  if (typeof meta.chapterHeading === 'string') {
    const m = /^h([1-6])$/i.exec(meta.chapterHeading.trim());
    if (m) {
      const lvl = Number(m[1]);
      const split = splitByHeading(cleanBody, lvl);
      if (split && split.length > 0) chapters = split;
    }
  }
  if (!chapters) {
    chapters = [{ id: 'ch1', title, body: cleanBody }];
  }

  // Step 3: cover image. Frontmatter `cover: path/to/image.png` —
  // resolved against the doc's directory (same convention as the
  // template engine's default cwd). Absolute paths (leading `/`) reach
  // anywhere in the VFS. Falls back gracefully on read errors.
  let cover = null;
  if (typeof meta.cover === 'string' && meta.cover.trim()) {
    const raw = meta.cover.trim();
    const coverPath = raw.startsWith('/')
      ? raw
      : ((projectDir === '/' ? '' : projectDir) + '/' + raw).replace(/\/+/g, '/');
    try {
      const bytes = await busVfs.readFile(coverPath, 'bytes');
      if (bytes && bytes.length > 0) {
        const ext = (coverPath.match(/\.([a-z0-9]+)$/i) || ['', ''])[1].toLowerCase();
        const mime =
            ext === 'png'  ? 'image/png'
          : ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg'
          : ext === 'gif'  ? 'image/gif'
          : ext === 'webp' ? 'image/webp'
          : ext === 'svg'  ? 'image/svg+xml'
          : 'application/octet-stream';
        cover = { mime, bytes };
      }
    } catch (e) {
      console.warn('[doc] cover load failed (' + coverPath + '):', e.message);
    }
  }

  let bytes;
  try {
    bytes = await writeEpub({
      // writeEpub's resolver walks the archive object for createWriter;
      // a {createWriter} adapter is the minimal shape it accepts.
      archive: { createWriter },
      metadata,
      chapters,
      cover,
      resources: imgResources,
    });
  } catch (e) {
    console.error('[doc] EPUB export failed:', e);
    return;
  }

  const blob = new Blob([bytes], { type: 'application/epub+zip' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = fileBaseName + '.epub';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Export HTML ───────────────────────────────────────────────────────
async function exportHtml() {
  const title = basename(filePath).replace(/\.[^.]+$/, '') || 'document';
  const innerHtml = previewRoot.innerHTML;
  const docHtml =
    '<!doctype html>\n<html><head><meta charset="utf-8">\n' +
    '<title>' + esc(title) + '</title>\n' +
    '<style>\n' +
    'body{font:14px/1.55 "Barlow",system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#222}\n' +
    'h1,h2,h3,h4{color:#b54e1a;margin-top:1.5em;font-weight:600}\n' +
    'h1{font-size:1.8em;border-bottom:1px solid #ccc;padding-bottom:0.2em}\n' +
    'code{background:#f1efe9;padding:1px 4px;border-radius:3px;font:12px ui-monospace,"Space Mono",monospace;color:#1b6b72}\n' +
    'pre{background:#f1efe9;padding:10px 12px;border-radius:4px;overflow:auto}\n' +
    'pre code{background:none;padding:0;color:#222}\n' +
    'blockquote{border-left:3px solid #1b6b72;padding:4px 12px;margin:0;color:#666;background:#eef5f6}\n' +
    'a{color:#b54e1a}\n' +
    'table{border-collapse:collapse;width:100%;font-size:0.92em}\n' +
    'th,td{padding:4px 8px;text-align:left;border-bottom:1px solid #ddd}\n' +
    'th{background:#f5f3ed;font-weight:600}\n' +
    'img{max-width:100%}\n' +
    '</style>\n</head><body>\n' +
    innerHtml +
    '\n</body></html>\n';
  const blob = new Blob([docHtml], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = title + '.html';
  a.click();
  URL.revokeObjectURL(url);
}

// ── Menubar ───────────────────────────────────────────────────────────
const menubarEl = document.getElementById('menubar');
let actions = {};
const bar = new MenuBar(menubarEl, () => [
  { label: 'File', items: () => [
    { label: 'Save',             action: 'file:save',   shortcut: 'Ctrl+S' },
    { label: 'Revert from disk', action: 'file:revert' },
    '---',
    { label: 'Export HTML…',     action: 'file:export-html' },
    { label: 'Export EPUB…',     action: 'file:export-epub' },
  ] },
  { label: 'Edit', items: () => [
    { label: 'Undo',             action: 'edit:undo',   shortcut: 'Ctrl+Z' },
    { label: 'Redo',             action: 'edit:redo',   shortcut: 'Ctrl+Shift+Z' },
    '---',
    { label: 'Find / Replace…',  action: 'edit:find',   shortcut: 'Ctrl+F' },
  ] },
  { label: 'View', items: () => [
    { label: (mode === 'source'  ? '✓ ' : '   ') + 'Source',  action: 'view:source' },
    { label: (mode === 'split'   ? '✓ ' : '   ') + 'Split',   action: 'view:split' },
    { label: (mode === 'reading' ? '✓ ' : '   ') + 'Reading', action: 'view:reading' },
  ] },
]);
bar.on('action', (a) => { const fn = actions[a]; if (fn) fn(); });

// ── A-Bus connect ─────────────────────────────────────────────────────
bootSurface({
  connect,
  client: 'doc',
  onConnect: (b) => installThemeSubscription(b),
  // Editor host: Flush persists; Relocated re-points the bound path.
  makeHost: () => ({
    flush: () => flush(),
    relocate: (p) => { filePath = p; projectDir = dirOf(p); sPath.textContent = p; },
  }),
  mount: async ({ bus: b, tab }) => {
  bus = b;
  filePath = tab.path;
  projectDir = dirOf(filePath);
  sPath.textContent = filePath;

  busVfs = makeBusVfs();
  view = makeEditor('');
  _wireTreeDrop();
  await loadFromDisk();

  // VFS.Changed → re-render if any tracked dependency path moved.
  // Coalesce on the 200ms render debounce.
  vfsUnsub = bus.subscribe(
    { interface: 'VFS', member: 'Changed', from: 'works' },
    (msg) => {
      const ev = msg && msg.args && msg.args[0];
      const p = ev && (typeof ev === 'string' ? ev : ev.path);
      if (typeof p !== 'string') return;
      if (deps.has(p)) scheduleRender();
      // If the file we're editing changed on disk from somewhere else,
      // pull the new content. Naive overwrite — if the user has unsaved
      // local edits, those win until they save (Ctrl-S). A more robust
      // shape would diff or warn; v1 is permissive.
      if (p === filePath && !dirty) loadFromDisk();
    },
  );

  // Action handlers
  actions = {
    'file:save':         () => flush(),
    'file:revert':       () => loadFromDisk(),
    'file:export-html':  () => exportHtml(),
    'file:export-epub':  () => exportEpub(),
    'edit:undo':         () => undo(view),
    'edit:redo':         () => redo(view),
    'edit:find':         () => openSearchPanel(view),
    'view:source':       () => setMode('source'),
    'view:split':        () => setMode('split'),
    'view:reading':      () => setMode('reading'),
  };

  // Initial title — renderNow will replace this with the frontmatter
  // title (if any) on first paint; emit a fallback here so the tab has
  // a sensible label between Ready and the first render completing.
  emitSig('TitleChanged', [basename(filePath)]);
  },
});
</script>
</body>
</html>
