<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>text editor</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--au-surface-deep);
    color: var(--au-fg);
    font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace;
    display: flex;
    flex-direction: column;
  }

  .menubar-host {
    flex: none;
    background: var(--au-surface);
    border-bottom: 1px solid var(--au-border);
  }

  /* ── Editor container ──────────────────────────────────────────────
     CodeMirror's EditorView attaches its own DOM under this element.
     We let CM6 own everything below the menubar — gutters, scrolling,
     selection, search panel, the lot. */
  #editor-root {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: var(--au-surface-deep);
    display: flex;
  }
  #editor-root .cm-editor {
    flex: 1 1 auto;
    height: 100%;
    background: var(--au-surface-deep);
    color: var(--au-fg);
    font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace;
  }
  #editor-root .cm-scroller {
    font-family: inherit;
    line-height: 1.55;
  }
  #editor-root .cm-content {
    padding: 8px 4px 8px 0;
    caret-color: var(--au-action);
  }
  #editor-root .cm-gutters {
    background: var(--au-surface);
    color: var(--au-fg-soft);
    border-right: 1px solid var(--au-border);
  }
  #editor-root .cm-activeLineGutter,
  #editor-root .cm-activeLine {
    background: var(--au-surface-bright);
  }
  #editor-root .cm-cursor,
  #editor-root .cm-dropCursor { border-left-color: var(--au-action); }
  #editor-root .cm-selectionBackground,
  #editor-root .cm-focused .cm-selectionBackground,
  #editor-root ::selection {
    background: var(--au-selected-soft) !important;
  }
  #editor-root .cm-focused { outline: none; }

  /* CM6's built-in search panel — restyled to match the GCU chrome. */
  #editor-root .cm-panels {
    background: var(--au-surface-raised);
    color: var(--au-fg);
    border-color: var(--au-border);
  }
  #editor-root .cm-panels.cm-panels-top { border-bottom: 1px solid var(--au-border); }
  #editor-root .cm-panels.cm-panels-bottom { border-top: 1px solid var(--au-border); }
  #editor-root .cm-panel input,
  #editor-root .cm-panel button,
  #editor-root .cm-panel label {
    font: 11px/1.4 ui-monospace, 'Space Mono', Menlo, monospace;
    color: var(--au-fg);
  }
  #editor-root .cm-panel input {
    background: var(--au-surface-deep);
    border: 1px solid var(--au-border);
    padding: 2px 6px;
    border-radius: 2px;
    outline: none;
  }
  #editor-root .cm-panel input:focus { border-color: var(--au-action); }
  #editor-root .cm-panel button {
    background: none;
    border: 1px solid var(--au-border);
    padding: 2px 8px;
    border-radius: 2px;
    cursor: pointer;
    margin-left: 4px;
    color: var(--au-fg-muted);
  }
  #editor-root .cm-panel button:hover {
    color: var(--au-fg);
    border-color: var(--au-fg-soft);
  }
  #editor-root .cm-search-match { background: var(--au-action-soft); }
  #editor-root .cm-selectionMatch { background: var(--au-warn-soft); }

  /* ── Status bar ──────────────────────────────────────────────────── */
  .statusbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 10px;
    background: var(--au-surface-raised);
    border-top: 1px solid var(--au-border);
    color: var(--au-fg-muted);
    font: 11px/1.6 ui-monospace, 'Space Mono', Menlo, monospace;
    user-select: none;
  }
  .statusbar.hidden { display: none; }
  .status-path { color: var(--au-fg); }
  .status-pos, .status-size, .status-lang { color: var(--au-fg-muted); }
  .status-dirty {
    color: var(--au-warn);
    font-weight: 700;
    width: 1em;
    text-align: center;
  }
  .status-spacer { flex: 1; }

  /* ── Scrollbars (GCU thin) ───────────────────────────────────────── */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--au-border) transparent;
  }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--au-border);
    border-radius: 4px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--au-fg-soft); }
  *::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
<!--
  Text editor surface for Auditable Works. Now backed by CodeMirror 6 —
  swap from the prior textarea approach removed ~500 LOC of manual
  gutter-sync / scroll-preservation / find-replace handling that CM6
  ships solved out of the box.

  CM6 is loaded via the works shared-lib mechanism: the build inlines
  `/* @cm6-inline */` below with the cm6.min.js IIFE source, exposing
  `CM6` as a module-scope variable. Disk-only dedup with other surfaces
  that opt into @gcu/cm6 — one copy in works.html, one fresh runtime
  copy per iframe scope.

  Language extensions match by file extension: js / py / css / html
  get their respective lang packages; everything else stays plain text.

  Still ours to own: the @gcu/menu menubar (File / Edit / View) + the
  status bar at the bottom. Find/Replace routes to CM6's built-in
  search panel (openSearchPanel) instead of our previous custom bar.
-->
<div class="menubar-host" id="menubar"></div>
<div id="editor-root"></div>
<div class="statusbar" id="statusbar">
  <span class="status-dirty" id="status-dirty"> </span>
  <span class="status-path" id="status-path">—</span>
  <span class="status-pos" id="status-pos">ln 1, col 1</span>
  <span class="status-size" id="status-size">0 B</span>
  <span class="status-lang" id="status-lang"></span>
  <span class="status-spacer"></span>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';
import { MenuBar } from '../../ext/menu/index.js';

/* @theme-init */

/* @cm6-inline */

// CM6 is now in scope after the inlined IIFE. Destructure the symbols
// the surface uses. (Adding a new feature later — bracket matching,
// autocomplete, etc. — means pulling more names from CM6 here AND
// extending ext/cm6/entry.mjs's export list.)
const {
  EditorView, EditorState, Compartment,
  lineNumbers, highlightActiveLine, drawSelection,
  history, undo, redo, indentWithTab,
  keymap, minimalSetup,
  openSearchPanel, searchKeymap, search,
  bracketMatching, indentOnInput,
  javascript, css: cssLang, python, html: htmlLang,
} = CM6;

const statusBar = document.getElementById('statusbar');
const sDirty    = document.getElementById('status-dirty');
const sPath     = document.getElementById('status-path');
const sPos      = document.getElementById('status-pos');
const sSize     = document.getElementById('status-size');
const sLang     = document.getElementById('status-lang');
const editorRoot = document.getElementById('editor-root');

const basename = (p) => p.split('/').filter(Boolean).pop() || p;
const fmtBytes = (n) =>
  n < 1024 ? n + ' B'
  : n < 1024 * 1024 ? (n / 1024).toFixed(1) + ' KB'
  : (n / 1024 / 1024).toFixed(1) + ' MB';

// ── Language detection ────────────────────────────────────────────────
// Match by file extension; default to plain text. Extending: add an entry,
// and ensure the language module is re-exported from ext/cm6/entry.mjs.
function langForPath(p) {
  const ext = (p.match(/\.([^./]+)$/) || ['', ''])[1].toLowerCase();
  switch (ext) {
    case 'js': case 'mjs': case 'cjs': case 'jsx': case 'ts': case 'tsx':
      return { name: 'JavaScript', ext: javascript() };
    case 'py':
      return { name: 'Python', ext: python() };
    case 'css':
      return { name: 'CSS', ext: cssLang() };
    case 'html': case 'htm': case 'xml': case 'svg':
      return { name: 'HTML', ext: htmlLang() };
    case 'json':
      // CM6's javascript() handles JSON well enough — no separate JSON pkg.
      return { name: 'JSON', ext: javascript() };
    default:
      return { name: '', ext: [] };
  }
}

// ── View toggles (line numbers / wrap / status bar) ─────────────────
// Compartments let us reconfigure individual extensions at runtime
// without rebuilding the whole state. CM6 pattern.
const lineNumCompartment = new Compartment();
const wrapCompartment    = new Compartment();
const langCompartment    = new Compartment();

let showLineNumbers = true;
let wrap            = false;
let showStatusBar   = true;

function applyViewToggles() {
  view.dispatch({
    effects: [
      lineNumCompartment.reconfigure(showLineNumbers ? lineNumbers() : []),
      wrapCompartment.reconfigure(wrap ? EditorView.lineWrapping : []),
    ],
  });
  statusBar.classList.toggle('hidden', !showStatusBar);
}

// ── Status-bar updates piggyback on a CM6 updateListener ──────────────
function updateStatus() {
  const state = view.state;
  const head = state.selection.main.head;
  const line = state.doc.lineAt(head);
  sPos.textContent = 'ln ' + line.number + ', col ' + (head - line.from + 1);
  sSize.textContent = fmtBytes(state.doc.length);
}

// ── A-Bus wire-up ─────────────────────────────────────────────────────
let view;
let bus;
let saved = '';
let filePath = '';
let dirty = false;
let flushTimer = null;

const emit = (member, args) =>
  bus.signal({ path: '/', interface: 'Surface', member }, args);

function setDirty(d) {
  if (dirty === d) return;
  dirty = d;
  sDirty.textContent = dirty ? '●' : ' ';
  emit('DirtyChanged', [dirty]);
}

async function flush() {
  clearTimeout(flushTimer);
  const content = view.state.doc.toString();
  if (content === saved) return;
  await bus.call(
    { to: 'works', path: '/', interface: 'VFS', member: 'Write' },
    [filePath, content]);
  saved = content;
  setDirty(false);
}

async function loadFromDisk() {
  try {
    saved = (await bus.call(
      { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
      [filePath, 'utf8'])) || '';
  } catch { saved = ''; }
  view.dispatch({
    changes: { from: 0, to: view.state.doc.length, insert: saved },
  });
  setDirty(false);
  updateStatus();
}

function makeEditor(initialText, languageExt) {
  return new EditorView({
    parent: editorRoot,
    state: EditorState.create({
      doc: initialText,
      extensions: [
        minimalSetup,
        history(),
        drawSelection(),
        highlightActiveLine(),
        bracketMatching(),
        indentOnInput(),
        search({ top: true }),
        lineNumCompartment.of(showLineNumbers ? lineNumbers() : []),
        wrapCompartment.of(wrap ? EditorView.lineWrapping : []),
        langCompartment.of(languageExt),
        keymap.of([
          indentWithTab,
          ...searchKeymap,
          { key: 'Ctrl-s',   mac: 'Cmd-s',  run: () => { flush(); return true; }, preventDefault: true },
          { key: 'Ctrl-z',   mac: 'Cmd-z',  run: undo },
          { key: 'Ctrl-Shift-z', mac: 'Cmd-Shift-z', run: redo },
          { key: 'Ctrl-y',   mac: 'Cmd-y',  run: redo },
        ]),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            setDirty(view.state.doc.toString() !== saved);
            clearTimeout(flushTimer);
            flushTimer = setTimeout(flush, 1500);
          }
          if (update.docChanged || update.selectionSet) {
            updateStatus();
          }
        }),
      ],
    }),
  });
}

// ── Menubar ───────────────────────────────────────────────────────────
const menubarEl = document.getElementById('menubar');
let actions = {};
const bar = new MenuBar(menubarEl, () => [
  { label: 'File', items: () => [
    { label: 'Save',             action: 'file:save',   shortcut: 'Ctrl+S' },
    { label: 'Revert from disk', action: 'file:revert' },
  ] },
  { label: 'Edit', items: () => [
    { label: 'Undo',            action: 'edit:undo',    shortcut: 'Ctrl+Z' },
    { label: 'Redo',            action: 'edit:redo',    shortcut: 'Ctrl+Shift+Z' },
    '---',
    { label: 'Find / Replace…', action: 'edit:find',    shortcut: 'Ctrl+F' },
    '---',
    { label: 'Select all',      action: 'edit:selectall', shortcut: 'Ctrl+A' },
    { label: 'Insert date/time', action: 'edit:datetime' },
  ] },
  { label: 'View', items: () => [
    { label: (showLineNumbers ? '✓ ' : '   ') + 'Line numbers', action: 'view:line-numbers' },
    { label: (wrap            ? '✓ ' : '   ') + 'Word wrap',    action: 'view:wrap' },
    { label: (showStatusBar   ? '✓ ' : '   ') + 'Status bar',   action: 'view:status-bar' },
  ] },
]);
bar.on('action', (a) => {
  const fn = actions[a];
  if (fn) fn();
});

// ── A-Bus connect ─────────────────────────────────────────────────────
window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent) return;
  if (!ev.data || ev.data.type !== 'abus:welcome') return;
  const { port, tab } = ev.data;

  filePath = tab.path;
  sPath.textContent = filePath;
  const { name: langName, ext: langExt } = langForPath(filePath);
  sLang.textContent = langName;

  try {
    bus = await connect(port, { client: 'text-surface' });
  } catch (e) {
    editorRoot.textContent = 'connect failed: ' + e.message;
    return;
  }
  installThemeSubscription(bus);

  view = makeEditor('', langExt);
  await loadFromDisk();
  updateStatus();

  // Now that view exists, wire menubar actions.
  actions = {
    'file:save': () => flush(),
    'file:revert': async () => {
      if (dirty && !window.confirm('Discard unsaved changes?')) return;
      await loadFromDisk();
    },
    'edit:undo': () => undo({ state: view.state, dispatch: view.dispatch.bind(view) }),
    'edit:redo': () => redo({ state: view.state, dispatch: view.dispatch.bind(view) }),
    'edit:find': () => openSearchPanel(view),
    'edit:selectall': () => {
      view.dispatch({ selection: { anchor: 0, head: view.state.doc.length } });
      view.focus();
    },
    'edit:datetime': () => {
      const stamp = new Date().toISOString().slice(0, 19).replace('T', ' ');
      const sel = view.state.selection.main;
      view.dispatch({ changes: { from: sel.from, to: sel.to, insert: stamp } });
      view.focus();
    },
    'view:line-numbers': () => { showLineNumbers = !showLineNumbers; applyViewToggles(); },
    'view:wrap':         () => { wrap = !wrap; applyViewToggles(); },
    'view:status-bar':   () => { showStatusBar = !showStatusBar; applyViewToggles(); },
  };

  // The §5.2 Surface contract.
  bus.expose('/', {
    Surface: {
      methods: {
        Flush:     () => flush(),
        CanClose:  () => true,
        Relocated: (p) => {
          filePath = p;
          sPath.textContent = filePath;
          const { name, ext } = langForPath(p);
          sLang.textContent = name;
          view.dispatch({ effects: langCompartment.reconfigure(ext) });
          emit('TitleChanged', [basename(p)]);
        },
      },
      signals: ['DirtyChanged', 'TitleChanged', 'Ready'],
    },
  });

  emit('TitleChanged', [basename(filePath)]);
  emit('Ready', []);
});
</script>
</body>
</html>
