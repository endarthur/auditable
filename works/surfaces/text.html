<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>text editor</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--au-surface-deep);
    color: var(--au-fg);
    font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace;
    display: flex;
    flex-direction: column;
  }

  .menubar-host {
    flex: none;
    background: var(--au-surface);
    border-bottom: 1px solid var(--au-border);
  }

  /* ── Editor container ──────────────────────────────────────────────
     CodeMirror's EditorView attaches its own DOM under this element.
     We let CM6 own everything below the menubar — gutters, scrolling,
     selection, search panel, the lot. */
  #editor-root {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    background: var(--au-surface-deep);
    display: flex;
  }
  #editor-root .cm-editor {
    flex: 1 1 auto;
    height: 100%;
    background: var(--au-surface-deep);
    color: var(--au-fg);
    font: 13px/1.55 ui-monospace, 'Space Mono', Menlo, monospace;
  }
  #editor-root .cm-scroller {
    font-family: inherit;
    line-height: 1.55;
  }
  #editor-root .cm-content {
    padding: 8px 4px 8px 0;
    caret-color: var(--au-action);
  }
  #editor-root .cm-gutters {
    background: var(--au-surface);
    color: var(--au-fg-soft);
    border-right: 1px solid var(--au-border);
  }
  #editor-root .cm-activeLineGutter,
  #editor-root .cm-activeLine {
    background: var(--au-surface-bright);
  }
  #editor-root .cm-cursor,
  #editor-root .cm-dropCursor { border-left-color: var(--au-action); }
  #editor-root .cm-selectionBackground,
  #editor-root .cm-focused .cm-selectionBackground,
  #editor-root ::selection {
    background: var(--au-selected-soft) !important;
  }
  #editor-root .cm-focused { outline: none; }

  /* CM6's built-in search panel — restyled to match the GCU chrome. */
  #editor-root .cm-panels {
    background: var(--au-surface-raised);
    color: var(--au-fg);
    border-color: var(--au-border);
  }
  #editor-root .cm-panels.cm-panels-top { border-bottom: 1px solid var(--au-border); }
  #editor-root .cm-panels.cm-panels-bottom { border-top: 1px solid var(--au-border); }
  #editor-root .cm-panel input,
  #editor-root .cm-panel button,
  #editor-root .cm-panel label {
    font: 11px/1.4 ui-monospace, 'Space Mono', Menlo, monospace;
    color: var(--au-fg);
  }
  #editor-root .cm-panel input {
    background: var(--au-surface-deep);
    border: 1px solid var(--au-border);
    padding: 2px 6px;
    border-radius: 2px;
    outline: none;
  }
  #editor-root .cm-panel input:focus { border-color: var(--au-action); }
  #editor-root .cm-panel button {
    background: none;
    border: 1px solid var(--au-border);
    padding: 2px 8px;
    border-radius: 2px;
    cursor: pointer;
    margin-left: 4px;
    color: var(--au-fg-muted);
  }
  #editor-root .cm-panel button:hover {
    color: var(--au-fg);
    border-color: var(--au-fg-soft);
  }
  /* CM6's search panel ships a close button at name="close" — by default
     position: absolute; top: 0; right: 4px inside .cm-search. Make it
     impossible to miss: explicit position, accent border, larger ×,
     standout background. !important wards off any conflicting rule
     from CM6's baseTheme or our generic .cm-panel button styling above. */
  #editor-root .cm-panel button[name="close"] {
    position: absolute !important;
    top: 4px !important;
    right: 6px !important;
    z-index: 2;
    width: 22px;
    height: 22px;
    padding: 0 !important;
    margin: 0 !important;
    background: var(--au-surface-deep) !important;
    border: 1px solid var(--au-border) !important;
    border-radius: 3px;
    color: var(--au-fg) !important;
    font-size: 16px;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
    cursor: pointer;
  }
  #editor-root .cm-panel button[name="close"]:hover {
    color: var(--au-action) !important;
    border-color: var(--au-action) !important;
  }
  /* Make sure the panel has enough right padding so the absolute close
     button doesn't visually overlap the last input/button in the row. */
  #editor-root .cm-panel.cm-search {
    padding-right: 36px !important;
  }
  #editor-root .cm-search-match { background: var(--au-action-soft); }
  #editor-root .cm-selectionMatch { background: var(--au-warn-soft); }

  /* ── Status bar ──────────────────────────────────────────────────── */
  .statusbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 10px;
    background: var(--au-surface-raised);
    border-top: 1px solid var(--au-border);
    color: var(--au-fg-muted);
    font: 11px/1.6 ui-monospace, 'Space Mono', Menlo, monospace;
    user-select: none;
  }
  .statusbar.hidden { display: none; }
  .status-path { color: var(--au-fg); }
  .status-pos, .status-size, .status-lang { color: var(--au-fg-muted); }
  .status-dirty {
    color: var(--au-warn);
    font-weight: 700;
    width: 1em;
    text-align: center;
  }
  .status-spacer { flex: 1; }

  /* ── Scrollbars (GCU thin) ───────────────────────────────────────── */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--au-border) transparent;
  }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--au-border);
    border-radius: 4px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--au-fg-soft); }
  *::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
<!--
  Text editor surface for Auditable Works. Now backed by CodeMirror 6 —
  swap from the prior textarea approach removed ~500 LOC of manual
  gutter-sync / scroll-preservation / find-replace handling that CM6
  ships solved out of the box.

  CM6 is loaded via the works shared-lib mechanism: the build inlines
  the CM6 IIFE source at a build-time marker below, exposing CM6 as
  a module-scope variable. Disk-only dedup with other surfaces that
  opt into @gcu/cm6 — one copy in works.html, one fresh runtime
  copy per iframe scope. (Mind: the marker token below is unique so
  the text.replace doesn't accidentally fire on the first occurrence
  of the placeholder in this very comment — happened once, debugged
  once, never again.)

  Language extensions match by file extension: js / py / css / html
  get their respective lang packages; everything else stays plain text.

  Still ours to own: the @gcu/menu menubar (File / Edit / View) + the
  status bar at the bottom. Find/Replace routes to CM6's built-in
  search panel (openSearchPanel) instead of our previous custom bar.
-->
<div class="menubar-host" id="menubar"></div>
<div id="editor-root"></div>
<div class="statusbar" id="statusbar">
  <span class="status-dirty" id="status-dirty"> </span>
  <span class="status-path" id="status-path">—</span>
  <span class="status-pos" id="status-pos">ln 1, col 1</span>
  <span class="status-size" id="status-size">0 B</span>
  <span class="status-lang" id="status-lang"></span>
  <span class="status-spacer"></span>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';
import { bootSurface } from '../../ext/surface/index.js';
import { MenuBar } from '../../ext/menu/index.js';

/* @theme-init */

/*__GCU_CM6_INLINE__*/

// CM6 is now in scope after the inlined IIFE. Destructure the symbols
// the surface uses. (Adding a new feature later — bracket matching,
// autocomplete, etc. — means pulling more names from CM6 here AND
// extending ext/cm6/entry.mjs's export list.)
const {
  EditorView, EditorState, Compartment,
  lineNumbers, highlightActiveLine, drawSelection,
  history, undo, redo, indentWithTab,
  keymap, minimalSetup,
  openSearchPanel, closeSearchPanel, searchKeymap, search,
  bracketMatching, indentOnInput,
  javascript, css: cssLang, python, html: htmlLang,
  syntaxHighlighting, HighlightStyle, StreamLanguage, tags,
} = CM6;

// GCU syntax colors — one HighlightStyle for both themes (the --au-* tokens flip
// with [data-theme]). Mirrors the notebook's palette (src/js/cm6.js). minimalSetup
// ships no highlighting, so without this the editor shows structure but no color.
const gcuHighlight = HighlightStyle.define([
  { tag: tags.keyword, color: 'var(--au-selected)' },
  { tag: tags.string, color: 'var(--au-success)' },
  { tag: tags.number, color: 'var(--au-warn)' },
  { tag: tags.bool, color: 'var(--au-warn)' },
  { tag: tags.null, color: 'var(--au-warn)' },
  { tag: tags.comment, color: 'var(--au-fg-soft)', fontStyle: 'italic' },
  { tag: tags.function(tags.variableName), color: 'var(--au-info)' },
  { tag: tags.function(tags.propertyName), color: 'var(--au-info)' },
  { tag: tags.definition(tags.variableName), color: 'var(--au-fg)' },
  { tag: tags.constant(tags.variableName), color: 'var(--au-warn)' },
  { tag: tags.operator, color: 'var(--au-fg-muted)' },
  { tag: tags.punctuation, color: 'var(--au-fg-soft)' },
  { tag: tags.propertyName, color: 'var(--au-info)' },
  { tag: tags.variableName, color: 'var(--au-fg)' },
  { tag: tags.typeName, color: 'var(--au-info)' },
  { tag: tags.className, color: 'var(--au-info)' },
  { tag: tags.tagName, color: 'var(--au-info)' },
  { tag: tags.attributeName, color: 'var(--au-info)' },
]);

// atra (@gcu/atra) StreamLanguage — a compact line tokenizer for .atra files.
// The CANONICAL tokenizer lives in ext/atra/src/highlight.js (used by notebook
// atra cells); this is a self-contained editor approximation so the text surface
// can highlight .atra without pulling in atra's compiler. Keyword/type/builtin
// sets mirror highlight.js — stable, but if atra's vocabulary grows, update here.
const ATRA_KW = new Set(['function','subroutine','begin','end','var','const','if','then','else','for','while','do','break','and','or','not','mod','import','export','call','array','true','false','from','tailcall','return','layout','packed','memory','case','of']);
const ATRA_TY = new Set(['i32','i64','f32','f64','f64x2','f32x4','i32x4','i64x2']);
const ATRA_FN = new Set(['sin','cos','sqrt','abs','floor','ceil','ln','exp','pow','min','max','trunc','nearest','copysign','select','clz','ctz','popcnt','rotl','rotr','memory_size','memory_grow','memory_copy','memory_fill']);
const atraLang = StreamLanguage.define({
  token(stream) {
    if (stream.eatSpace()) return null;
    if (stream.match('//')) { stream.skipToEnd(); return 'comment'; }
    if (stream.match(/^"(?:[^"\\]|\\.)*"?/)) return 'string';
    if (stream.match(/^0x[0-9a-fA-F]+|^\d+\.?\d*(?:[eE][+-]?\d+)?/)) return 'number';
    if (stream.match(/^[A-Za-z_][A-Za-z0-9_]*/)) {
      const w = stream.current();
      if (ATRA_KW.has(w)) return (w === 'true' || w === 'false') ? 'bool' : 'keyword';
      if (ATRA_TY.has(w)) return 'typeName';
      if (ATRA_FN.has(w)) return 'builtin';
      return 'variableName';
    }
    if (stream.match(/^[-+*/%<>=!&|^~]+/)) return 'operator';
    stream.next();
    return null;
  },
  tokenTable: {
    keyword: tags.keyword, typeName: tags.typeName, builtin: tags.function(tags.variableName),
    string: tags.string, number: tags.number, comment: tags.comment,
    operator: tags.operator, variableName: tags.variableName, bool: tags.bool,
  },
});

const statusBar = document.getElementById('statusbar');
const sDirty    = document.getElementById('status-dirty');
const sPath     = document.getElementById('status-path');
const sPos      = document.getElementById('status-pos');
const sSize     = document.getElementById('status-size');
const sLang     = document.getElementById('status-lang');
const editorRoot = document.getElementById('editor-root');

const basename = (p) => p.split('/').filter(Boolean).pop() || p;
const fmtBytes = (n) =>
  n < 1024 ? n + ' B'
  : n < 1024 * 1024 ? (n / 1024).toFixed(1) + ' KB'
  : (n / 1024 / 1024).toFixed(1) + ' MB';

// ── Language detection ────────────────────────────────────────────────
// Match by file extension; default to plain text. Extending: add an entry,
// and ensure the language module is re-exported from ext/cm6/entry.mjs.
function langForPath(p) {
  const ext = (p.match(/\.([^./]+)$/) || ['', ''])[1].toLowerCase();
  switch (ext) {
    case 'js': case 'mjs': case 'cjs': case 'jsx': case 'ts': case 'tsx':
      return { name: 'JavaScript', ext: javascript() };
    case 'py':
      return { name: 'Python', ext: python() };
    case 'css':
      return { name: 'CSS', ext: cssLang() };
    case 'html': case 'htm': case 'xml': case 'svg':
      return { name: 'HTML', ext: htmlLang() };
    case 'json':
      // CM6's javascript() handles JSON well enough — no separate JSON pkg.
      return { name: 'JSON', ext: javascript() };
    case 'atra':
      return { name: 'atra', ext: atraLang };
    default:
      return { name: '', ext: [] };
  }
}

// ── View toggles (line numbers / wrap / status bar) ─────────────────
// Compartments let us reconfigure individual extensions at runtime
// without rebuilding the whole state. CM6 pattern.
const lineNumCompartment = new Compartment();
const wrapCompartment    = new Compartment();
const langCompartment    = new Compartment();

let showLineNumbers = true;
let wrap            = false;
let showStatusBar   = true;

// Last-read full settings object — kept so we can read-modify-write
// (the Settings.Set service writes the whole blob, not a patch).
let _settingsCache = null;

function applyViewToggles() {
  if (view) view.dispatch({
    effects: [
      lineNumCompartment.reconfigure(showLineNumbers ? lineNumbers() : []),
      wrapCompartment.reconfigure(wrap ? EditorView.lineWrapping : []),
    ],
  });
  statusBar.classList.toggle('hidden', !showStatusBar);
}

// Pull text-editor prefs from a settings blob into our locals. Pure —
// doesn't touch view; caller decides whether to applyViewToggles after.
function _readTextEditorPrefs(settings) {
  const te = (settings && settings.textEditor) || {};
  if (typeof te.wrap === 'boolean')            wrap            = te.wrap;
  if (typeof te.showLineNumbers === 'boolean') showLineNumbers = te.showLineNumbers;
  if (typeof te.showStatusBar === 'boolean')   showStatusBar   = te.showStatusBar;
}

// Persist current toggle state to /etc/works.json. Read-modify-write
// the cached blob so we don't clobber appearance/theme/etc.
async function _saveTextEditorPrefs() {
  if (!bus || !_settingsCache) return;
  const next = JSON.parse(JSON.stringify(_settingsCache));   // deep-clone (avoids surprising signal aliasing)
  next.textEditor = next.textEditor || {};
  next.textEditor.wrap            = wrap;
  next.textEditor.showLineNumbers = showLineNumbers;
  next.textEditor.showStatusBar   = showStatusBar;
  try {
    _settingsCache = await bus.call(
      { to: 'works', path: '/', interface: 'Settings', member: 'Set' },
      [next]);
  } catch (e) {
    console.warn('[text-surface] saving prefs failed:', e);
  }
}

// ── Status-bar updates piggyback on a CM6 updateListener ──────────────
function updateStatus() {
  const state = view.state;
  const head = state.selection.main.head;
  const line = state.doc.lineAt(head);
  sPos.textContent = 'ln ' + line.number + ', col ' + (head - line.from + 1);
  sSize.textContent = fmtBytes(state.doc.length);
}

// ── A-Bus wire-up ─────────────────────────────────────────────────────
let view;
let bus;
let saved = '';
let filePath = '';
let dirty = false;
let flushTimer = null;

const emit = (member, args) =>
  bus.signal({ path: '/', interface: 'Surface', member }, args);

function setDirty(d) {
  if (dirty === d) return;
  dirty = d;
  sDirty.textContent = dirty ? '●' : ' ';
  emit('DirtyChanged', [dirty]);
}

async function flush() {
  clearTimeout(flushTimer);
  const content = view.state.doc.toString();
  if (content === saved) return;
  await bus.call(
    { to: 'works', path: '/', interface: 'VFS', member: 'Write' },
    [filePath, content]);
  saved = content;
  setDirty(false);
}

async function loadFromDisk() {
  try {
    saved = (await bus.call(
      { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
      [filePath, 'utf8'])) || '';
  } catch { saved = ''; }
  view.dispatch({
    changes: { from: 0, to: view.state.doc.length, insert: saved },
  });
  setDirty(false);
  updateStatus();
}

function makeEditor(initialText, languageExt) {
  return new EditorView({
    parent: editorRoot,
    state: EditorState.create({
      doc: initialText,
      extensions: [
        minimalSetup,
        syntaxHighlighting(gcuHighlight),
        history(),
        drawSelection(),
        highlightActiveLine(),
        bracketMatching(),
        indentOnInput(),
        search({ top: true }),
        lineNumCompartment.of(showLineNumbers ? lineNumbers() : []),
        wrapCompartment.of(wrap ? EditorView.lineWrapping : []),
        langCompartment.of(languageExt),
        keymap.of([
          indentWithTab,
          ...searchKeymap,
          { key: 'Ctrl-s',   mac: 'Cmd-s',  run: () => { flush(); return true; }, preventDefault: true },
          { key: 'Ctrl-z',   mac: 'Cmd-z',  run: undo },
          { key: 'Ctrl-Shift-z', mac: 'Cmd-Shift-z', run: redo },
          { key: 'Ctrl-y',   mac: 'Cmd-y',  run: redo },
          // CM6's searchKeymap binds Escape to closeSearchPanel only when
          // the search PANEL has focus — Escape from the editor area is a
          // no-op by default. Make it work from anywhere: try the close,
          // return false on no-effect so other handlers still see it.
          { key: 'Escape',   run: (view) => closeSearchPanel(view) },
        ]),
        EditorView.updateListener.of((update) => {
          if (update.docChanged) {
            setDirty(view.state.doc.toString() !== saved);
            clearTimeout(flushTimer);
            flushTimer = setTimeout(flush, 1500);
          }
          if (update.docChanged || update.selectionSet) {
            updateStatus();
          }
        }),
      ],
    }),
  });
}

// ── Menubar ───────────────────────────────────────────────────────────
const menubarEl = document.getElementById('menubar');
let actions = {};
const bar = new MenuBar(menubarEl, () => [
  { label: 'File', items: () => [
    { label: 'Save',             action: 'file:save',   shortcut: 'Ctrl+S' },
    { label: 'Revert from disk', action: 'file:revert' },
  ] },
  { label: 'Edit', items: () => [
    { label: 'Undo',            action: 'edit:undo',    shortcut: 'Ctrl+Z' },
    { label: 'Redo',            action: 'edit:redo',    shortcut: 'Ctrl+Shift+Z' },
    '---',
    { label: 'Find / Replace…', action: 'edit:find',    shortcut: 'Ctrl+F' },
    '---',
    { label: 'Select all',      action: 'edit:selectall', shortcut: 'Ctrl+A' },
    { label: 'Insert date/time', action: 'edit:datetime' },
  ] },
  { label: 'View', items: () => [
    { label: (showLineNumbers ? '✓ ' : '   ') + 'Line numbers', action: 'view:line-numbers' },
    { label: (wrap            ? '✓ ' : '   ') + 'Word wrap',    action: 'view:wrap' },
    { label: (showStatusBar   ? '✓ ' : '   ') + 'Status bar',   action: 'view:status-bar' },
  ] },
]);
bar.on('action', (a) => {
  const fn = actions[a];
  if (fn) fn();
});

// ── A-Bus connect ─────────────────────────────────────────────────────
bootSurface({
  connect,
  client: 'text',
  onConnect: (b) => installThemeSubscription(b),
  // Editor host: Flush persists, Relocated re-points the bound path + relangs.
  makeHost: () => ({
    flush: () => flush(),
    relocate: (p) => {
      filePath = p;
      sPath.textContent = filePath;
      const { name, ext } = langForPath(p);
      sLang.textContent = name;
      view.dispatch({ effects: langCompartment.reconfigure(ext) });
      emit('TitleChanged', [basename(p)]);
    },
  }),
  mount: async ({ bus: b, tab }) => {
  bus = b;
  filePath = tab.path;
  sPath.textContent = filePath;
  const { name: langName, ext: langExt } = langForPath(filePath);
  sLang.textContent = langName;

  // Read persisted text-editor prefs before mounting the editor so
  // wrap / line-numbers / status-bar reflect the saved state on first
  // paint — no flicker between defaults and remembered values.
  try {
    _settingsCache = await bus.call(
      { to: 'works', path: '/', interface: 'Settings', member: 'Get' }, []);
    _readTextEditorPrefs(_settingsCache);
  } catch { /* no settings service yet — defaults are fine */ }

  // Live-sync prefs across multiple open text surfaces: if another tab
  // toggles wrap, this one updates too.
  try {
    bus.subscribe(
      { interface: 'Shell', member: 'SettingsChanged', from: 'works' },
      (msg) => {
        const next = msg && msg.args && msg.args[0];
        if (!next) return;
        _settingsCache = next;
        _readTextEditorPrefs(next);
        applyViewToggles();
      });
  } catch { /* */ }

  view = makeEditor('', langExt);
  window._cmView = view;   // test/debug hook (works-smoke drives the editor via this)
  applyViewToggles();
  await loadFromDisk();
  updateStatus();

  // Now that view exists, wire menubar actions.
  actions = {
    'file:save': () => flush(),
    'file:revert': async () => {
      if (dirty && !window.confirm('Discard unsaved changes?')) return;
      await loadFromDisk();
    },
    'edit:undo': () => undo({ state: view.state, dispatch: view.dispatch.bind(view) }),
    'edit:redo': () => redo({ state: view.state, dispatch: view.dispatch.bind(view) }),
    'edit:find': () => openSearchPanel(view),
    'edit:selectall': () => {
      view.dispatch({ selection: { anchor: 0, head: view.state.doc.length } });
      view.focus();
    },
    'edit:datetime': () => {
      const stamp = new Date().toISOString().slice(0, 19).replace('T', ' ');
      const sel = view.state.selection.main;
      view.dispatch({ changes: { from: sel.from, to: sel.to, insert: stamp } });
      view.focus();
    },
    'view:line-numbers': () => { showLineNumbers = !showLineNumbers; applyViewToggles(); _saveTextEditorPrefs(); },
    'view:wrap':         () => { wrap = !wrap; applyViewToggles(); _saveTextEditorPrefs(); },
    'view:status-bar':   () => { showStatusBar = !showStatusBar; applyViewToggles(); _saveTextEditorPrefs(); },
  };

  emit('TitleChanged', [basename(filePath)]);
  },
});
</script>
</body>
</html>
