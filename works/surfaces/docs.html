<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Documentation</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--au-surface); color: var(--au-fg);
    font: 13px/1.6 'Barlow', system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  /* Custom scrollbars — GCU aesthetic. */
  * {
    scrollbar-width: thin;
    scrollbar-color: var(--au-border) var(--au-surface-deep);
  }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--au-border); border-radius: 4px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--au-rule); }
  *::-webkit-scrollbar-corner { background: transparent; }

  header {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 6px 12px; border-bottom: 1px solid var(--au-border); background: var(--au-surface-raised);
    position: relative; z-index: 30;
  }
  header .title { font-weight: 600; color: var(--au-fg);
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 12px;
    letter-spacing: 2px; text-transform: uppercase; }
  header .crumbs { color: var(--au-fg-soft); font-size: 12px; }
  header .spacer { flex: 1; }
  header .toggle, header .search-btn {
    background: none; border: 1px solid var(--au-border); border-radius: 3px;
    color: var(--au-fg); cursor: pointer; padding: 2px 8px;
    font: inherit;
  }
  header .toggle:hover, header .search-btn:hover { background: var(--au-surface-bright); }
  header .search-btn .kbd {
    color: var(--au-fg-soft); font-size: 10px; margin-left: 6px;
  }

  /* Ctrl+K search overlay. */
  .search-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: flex-start; justify-content: center;
    padding-top: 60px; z-index: 100;
  }
  .search-overlay.open { display: flex; }
  .search-box {
    width: min(640px, 90vw); background: var(--au-surface-raised);
    border: 1px solid var(--au-border); border-radius: 6px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; max-height: 70vh;
  }
  .search-input {
    background: none; border: none; outline: none;
    color: var(--au-fg); font: 14px/1.4 ui-monospace, 'Space Mono', monospace;
    padding: 14px 16px; border-bottom: 1px solid var(--au-border);
  }
  .search-results {
    overflow: auto; padding: 4px 0;
  }
  .search-results .empty {
    padding: 12px 16px; color: var(--au-fg-soft); font-style: italic;
  }
  .search-hit {
    padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent;
  }
  .search-hit:hover, .search-hit.active {
    background: var(--au-surface-bright); border-left-color: var(--au-action);
  }
  .search-hit .crumb {
    font-size: 11px; color: var(--au-fg-soft);
    font-family: ui-monospace, 'Space Mono', monospace;
    margin-bottom: 2px;
  }
  .search-hit .title {
    color: var(--au-fg); font-size: 13px; font-weight: 500;
  }
  .search-hit .snippet {
    color: var(--au-fg-muted); font-size: 12px; margin-top: 2px;
    font-family: ui-monospace, 'Space Mono', monospace;
  }
  .search-hit .snippet mark {
    background: var(--au-action-soft); color: var(--au-fg);
    padding: 0 2px; border-radius: 2px;
  }
  .search-suggest {
    padding: 8px 16px; color: var(--au-fg-muted); font-size: 12px;
    border-top: 1px solid var(--au-border);
  }
  .search-suggest .term { color: var(--au-action); cursor: pointer; }
  .search-suggest .term:hover { text-decoration: underline; }

  .body { flex: 1; display: flex; min-height: 0; position: relative; }
  .backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
    z-index: 10;
  }
  body.nav-open .backdrop { opacity: 1; pointer-events: auto; }
  .sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 280px;
    overflow: auto;
    border-right: 1px solid var(--au-border); background: var(--au-surface-raised);
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 11px;
    padding: 8px 0;
    transform: translateX(-100%);
    transition: transform 0.18s ease-out;
    z-index: 20;
  }
  body.nav-open .sidebar { transform: translateX(0); }
  .sidebar h3 {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--au-action); margin: 12px 12px 4px; font-weight: 600;
  }
  .sidebar .item {
    padding: 4px 16px; cursor: pointer; color: var(--au-fg-muted);
    border-left: 2px solid transparent;
  }
  .sidebar .item:hover { background: var(--au-surface-bright); color: var(--au-fg); }
  .sidebar .item.active {
    color: var(--au-fg); border-left-color: var(--au-action); background: var(--au-surface-raised);
  }
  .sidebar .item.nested { padding-left: 28px; }
  .content {
    flex: 1; overflow: auto; padding: 24px 40px;
    max-width: 860px; margin: 0 auto;
  }
  .content h1, .content h2, .content h3, .content h4 {
    font-family: ui-monospace, 'Space Mono', monospace;
    color: var(--au-fg);
  }
  .content h1 {
    font-size: 22px; letter-spacing: 1px; margin: 0 0 16px;
    color: var(--au-action);
  }
  .content h2 {
    font-size: 16px; letter-spacing: 1px; margin: 32px 0 12px;
    border-bottom: 1px solid var(--au-border); padding-bottom: 4px;
  }
  .content h3 { font-size: 14px; margin: 24px 0 8px; }
  .content h4 { font-size: 13px; margin: 16px 0 4px; color: var(--au-fg); }
  .content p { margin: 0 0 12px; }
  .content code {
    font-family: ui-monospace, 'Space Mono', monospace;
    background: var(--au-surface-bright); color: var(--au-fg);
    padding: 1px 5px; border-radius: 2px;
    font-size: 0.92em;
  }
  .content pre {
    background: var(--au-surface-raised); border: 1px solid var(--au-border); border-radius: 3px;
    padding: 10px 14px; overflow-x: auto;
    font-family: ui-monospace, 'Space Mono', monospace;
    font-size: 12px; line-height: 1.5;
  }
  .content pre code { background: none; padding: 0; color: inherit; }
  .content a { color: var(--au-info); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content ul, .content ol { padding-left: 24px; margin: 0 0 12px; }
  .content li { margin: 2px 0; }
  .content blockquote {
    border-left: 3px solid var(--au-border); padding-left: 12px;
    color: var(--au-fg-muted); margin: 12px 0;
  }
  .content table {
    border-collapse: collapse; margin: 12px 0;
    font-size: 12px; font-family: ui-monospace, 'Space Mono', monospace;
  }
  .content th, .content td {
    border: 1px solid var(--au-border); padding: 4px 10px; text-align: left;
  }
  .content th { background: var(--au-surface-raised); color: var(--au-fg); }
  .empty { color: var(--au-fg-soft); padding: 8px 16px; font-style: italic; }
  .err { color: var(--au-error); padding: 20px; }

  /* Right-side TOC. */
  .toc {
    position: fixed; right: 16px; top: 56px;
    max-height: calc(100vh - 80px);
    width: 200px; padding: 8px 0 8px 14px;
    overflow: auto;
    font: 11px/1.5 ui-monospace, 'Space Mono', monospace;
    color: var(--au-fg-soft);
    border-left: 1px solid var(--au-border);
    z-index: 5;
  }
  .toc.empty-toc { display: none; }
  .toc h4 {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--au-action); margin: 0 0 6px; font-weight: 600;
  }
  .toc a {
    display: block; padding: 2px 0 2px 8px;
    color: var(--au-fg-muted); text-decoration: none;
    border-left: 2px solid transparent;
    margin-left: -10px; padding-left: 8px;
    transition: color 0.1s, border-color 0.1s;
  }
  .toc a:hover { color: var(--au-fg); }
  .toc a.active { color: var(--au-fg); border-left-color: var(--au-action); }
  .toc a.lvl3 { padding-left: 20px; font-size: 10.5px; color: var(--au-fg-soft); }
  .toc a.lvl3.active { color: var(--au-fg); }
  @media (max-width: 1140px) { .toc { display: none; } }

  /* Heading anchor links — show a § on hover for deep-linking. */
  .content h1, .content h2, .content h3 { scroll-margin-top: 60px; position: relative; }
  .content h1 .anchor-link, .content h2 .anchor-link, .content h3 .anchor-link {
    position: absolute; left: -22px; top: 0; bottom: 0;
    display: flex; align-items: center;
    color: var(--au-border); text-decoration: none;
    opacity: 0; transition: opacity 0.1s, color 0.1s;
    font-weight: normal; padding: 0 6px;
  }
  .content h1:hover .anchor-link, .content h2:hover .anchor-link, .content h3:hover .anchor-link {
    opacity: 1;
  }
  .content .anchor-link:hover { color: var(--au-action) !important; }

  /* Sidebar collapsible groups. */
  .sidebar h3 {
    cursor: pointer; user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .sidebar h3::before {
    content: '▾'; font-size: 8px; color: var(--au-fg-soft);
    transition: transform 0.15s;
    display: inline-block; width: 8px; text-align: center;
  }
  .sidebar h3.collapsed::before { transform: rotate(-90deg); }
  .sidebar .group-items.hidden { display: none; }

  /* Admonitions (MkDocs Material style). */
  .content .admonition {
    border-left: 3px solid var(--au-action);
    background: var(--au-surface-raised);
    padding: 10px 14px 8px;
    margin: 16px 0;
    border-radius: 0 3px 3px 0;
  }
  .content .admonition .admonition-title {
    font-family: ui-monospace, 'Space Mono', monospace;
    font-weight: 600; color: var(--au-action);
    margin-bottom: 6px;
    font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .content .admonition p:last-child { margin-bottom: 0; }
  .content .admonition > p:first-of-type { margin-top: 0; }
  /* Per-type accents. */
  .content .adm-tip       { border-left-color: var(--au-success); }
  .content .adm-tip       .admonition-title { color: var(--au-success); }
  .content .adm-note      { border-left-color: var(--au-info); }
  .content .adm-note      .admonition-title { color: var(--au-info); }
  .content .adm-info      { border-left-color: var(--au-info); }
  .content .adm-info      .admonition-title { color: var(--au-info); }
  .content .adm-warning   { border-left-color: var(--au-warn); }
  .content .adm-warning   .admonition-title { color: var(--au-warn); }
  .content .adm-danger    { border-left-color: var(--au-error); }
  .content .adm-danger    .admonition-title { color: var(--au-error); }
  .content .adm-abstract  { border-left-color: var(--au-selected); }
  .content .adm-abstract  .admonition-title { color: var(--au-selected); }

  /* Keyboard pills (++ctrl+enter++ → <kbd>ctrl</kbd>+<kbd>enter</kbd>). */
  .content kbd {
    display: inline-block;
    background: var(--au-surface-bright); color: var(--au-fg);
    border: 1px solid var(--au-border);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 6px;
    font-family: ui-monospace, 'Space Mono', monospace;
    font-size: 11px; line-height: 1.5;
    vertical-align: baseline;
    margin: 0 1px;
  }

  /* Syntax highlighting tokens. Mapped onto semantic accents so they
     flip with the theme. */
  .content .tok-comment  { color: var(--au-fg-soft); font-style: italic; }
  .content .tok-string   { color: var(--au-success); }
  .content .tok-number   { color: var(--au-warn); }
  .content .tok-keyword  { color: var(--au-info); }
  .content .tok-builtin  { color: var(--au-selected); }
  .content .tok-tag      { color: var(--au-error); }
  .content .tok-attr     { color: var(--au-warn); }
  .content .tok-punct    { color: var(--au-fg-muted); }
</style>
</head>
<body>
<header>
  <button class="toggle" id="navToggle" title="Toggle navigation (Ctrl+\)">☰</button>
  <span class="title">Documentation</span>
  <span class="crumbs" id="crumbs"></span>
  <span class="spacer"></span>
  <button class="search-btn" id="searchBtn" title="Search (Ctrl+K)">
    Search<span class="kbd">Ctrl+K</span>
  </button>
</header>

<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input class="search-input" id="searchInput" type="text"
      placeholder="Search docs…  (Esc to close)" spellcheck="false" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>
<div class="body">
  <div class="backdrop" id="backdrop"></div>
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
  <aside class="toc empty-toc" id="toc"></aside>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';

/* @theme-init */
import { render as mdRender, presets as mdPresets, slugify } from '../../ext/markdown/index.js';
// @gcu/markdown with the docs preset (notebook dialect + footnotes, html inert).
const renderMd = (md) => mdRender(md, mdPresets.docs);
import { Librarian } from '../../ext/librarian/index.js';
import { highlightCode, scrollToAnchor, decorateHeadings, buildToc, rewireLinks, buildSearchIndex, makeStatePersister } from '../../ext/docview/index.js';

const $ = (id) => document.getElementById(id);

let bus = null;
let manifest = null;
const fileCache = new Map();
let current = null;
let docsIndex = null;
let activeHitIdx = 0;

const STATE_PATH = '/home/.works/docs-state.json';
let persister = null;   // makeStatePersister(bus, STATE_PATH) once bus connects
function scheduleSave() {
  if (!current || !persister) return;
  persister.schedule(() => ({
    current,
    scrollTop: document.getElementById('content')?.scrollTop || 0,
    groupStates,
  }));
}
async function readState() {
  return persister ? persister.read() : null;
}

// Build the librarian index from the manifest's docs + extension entries.
// Section-splitting + indexing live in @gcu/docview (buildSearchIndex); here
// we just collect the { path, title, md } list from the docs manifest. Named
// buildDocsIndex so it doesn't collide with docview's inlined buildSearchIndex
// (the surface lib-inliner flattens lib exports into this scope by raw name).
async function buildDocsIndex() {
  async function readFile(relPath) {
    try {
      return await bus.call(
        { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
        ['/usr/share/doc/' + relPath, 'utf8']);
    } catch { return ''; }
  }
  function navLabel(file) {
    function walk(list) {
      for (const item of list) {
        if (item.file && 'docs/' + item.file === file) return item.label;
        if (item.children) { const r = walk(item.children); if (r) return r; }
      }
      return null;
    }
    return walk(manifest.nav || []) || file.split('/').pop().replace(/\.md$/, '');
  }
  function collectNav(list, out) {
    for (const item of list) {
      if (item.file) out.push('docs/' + item.file);
      if (item.children) collectNav(item.children, out);
    }
  }
  const navFiles = [];
  collectNav(manifest.nav || [], navFiles);
  const collected = [];
  for (const file of navFiles) {
    const md = await readFile(file);
    if (md) collected.push({ path: file, title: navLabel(file), md });
  }
  for (const ext of manifest.extensions || []) {
    const md = await readFile(ext.file);
    if (md) collected.push({ path: ext.file, title: '@gcu/' + ext.pkg + ' ' + ext.kind, md });
  }
  docsIndex = buildSearchIndex(Librarian, collected, slugify, {
    synonyms: {
      'vfs': ['filesystem'],
      'dag': ['reactivity', 'reactive'],
      'cell': ['block', 'cells'],
      'mcp': ['agent', 'model-context'],
    },
  });
}

function openSearch() {
  document.getElementById('searchOverlay').classList.add('open');
  const input = document.getElementById('searchInput');
  input.value = '';
  input.focus();
  document.getElementById('searchResults').innerHTML = '';
  activeHitIdx = 0;
}
function closeSearch() {
  document.getElementById('searchOverlay').classList.remove('open');
}

function renderResults(hits, query) {
  const box = document.getElementById('searchResults');
  box.innerHTML = '';
  if (hits.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'no matches.';
    box.appendChild(empty);
    // Did-you-mean suggestion.
    if (docsIndex && query.trim()) {
      const sug = Librarian.suggest(docsIndex, query);
      if (sug && sug !== query.toLowerCase().trim()) {
        const div = document.createElement('div');
        div.className = 'search-suggest';
        const span = document.createElement('span');
        span.className = 'term';
        span.textContent = sug;
        span.addEventListener('click', () => {
          document.getElementById('searchInput').value = sug;
          runSearch();
        });
        div.appendChild(document.createTextNode('did you mean: '));
        div.appendChild(span);
        div.appendChild(document.createTextNode(' ?'));
        box.appendChild(div);
      }
    }
    return;
  }
  hits.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'search-hit' + (i === activeHitIdx ? ' active' : '');
    row.dataset.idx = i;
    const crumb = document.createElement('div');
    crumb.className = 'crumb';
    crumb.textContent = h.doc.fileTitle + (h.doc.heading && h.doc.heading !== h.doc.fileTitle
      ? '  ›  ' + h.doc.heading : '');
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = h.doc.heading || h.doc.fileTitle;
    row.appendChild(crumb);
    row.appendChild(title);
    if (h.snippet) {
      const sn = document.createElement('div');
      sn.className = 'snippet';
      sn.innerHTML = h.snippet;
      row.appendChild(sn);
    }
    row.addEventListener('click', () => activateHit(h));
    row.addEventListener('mouseenter', () => {
      activeHitIdx = i;
      for (const r of box.querySelectorAll('.search-hit')) r.classList.remove('active');
      row.classList.add('active');
    });
    box.appendChild(row);
  });
}

function runSearch() {
  if (!docsIndex) return;
  const q = document.getElementById('searchInput').value;
  if (!q.trim()) {
    document.getElementById('searchResults').innerHTML = '';
    return;
  }
  const hits = Librarian.search(docsIndex, q, { fuzzy: 1, limit: 20 });
  activeHitIdx = 0;
  renderResults(hits, q);
}

async function activateHit(hit) {
  closeSearch();
  await loadFile(hit.doc.file, hit.doc.fileTitle, hit.doc.anchor);
}

// scrollToAnchor / decorateHeadings / buildToc / rewireLinks / highlightCode
// come from @gcu/docview (inlined into this scope by raw name at build time —
// so we must NOT redeclare them here; call sites use the imported names with
// docview's signatures).

function setNavOpen(open) {
  document.body.classList.toggle('nav-open', open);
}

// ── Right-side TOC (scroll-spy) ─────────────────────────────────────
// docview.buildToc returns a controller; updateActiveToc tracks the active
// heading on scroll. _toc is set in loadFile.
let _toc = { items: [], update() {} };
function updateActiveToc() { _toc.update(); }

// Syntax highlighting for fenced code lives in @gcu/docview (highlightCode).

async function loadFile(relPath, label, anchor) {
  current = relPath;
  $('crumbs').textContent = label || relPath;
  // Mark active in sidebar and scroll it into view.
  let activeItem = null;
  for (const el of document.querySelectorAll('.sidebar .item')) {
    const on = el.dataset.path === relPath;
    el.classList.toggle('active', on);
    if (on) activeItem = el;
  }
  if (activeItem) activeItem.scrollIntoView({ block: 'nearest' });

  let md = fileCache.get(relPath);
  if (md == null) {
    try {
      md = await bus.call(
        { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
        ['/usr/share/doc/' + relPath, 'utf8']);
    } catch (e) {
      $('content').innerHTML = '<div class="err">failed to load '
        + relPath + ': ' + (e.message || e) + '</div>';
      return;
    }
    fileCache.set(relPath, md);
  }
  $('content').innerHTML = renderMd(md);
  // § deep-link anchors; onCopy puts the current doc path on the clipboard.
  decorateHeadings($('content'), (id) => {
    const link = current + '#' + id;
    try { navigator.clipboard?.writeText(link); } catch {}
  });
  highlightCode($('content'));
  // Internal .md links load through loadFile; external/# handled by docview.
  rewireLinks($('content'), relPath, (resolved, anchor, pathPart) => {
    loadFile(resolved, pathPart, anchor);
  });
  _toc = buildToc($('content'), $('toc'));
  if (anchor && scrollToAnchor(anchor)) {
    // anchor scroll wins over scroll-to-top
  } else {
    $('content').scrollTop = 0;
  }
  scheduleSave();
}

// Per-group collapsed state, keyed by group label. Persisted via
// docs-state.json so the user's choice survives reloads.
let groupStates = {};

function startGroup(sb, label) {
  const h = document.createElement('h3');
  h.textContent = label;
  h.dataset.group = label;
  const items = document.createElement('div');
  items.className = 'group-items';
  items.dataset.group = label;
  if (groupStates[label] === 'collapsed') {
    h.classList.add('collapsed');
    items.classList.add('hidden');
  }
  h.addEventListener('click', () => {
    const collapsed = !h.classList.contains('collapsed');
    h.classList.toggle('collapsed', collapsed);
    items.classList.toggle('hidden', collapsed);
    groupStates[label] = collapsed ? 'collapsed' : 'open';
    scheduleSave();
  });
  sb.appendChild(h);
  sb.appendChild(items);
  return items;
}

function renderSidebar() {
  const sb = $('sidebar');
  sb.innerHTML = '';

  function addItem(parent, label, relPath, nested) {
    const div = document.createElement('div');
    div.className = 'item' + (nested ? ' nested' : '');
    div.textContent = label;
    div.dataset.path = relPath;
    div.addEventListener('click', () => {
      loadFile(relPath, label);
      setNavOpen(false);   // auto-dismiss after selection
    });
    parent.appendChild(div);
  }

  // Walk the mkdocs nav. Top-level entries with `children` become
  // collapsible groups; bare files go in a top-level "Docs" group.
  let rootGroup = null;
  function walkNav(list, target) {
    for (const item of list) {
      if (item.file) {
        if (!target) {
          rootGroup = rootGroup || startGroup(sb, 'Docs');
          target = rootGroup;
        }
        addItem(target, item.label, 'docs/' + item.file, target !== rootGroup);
      } else if (item.children) {
        const items = startGroup(sb, item.label);
        walkNav(item.children, items);
      }
    }
  }

  if (manifest && manifest.nav && manifest.nav.length) {
    walkNav(manifest.nav, null);
  }

  // Extensions section.
  const exts = manifest && manifest.extensions || [];
  if (exts.length) {
    const grouped = new Map();
    for (const e of exts) {
      if (!grouped.has(e.pkg)) grouped.set(e.pkg, []);
      grouped.get(e.pkg).push(e);
    }
    const items = startGroup(sb, 'Extensions');
    for (const [pkg, entries] of [...grouped].sort((a, b) => a[0].localeCompare(b[0]))) {
      if (entries.length === 1) {
        addItem(items, pkg, entries[0].file, true);
      } else {
        const div = document.createElement('div');
        div.className = 'item';
        div.style.cursor = 'default';
        div.textContent = pkg;
        items.appendChild(div);
        for (const e of entries) addItem(items, e.kind, e.file, true);
      }
    }
  }
}

window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent) return;
  if (!ev.data || ev.data.type !== 'abus:welcome') return;

  try { bus = await connect(ev.data.port, { client: 'docs-surface' }); }
  catch (e) {
    document.body.innerHTML = '<div class="err">connect failed: ' + (e.message || e) + '</div>';
    return;
  }
  try { await bus.claim('docs-' + (ev.data.tab && ev.data.tab.id || 'unknown')); } catch {}

  persister = makeStatePersister(bus, STATE_PATH);
  installThemeSubscription(bus);
bus.expose('/', {
    Surface: {
      methods: { Flush: () => {}, CanClose: () => true, Relocated: () => {} },
      signals: ['DirtyChanged', 'TitleChanged', 'Ready'],
    },
  });

  // Load the manifest first; everything else hangs off it.
  try {
    const json = await bus.call(
      { to: 'works', path: '/', interface: 'VFS', member: 'Read' },
      ['/usr/share/doc/manifest.json', 'utf8']);
    manifest = JSON.parse(json);
  } catch (e) {
    document.body.innerHTML = '<div class="err">no docs payload — '
      + (e.message || e) + '</div>';
    return;
  }

  // Read persisted state before rendering the sidebar so collapsed-group
  // state is applied during initial render.
  const saved = await readState();
  groupStates = (saved && saved.groupStates) || {};
  renderSidebar();
  // Build the search index in the background so opening Ctrl+K is instant.
  buildDocsIndex().catch((e) => console.warn('search index build failed:', e));

  // Toggle + dismiss handlers.
  document.getElementById('navToggle').addEventListener('click', () => {
    setNavOpen(!document.body.classList.contains('nav-open'));
  });
  document.getElementById('backdrop').addEventListener('click', () => setNavOpen(false));
  document.getElementById('searchBtn').addEventListener('click', openSearch);
  document.getElementById('searchInput').addEventListener('input', runSearch);
  document.getElementById('searchOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'searchOverlay') closeSearch();
  });
  document.addEventListener('keydown', (e) => {
    const inSearch = document.body.contains(document.getElementById('searchOverlay'))
      && document.getElementById('searchOverlay').classList.contains('open');
    if (e.key === 'k' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      openSearch();
      return;
    }
    if (inSearch) {
      if (e.key === 'Escape') { closeSearch(); return; }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const rows = document.querySelectorAll('#searchResults .search-hit');
        if (rows.length === 0) return;
        activeHitIdx = Math.min(activeHitIdx + 1, rows.length - 1);
        for (const r of rows) r.classList.remove('active');
        rows[activeHitIdx].classList.add('active');
        rows[activeHitIdx].scrollIntoView({ block: 'nearest' });
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        const rows = document.querySelectorAll('#searchResults .search-hit');
        if (rows.length === 0) return;
        activeHitIdx = Math.max(activeHitIdx - 1, 0);
        for (const r of rows) r.classList.remove('active');
        rows[activeHitIdx].classList.add('active');
        rows[activeHitIdx].scrollIntoView({ block: 'nearest' });
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        const rows = document.querySelectorAll('#searchResults .search-hit');
        if (rows.length > 0 && rows[activeHitIdx]) rows[activeHitIdx].click();
        return;
      }
    }
    if (e.key === 'Escape' && document.body.classList.contains('nav-open')) {
      setNavOpen(false);
    } else if (e.key === '\\' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      setNavOpen(!document.body.classList.contains('nav-open'));
    }
  });

  // Restore the last-viewed doc + scroll position; fall back to index.md.
  const findIndex = (list) => {
    for (const it of list) {
      if (it.file === 'index.md') return 'docs/index.md';
      if (it.children) { const r = findIndex(it.children); if (r) return r; }
    }
    return null;
  };
  const fallback = (manifest.nav && findIndex(manifest.nav))
    || (manifest.nav && manifest.nav[0] && manifest.nav[0].file && 'docs/' + manifest.nav[0].file)
    || null;
  const start = saved?.current || fallback;
  if (start) {
    await loadFile(start, '');
    if (saved?.current === start && typeof saved.scrollTop === 'number') {
      // Restore scroll AFTER the render has settled, then sync the TOC.
      requestAnimationFrame(() => {
        document.getElementById('content').scrollTop = saved.scrollTop;
        updateActiveToc();
      });
    }
  }

  // On scroll: update the TOC active item (rAF-coalesced) and persist
  // the position (debounced via scheduleSave).
  let _scrollRaf = 0;
  document.getElementById('content').addEventListener('scroll', () => {
    if (_scrollRaf) return;
    _scrollRaf = requestAnimationFrame(() => {
      _scrollRaf = 0;
      updateActiveToc();
    });
    scheduleSave();
  });

  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' }, ['Documentation']);
  bus.signal({ path: '/', interface: 'Surface', member: 'Ready' }, []);
});
</script>
