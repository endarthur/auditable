<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Library</title>
<style>
  /* @theme-tokens */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--au-surface); color: var(--au-fg);
    font: 13px/1.5 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; }
  * { scrollbar-width: thin; scrollbar-color: var(--au-border) var(--au-surface-deep); }
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-thumb { background: var(--au-border); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  button { background: var(--au-surface-bright); color: var(--au-fg); border: 1px solid var(--au-border); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--au-action); }
  button:disabled { opacity: .5; cursor: default; }

  .shell { flex: 1; display: flex; min-height: 0; }

  /* collapsed rail */
  .rail { display: none; flex: none; width: 22px; border-right: 1px solid var(--au-border);
    background: var(--au-surface-raised); cursor: pointer; color: var(--au-fg-soft);
    align-items: flex-start; justify-content: center; padding-top: 11px; font-size: 14px; }
  .rail:hover { color: var(--au-action); }
  .shell.collapsed .side { display: none; }
  .shell.collapsed .rail { display: flex; }

  /* sidebar */
  .side { flex: none; width: 210px; display: flex; flex-direction: column;
    border-right: 1px solid var(--au-border); background: var(--au-surface-raised); overflow: auto; }
  .side-head { flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border-bottom: 1px solid var(--au-border); }
  .brand { font-family: ui-monospace,'Space Mono',monospace; font-weight: 600; letter-spacing: 1px; font-size: 13px; }
  .icon { background: none; border: none; color: var(--au-fg-soft); cursor: pointer; font-size: 15px; padding: 0 4px; }
  .icon:hover { color: var(--au-action); }
  .views { flex: none; padding: 6px 0; border-bottom: 1px solid var(--au-border); }
  .nav-item, .src-item { display: flex; align-items: center; gap: 7px; padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--au-fg); border-left: 2px solid transparent; }
  .nav-item:hover, .src-item:hover { background: var(--au-surface-bright); }
  .nav-item.active, .src-item.active { background: var(--au-surface-bright); color: var(--au-action); border-left-color: var(--au-action); }
  .nav-item .cnt { margin-left: auto; font: 10px ui-monospace,monospace; background: var(--au-action); color: var(--au-surface-deep); border-radius: 8px; padding: 0 6px; }
  .side-label { flex: none; padding: 9px 12px 3px; font: 10px ui-monospace,monospace; letter-spacing: 1px; color: var(--au-fg-soft); text-transform: uppercase; }
  .srcs { flex: 1; min-height: 0; }
  .src-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-item .rm { margin-left: auto; opacity: 0; color: var(--au-fg-soft); padding: 0 3px; }
  .src-item:hover .rm { opacity: 1; }
  .src-item .rm:hover { color: var(--au-error); }
  .src-item.err .nm { color: var(--au-error); }
  .side-btn { margin: 8px 12px; }

  /* add-source panel */
  .addsrc { flex: none; display: none; flex-direction: column; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--au-border); background: var(--au-surface-raised); }
  .addsrc.open { display: flex; }
  .addsrc .warn { color: var(--au-warn); font-size: 12px; }
  .addsrc .row { display: flex; gap: 8px; }
  .addsrc input { flex: 1; background: var(--au-surface); color: var(--au-fg); border: 1px solid var(--au-border); border-radius: 4px; padding: 5px 9px; font: inherit; }

  /* main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .toolbar { flex: none; display: flex; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--au-border); }
  .toolbar input { flex: 1; background: var(--au-surface); color: var(--au-fg); border: 1px solid var(--au-border); border-radius: 4px; padding: 5px 9px; font: inherit; }
  .toolbar #updAll { color: var(--au-action); border-color: var(--au-action); }

  .grid { flex: 1; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 14px; align-content: start; }
  .empty { padding: 24px; color: var(--au-fg-soft); font-style: italic; grid-column: 1 / -1; }
  .card { display: flex; gap: 11px; padding: 11px; border: 1px solid var(--au-border); border-radius: 6px; background: var(--au-surface-raised); }
  .card .cover { flex: none; width: 56px; height: 74px; border-radius: 3px; background: var(--au-surface-bright); display: grid; place-items: center; color: var(--au-fg-soft); font-size: 26px; overflow: hidden; }
  .card .cover img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card .ttl { color: var(--au-fg); font-weight: 600; line-height: 1.25; }
  .card .badges { margin: 4px 0; }
  .card .badge { font: 10px ui-monospace,monospace; text-transform: uppercase; letter-spacing: .5px; color: var(--au-action); border: 1px solid var(--au-border); border-radius: 3px; padding: 0 5px; margin-right: 5px; }
  .card .badge.nc { color: var(--au-warn); border-color: var(--au-warn); }
  .card .meta { color: var(--au-fg-soft); font-size: 11px; }
  .card .src { color: var(--au-fg-soft); font: 10px ui-monospace,monospace; margin-top: 2px; }
  .card .desc { color: var(--au-fg-muted); font-size: 12px; margin: 4px 0 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .card .act { margin-top: auto; padding-top: 7px; }
  .card .act button.done { color: var(--au-go); border-color: var(--au-go); }
  .card .act button.upd { color: var(--au-action); border-color: var(--au-action); }

  footer { flex: none; padding: 7px 14px; border-top: 1px solid var(--au-border); color: var(--au-fg-soft); font-size: 11px; }
  .err { color: var(--au-error); }
  .card .act button.share { color: var(--au-fg-soft); }
  .card .act button.share:hover { color: var(--au-action); }

  /* share modal — capsule link + QR ("Open in Works") */
  .share-ovl { position: fixed; inset: 0; z-index: 40; display: none; background: rgba(0,0,0,.55); }
  .share-ovl.open { display: grid; place-items: center; }
  .share-panel { width: 380px; max-width: 92vw; background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .share-panel h3 { margin: 0; font-size: 15px; }
  .share-panel .hint { color: var(--au-fg-soft); font-size: 12px; margin: -6px 0 0; }
  .share-qr { align-self: center; width: 220px; height: 220px; background: #fff; border-radius: 6px; padding: 8px; }
  .share-qr svg { width: 100%; height: 100%; display: block; }
  .share-row { display: flex; gap: 8px; }
  .share-row input { flex: 1; min-width: 0; background: var(--au-surface); color: var(--au-fg); border: 1px solid var(--au-border);
    border-radius: 4px; padding: 6px 8px; font: 11px ui-monospace,monospace; }
  .share-row button, .share-close { background: var(--au-surface-bright); color: var(--au-fg); border: 1px solid var(--au-border);
    border-radius: 4px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .share-close { align-self: flex-end; }
</style>
</head>
<body>
<div class="shell" id="shell">
  <div class="rail" id="rail" title="Expand sidebar">»</div>
  <aside class="side" id="side">
    <div class="side-head">
      <span class="brand">LIBRARY</span>
      <button class="icon" id="collapse" title="Collapse sidebar">«</button>
    </div>
    <div class="views">
      <div class="nav-item" data-view="all">⚏ All sources</div>
      <div class="nav-item" data-view="updates">↑ Updates <span class="cnt" id="updCnt" style="display:none"></span></div>
      <div class="nav-item" data-view="installed">✓ Installed</div>
    </div>
    <div class="side-label">Sources</div>
    <div class="srcs" id="srcs"></div>
    <button class="side-btn" id="add">+ Add source</button>
  </aside>
  <main class="main">
    <div class="addsrc" id="addPanel">
      <div class="warn">⚠ Sources can serve data packs — and code extensions that run in your workspace. Only add sources you trust.</div>
      <div class="row">
        <input id="addUrl" type="text" placeholder="https://example.org/registry.json" spellcheck="false" autocomplete="off">
        <button id="addGo">Add</button>
        <button id="addCancel">Cancel</button>
      </div>
    </div>
    <div class="toolbar"><input id="search" type="text" placeholder="Filter the shelf…" spellcheck="false" autocomplete="off"><button id="updAll" class="upd" style="display:none"></button></div>
    <div class="grid" id="grid"><div class="empty">Loading…</div></div>
    <footer id="credit"></footer>
  </main>
</div>

<div class="share-ovl" id="shareOvl">
  <div class="share-panel">
    <h3 id="shareTitle">Share</h3>
    <p class="hint">Scan or open to install this in Auditable Works.</p>
    <div class="share-qr" id="shareQr"></div>
    <div class="share-row">
      <input id="shareLink" type="text" readonly spellcheck="false">
      <button id="shareCopy">Copy</button>
    </div>
    <button class="share-close" id="shareClose">Close</button>
  </div>
</div>

<script type="module">
import { connect } from '../../ext/abus/index.js';
import { toSVG } from '../../ext/qr/index.js';
import { encodeInlineI, fragmentEncode } from '../../ext/capsule/index.js';
/* @theme-init */

const WORKS_URL = 'https://gentropic.org/works/';   // the published Auditable Works PWA

const $ = (id) => document.getElementById(id);
let bus = null;
let sources = [];      // [{url,name}] from the shell
let srcData = [];      // [{url,name,base,registry,error}] — fetched
let allEntries = [];   // merged, each tagged with _src/_base/_srcName
let statusMap = {};    // name → 'install'|'installed'|'update'
let view = { kind: 'all' };

const callShell = (member, args = []) => bus.call({ to: 'works', path: '/', interface: 'Shell', member }, args);
const callVfs = (member, args) => bus.call({ to: 'works', path: '/', interface: 'VFS', member }, args);

// UI prefs (collapsed + last view) persist in the workspace VFS, so they
// survive reopen and travel with the workspace.
const PREFS = '/home/.library.json';
async function loadPrefs() {
  try {
    const p = JSON.parse(await callVfs('Read', [PREFS, 'utf8']));
    if (p && typeof p === 'object') {
      if (p.collapsed) $('shell').classList.add('collapsed');
      if (p.view && p.view.kind) view = p.view;
    }
  } catch { /* no prefs yet */ }
}
let saveT = null;
function savePrefs() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    callVfs('Write', [PREFS, JSON.stringify({ collapsed: $('shell').classList.contains('collapsed'), view })]).catch(() => {});
  }, 250);
}
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtSize = (n) => (n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB');
const isNC = (l) => /\bNC\b|non-?commercial/i.test(String(l || ''));
const ICON = { books: '▤', geodata: '◴', data: '◳' };
const LABEL = { install: 'Install', update: 'Update ↑', installed: 'Reinstall ↻' };

// Fetch every source, merge entries, compute statuses. A source view just
// filters the cached merge — no re-fetch. Per-source errors are non-fatal.
async function loadAll() {
  $('grid').innerHTML = '<div class="empty">loading…</div>';
  sources = await callShell('RegistrySources').catch(() => []);
  if (!sources.length) sources = [];
  srcData = await Promise.all(sources.map(async (s) => {
    try { const r = await callShell('RegistryFetch', [s.url]); return { url: s.url, name: s.name || (r.registry && r.registry.name) || s.url, base: r.base, registry: r.registry, error: null }; }
    catch (e) { return { url: s.url, name: s.name || s.url, base: '', registry: null, error: String(e.message || e) }; }
  }));
  allEntries = [];
  for (const sd of srcData) {
    if (!sd.registry) continue;
    for (const e of (sd.registry.entries || [])) allEntries.push({ ...e, _src: sd.url, _base: sd.base, _srcName: sd.name });
  }
  statusMap = allEntries.length ? await callShell('RegistryStatuses', [allEntries]).catch(() => ({})) : {};
  // if the active source view points at a now-gone source, fall back
  if (view.kind === 'source' && !srcData.some((s) => s.url === view.url)) view = { kind: 'all' };
  renderSide();
  render();
}

const updatesCount = () => allEntries.filter((e) => statusMap[e.name] === 'update').length;

function renderSide() {
  const n = updatesCount();
  $('updCnt').textContent = n || '';
  $('updCnt').style.display = n ? '' : 'none';
  for (const el of document.querySelectorAll('.nav-item')) el.classList.toggle('active', view.kind === el.dataset.view);
  const box = $('srcs'); box.innerHTML = '';
  for (const sd of srcData) {
    const it = document.createElement('div');
    it.className = 'src-item' + (view.kind === 'source' && view.url === sd.url ? ' active' : '') + (sd.error ? ' err' : '');
    it.title = sd.error ? ('couldn\'t load — ' + sd.error) : sd.url;
    it.innerHTML = '<span class="dot">•</span><span class="nm">' + esc(sd.name) + '</span>'
      + (sources.length > 1 ? '<span class="rm" title="Remove source">×</span>' : '');
    it.addEventListener('click', () => { view = { kind: 'source', url: sd.url }; renderSide(); render(); savePrefs(); });
    const rm = it.querySelector('.rm');
    if (rm) rm.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      await callShell('RegistryRemoveSource', [sd.url]).catch(() => {});
      loadAll();
    });
    box.appendChild(it);
  }
}

function visibleEntries() {
  let list = allEntries;
  if (view.kind === 'source') list = list.filter((e) => e._src === view.url);
  else if (view.kind === 'updates') list = list.filter((e) => statusMap[e.name] === 'update');
  else if (view.kind === 'installed') list = list.filter((e) => statusMap[e.name] === 'installed' || statusMap[e.name] === 'update');
  const q = $('search').value.toLowerCase().trim();
  if (q) list = list.filter((e) =>
    ((e.title || '') + ' ' + (e.description || '') + ' ' + (e.tags || []).join(' ') + ' ' + (e.datKind || '') + ' ' + (e._srcName || '')).toLowerCase().includes(q));
  return list;
}

function render() {
  const grid = $('grid');
  const list = visibleEntries();
  const nUpd = updatesCount();
  const updAll = $('updAll');
  if (view.kind === 'updates' && nUpd > 0) { updAll.style.display = ''; updAll.disabled = false; updAll.textContent = 'Update all (' + nUpd + ')'; }
  else updAll.style.display = 'none';
  const cur = view.kind === 'source' ? srcData.find((s) => s.url === view.url) : null;
  if (cur && cur.error) $('credit').textContent = 'couldn\'t load this source — ' + cur.error;
  else if (cur && cur.registry) $('credit').textContent = (cur.registry.name || '') + (cur.registry.description ? ' — ' + cur.registry.description : '') + (cur.registry.updated ? '  ·  updated ' + cur.registry.updated : '');
  else $('credit').textContent = allEntries.length + ' pack' + (allEntries.length === 1 ? '' : 's') + ' across ' + srcData.filter((s) => s.registry).length + ' source' + (srcData.filter((s) => s.registry).length === 1 ? '' : 's');

  grid.innerHTML = '';
  if (!list.length) {
    const msg = view.kind === 'updates' ? 'Everything is up to date.'
      : view.kind === 'installed' ? 'Nothing installed yet.'
      : (cur && cur.error) ? 'couldn\'t load this source.'
      : (allEntries.length ? 'no matches.' : 'no entries.');
    grid.innerHTML = '<div class="empty">' + esc(msg) + '</div>';
    return;
  }
  const multi = view.kind !== 'source';
  for (const e of list) {
    const status = statusMap[e.name] || 'install';
    const coverUrl = e.cover ? (/^https?:/.test(e.cover) ? e.cover : (e._base + '/' + e.cover.replace(/^\//, ''))) : '';
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML =
      '<div class="cover">' + (coverUrl ? '<img src="' + esc(coverUrl) + '" alt="">' : (ICON[e.datKind] || ICON.data)) + '</div>'
      + '<div class="body">'
      + '<div class="ttl">' + esc(e.title || e.name) + '</div>'
      + '<div class="badges"><span class="badge">' + esc(e.kind === 'gcupkg' ? 'ext' : e.kind === 'profile' ? 'profile' : (e.datKind || 'data')) + '</span>'
      + (isNC(e.license) ? '<span class="badge nc" title="Non-commercial — free to share, not to sell">NC</span>' : '') + '</div>'
      + '<div class="meta">' + esc(e.license || '') + (e.attribution ? ' · ' + esc(e.attribution) : '') + ' · ' + fmtSize(e.size || 0) + (e.version ? ' · v' + esc(e.version) : '') + '</div>'
      + (multi ? '<div class="src">' + esc(e._srcName || '') + '</div>' : '')
      + (e.description ? '<div class="desc">' + esc(e.description) + '</div>' : '')
      + '<div class="act"></div>'
      + '</div>';
    const btn = document.createElement('button');
    btn.textContent = e.kind === 'profile' ? 'Apply' : LABEL[status];
    btn.className = status === 'installed' ? 'done' : status === 'update' ? 'upd' : '';
    if (status === 'installed') btn.title = 'Reinstall (overwrite — reading state is kept)';
    btn.addEventListener('click', async () => {
      const wasReinstall = status === 'installed';
      const idle = e.kind === 'profile' ? 'Apply' : LABEL[status];
      btn.disabled = true; btn.textContent = '…';
      try {
        // For a kind:'profile' entry the shell applies it (provision) and the
        // confirm + trust dialogs run shell-side; dest is the provision report.
        const dest = await callShell('RegistryInstall', [e._src, e.name]);
        if (dest) {
          statusMap = await callShell('RegistryStatuses', [allEntries]).catch(() => statusMap);
          if (!wasReinstall && e.kind === 'gcudat') await callShell('OpenPath', [dest]);
          else $('credit').textContent = (e.kind === 'profile' ? 'applied ' : e.kind === 'gcupkg' ? 'installed ' : 'reinstalled ') + (e.title || e.name);
          renderSide(); render();
        } else { btn.disabled = false; btn.textContent = idle; }
      } catch (err) { btn.disabled = false; btn.textContent = idle; $('credit').textContent = 'install failed: ' + (err.message || err); }
    });
    card.querySelector('.act').appendChild(btn);
    const share = document.createElement('button');
    share.className = 'share'; share.textContent = '⤴ Share'; share.title = 'Share link / QR — open in Works';
    share.addEventListener('click', () => shareEntry(e));
    card.querySelector('.act').appendChild(share);
    grid.appendChild(card);
  }
}

// Share — build a capsule registry-pointer link (→ gentropic.org/works/#capsule),
// show it + a QR. Scanning / opening installs the entry in Works.
async function shareEntry(e) {
  try {
    const cap = await encodeInlineI(JSON.stringify({ v: 1, install: { source: e._src, name: e.name } }));
    const link = WORKS_URL + '#capsule=' + encodeURIComponent(fragmentEncode(cap));
    $('shareTitle').textContent = e.title || e.name;
    $('shareQr').innerHTML = toSVG(link, { ecc: 'M', scale: 5 });   // dark-on-white for scannability
    $('shareLink').value = link;
    $('shareOvl').classList.add('open');
  } catch (err) { $('credit').textContent = 'share failed: ' + (err.message || err); }
}

window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent || !ev.data || ev.data.type !== 'abus:welcome') return;
  try { bus = await connect(ev.data.port, { client: 'library-surface' }); }
  catch (e) { document.body.innerHTML = '<div class="err" style="padding:24px">connect failed: ' + (e.message || e) + '</div>'; return; }
  try { await bus.claim('library-' + (ev.data.tab && ev.data.tab.id || 'x')); } catch {}
  if (typeof installThemeSubscription === 'function') installThemeSubscription(bus);
  bus.expose('/', { Surface: { methods: { Flush: () => {}, CanClose: () => true, Relocated: () => {} }, signals: ['DirtyChanged', 'TitleChanged', 'Ready'] } });

  // smart-view nav
  for (const el of document.querySelectorAll('.nav-item'))
    el.addEventListener('click', () => { view = { kind: el.dataset.view }; renderSide(); render(); savePrefs(); });

  $('search').addEventListener('input', render);
  $('shareClose').addEventListener('click', () => $('shareOvl').classList.remove('open'));
  $('shareOvl').addEventListener('click', (e) => { if (e.target === $('shareOvl')) $('shareOvl').classList.remove('open'); });
  $('shareCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('shareLink').value); $('shareCopy').textContent = 'Copied'; setTimeout(() => { $('shareCopy').textContent = 'Copy'; }, 1200); }
    catch { $('shareLink').select(); }
  });
  $('collapse').addEventListener('click', () => { $('shell').classList.add('collapsed'); savePrefs(); });
  $('rail').addEventListener('click', () => { $('shell').classList.remove('collapsed'); savePrefs(); });

  // Update all — install every pack with an available update (no auto-open).
  $('updAll').addEventListener('click', async () => {
    const todo = allEntries.filter((e) => statusMap[e.name] === 'update');
    if (!todo.length) return;
    $('updAll').disabled = true;
    let done = 0;
    for (const e of todo) {
      $('credit').textContent = 'updating ' + (e.title || e.name) + '… (' + (done + 1) + '/' + todo.length + ')';
      try { if (await callShell('RegistryInstall', [e._src, e.name])) done++; } catch { /* skip, continue */ }
    }
    statusMap = await callShell('RegistryStatuses', [allEntries]).catch(() => statusMap);
    $('credit').textContent = 'updated ' + done + ' pack' + (done === 1 ? '' : 's') + (done < todo.length ? ' (' + (todo.length - done) + ' failed)' : '');
    renderSide(); render();
  });

  $('add').addEventListener('click', () => { $('addPanel').classList.toggle('open'); if ($('addPanel').classList.contains('open')) $('addUrl').focus(); });
  $('addCancel').addEventListener('click', () => { $('addPanel').classList.remove('open'); $('addUrl').value = ''; });
  $('addGo').addEventListener('click', async () => {
    const u = $('addUrl').value.trim(); if (!u) return;
    await callShell('RegistryAddSource', [u, u]);
    $('addPanel').classList.remove('open'); $('addUrl').value = '';
    view = { kind: 'source', url: u };
    loadAll();
  });

  await loadPrefs();
  loadAll();
  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' }, ['Library']);
  bus.signal({ path: '/', interface: 'Surface', member: 'Ready' }, []);
});
</script>
</body>
</html>
