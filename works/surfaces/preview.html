<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Preview</title>
<style>
/* @theme-tokens */

html, body { margin: 0; height: 100%; overflow: hidden;
  background: var(--au-surface); color: var(--au-fg);
  font: 13px/1.5 ui-sans-serif, 'Barlow', system-ui, sans-serif; }
#root { height: 100%; overflow: auto; box-sizing: border-box; }
#loading, .error { padding: 16px 20px; color: var(--au-fg-soft); }
.error { color: var(--au-error); }

/* CSV table */
.csv-info { padding: 6px 12px; color: var(--au-fg-soft); font-size: 11px;
  border-bottom: 1px solid var(--au-border); }
.csv-wrap { overflow: auto; max-height: calc(100vh - 26px); }
table.csv { border-collapse: collapse; min-width: 100%;
  font: 12px ui-monospace, 'Space Mono', Menlo, monospace; }
table.csv th, table.csv td { border: 1px solid var(--au-border); padding: 4px 10px;
  text-align: left; vertical-align: top; white-space: nowrap; }
table.csv th { background: var(--au-surface-raised); position: sticky; top: 0;
  color: var(--au-fg); font-weight: 600; cursor: pointer; user-select: none; }
table.csv th:hover { background: var(--au-surface-bright); }
table.csv th .sort-ind { color: var(--au-info); margin-left: 6px; }
table.csv th[data-type="number"], table.csv td[data-type="number"] {
  text-align: right; font-variant-numeric: tabular-nums; }
table.csv tr:hover td { background: var(--au-surface-raised); }
table.csv .col-type { color: var(--au-fg-soft); font-size: 10px; font-weight: 400;
  margin-left: 4px; }

/* JSON tree */
.json { padding: 12px 16px;
  font: 12px ui-monospace, 'Space Mono', Menlo, monospace; }
.json details { margin-left: 12px; }
.json .leaf { margin-left: 24px; }
.json .key { color: var(--au-info); }
.json .val.string { color: var(--au-success); }
.json .val.number { color: var(--au-warn); }
.json .val.bool { color: var(--au-selected); }
.json .val.null { color: var(--au-fg-soft); font-style: italic; }
.json .type { color: var(--au-fg-soft); font-size: 10px; margin-left: 6px; }
.json summary { cursor: pointer; user-select: none; }
.json summary:hover { color: var(--au-fg); }

/* Markdown */
.md { padding: 16px 28px; max-width: 820px; line-height: 1.6;
  font: 14px/1.6 ui-sans-serif, 'Barlow', system-ui, sans-serif; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 {
  color: var(--au-fg); margin: 1em 0 0.5em; }
.md h1 { font-size: 1.8em; border-bottom: 1px solid var(--au-border); padding-bottom: 0.3em; }
.md h2 { font-size: 1.4em; }
.md h3 { font-size: 1.2em; }
.md p { margin: 0.8em 0; }
.md code { background: var(--au-surface-raised); padding: 1px 6px; border-radius: 3px;
  color: var(--au-info); font: 0.9em ui-monospace, 'Space Mono', Menlo, monospace; }
.md pre { background: var(--au-surface-raised); padding: 12px 16px; border-radius: 4px;
  overflow: auto; }
.md pre code { background: none; padding: 0; color: inherit; }
.md a { color: var(--au-info); }
.md ul, .md ol { padding-left: 24px; }
.md strong { color: var(--au-fg); }
.md blockquote { border-left: 3px solid var(--au-border); margin: 0.8em 0;
  padding: 0 1em; color: var(--au-fg-soft); }

/* Image */
.img-wrap { display: flex; justify-content: center; align-items: center;
  min-height: 100%; padding: 20px; box-sizing: border-box; background: var(--au-surface-deep); }
.img-wrap img { max-width: 100%; max-height: calc(100vh - 40px);
  background: repeating-conic-gradient(var(--au-border) 0% 25%, var(--au-surface-raised) 0% 50%) 50% / 20px 20px; }

/* PDF */
.pdf { width: 100%; height: 100vh; border: 0; }

/* Archive tree */
.archive-wrap { padding: 0; }
.archive-header { padding: 12px 16px; border-bottom: 1px solid var(--au-border);
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.archive-header .name { font-weight: 600; color: var(--au-fg); flex: 0 0 auto; }
.archive-header .stats { color: var(--au-fg-soft); font-size: 11px; flex: 1 1 auto; }
.archive-header .actions { display: flex; gap: 6px; }
.archive-header button {
  background: var(--au-surface-raised); color: var(--au-fg); border: 1px solid var(--au-border);
  border-radius: 3px; padding: 4px 10px; cursor: pointer; font: inherit;
}
.archive-header button:hover { background: var(--au-surface-bright); }
.archive-header button.primary { background: var(--au-surface-bright); border-color: var(--au-rule); }
.archive-tree { padding: 6px 0; font-family: ui-monospace, 'Space Mono', Menlo, monospace; font-size: 12px; }
.archive-tree details { margin-left: 16px; }
.archive-tree summary { cursor: pointer; user-select: none; padding: 2px 8px; color: var(--au-fg); }
.archive-tree summary:hover { background: var(--au-surface-raised); }
.archive-tree summary::marker { color: var(--au-fg-soft); }
.archive-tree .archive-leaf { padding: 2px 8px; margin-left: 16px; cursor: pointer;
  display: flex; align-items: center; gap: 10px; color: var(--au-fg); }
.archive-tree .archive-leaf:hover { background: var(--au-surface-raised); }
.archive-tree .archive-leaf .icon { color: var(--au-fg-soft); flex: 0 0 14px; }
.archive-tree .archive-leaf .name { flex: 1 1 auto; }
.archive-tree .archive-leaf .size { color: var(--au-fg-soft); font-size: 11px; flex: 0 0 auto; }
.archive-tree .archive-dir-icon { color: var(--au-fg-soft); margin-right: 6px; }

/* Inline-viewer back bar (shown above an inline-rendered archive entry) */
.archive-back { padding: 8px 12px; border-bottom: 1px solid var(--au-border);
  display: flex; align-items: center; gap: 10px; background: var(--au-surface-deep); }
.archive-back button {
  background: var(--au-surface-raised); color: var(--au-fg); border: 1px solid var(--au-border);
  border-radius: 3px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 11px;
}
.archive-back button:hover { background: var(--au-surface-bright); }
.archive-back .crumb { color: var(--au-fg-soft); font-size: 11px; flex: 1 1 auto; }

/* GCU thin scrollbar — surfaces are sandboxed iframes; mirrors the works
   shell pattern in works/style.css. */
* { scrollbar-width: thin; scrollbar-color: var(--au-border) transparent; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--au-border); border-radius: 4px; }
*::-webkit-scrollbar-thumb:hover { background: var(--au-fg-soft); }
*::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
<div id="root"><div id="loading">Loading…</div></div>
<script type="module">
import { connect } from '../../ext/abus/index.js';

/* @theme-init */

const root = document.getElementById('root');
const basename = (p) => p.split('/').filter(Boolean).pop() || p;
const extOf = (n) => {
  const i = n.lastIndexOf('.');
  return i >= 0 ? n.slice(i).toLowerCase() : '';
};
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const showError = (msg) => { root.innerHTML = '<div class="error">' + esc(msg) + '</div>'; };

const IMAGE_EXTS = ['.png','.jpg','.jpeg','.gif','.webp','.svg','.bmp','.ico','.avif'];
const MIME = {
  '.png':'image/png', '.jpg':'image/jpeg', '.jpeg':'image/jpeg',
  '.gif':'image/gif', '.webp':'image/webp', '.svg':'image/svg+xml',
  '.bmp':'image/bmp', '.ico':'image/x-icon', '.avif':'image/avif',
  '.pdf':'application/pdf',
};

// Recognized archive extensions — files matching these route through the
// archive tree renderer instead of a per-type renderer. Format detection
// happens server-side (Archive.Detect via A-Bus); this is just the gate.
const ARCHIVE_EXTS = ['.zip','.tar','.tar.gz','.tgz','.tar.zst','.tzst',
                      '.tar.xz','.txz','.tar.bz2','.tbz2','.gz','.zst'];
function archiveExtMatches(name) {
  const lower = name.toLowerCase();
  return ARCHIVE_EXTS.some((e) => lower.endsWith(e));
}

// Track blob URLs so they're revoked on unload (image / pdf paths).
const blobUrls = [];
window.addEventListener('unload', () => blobUrls.forEach((u) => URL.revokeObjectURL(u)));

// Set by the message handler — the archive renderer references these so
// it can call Archive.List / Read / Extract via A-Bus and so the inline-
// entry "Back" button can re-render the archive's top-level tree.
let currentBus = null;
let currentSourcePath = null;
let cachedEntries = null;   // memoize the entry list within a session

window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent || !ev.data || ev.data.type !== 'abus:welcome') return;
  const { port, tab } = ev.data;

  let bus;
  try { bus = await connect(port, { client: 'preview' }); }
  catch (e) { showError('A-Bus connect failed: ' + e.message); return; }
  installThemeSubscription(bus);
  try { await bus.claim('preview-' + (tab.id || 'unknown')); } catch {}

  const path = tab.path;
  const name = basename(path);
  const ext = extOf(name);
  const readText = () => bus.call(
    { to: 'works', path: '/', interface: 'VFS', member: 'Read' }, [path, 'utf8']);
  // MUST pass 'bytes' — VFS.Read without an encoding hits the backend's
  // default (TextDecoder().decode()), which UTF-8-launders binary contents
  // and substitutes U+FFFD for non-UTF-8 bytes. Same trap we hit earlier in
  // the archive arc; the lesson applies to image + PDF previews too.
  const readBytes = () => bus.call(
    { to: 'works', path: '/', interface: 'VFS', member: 'Read' }, [path, 'bytes']);

  // Expose bus so the archive renderer (called later) can also invoke
  // Archive.List / Archive.Read / Archive.Extract.
  currentBus = bus;
  currentSourcePath = path;

  try {
    if (archiveExtMatches(name)) {
      await renderArchive(path);
    } else if (ext === '.csv' || ext === '.tsv') {
      renderCsv(await readText(), ext === '.tsv' ? '\t' : ',');
    } else if (ext === '.json' || ext === '.geojson') {
      renderJson(await readText());
    } else if (ext === '.md' || ext === '.markdown') {
      renderMarkdown(await readText());
    } else if (IMAGE_EXTS.includes(ext)) {
      renderImage(await readBytes(), ext);
    } else if (ext === '.pdf') {
      renderPdf(await readBytes());
    } else {
      showError('No preview available for ' + (ext || 'this file'));
    }
  } catch (e) {
    showError('read failed: ' + (e.message || e));
  }

  // §5.2 Surface contract — read-only viewer.
  bus.expose('/', {
    Surface: {
      methods: {
        Flush:     () => {},
        CanClose:  () => true,
        Relocated: () => {},
      },
      signals: ['DirtyChanged', 'TitleChanged', 'Ready'],
    },
  });
  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' }, [name]);
  bus.signal({ path: '/', interface: 'Surface', member: 'Ready' }, []);
});

// ── CSV ─────────────────────────────────────────────────────────────
// Small state-machine parser — handles quoted fields with escaped quotes
// (the RFC 4180 case). No streaming; the table cap below handles large
// files. Hard tab as delim for .tsv.
function parseCsv(text, delim) {
  const rows = [];
  let cur = '', row = [], inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cur += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); cur = ''; row = []; }
      else if (c === '\r') { /* skip */ }
      else cur += c;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

const NUM_RE = /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/;
function detectType(values) {
  let allNum = true, allDate = true, anyNonEmpty = false;
  for (const v of values) {
    const t = (v || '').trim();
    if (!t) continue;
    anyNonEmpty = true;
    if (allNum && !NUM_RE.test(t)) allNum = false;
    // Date.parse is forgiving — gate on at least one '-' or '/' so plain
    // numbers don't get classed as dates.
    if (allDate && (!/[-/]/.test(t) || isNaN(Date.parse(t)))) allDate = false;
    if (!allNum && !allDate) break;
  }
  if (!anyNonEmpty) return 'string';
  if (allNum) return 'number';
  if (allDate) return 'date';
  return 'string';
}

function renderCsv(text, delim) {
  const rows = parseCsv(text, delim);
  if (rows.length === 0) { showError('file is empty'); return; }
  const headers = rows[0];
  const data = rows.slice(1);
  const types = headers.map((_, c) => detectType(data.map((r) => r[c])));

  const MAX_ROWS = 5000;   // beyond this, large tables stall the renderer
  const truncated = data.length > MAX_ROWS;
  // Slice for display — sort applies to all rows but render is capped.
  let display = data.slice(0, MAX_ROWS);
  let sortCol = -1, sortDir = 1;   // 1 = asc, -1 = desc

  function renderHeader() {
    const parts = ['<tr>'];
    for (let c = 0; c < headers.length; c++) {
      const ind = c === sortCol
        ? `<span class="sort-ind">${sortDir === 1 ? '▲' : '▼'}</span>` : '';
      parts.push(`<th data-type="${types[c]}" data-col="${c}">${esc(headers[c])}`
        + `<span class="col-type">${esc(types[c])}</span>${ind}</th>`);
    }
    parts.push('</tr>');
    return parts.join('');
  }

  function renderBody() {
    const parts = [];
    for (const r of display) {
      parts.push('<tr>');
      for (let c = 0; c < headers.length; c++) {
        const v = r[c] != null ? r[c] : '';
        parts.push(`<td data-type="${types[c]}">${esc(v)}</td>`);
      }
      parts.push('</tr>');
    }
    return parts.join('');
  }

  root.innerHTML = [
    '<div class="csv-info">', esc(`${data.length} rows × ${headers.length} columns`),
    truncated ? esc(` — showing first ${MAX_ROWS}`) : '',
    '</div>',
    '<div class="csv-wrap"><table class="csv"><thead>', renderHeader(),
    '</thead><tbody>', renderBody(), '</tbody></table></div>',
  ].join('');

  // Sort on header click. Same column twice → reverse; new column → asc.
  // Sort applies to the FULL data array (so the first MAX_ROWS reshuffle);
  // empty cells go to the end regardless of direction.
  root.querySelector('table.csv thead').addEventListener('click', (ev) => {
    const th = ev.target.closest('th'); if (!th) return;
    const col = Number(th.dataset.col);
    if (sortCol === col) sortDir = -sortDir; else { sortCol = col; sortDir = 1; }
    const type = types[col];
    data.sort((a, b) => {
      const av = (a[col] || '').trim();
      const bv = (b[col] || '').trim();
      if (av === '' && bv === '') return 0;
      if (av === '') return 1;             // empties to the end
      if (bv === '') return -1;
      let cmp;
      if (type === 'number') cmp = parseFloat(av) - parseFloat(bv);
      else if (type === 'date') cmp = Date.parse(av) - Date.parse(bv);
      else cmp = av.localeCompare(bv);
      return cmp * sortDir;
    });
    display = data.slice(0, MAX_ROWS);
    root.querySelector('table.csv thead').innerHTML = renderHeader();
    root.querySelector('table.csv tbody').innerHTML = renderBody();
  });
}

// ── JSON ────────────────────────────────────────────────────────────
function renderJson(text) {
  let value;
  try { value = JSON.parse(text); }
  catch (e) { showError('invalid JSON: ' + e.message); return; }
  root.innerHTML = '<div class="json">' + jsonNode(value, '$') + '</div>';
}

function jsonNode(v, key) {
  if (v === null) return jsonLeaf(key, 'null', 'null');
  if (typeof v === 'boolean') return jsonLeaf(key, String(v), 'bool');
  if (typeof v === 'number') return jsonLeaf(key, String(v), 'number');
  if (typeof v === 'string') return jsonLeaf(key, JSON.stringify(v), 'string');
  if (Array.isArray(v)) {
    if (v.length === 0) return jsonLeaf(key, '[]', 'array');
    const open = v.length <= 50 ? ' open' : '';
    const inner = v.map((c, i) => jsonNode(c, '[' + i + ']')).join('');
    return `<details${open}><summary><span class="key">${esc(key)}</span>`
      + `<span class="type">array (${v.length})</span></summary>${inner}</details>`;
  }
  if (typeof v === 'object') {
    const keys = Object.keys(v);
    if (keys.length === 0) return jsonLeaf(key, '{}', 'object');
    const open = keys.length <= 50 ? ' open' : '';
    const inner = keys.map((k) => jsonNode(v[k], k)).join('');
    return `<details${open}><summary><span class="key">${esc(key)}</span>`
      + `<span class="type">object (${keys.length})</span></summary>${inner}</details>`;
  }
  return '';
}
function jsonLeaf(key, val, type) {
  return `<div class="leaf"><span class="key">${esc(key)}</span>: `
    + `<span class="val ${type}">${esc(val)}</span></div>`;
}

// ── Markdown ────────────────────────────────────────────────────────
// Tiny subset — headings, bold/italic/code inline, code fences, lists,
// blockquotes, links. Not CommonMark; good enough for READMEs.
function renderMarkdown(text) {
  const lines = text.split('\n');
  const out = [];
  let inCode = false, listType = '';
  const closeList = () => { if (listType) { out.push(`</${listType}>`); listType = ''; } };

  for (const raw of lines) {
    const line = raw.replace(/\r$/, '');
    if (line.startsWith('```')) {
      closeList();
      if (inCode) { out.push('</code></pre>'); inCode = false; }
      else { out.push('<pre><code>'); inCode = true; }
      continue;
    }
    if (inCode) { out.push(esc(line) + '\n'); continue; }

    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      closeList();
      const lvl = m[1].length;
      out.push(`<h${lvl}>${inlineMd(m[2])}</h${lvl}>`);
    } else if (line.startsWith('> ')) {
      closeList();
      out.push(`<blockquote>${inlineMd(line.slice(2))}</blockquote>`);
    } else if ((m = line.match(/^[-*]\s+(.*)$/))) {
      if (listType !== 'ul') { closeList(); out.push('<ul>'); listType = 'ul'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if ((m = line.match(/^\d+\.\s+(.*)$/))) {
      if (listType !== 'ol') { closeList(); out.push('<ol>'); listType = 'ol'; }
      out.push(`<li>${inlineMd(m[1])}</li>`);
    } else if (line.trim() === '') {
      closeList();
    } else {
      closeList();
      out.push(`<p>${inlineMd(line)}</p>`);
    }
  }
  closeList();
  if (inCode) out.push('</code></pre>');
  root.innerHTML = '<div class="md">' + out.join('') + '</div>';
}

function inlineMd(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// ── Image ───────────────────────────────────────────────────────────
// Encode as data: URL rather than blob: URL. The preview surface itself
// runs from a blob:null/<uuid> iframe (opaque origin); on file:// each
// blob URL gets ANOTHER unique opaque origin and the parent rejects the
// load with "Not allowed to load local resource". data: URLs work
// cross-origin freely (modulo CSP). Size penalty is ~33% from base64 —
// acceptable for typical preview images. For huge images the
// blob-URL path would be preferable but we'd need to be on http(s):// for
// it to work anyway, and at that point the parent's origin model is
// different too.
function _bytesToDataUrl(bytes, mime) {
  // Coerce whatever the A-Bus + VFS marshalling handed us into a Uint8Array
  // before chunking. structured-clone preserves typed arrays, but defensive
  // about the alternatives (plain ArrayBuffer, a transferred Buffer-like
  // shape, or a UTF-8-lossy string from a misbehaving VFS read).
  let u;
  if (bytes instanceof Uint8Array) u = bytes;
  else if (bytes instanceof ArrayBuffer) u = new Uint8Array(bytes);
  else if (bytes && typeof bytes === 'object' && bytes.buffer instanceof ArrayBuffer) {
    u = new Uint8Array(bytes.buffer, bytes.byteOffset || 0, bytes.byteLength);
  }
  else if (typeof bytes === 'string') u = new TextEncoder().encode(bytes);
  else throw new TypeError('preview: cannot convert ' + (typeof bytes) + ' to bytes');

  // Chunked btoa — avoids the call-stack-size limit on String.fromCharCode
  // for large byte arrays.
  let s = '';
  const CHUNK = 8192;
  for (let i = 0; i < u.length; i += CHUNK) {
    s += String.fromCharCode.apply(null, u.subarray(i, i + CHUNK));
  }
  return 'data:' + mime + ';base64,' + btoa(s);
}

function renderImage(bytes, ext) {
  const url = _bytesToDataUrl(bytes, MIME[ext] || 'application/octet-stream');
  root.innerHTML = `<div class="img-wrap"><img src="${url}" alt=""></div>`;
}

// ── PDF ─────────────────────────────────────────────────────────────
function renderPdf(bytes) {
  const url = _bytesToDataUrl(bytes, 'application/pdf');
  root.innerHTML = `<embed src="${url}" type="application/pdf" class="pdf">`;
}

// ── Archive ─────────────────────────────────────────────────────────
// Two modes:
//   tree view  — collapsible directory tree of entries; click an entry
//                to open it
//   inline view — selected entry rendered through the same per-format
//                 dispatcher used for top-level files. Back button restores
//                 the tree view from `cachedEntries`.
//
// All bytes go through Archive.* on the works shell — preview is sandboxed
// and doesn't bundle @gcu/archive itself.

async function renderArchive(path) {
  if (!currentBus) { showError('archive: no bus'); return; }
  // Pretty status while we ask the shell to list the archive — large .zips
  // can take a moment.
  root.innerHTML = '<div id="loading">Reading archive…</div>';
  let entries;
  try {
    entries = await currentBus.call(
      { to: 'works', path: '/', interface: 'Archive', member: 'List' }, [path]);
  } catch (e) {
    showError('archive: list failed — ' + (e.message || e)); return;
  }
  cachedEntries = entries;
  _renderArchiveTree(path, entries);
}

function _fmtBytes(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  if (n < 1024 * 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

// Build a nested directory tree from a flat entry list. Each node:
//   { name, type, size?, path, children? (sorted: dirs first, then files) }
function _buildTree(entries) {
  const root = { name: '', type: 'directory', path: '', children: new Map() };
  for (const e of entries) {
    const parts = e.path.split('/').filter(Boolean);
    if (parts.length === 0) continue;
    let cur = root;
    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      const last = i === parts.length - 1 && !e.path.endsWith('/');
      if (!cur.children.has(part)) {
        cur.children.set(part, {
          name: part,
          type: last ? 'file' : 'directory',
          path: parts.slice(0, i + 1).join('/') + (last ? '' : '/'),
          size: last ? e.size : null,
          children: last ? null : new Map(),
        });
      }
      cur = cur.children.get(part);
    }
  }
  // Convert maps → sorted arrays (dirs first, then files, both alpha).
  const finalize = (node) => {
    if (!node.children) return;
    const arr = [...node.children.values()];
    arr.sort((a, b) =>
      (a.type === b.type ? a.name.localeCompare(b.name)
                          : (a.type === 'directory' ? -1 : 1)));
    node.children = arr;
    for (const c of arr) finalize(c);
  };
  finalize(root);
  return root.children;
}

function _renderArchiveTree(archivePath, entries) {
  const name = basename(archivePath);
  let fileCount = 0, totalSize = 0;
  for (const e of entries) {
    if (e.type === 'file') { fileCount++; totalSize += e.size || 0; }
  }

  const tree = _buildTree(entries);

  // Render. The tree itself is plain HTML + a single click handler bubbled
  // off the container — keeps the DOM small even for large archives.
  const wrap = document.createElement('div');
  wrap.className = 'archive-wrap';

  const header = document.createElement('div');
  header.className = 'archive-header';
  header.innerHTML =
    '<span class="name">' + esc(name) + '</span>' +
    '<span class="stats">' + fileCount + ' files · ' + _fmtBytes(totalSize) + '</span>' +
    '<span class="actions">' +
      '<button class="primary" data-act="extract-here">Extract here</button>' +
      '<button data-act="extract-all">Extract to a sibling dir</button>' +
    '</span>';
  wrap.appendChild(header);

  const treeEl = document.createElement('div');
  treeEl.className = 'archive-tree';
  treeEl.innerHTML = _renderTreeNodes(tree);
  wrap.appendChild(treeEl);

  root.innerHTML = '';
  root.appendChild(wrap);

  // Single delegated click handler.
  wrap.addEventListener('click', async (ev) => {
    const leaf = ev.target.closest('.archive-leaf');
    if (leaf && leaf.dataset.path) {
      ev.preventDefault();
      const innerPath = leaf.dataset.path;
      await _renderArchiveEntry(archivePath, innerPath);
      return;
    }
    const btn = ev.target.closest('button[data-act]');
    if (btn) {
      ev.preventDefault();
      const act = btn.dataset.act;
      if (act === 'extract-here')  await _extractArchive(archivePath, 'here');
      else if (act === 'extract-all') await _extractArchive(archivePath, 'pick');
    }
  });
}

function _renderTreeNodes(nodes) {
  const parts = [];
  for (const node of nodes) {
    if (node.type === 'directory') {
      parts.push(
        '<details open><summary>' +
          '<span class="archive-dir-icon">▸</span>' +
          esc(node.name) + '/' +
        '</summary>' +
        _renderTreeNodes(node.children || []) +
        '</details>');
    } else {
      parts.push(
        '<div class="archive-leaf" data-path="' + esc(node.path) + '">' +
          '<span class="icon">·</span>' +
          '<span class="name">' + esc(node.name) + '</span>' +
          '<span class="size">' + _fmtBytes(node.size) + '</span>' +
        '</div>');
    }
  }
  return parts.join('');
}

async function _renderArchiveEntry(archivePath, innerPath) {
  root.innerHTML = '<div id="loading">Extracting ' + esc(innerPath) + '…</div>';
  let bytes;
  try {
    bytes = await currentBus.call(
      { to: 'works', path: '/', interface: 'Archive', member: 'Read' },
      [archivePath, innerPath]);
  } catch (e) {
    showError('archive: read failed — ' + (e.message || e)); return;
  }
  if (!bytes) { showError('archive: entry not found — ' + innerPath); return; }
  // Bytes may come back across A-Bus as a Uint8Array or ArrayBuffer
  // depending on transport. Normalize.
  if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
  else if (!(bytes instanceof Uint8Array) && bytes && bytes.buffer) {
    bytes = new Uint8Array(bytes.buffer, bytes.byteOffset || 0, bytes.byteLength);
  }

  // Render the entry through the existing per-format dispatcher. Above the
  // rendered content, a back bar with breadcrumb + "Back to archive" button.
  // We render the dispatcher's output into root first, then prepend the bar
  // so renderers that do `root.innerHTML = ...` don't clobber it.
  const innerExt = extOf(innerPath);
  let renderedSomething = true;
  try {
    if (innerExt === '.csv' || innerExt === '.tsv') {
      renderCsv(new TextDecoder().decode(bytes), innerExt === '.tsv' ? '\t' : ',');
    } else if (innerExt === '.json' || innerExt === '.geojson') {
      renderJson(new TextDecoder().decode(bytes));
    } else if (innerExt === '.md' || innerExt === '.markdown') {
      renderMarkdown(new TextDecoder().decode(bytes));
    } else if (IMAGE_EXTS.includes(innerExt)) {
      renderImage(bytes, innerExt);
    } else if (innerExt === '.pdf') {
      renderPdf(bytes);
    } else if (innerExt === '' || innerExt === '.txt' || innerExt === '.log'
            || /^[\x09\x0a\x0d\x20-\x7e -￿]*$/.test(
                 new TextDecoder('utf-8', { fatal: false }).decode(bytes.subarray(0, 4096)))) {
      // No extension or text-like — render as plain text.
      const text = new TextDecoder().decode(bytes);
      root.innerHTML = '<pre style="padding:12px 16px;color:#c8ccd0;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;">'
        + esc(text) + '</pre>';
    } else {
      showError('No preview available for ' + (innerExt || basename(innerPath))
        + ' (' + _fmtBytes(bytes.length) + ')');
      renderedSomething = false;
    }
  } catch (e) {
    showError('preview failed: ' + (e.message || e));
    renderedSomething = false;
  }

  // Back bar — prepend so it sits above whatever the dispatcher rendered.
  const bar = document.createElement('div');
  bar.className = 'archive-back';
  bar.innerHTML =
    '<button data-back>← Back to archive</button>' +
    '<span class="crumb">' + esc(basename(archivePath)) + ' / ' + esc(innerPath) + '</span>';
  bar.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-back]')) {
      ev.preventDefault();
      _renderArchiveTree(archivePath, cachedEntries);
    }
  });
  root.prepend(bar);
}

// Resolve a destination directory for "Extract here". Mirrors the tree
// logic but stays surface-side: ask the shell for a unique path under the
// sibling-of-the-archive directory, named after the archive minus its
// extension. The Extract call uses overwrite='rename' so any residual
// collision is handled at the entry level too.
async function _extractArchive(archivePath, mode) {
  if (mode === 'here') {
    const slash = archivePath.lastIndexOf('/');
    const parent = slash <= 0 ? '/' : archivePath.slice(0, slash);
    const stem = basename(archivePath).replace(/\.(zip|tar|tar\.gz|tgz|tar\.zst|tzst|tar\.xz|txz|tar\.bz2|tbz2|gz|zst)$/i, '');
    const dest = parent === '/' ? '/' + stem : parent + '/' + stem;
    // Probe for the first unused dir name.
    const uniqueDest = await _uniqueDest(dest);
    try {
      await currentBus.call(
        { to: 'works', path: '/', interface: 'Archive', member: 'Extract' },
        [archivePath, uniqueDest, { overwrite: 'rename' }]);
      _flashBanner('Extracted to ' + uniqueDest);
    } catch (e) {
      _flashBanner('Extract failed: ' + (e.message || e), 'error');
    }
    return;
  }
  if (mode === 'pick') {
    // No surface-side folder picker yet — show a prompt. Future: route
    // through a Shell.PickFolder A-Bus method on the shell so the surface
    // gets the same picker (with + New folder support) that tree.js uses.
    // For now: prompt() inside the sandbox. The extract sink auto-creates
    // parent directories recursively, so typing a path that doesn't exist
    // yet is the supported way to create a new destination — the message
    // calls that out.
    const slash = archivePath.lastIndexOf('/');
    const parent = slash <= 0 ? '/' : archivePath.slice(0, slash);
    const stem = basename(archivePath).replace(
      /\.(zip|tar|tar\.gz|tgz|tar\.zst|tzst|tar\.xz|txz|tar\.bz2|tbz2|gz|zst)$/i, '');
    const seed = parent === '/' ? '/' + stem : parent + '/' + stem;
    const dest = window.prompt(
      'Extract to (absolute VFS path — typed path is created if it doesn\'t exist):',
      seed);
    if (!dest) return;
    try {
      // Ensure the destination exists so the post-extract refresh shows it
      // immediately. Archive.Extract would auto-create on first write, but
      // that races with empty-archive edge cases.
      try {
        await currentBus.call(
          { to: 'works', path: '/', interface: 'VFS', member: 'MkDir' }, [dest]);
      } catch { /* MkDir is idempotent enough; ignore EEXIST */ }
      await currentBus.call(
        { to: 'works', path: '/', interface: 'Archive', member: 'Extract' },
        [archivePath, dest, { overwrite: 'rename' }]);
      _flashBanner('Extracted to ' + dest);
    } catch (e) {
      _flashBanner('Extract failed: ' + (e.message || e), 'error');
    }
  }
}

async function _uniqueDest(path) {
  // Probe via VFS.Exists on the shell. If unavailable, just return path
  // (extract's overwrite='rename' will dedupe at the entry level).
  try {
    const exists = await currentBus.call(
      { to: 'works', path: '/', interface: 'VFS', member: 'Exists' }, [path]);
    if (!exists) return path;
  } catch { return path; }
  for (let i = 2; i < 1000; i++) {
    const candidate = path + ' (' + i + ')';
    try {
      const exists = await currentBus.call(
        { to: 'works', path: '/', interface: 'VFS', member: 'Exists' }, [candidate]);
      if (!exists) return candidate;
    } catch { return candidate; }
  }
  return path;
}

function _flashBanner(msg, kind) {
  const el = document.createElement('div');
  el.style.cssText = 'padding: 8px 16px; font-size: 12px; '
    + (kind === 'error' ? 'background: #3a1a1a; color: #ffaaaa;' : 'background: #1a2a1a; color: #aaffaa;')
    + ' position: sticky; top: 0; z-index: 10;';
  el.textContent = msg;
  root.prepend(el);
  setTimeout(() => el.remove(), 3000);
}
</script>
</body>
</html>
