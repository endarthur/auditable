<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Reader</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--au-surface); color: var(--au-fg);
    font: 13px/1.6 'Barlow', system-ui, sans-serif;
    display: flex; flex-direction: column;
    /* Reading typography knobs — set by the settings popover, persisted. */
    --reader-font: 'Barlow', Georgia, serif;
    --reader-size: 18px;
    --reader-width: 680px;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--au-border) var(--au-surface-deep); }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--au-border); border-radius: 4px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--au-rule, var(--au-fg-soft)); }
  *::-webkit-scrollbar-corner { background: transparent; }

  header {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-bottom: 1px solid var(--au-border); background: var(--au-surface-raised);
    position: relative; z-index: 30;
  }
  header .title { font-weight: 600; color: var(--au-fg);
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 12px;
    letter-spacing: 1px; white-space: nowrap; }
  header .crumb { color: var(--au-fg-soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header button {
    background: none; border: 1px solid var(--au-border); border-radius: 3px;
    color: var(--au-fg); cursor: pointer; padding: 2px 9px; font: inherit; line-height: 1.4;
  }
  header button:hover:not(:disabled) { background: var(--au-surface-bright); }
  header button:disabled { opacity: 0.4; cursor: default; }

  /* Reading-settings popover. */
  .settings-pop {
    position: absolute; top: 38px; right: 10px; z-index: 40;
    background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    padding: 12px 14px; width: 230px; display: none;
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 11px;
  }
  .settings-pop.open { display: block; }
  .settings-pop .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .settings-pop .row:first-child { margin-top: 0; }
  .settings-pop label { color: var(--au-fg-muted); }
  .settings-pop .seg { display: flex; border: 1px solid var(--au-border); border-radius: 4px; overflow: hidden; }
  .settings-pop .seg button { border: none; border-radius: 0; padding: 3px 8px; background: var(--au-surface); }
  .settings-pop .seg button.active { background: var(--au-action); color: #fff; }
  .settings-pop input[type=range] { width: 110px; accent-color: var(--au-action); }

  .body { flex: 1; display: flex; min-height: 0; position: relative; }
  .backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 10;
  }
  body.nav-open .backdrop { opacity: 1; pointer-events: auto; }
  .contents {
    position: absolute; top: 0; left: 0; bottom: 0; width: 300px; overflow: auto;
    border-right: 1px solid var(--au-border); background: var(--au-surface-raised);
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 11px;
    padding: 10px 0; transform: translateX(-100%); transition: transform 0.18s ease-out; z-index: 20;
  }
  body.nav-open .contents { transform: translateX(0); }
  .contents .book-meta { padding: 4px 16px 12px; border-bottom: 1px solid var(--au-border); margin-bottom: 8px; }
  .contents .book-title { color: var(--au-fg); font-size: 13px; font-weight: 600; }
  .contents .book-author { color: var(--au-fg-soft); font-size: 11px; margin-top: 2px; }
  .contents .chap {
    padding: 6px 16px; cursor: pointer; color: var(--au-fg-muted);
    border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contents .chap:hover { background: var(--au-surface-bright); color: var(--au-fg); }
  .contents .chap.active { color: var(--au-fg); border-left-color: var(--au-action); background: var(--au-surface); }

  .content {
    flex: 1; overflow: auto; padding: 40px 48px 80px;
  }
  .content .page {
    max-width: var(--reader-width); margin: 0 auto;
    font-family: var(--reader-font); font-size: var(--reader-size); line-height: 1.7;
    color: var(--au-fg);
  }
  body.font-sans .content .page { --reader-font: 'Barlow', system-ui, sans-serif; }
  body.font-serif .content .page { --reader-font: Georgia, 'Times New Roman', serif; }
  body.font-mono .content .page { --reader-font: ui-monospace, 'Space Mono', monospace; }
  .content h1, .content h2, .content h3, .content h4 { color: var(--au-fg); line-height: 1.25; }
  .content h1 { font-size: 1.6em; margin: 0 0 0.6em; color: var(--au-action); }
  .content h2 { font-size: 1.3em; margin: 1.4em 0 0.5em; border-bottom: 1px solid var(--au-border); padding-bottom: 0.2em; }
  .content h3 { font-size: 1.12em; margin: 1.2em 0 0.4em; }
  .content p { margin: 0 0 1em; }
  .content code { font-family: ui-monospace, 'Space Mono', monospace; background: var(--au-surface-bright); padding: 1px 5px; border-radius: 2px; font-size: 0.85em; }
  .content pre { background: var(--au-surface-raised); border: 1px solid var(--au-border); border-radius: 3px; padding: 10px 14px; overflow-x: auto; font-size: 0.8em; line-height: 1.5; position: relative; }
  .content pre code { background: none; padding: 0; }
  /* Copy button — empty (icon via ::before) so it contributes no text to the
     page's textContent, keeping highlight char-offset anchoring intact. */
  .code-copy { position: absolute; top: 6px; right: 6px; width: 26px; height: 22px; padding: 0; border: 1px solid var(--au-border); border-radius: 3px; background: var(--au-surface-bright); color: var(--au-text-muted); cursor: pointer; opacity: 0; transition: opacity .12s, color .12s, border-color .12s; font-size: 12px; line-height: 1; }
  .content pre:hover .code-copy, .code-copy:focus-visible { opacity: 1; }
  .code-copy::before { content: '⧉'; }
  .code-copy:hover { color: var(--au-action); border-color: var(--au-action); }
  .code-copy.copied { color: var(--au-go); border-color: var(--au-go); opacity: 1; }
  .code-copy.copied::before { content: '✓'; }
  .code-copy.failed { color: var(--au-fault); border-color: var(--au-fault); opacity: 1; }
  .code-copy.failed::before { content: '✕'; }
  .content a { color: var(--au-info); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content blockquote { border-left: 3px solid var(--au-border); padding-left: 14px; color: var(--au-fg-muted); margin: 1em 0; }
  .content ul, .content ol { padding-left: 1.4em; margin: 0 0 1em; }
  .content img { max-width: 100%; height: auto; }
  .content table { border-collapse: collapse; margin: 1em 0; font-size: 0.85em; }
  .content th, .content td { border: 1px solid var(--au-border); padding: 4px 10px; text-align: left; }
  .content th { background: var(--au-surface-raised); }
  .content h1, .content h2, .content h3 { scroll-margin-top: 20px; position: relative; }
  .content h1 .anchor-link, .content h2 .anchor-link, .content h3 .anchor-link {
    position: absolute; left: -20px; top: 0; bottom: 0; display: flex; align-items: center;
    color: var(--au-border); text-decoration: none; opacity: 0; transition: opacity 0.1s; padding: 0 5px; font-size: 0.7em;
  }
  .content h1:hover .anchor-link, .content h2:hover .anchor-link, .content h3:hover .anchor-link { opacity: 1; }
  .content .anchor-link:hover { color: var(--au-action) !important; }

  /* Footer chapter nav. */
  .chap-foot { max-width: var(--reader-width); margin: 40px auto 0; display: flex; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--au-border); padding-top: 16px; font-family: ui-monospace,'Space Mono',monospace; font-size: 12px; }
  .chap-foot a { color: var(--au-info); cursor: pointer; text-decoration: none; }
  .chap-foot a:hover { text-decoration: underline; }
  .chap-foot .sp { flex: 1; }

  /* Right-side TOC (within chapter). */
  .toc {
    position: fixed; right: 14px; top: 52px; max-height: calc(100vh - 80px); width: 190px;
    padding: 8px 0 8px 12px; overflow: auto;
    font: 11px/1.5 ui-monospace, 'Space Mono', monospace; color: var(--au-fg-soft);
    border-left: 1px solid var(--au-border); z-index: 5;
  }
  .toc.empty-toc { display: none; }
  .toc h4 { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--au-action); margin: 0 0 6px; }
  .toc a { display: block; padding: 2px 0 2px 8px; color: var(--au-fg-muted); text-decoration: none; border-left: 2px solid transparent; margin-left: -10px; }
  .toc a:hover { color: var(--au-fg); }
  .toc a.active { color: var(--au-fg); border-left-color: var(--au-action); }
  .toc a.lvl3 { padding-left: 18px; font-size: 10.5px; }
  @media (max-width: 1180px) { .toc { display: none; } }

  /* Syntax tokens (docview.highlightCode) — mapped to semantic accents. */
  .content .tok-comment { color: var(--au-fg-soft); font-style: italic; }
  .content .tok-string  { color: var(--au-success); }
  .content .tok-number  { color: var(--au-warn); }
  .content .tok-keyword { color: var(--au-info); }
  .content .tok-builtin { color: var(--au-selected); }
  .content .tok-tag     { color: var(--au-error); }
  .content .tok-attr    { color: var(--au-warn); }
  .content .tok-punct   { color: var(--au-fg-muted); }

  /* PDF backend — page canvases stacked in the scroll column, with a
     transparent selectable text layer (PDF.js) positioned over each. */
  .content .pdf-page { margin: 0 auto 14px; }
  .content .pdf-page canvas { display: block; width: 100%; height: 100%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.4); border-radius: 2px; }
  .content .pdf-textlayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; opacity: 1; text-align: initial; }
  .content .pdf-textlayer span, .content .pdf-textlayer br { color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0 0; }
  .content .pdf-page ::selection { background: var(--au-action-soft, rgba(232,115,31,0.4)); }

  .err { color: var(--au-error); padding: 24px; }
  .empty { color: var(--au-fg-soft); padding: 24px; font-style: italic; }

  /* Ctrl+K search overlay (search within the open book). */
  .search-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: flex-start; justify-content: center; padding-top: 60px; z-index: 100; }
  .search-overlay.open { display: flex; }
  .search-box { width: min(640px, 90vw); background: var(--au-surface-raised); border: 1px solid var(--au-border); border-radius: 6px; box-shadow: 0 12px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; max-height: 70vh; }
  .search-input { background: none; border: none; outline: none; color: var(--au-fg); font: 14px/1.4 ui-monospace, 'Space Mono', monospace; padding: 14px 16px; border-bottom: 1px solid var(--au-border); }
  .search-results { overflow: auto; padding: 4px 0; }
  .search-results .empty { padding: 12px 16px; }
  .search-hit { padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent; }
  .search-hit:hover, .search-hit.active { background: var(--au-surface-bright); border-left-color: var(--au-action); }
  .search-hit .crumb { font-size: 11px; color: var(--au-fg-soft); font-family: ui-monospace, 'Space Mono', monospace; margin-bottom: 2px; }
  .search-hit .h { color: var(--au-fg); font-size: 13px; font-weight: 500; }
  .search-hit .snippet { color: var(--au-fg-muted); font-size: 12px; margin-top: 2px; font-family: ui-monospace, 'Space Mono', monospace; }
  .search-hit .snippet mark { background: var(--au-action-soft); color: var(--au-fg); padding: 0 2px; border-radius: 2px; }

  /* Highlights — translucent so text stays readable on dark or light. */
  .content .hl { border-radius: 2px; cursor: pointer; }
  .content .hl.c-yellow { background: rgba(232, 193, 76, 0.34); }
  .content .hl.c-green  { background: rgba(126, 180, 90, 0.34); }
  .content .hl.c-blue   { background: rgba(90, 140, 210, 0.36); }
  .content .hl.has-note { box-shadow: inset 0 -2px 0 var(--au-action); }

  /* Colour swatch buttons (shared by the toolbar + note popover). */
  .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); cursor: pointer; padding: 0; }
  .sw.c-yellow { background: rgb(232, 193, 76); }
  .sw.c-green  { background: rgb(126, 180, 90); }
  .sw.c-blue   { background: rgb(90, 140, 210); }
  .sw.active { outline: 2px solid var(--au-fg); outline-offset: 1px; }

  /* Floating selection toolbar. */
  .sel-toolbar {
    position: fixed; z-index: 60; display: none; align-items: center; gap: 7px;
    background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 6px 9px;
  }
  .sel-toolbar.open { display: flex; }
  .sel-toolbar .note-btn {
    background: none; border: 1px solid var(--au-border); border-radius: 4px;
    color: var(--au-fg); cursor: pointer; font: 11px ui-monospace, 'Space Mono', monospace; padding: 3px 8px;
  }
  .sel-toolbar .note-btn:hover { background: var(--au-surface-bright); }

  /* Note popover. */
  .note-pop {
    position: fixed; z-index: 60; display: none; width: 250px;
    background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 8px;
  }
  .note-pop.open { display: block; }
  .note-pop textarea {
    width: 100%; box-sizing: border-box; min-height: 70px; resize: vertical;
    background: var(--au-surface); color: var(--au-fg); border: 1px solid var(--au-border);
    border-radius: 4px; padding: 6px 8px; font: 12px/1.5 'Barlow', system-ui, sans-serif;
  }
  .note-pop .note-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .note-pop .note-swatches { display: flex; gap: 6px; }
  .note-pop .sp { flex: 1; }
  .note-pop button.danger {
    background: none; border: 1px solid var(--au-border); border-radius: 4px;
    color: var(--au-error); cursor: pointer; font: 11px ui-monospace, 'Space Mono', monospace; padding: 3px 8px;
  }
  .note-pop button.danger:hover { background: var(--au-surface-bright); }

  /* Marks section in the contents sidebar. */
  .contents h3 {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--au-action); margin: 14px 16px 4px; font-weight: 600;
  }
  .contents .mark {
    display: flex; align-items: flex-start; gap: 7px; padding: 5px 16px; cursor: pointer;
    color: var(--au-fg-muted); border-left: 2px solid transparent;
  }
  .contents .mark:hover { background: var(--au-surface-bright); color: var(--au-fg); }
  .contents .mark .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; }
  .contents .mark .dot.c-yellow { background: rgb(232,193,76); }
  .contents .mark .dot.c-green { background: rgb(126,180,90); }
  .contents .mark .dot.c-blue { background: rgb(90,140,210); }
  .contents .mark .dot.bm { background: var(--au-action); border-radius: 1px; }
  .contents .mark .txt { flex: 1; overflow: hidden; }
  .contents .mark .q { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contents .mark .n { display: block; color: var(--au-fg-soft); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contents .mark .del { flex: none; color: var(--au-fg-soft); opacity: 0; padding: 0 2px; }
  .contents .mark:hover .del { opacity: 1; }
  .contents .mark .del:hover { color: var(--au-error); }
  .contents .marks-empty { padding: 4px 16px; color: var(--au-fg-soft); font-style: italic; font-size: 10px; }
</style>
</head>
<body class="font-serif">
<header>
  <button id="navToggle" title="Contents (Ctrl+\)">☰</button>
  <span class="title" id="bookTitle">Reader</span>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <button id="prevBtn" title="Previous chapter (←)">‹ Prev</button>
  <button id="nextBtn" title="Next chapter (→)">Next ›</button>
  <button id="searchBtn" title="Search this book (Ctrl+K)">⌕</button>
  <button id="markBtn" title="Bookmark this spot">🔖</button>
  <button id="setBtn" title="Reading settings">Aa</button>
  <div class="settings-pop" id="settingsPop">
    <div class="row">
      <label>Typeface</label>
      <div class="seg" id="fontSeg">
        <button data-font="serif">Serif</button>
        <button data-font="sans">Sans</button>
        <button data-font="mono">Mono</button>
      </div>
    </div>
    <div class="row">
      <label>Size</label>
      <input type="range" id="sizeRange" min="14" max="26" step="1">
    </div>
    <div class="row">
      <label>Width</label>
      <input type="range" id="widthRange" min="520" max="980" step="20">
    </div>
  </div>
</header>
<div class="body">
  <div class="backdrop" id="backdrop"></div>
  <nav class="contents" id="contents"></nav>
  <div class="content" id="content"><div class="empty">Loading book…</div></div>
  <aside class="toc empty-toc" id="toc"></aside>
</div>
<!-- Floating selection toolbar — appears over a text selection. -->
<div class="sel-toolbar" id="selToolbar">
  <button class="sw c-yellow" data-color="yellow" title="Highlight"></button>
  <button class="sw c-green" data-color="green" title="Highlight"></button>
  <button class="sw c-blue" data-color="blue" title="Highlight"></button>
  <button class="note-btn" id="selNote" title="Highlight + add note">✎ Note</button>
</div>
<!-- Note popover — view/edit/delete a highlight's annotation. -->
<div class="note-pop" id="notePop">
  <textarea id="noteText" placeholder="Add a note…" spellcheck="false"></textarea>
  <div class="note-row">
    <div class="note-swatches" id="noteSwatches">
      <button class="sw c-yellow" data-color="yellow"></button>
      <button class="sw c-green" data-color="green"></button>
      <button class="sw c-blue" data-color="blue"></button>
    </div>
    <span class="sp"></span>
    <button id="noteDelete" class="danger">Delete</button>
  </div>
</div>
<!-- Ctrl+K search-within-book overlay. -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input class="search-input" id="searchInput" type="text" placeholder="Search this book…  (Esc to close)" spellcheck="false" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';

/* @theme-init */
import { renderMd, slugify } from '../../src/js/markdown.js';
import { highlightCode, scrollToAnchor, decorateHeadings, buildToc, rewireLinks, makeStatePersister, splitByHeadings } from '../../ext/docview/index.js';
import { Librarian } from '../../ext/librarian/index.js';
import { renderToString } from '../../ext/katex/index.js';
import { createReader } from '../../ext/reader-core/index.js';

// Thin chrome over @gcu/reader-core: this surface owns the element layout, the
// contents/marks/search list rendering, the overlays, and the control wiring;
// the core owns the book model, render pipeline, math, anchoring, search and
// reading-state. The two talk through the core's API + on.* hooks.
const $ = (id) => document.getElementById(id);
let bus = null;
let reader = null;
let persister = null;
let _toc = { items: [], update() {} };
let activeMarkId = null;   // highlight whose note popover is open
let hitIdx = 0;

function applySettings() {
  const s = reader.settings;
  document.body.classList.remove('font-serif', 'font-sans', 'font-mono');
  document.body.classList.add('font-' + s.font);
  document.body.style.setProperty('--reader-size', s.size + 'px');
  document.body.style.setProperty('--reader-width', s.width + 'px');
  for (const b of document.querySelectorAll('#fontSeg button')) b.classList.toggle('active', b.dataset.font === s.font);
  $('sizeRange').value = s.size;
  $('widthRange').value = s.width;
}
function setNavOpen(open) { document.body.classList.toggle('nav-open', open); }
function updateButtons() {
  $('prevBtn').disabled = reader.index <= 0;
  $('nextBtn').disabled = reader.index >= reader.chapters.length - 1;
}

// ── contents sidebar (chapter spine + marks) ────────────────────────
function renderContents() {
  const el = $('contents'); el.innerHTML = '';
  const book = reader.book;
  const meta = document.createElement('div'); meta.className = 'book-meta';
  const t = document.createElement('div'); t.className = 'book-title'; t.textContent = book.title || reader.slug;
  meta.appendChild(t);
  if (book.author) { const a = document.createElement('div'); a.className = 'book-author'; a.textContent = book.author; meta.appendChild(a); }
  el.appendChild(meta);
  reader.chapters.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'chap' + (i === reader.index ? ' active' : '');
    d.textContent = c.title || ('Chapter ' + (i + 1));
    d.dataset.idx = i;
    d.addEventListener('click', () => { reader.loadChapter(i); setNavOpen(false); });
    el.appendChild(d);
  });
  renderMarks(el);
}
function renderMarks(el) {
  const h3 = document.createElement('h3'); h3.textContent = 'Marks'; el.appendChild(h3);
  const { bookmarks, highlights } = reader.marks;
  const all = bookmarks.map((b) => ({ ...b, kind: 'bm' })).concat(highlights.map((h) => ({ ...h, kind: 'hl' })));
  if (!all.length) {
    const e = document.createElement('div'); e.className = 'marks-empty';
    e.textContent = 'No marks yet — select text to highlight, or 🔖 to bookmark.';
    el.appendChild(e); return;
  }
  all.sort((a, b) => (reader.chapIndexOf(a.chapterId) - reader.chapIndexOf(b.chapterId))
    || ((a.kind === 'bm' ? 0 : 1) - (b.kind === 'bm' ? 0 : 1))
    || ((a.start || 0) - (b.start || 0)));
  for (const m of all) {
    const row = document.createElement('div'); row.className = 'mark';
    const dot = document.createElement('span'); dot.className = 'dot ' + (m.kind === 'bm' ? 'bm' : 'c-' + (m.color || 'yellow'));
    const txt = document.createElement('span'); txt.className = 'txt';
    const q = document.createElement('span'); q.className = 'q';
    q.textContent = m.kind === 'bm' ? (m.label || 'Bookmark') : (m.quote || '(highlight)');
    txt.appendChild(q);
    if (m.kind === 'hl' && m.note && m.note.trim()) { const n = document.createElement('span'); n.className = 'n'; n.textContent = '✎ ' + m.note.trim(); txt.appendChild(n); }
    const del = document.createElement('span'); del.className = 'del'; del.textContent = '×'; del.title = 'Remove';
    del.addEventListener('click', (e) => { e.stopPropagation(); reader.removeMark(m.kind, m.id); });
    row.append(dot, txt, del);
    row.addEventListener('click', () => { reader.jumpToMark(m); setNavOpen(false); });
    el.appendChild(row);
  }
}

// ── note popover ────────────────────────────────────────────────────
function openNote(id, anchorEl) {
  const h = reader.getMark(id); if (!h) return;
  activeMarkId = id;
  const pop = $('notePop');
  $('noteText').value = h.note || '';
  for (const b of pop.querySelectorAll('.sw')) b.classList.toggle('active', b.dataset.color === h.color);
  const r = anchorEl.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 266)) + 'px';
  pop.style.top = Math.min(r.bottom + 6, window.innerHeight - 140) + 'px';
  pop.classList.add('open');
  $('noteText').focus();
}
function closeNote() { $('notePop').classList.remove('open'); activeMarkId = null; }

// ── selection toolbar ───────────────────────────────────────────────
function showSelToolbar(rect) {
  const tb = $('selToolbar'); tb.classList.add('open');
  const w = tb.offsetWidth || 170;
  tb.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, window.innerWidth - w - 8)) + 'px';
  tb.style.top = Math.max(8, rect.top - 44) + 'px';
}
function hideSelToolbar() { $('selToolbar').classList.remove('open'); }

// ── search overlay ──────────────────────────────────────────────────
async function openSearch() {
  $('searchOverlay').classList.add('open');
  const inp = $('searchInput'); inp.value = ''; inp.focus();
  $('searchResults').innerHTML = '<div class="empty">indexing…</div>';
  await reader.buildIndex();
  $('searchResults').innerHTML = ''; hitIdx = 0;
}
function closeSearch() { $('searchOverlay').classList.remove('open'); }
function runSearch() {
  const q = $('searchInput').value; const box = $('searchResults');
  if (!q.trim()) { box.innerHTML = ''; return; }
  const hits = reader.search(q);
  hitIdx = 0; box.innerHTML = '';
  if (!hits.length) { box.innerHTML = '<div class="empty">no matches.</div>'; return; }
  hits.forEach((h, i) => {
    const row = document.createElement('div'); row.className = 'search-hit' + (i === 0 ? ' active' : '');
    const crumb = document.createElement('div'); crumb.className = 'crumb'; crumb.textContent = h.doc.fileTitle || '';
    const head = document.createElement('div'); head.className = 'h'; head.textContent = h.doc.heading || h.doc.fileTitle || '';
    row.append(crumb, head);
    if (h.snippet) { const sn = document.createElement('div'); sn.className = 'snippet'; sn.innerHTML = h.snippet; row.appendChild(sn); }
    row.addEventListener('click', () => activateHit(h));
    row.addEventListener('mouseenter', () => { hitIdx = i; for (const r of box.querySelectorAll('.search-hit')) r.classList.remove('active'); row.classList.add('active'); });
    box.appendChild(row);
  });
}
async function activateHit(hit) { closeSearch(); await reader.loadChapter(hit.doc.chapterIndex, hit.doc.anchor || null); }

// ── boot ────────────────────────────────────────────────────────────
window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent) return;
  if (!ev.data || ev.data.type !== 'abus:welcome') return;

  try { bus = await connect(ev.data.port, { client: 'reader-surface' }); }
  catch (e) { document.body.innerHTML = '<div class="err">connect failed: ' + (e.message || e) + '</div>'; return; }
  try { await bus.claim('reader-' + (ev.data.tab && ev.data.tab.id || 'unknown')); } catch {}
  if (typeof installThemeSubscription === 'function') installThemeSubscription(bus);
  bus.expose('/', {
    Surface: { methods: { Flush: () => {}, CanClose: () => true, Relocated: () => {} }, signals: ['DirtyChanged', 'TitleChanged', 'Ready'] },
  });

  const tabPath = (ev.data.tab && ev.data.tab.path) || '/';
  const manifestPath = tabPath.endsWith('.json') ? tabPath : (tabPath.replace(/\/$/, '') + '/book.json');

  const vfsRead = (p) => bus.call({ to: 'works', path: '/', interface: 'VFS', member: 'Read' }, [p, 'utf8']);
  const vfsReadBytes = (p) => bus.call({ to: 'works', path: '/', interface: 'VFS', member: 'Read' }, [p]);
  const ensurePersister = () => { if (!persister) persister = makeStatePersister(bus, '/home/.books/state/' + reader.slug + '.json'); return persister; };
  // PDF engine — works-all only (vendored @gcu/pdfjs lives at /usr/lib there;
  // absent in base works → null → the pdf backend degrades). Loaded as a classic
  // script via indirect eval (cross-blob ESM imports are blocked on file://),
  // with a classic worker spun from the embedded worker source.
  let _pdfEngine;
  async function loadPdfEngine() {
    if (_pdfEngine !== undefined) return _pdfEngine;
    try {
      const src = await vfsRead('/usr/lib/@gcu/pdfjs/source');
      (0, eval)(src);
      const lib = globalThis['pdfjs-dist/build/pdf'];
      if (lib && globalThis.__pdfjsWorkerSrc && !lib.GlobalWorkerOptions.workerPort) {
        const blob = new Blob([globalThis.__pdfjsWorkerSrc], { type: 'text/javascript' });
        lib.GlobalWorkerOptions.workerPort = new Worker(URL.createObjectURL(blob));
      }
      _pdfEngine = lib || null;
    } catch { _pdfEngine = null; }
    return _pdfEngine;
  }

  reader = createReader({
    contentEl: $('content'),
    readFile: vfsRead,
    readBytes: vfsReadBytes,
    loadPdfEngine,
    loadState: () => ensurePersister().read(),
    saveState: (s) => ensurePersister().schedule(() => s),
    libs: { renderMd, slugify, decorateHeadings, highlightCode, rewireLinks, scrollToAnchor, splitByHeadings, Librarian, renderToString },
    on: {
      ready: (book) => { $('bookTitle').textContent = book.title || reader.slug; applySettings(); },
      marksChange: () => renderContents(),
      chapterChange: ({ index, chapter, page }) => {
        $('crumb').textContent = chapter.title || '';
        for (const d of document.querySelectorAll('.contents .chap')) {
          const onn = +d.dataset.idx === index; d.classList.toggle('active', onn);
          if (onn) d.scrollIntoView({ block: 'nearest' });
        }
        _toc = page ? buildToc(page, $('toc')) : { items: [], update() {} };
        closeNote(); hideSelToolbar(); updateButtons();
      },
      markClick: (id, el) => openNote(id, el),
      settingsChange: () => applySettings(),
    },
  });

  try { await reader.open(manifestPath); }
  catch (e) { document.body.innerHTML = '<div class="err">no book.json at ' + manifestPath + ' — ' + (e.message || e) + '</div>'; return; }

  // ── wire chrome controls ──
  $('setBtn').addEventListener('click', () => $('settingsPop').classList.toggle('open'));
  document.addEventListener('click', (e) => { if (!$('settingsPop').contains(e.target) && e.target !== $('setBtn')) $('settingsPop').classList.remove('open'); });
  for (const b of document.querySelectorAll('#fontSeg button')) b.addEventListener('click', () => reader.setSettings({ font: b.dataset.font }));
  $('sizeRange').addEventListener('input', () => reader.setSettings({ size: +$('sizeRange').value }));
  $('widthRange').addEventListener('input', () => reader.setSettings({ width: +$('widthRange').value }));

  $('navToggle').addEventListener('click', () => setNavOpen(!document.body.classList.contains('nav-open')));
  $('backdrop').addEventListener('click', () => setNavOpen(false));
  $('prevBtn').addEventListener('click', () => reader.prev());
  $('nextBtn').addEventListener('click', () => reader.next());
  $('markBtn').addEventListener('click', () => reader.addBookmark());
  $('searchBtn').addEventListener('click', openSearch);
  $('searchInput').addEventListener('input', runSearch);
  $('searchOverlay').addEventListener('click', (e) => { if (e.target.id === 'searchOverlay') closeSearch(); });

  // selection → highlight toolbar
  $('content').addEventListener('mouseup', () => setTimeout(() => {
    // PDF text is selectable/copyable, but the offset-anchored highlight system
    // is reflowable-only — don't offer the highlight toolbar on pdf chapters.
    const ch = reader.chapters[reader.index];
    if (ch && ch.format === 'pdf') { hideSelToolbar(); return; }
    const sel = reader.selectionInfo();
    if (sel) showSelToolbar(sel.rect); else hideSelToolbar();
  }, 0));
  for (const sw of $('selToolbar').querySelectorAll('.sw'))
    sw.addEventListener('mousedown', (e) => { e.preventDefault(); reader.addHighlightFromSelection(sw.dataset.color); });
  $('selNote').addEventListener('mousedown', (e) => {
    e.preventDefault();
    const h = reader.addHighlightFromSelection('yellow');
    if (h) { const mk = reader.currentPage() && reader.currentPage().querySelector('mark.hl[data-id="' + h.id + '"]'); if (mk) openNote(h.id, mk); }
  });

  // note popover edits
  $('noteText').addEventListener('input', () => { if (activeMarkId) reader.setNote(activeMarkId, $('noteText').value); });
  for (const sw of $('noteSwatches').querySelectorAll('.sw'))
    sw.addEventListener('click', () => {
      if (!activeMarkId) return;
      reader.setColor(activeMarkId, sw.dataset.color);
      for (const s of $('noteSwatches').querySelectorAll('.sw')) s.classList.toggle('active', s === sw);
    });
  $('noteDelete').addEventListener('click', () => { if (activeMarkId) { reader.removeMark('hl', activeMarkId); closeNote(); } });
  document.addEventListener('mousedown', (e) => {
    if ($('notePop').classList.contains('open') && !$('notePop').contains(e.target) && !(e.target.closest && e.target.closest('mark.hl'))) closeNote();
  });

  // scroll → TOC active + persist
  let raf = 0;
  $('content').addEventListener('scroll', () => {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; _toc.update(); });
    hideSelToolbar(); reader.persist();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'k' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); return; }
    if ($('searchOverlay').classList.contains('open')) {
      const rows = $('searchResults').querySelectorAll('.search-hit');
      if (e.key === 'Escape') { closeSearch(); return; }
      if (e.key === 'ArrowDown' && rows.length) { e.preventDefault(); hitIdx = Math.min(hitIdx + 1, rows.length - 1); rows.forEach((r) => r.classList.remove('active')); rows[hitIdx].classList.add('active'); rows[hitIdx].scrollIntoView({ block: 'nearest' }); return; }
      if (e.key === 'ArrowUp' && rows.length) { e.preventDefault(); hitIdx = Math.max(hitIdx - 1, 0); rows.forEach((r) => r.classList.remove('active')); rows[hitIdx].classList.add('active'); rows[hitIdx].scrollIntoView({ block: 'nearest' }); return; }
      if (e.key === 'Enter' && rows[hitIdx]) { e.preventDefault(); rows[hitIdx].click(); return; }
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (typing) return;
    if (e.key === '\\' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); setNavOpen(!document.body.classList.contains('nav-open')); }
    else if (e.key === 'ArrowLeft') reader.prev();
    else if (e.key === 'ArrowRight') reader.next();
    else if (e.key === 'Escape' && document.body.classList.contains('nav-open')) setNavOpen(false);
  });

  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' }, [reader.book.title || reader.slug]);
  bus.signal({ path: '/', interface: 'Surface', member: 'Ready' }, []);
});
</script>
</body>
</html>
