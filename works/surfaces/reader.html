<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Reader</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--au-surface); color: var(--au-fg);
    font: 13px/1.6 'Barlow', system-ui, sans-serif;
    display: flex; flex-direction: column;
    /* Reading typography knobs — set by the settings popover, persisted. */
    --reader-font: 'Barlow', Georgia, serif;
    --reader-size: 18px;
    --reader-width: 680px;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--au-border) var(--au-surface-deep); }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--au-border); border-radius: 4px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--au-rule, var(--au-fg-soft)); }
  *::-webkit-scrollbar-corner { background: transparent; }

  header {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-bottom: 1px solid var(--au-border); background: var(--au-surface-raised);
    position: relative; z-index: 30;
  }
  header .title { font-weight: 600; color: var(--au-fg);
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 12px;
    letter-spacing: 1px; white-space: nowrap; }
  header .crumb { color: var(--au-fg-soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header button {
    background: none; border: 1px solid var(--au-border); border-radius: 3px;
    color: var(--au-fg); cursor: pointer; padding: 2px 9px; font: inherit; line-height: 1.4;
  }
  header button:hover:not(:disabled) { background: var(--au-surface-bright); }
  header button:disabled { opacity: 0.4; cursor: default; }

  /* Reading-settings popover. */
  .settings-pop {
    position: absolute; top: 38px; right: 10px; z-index: 40;
    background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 6px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    padding: 12px 14px; width: 230px; display: none;
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 11px;
  }
  .settings-pop.open { display: block; }
  .settings-pop .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .settings-pop .row:first-child { margin-top: 0; }
  .settings-pop label { color: var(--au-fg-muted); }
  .settings-pop .seg { display: flex; border: 1px solid var(--au-border); border-radius: 4px; overflow: hidden; }
  .settings-pop .seg button { border: none; border-radius: 0; padding: 3px 8px; background: var(--au-surface); }
  .settings-pop .seg button.active { background: var(--au-action); color: #fff; }
  .settings-pop input[type=range] { width: 110px; accent-color: var(--au-action); }

  .body { flex: 1; display: flex; min-height: 0; position: relative; }
  .backdrop {
    position: absolute; inset: 0; background: rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 10;
  }
  body.nav-open .backdrop { opacity: 1; pointer-events: auto; }
  .contents {
    position: absolute; top: 0; left: 0; bottom: 0; width: 300px; overflow: auto;
    border-right: 1px solid var(--au-border); background: var(--au-surface-raised);
    font-family: ui-monospace, 'Space Mono', monospace; font-size: 11px;
    padding: 10px 0; transform: translateX(-100%); transition: transform 0.18s ease-out; z-index: 20;
  }
  body.nav-open .contents { transform: translateX(0); }
  .contents .book-meta { padding: 4px 16px 12px; border-bottom: 1px solid var(--au-border); margin-bottom: 8px; }
  .contents .book-title { color: var(--au-fg); font-size: 13px; font-weight: 600; }
  .contents .book-author { color: var(--au-fg-soft); font-size: 11px; margin-top: 2px; }
  .contents .chap {
    padding: 6px 16px; cursor: pointer; color: var(--au-fg-muted);
    border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .contents .chap:hover { background: var(--au-surface-bright); color: var(--au-fg); }
  .contents .chap.active { color: var(--au-fg); border-left-color: var(--au-action); background: var(--au-surface); }

  .content {
    flex: 1; overflow: auto; padding: 40px 48px 80px;
  }
  .content .page {
    max-width: var(--reader-width); margin: 0 auto;
    font-family: var(--reader-font); font-size: var(--reader-size); line-height: 1.7;
    color: var(--au-fg);
  }
  body.font-sans .content .page { --reader-font: 'Barlow', system-ui, sans-serif; }
  body.font-serif .content .page { --reader-font: Georgia, 'Times New Roman', serif; }
  body.font-mono .content .page { --reader-font: ui-monospace, 'Space Mono', monospace; }
  .content h1, .content h2, .content h3, .content h4 { color: var(--au-fg); line-height: 1.25; }
  .content h1 { font-size: 1.6em; margin: 0 0 0.6em; color: var(--au-action); }
  .content h2 { font-size: 1.3em; margin: 1.4em 0 0.5em; border-bottom: 1px solid var(--au-border); padding-bottom: 0.2em; }
  .content h3 { font-size: 1.12em; margin: 1.2em 0 0.4em; }
  .content p { margin: 0 0 1em; }
  .content code { font-family: ui-monospace, 'Space Mono', monospace; background: var(--au-surface-bright); padding: 1px 5px; border-radius: 2px; font-size: 0.85em; }
  .content pre { background: var(--au-surface-raised); border: 1px solid var(--au-border); border-radius: 3px; padding: 10px 14px; overflow-x: auto; font-size: 0.8em; line-height: 1.5; }
  .content pre code { background: none; padding: 0; }
  .content a { color: var(--au-info); text-decoration: none; }
  .content a:hover { text-decoration: underline; }
  .content blockquote { border-left: 3px solid var(--au-border); padding-left: 14px; color: var(--au-fg-muted); margin: 1em 0; }
  .content ul, .content ol { padding-left: 1.4em; margin: 0 0 1em; }
  .content img { max-width: 100%; height: auto; }
  .content table { border-collapse: collapse; margin: 1em 0; font-size: 0.85em; }
  .content th, .content td { border: 1px solid var(--au-border); padding: 4px 10px; text-align: left; }
  .content th { background: var(--au-surface-raised); }
  .content h1, .content h2, .content h3 { scroll-margin-top: 20px; position: relative; }
  .content h1 .anchor-link, .content h2 .anchor-link, .content h3 .anchor-link {
    position: absolute; left: -20px; top: 0; bottom: 0; display: flex; align-items: center;
    color: var(--au-border); text-decoration: none; opacity: 0; transition: opacity 0.1s; padding: 0 5px; font-size: 0.7em;
  }
  .content h1:hover .anchor-link, .content h2:hover .anchor-link, .content h3:hover .anchor-link { opacity: 1; }
  .content .anchor-link:hover { color: var(--au-action) !important; }

  /* Footer chapter nav. */
  .chap-foot { max-width: var(--reader-width); margin: 40px auto 0; display: flex; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--au-border); padding-top: 16px; font-family: ui-monospace,'Space Mono',monospace; font-size: 12px; }
  .chap-foot a { color: var(--au-info); cursor: pointer; text-decoration: none; }
  .chap-foot a:hover { text-decoration: underline; }
  .chap-foot .sp { flex: 1; }

  /* Right-side TOC (within chapter). */
  .toc {
    position: fixed; right: 14px; top: 52px; max-height: calc(100vh - 80px); width: 190px;
    padding: 8px 0 8px 12px; overflow: auto;
    font: 11px/1.5 ui-monospace, 'Space Mono', monospace; color: var(--au-fg-soft);
    border-left: 1px solid var(--au-border); z-index: 5;
  }
  .toc.empty-toc { display: none; }
  .toc h4 { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--au-action); margin: 0 0 6px; }
  .toc a { display: block; padding: 2px 0 2px 8px; color: var(--au-fg-muted); text-decoration: none; border-left: 2px solid transparent; margin-left: -10px; }
  .toc a:hover { color: var(--au-fg); }
  .toc a.active { color: var(--au-fg); border-left-color: var(--au-action); }
  .toc a.lvl3 { padding-left: 18px; font-size: 10.5px; }
  @media (max-width: 1180px) { .toc { display: none; } }

  /* Syntax tokens (docview.highlightCode) — mapped to semantic accents. */
  .content .tok-comment { color: var(--au-fg-soft); font-style: italic; }
  .content .tok-string  { color: var(--au-success); }
  .content .tok-number  { color: var(--au-warn); }
  .content .tok-keyword { color: var(--au-info); }
  .content .tok-builtin { color: var(--au-selected); }
  .content .tok-tag     { color: var(--au-error); }
  .content .tok-attr    { color: var(--au-warn); }
  .content .tok-punct   { color: var(--au-fg-muted); }

  .err { color: var(--au-error); padding: 24px; }
  .empty { color: var(--au-fg-soft); padding: 24px; font-style: italic; }

  /* Ctrl+K search overlay (search within the open book). */
  .search-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: flex-start; justify-content: center; padding-top: 60px; z-index: 100; }
  .search-overlay.open { display: flex; }
  .search-box { width: min(640px, 90vw); background: var(--au-surface-raised); border: 1px solid var(--au-border); border-radius: 6px; box-shadow: 0 12px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; max-height: 70vh; }
  .search-input { background: none; border: none; outline: none; color: var(--au-fg); font: 14px/1.4 ui-monospace, 'Space Mono', monospace; padding: 14px 16px; border-bottom: 1px solid var(--au-border); }
  .search-results { overflow: auto; padding: 4px 0; }
  .search-results .empty { padding: 12px 16px; }
  .search-hit { padding: 8px 16px; cursor: pointer; border-left: 2px solid transparent; }
  .search-hit:hover, .search-hit.active { background: var(--au-surface-bright); border-left-color: var(--au-action); }
  .search-hit .crumb { font-size: 11px; color: var(--au-fg-soft); font-family: ui-monospace, 'Space Mono', monospace; margin-bottom: 2px; }
  .search-hit .h { color: var(--au-fg); font-size: 13px; font-weight: 500; }
  .search-hit .snippet { color: var(--au-fg-muted); font-size: 12px; margin-top: 2px; font-family: ui-monospace, 'Space Mono', monospace; }
  .search-hit .snippet mark { background: var(--au-action-soft); color: var(--au-fg); padding: 0 2px; border-radius: 2px; }

  /* Highlights — translucent so text stays readable on dark or light. */
  .content .hl { border-radius: 2px; cursor: pointer; }
  .content .hl.c-yellow { background: rgba(232, 193, 76, 0.34); }
  .content .hl.c-green  { background: rgba(126, 180, 90, 0.34); }
  .content .hl.c-blue   { background: rgba(90, 140, 210, 0.36); }
  .content .hl.has-note { box-shadow: inset 0 -2px 0 var(--au-action); }

  /* Colour swatch buttons (shared by the toolbar + note popover). */
  .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.25); cursor: pointer; padding: 0; }
  .sw.c-yellow { background: rgb(232, 193, 76); }
  .sw.c-green  { background: rgb(126, 180, 90); }
  .sw.c-blue   { background: rgb(90, 140, 210); }
  .sw.active { outline: 2px solid var(--au-fg); outline-offset: 1px; }

  /* Floating selection toolbar. */
  .sel-toolbar {
    position: fixed; z-index: 60; display: none; align-items: center; gap: 7px;
    background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 6px 9px;
  }
  .sel-toolbar.open { display: flex; }
  .sel-toolbar .note-btn {
    background: none; border: 1px solid var(--au-border); border-radius: 4px;
    color: var(--au-fg); cursor: pointer; font: 11px ui-monospace, 'Space Mono', monospace; padding: 3px 8px;
  }
  .sel-toolbar .note-btn:hover { background: var(--au-surface-bright); }

  /* Note popover. */
  .note-pop {
    position: fixed; z-index: 60; display: none; width: 250px;
    background: var(--au-surface-raised); border: 1px solid var(--au-border);
    border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); padding: 8px;
  }
  .note-pop.open { display: block; }
  .note-pop textarea {
    width: 100%; box-sizing: border-box; min-height: 70px; resize: vertical;
    background: var(--au-surface); color: var(--au-fg); border: 1px solid var(--au-border);
    border-radius: 4px; padding: 6px 8px; font: 12px/1.5 'Barlow', system-ui, sans-serif;
  }
  .note-pop .note-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .note-pop .note-swatches { display: flex; gap: 6px; }
  .note-pop .sp { flex: 1; }
  .note-pop button.danger {
    background: none; border: 1px solid var(--au-border); border-radius: 4px;
    color: var(--au-error); cursor: pointer; font: 11px ui-monospace, 'Space Mono', monospace; padding: 3px 8px;
  }
  .note-pop button.danger:hover { background: var(--au-surface-bright); }

  /* Marks section in the contents sidebar. */
  .contents h3 {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--au-action); margin: 14px 16px 4px; font-weight: 600;
  }
  .contents .mark {
    display: flex; align-items: flex-start; gap: 7px; padding: 5px 16px; cursor: pointer;
    color: var(--au-fg-muted); border-left: 2px solid transparent;
  }
  .contents .mark:hover { background: var(--au-surface-bright); color: var(--au-fg); }
  .contents .mark .dot { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 3px; }
  .contents .mark .dot.c-yellow { background: rgb(232,193,76); }
  .contents .mark .dot.c-green { background: rgb(126,180,90); }
  .contents .mark .dot.c-blue { background: rgb(90,140,210); }
  .contents .mark .dot.bm { background: var(--au-action); border-radius: 1px; }
  .contents .mark .txt { flex: 1; overflow: hidden; }
  .contents .mark .q { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contents .mark .n { display: block; color: var(--au-fg-soft); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contents .mark .del { flex: none; color: var(--au-fg-soft); opacity: 0; padding: 0 2px; }
  .contents .mark:hover .del { opacity: 1; }
  .contents .mark .del:hover { color: var(--au-error); }
  .contents .marks-empty { padding: 4px 16px; color: var(--au-fg-soft); font-style: italic; font-size: 10px; }
</style>
</head>
<body class="font-serif">
<header>
  <button id="navToggle" title="Contents (Ctrl+\)">☰</button>
  <span class="title" id="bookTitle">Reader</span>
  <span class="crumb" id="crumb"></span>
  <span class="spacer"></span>
  <button id="prevBtn" title="Previous chapter (←)">‹ Prev</button>
  <button id="nextBtn" title="Next chapter (→)">Next ›</button>
  <button id="searchBtn" title="Search this book (Ctrl+K)">⌕</button>
  <button id="markBtn" title="Bookmark this spot">🔖</button>
  <button id="setBtn" title="Reading settings">Aa</button>
  <div class="settings-pop" id="settingsPop">
    <div class="row">
      <label>Typeface</label>
      <div class="seg" id="fontSeg">
        <button data-font="serif">Serif</button>
        <button data-font="sans">Sans</button>
        <button data-font="mono">Mono</button>
      </div>
    </div>
    <div class="row">
      <label>Size</label>
      <input type="range" id="sizeRange" min="14" max="26" step="1">
    </div>
    <div class="row">
      <label>Width</label>
      <input type="range" id="widthRange" min="520" max="980" step="20">
    </div>
  </div>
</header>
<div class="body">
  <div class="backdrop" id="backdrop"></div>
  <nav class="contents" id="contents"></nav>
  <div class="content" id="content"><div class="empty">Loading book…</div></div>
  <aside class="toc empty-toc" id="toc"></aside>
</div>
<!-- Floating selection toolbar — appears over a text selection. -->
<div class="sel-toolbar" id="selToolbar">
  <button class="sw c-yellow" data-color="yellow" title="Highlight"></button>
  <button class="sw c-green" data-color="green" title="Highlight"></button>
  <button class="sw c-blue" data-color="blue" title="Highlight"></button>
  <button class="note-btn" id="selNote" title="Highlight + add note">✎ Note</button>
</div>
<!-- Note popover — view/edit/delete a highlight's annotation. -->
<div class="note-pop" id="notePop">
  <textarea id="noteText" placeholder="Add a note…" spellcheck="false"></textarea>
  <div class="note-row">
    <div class="note-swatches" id="noteSwatches">
      <button class="sw c-yellow" data-color="yellow"></button>
      <button class="sw c-green" data-color="green"></button>
      <button class="sw c-blue" data-color="blue"></button>
    </div>
    <span class="sp"></span>
    <button id="noteDelete" class="danger">Delete</button>
  </div>
</div>
<!-- Ctrl+K search-within-book overlay. -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <input class="search-input" id="searchInput" type="text" placeholder="Search this book…  (Esc to close)" spellcheck="false" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';

/* @theme-init */
import { renderMd, slugify } from '../../src/js/markdown.js';
import { highlightCode, scrollToAnchor, decorateHeadings, buildToc, rewireLinks, makeStatePersister, splitByHeadings } from '../../ext/docview/index.js';
import { Librarian } from '../../ext/librarian/index.js';
import { renderToString } from '../../ext/katex/index.js';

const $ = (id) => document.getElementById(id);

let bus = null;
let persister = null;
let book = null;          // parsed book.json
let bookDir = '';         // directory holding book.json + chapters
let slug = 'book';
let chapters = [];        // book.chapters
let curIndex = 0;
let settings = { font: 'serif', size: 18, width: 680 };
let _toc = { items: [], update() {} };
let bookmarks = [];       // [{ id, chapterId, scrollTop, label }]
let highlights = [];      // [{ id, chapterId, start, end, quote, color, note }]
let _markSeq = 1;
let _activeMarkId = null; // highlight whose note popover is open
let bookIndex = null;     // librarian index over the book (built lazily)
let _hitIdx = 0;

// ── Renderer-backend seam (spec: format → backend) ──────────────────
// v1 ships the reflowable backend (markdown + sanitized HTML → our DOM, so
// docview decorations / search / theming all apply). Fixed-layout backends
// (pdf, djvu) slot in here later; for now they degrade to a clear message.
function sanitizeHtml(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  for (const el of tpl.content.querySelectorAll('script, style, link, meta, iframe, object, embed')) el.remove();
  for (const el of tpl.content.querySelectorAll('*')) {
    for (const at of [...el.attributes]) {
      if (/^on/i.test(at.name) || (/^(href|src)$/i.test(at.name) && /^\s*javascript:/i.test(at.value))) el.removeAttribute(at.name);
    }
  }
  return tpl.innerHTML;
}
// Markdown treats _ ^ \ * as syntax, which would corrupt math source. For md
// chapters we lift math spans out before renderMd and splice them back after,
// so renderMath sees the verbatim TeX. (html chapters skip markdown entirely.)
function renderMdWithMath(md) {
  const math = [];
  const stashed = md.replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/g,
    (m) => { math.push(m); return '@@MATH' + (math.length - 1) + '@@'; });
  return renderMd(stashed).replace(/@@MATH(\d+)@@/g, (_, i) => math[+i]);
}
const BACKENDS = {
  reflowable: {
    render(chapter, raw, pageEl) {
      pageEl.innerHTML = chapter.format === 'html' ? sanitizeHtml(raw) : renderMdWithMath(raw);
      decorateHeadings(pageEl, (id) => {
        try { navigator.clipboard?.writeText(slug + '/' + chapter.id + '#' + id); } catch {}
      });
      highlightCode(pageEl);
    },
  },
};
function backendFor(format) {
  if (format === 'pdf' || format === 'djvu') return null;   // fixed-layout: not yet
  return BACKENDS.reflowable;
}

// ── Math (KaTeX → MathML) ───────────────────────────────────────────
// Replace $$…$$ (display), \[…\] (display) and \(…\) (inline) with MathML.
// Single $…$ is intentionally NOT a delimiter (KaTeX-auto-render default) to
// avoid eating currency like "$5"; LaTeX sources should emit \(…\) inline
// (the ODS converter will). Skips code/pre/links. MathML output → the browser
// renders with system math fonts (no KaTeX fonts shipped).
const MATH_DELIMS = [
  { l: '$$', r: '$$', display: true },
  { l: '\\[', r: '\\]', display: true },
  { l: '\\(', r: '\\)', display: false },
];
const MATH_SKIP = new Set(['CODE', 'PRE', 'SCRIPT', 'STYLE', 'TEXTAREA', 'A', 'MATH']);
// Generic LaTeX→KaTeX macro shims for academic-text math (mbox, blackboard sets, E).
// Books may extend/override via book.katexMacros.
const KATEX_MACROS = { '\\mbox': '\\text', '\\eq': '=', '\\E': '\\mathrm{E}', '\\R': '\\mathbb{R}', '\\N': '\\mathbb{N}', '\\Z': '\\mathbb{Z}' };
// Normalize TeX KaTeX doesn't accept: amsmath align/eqnarray environments (→ aligned),
// and @{…} array/tabular column separators (KaTeX has no @ column type).
function katexFix(tex) {
  return tex
    .replace(/\\begin\{(?:align\*?|eqnarray\*?)\}/g, '\\begin{aligned}')
    .replace(/\\end\{(?:align\*?|eqnarray\*?)\}/g, '\\end{aligned}')
    .replace(/@\{[^{}]*\}/g, '');
}
function renderMath(root) {
  if (!root) return;
  const macros = { ...KATEX_MACROS, ...((book && book.katexMacros) || {}) };
  // 1) Explicit pandoc math spans (<span class="math inline|display">…</span>).
  //    Read textContent, which decodes HTML entities (&amp;→&) and flattens any
  //    embedded markup — e.g. ODS's #x# code-identifiers land as <code>x</code>
  //    INSIDE the \(…\), splitting the text node so the bare-delimiter scan below
  //    can't pair it. textContent gives the whole formula back as clean TeX.
  for (const el of root.querySelectorAll('span.math')) {
    const display = el.classList.contains('display');
    // Reconstruct TeX from the span. Embedded <code> (ODS's #x# code-identifiers
    // that landed inside math) → \texttt{…}: a code-font token that is also a
    // proper argument boundary, so an adjacent command doesn't swallow it
    // (\log#n# → \log<code>n</code> would flatten to \logn → undefined; this
    // gives \log\texttt{n} → "log n"). Escape LaTeX-specials in the code text —
    // notably % (a comment char that would eat the rest of the formula), and
    // _/^/&/#/$/{}/~/\. Clone + textContent also decodes entities (&amp;→&).
    const clone = el.cloneNode(true);
    for (const c of clone.querySelectorAll('code'))
      c.replaceWith(document.createTextNode('\\texttt{' + c.textContent
        .replace(/\\/g, '\\textbackslash ')
        .replace(/([%$#&_{}])/g, '\\$1')
        .replace(/~/g, '\\textasciitilde ')
        .replace(/\^/g, '\\textasciicircum ') + '}'));
    const tex = clone.textContent.trim().replace(/^\\[([]/, '').replace(/\\[)\]]$/, '').trim();
    if (!tex) continue;
    try { el.innerHTML = renderToString(katexFix(tex), { output: 'mathml', displayMode: display, macros }); }
    catch { /* leave the span's raw text in place */ }
  }
  // 2) Bare $$…$$ / \(…\) / \[…\] in plain text nodes (markdown chapters and
  //    non-pandoc HTML). Rendered spans from step 1 are <math> now → MATH_SKIP.
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (!/\$\$|\\\(|\\\[/.test(n.nodeValue)) return NodeFilter.FILTER_REJECT;
      for (let p = n.parentNode; p && p !== root; p = p.parentNode) if (MATH_SKIP.has(p.nodeName)) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const targets = [];
  for (let n; (n = walker.nextNode());) targets.push(n);
  for (const node of targets) {
    const text = node.nodeValue;
    const frag = document.createDocumentFragment();
    let i = 0, any = false;
    while (i < text.length) {
      let best = null;
      for (const d of MATH_DELIMS) {
        const s = text.indexOf(d.l, i);
        if (s < 0) continue;
        const e = text.indexOf(d.r, s + d.l.length);
        if (e < 0) continue;
        if (!best || s < best.s) best = { s, e, d };
      }
      if (!best) { frag.appendChild(document.createTextNode(text.slice(i))); break; }
      if (best.s > i) frag.appendChild(document.createTextNode(text.slice(i, best.s)));
      const tex = text.slice(best.s + best.d.l.length, best.e);
      const span = document.createElement('span');
      try { span.innerHTML = renderToString(katexFix(tex), { output: 'mathml', displayMode: best.d.display, macros }); any = true; }
      catch { span.textContent = best.d.l + tex + best.d.r; }
      frag.appendChild(span);
      i = best.e + best.d.r.length;
    }
    if (any) node.parentNode.replaceChild(frag, node);
  }
}

// ── VFS helpers ─────────────────────────────────────────────────────
async function vfsRead(p) {
  return bus.call({ to: 'works', path: '/', interface: 'VFS', member: 'Read' }, [p, 'utf8']);
}
// Resolve a chapter file path (relative to the book dir), normalising ../.
function resolveInBook(relPath) {
  const base = relPath.startsWith('/') ? relPath : bookDir + '/' + relPath;
  const out = [];
  for (const seg of base.split('/')) {
    if (seg === '..') out.pop();
    else if (seg && seg !== '.') out.push(seg);
  }
  return '/' + out.join('/');
}

// ── Reading settings ────────────────────────────────────────────────
function applySettings() {
  document.body.classList.remove('font-serif', 'font-sans', 'font-mono');
  document.body.classList.add('font-' + settings.font);
  document.body.style.setProperty('--reader-size', settings.size + 'px');
  document.body.style.setProperty('--reader-width', settings.width + 'px');
  for (const b of document.querySelectorAll('#fontSeg button'))
    b.classList.toggle('active', b.dataset.font === settings.font);
  $('sizeRange').value = settings.size;
  $('widthRange').value = settings.width;
}

// ── Persistence ─────────────────────────────────────────────────────
function scheduleSave() {
  if (!persister || !chapters.length) return;
  persister.schedule(() => ({
    chapterId: chapters[curIndex] && chapters[curIndex].id,
    scrollTop: $('content').scrollTop || 0,
    settings, bookmarks, highlights,
  }));
}

// ── Contents (chapter spine) ────────────────────────────────────────
function renderContents() {
  const el = $('contents');
  el.innerHTML = '';
  const meta = document.createElement('div');
  meta.className = 'book-meta';
  const t = document.createElement('div'); t.className = 'book-title'; t.textContent = book.title || slug;
  meta.appendChild(t);
  if (book.author) { const a = document.createElement('div'); a.className = 'book-author'; a.textContent = book.author; meta.appendChild(a); }
  el.appendChild(meta);
  chapters.forEach((c, i) => {
    const d = document.createElement('div');
    d.className = 'chap' + (i === curIndex ? ' active' : '');
    d.textContent = c.title || ('Chapter ' + (i + 1));
    d.dataset.idx = i;
    d.addEventListener('click', () => { loadChapter(i); setNavOpen(false); });
    el.appendChild(d);
  });
  renderMarks(el);
}
function setNavOpen(open) { document.body.classList.toggle('nav-open', open); }

// Render the bookmarks + highlights list into the contents sidebar. Marks
// sort by chapter order, bookmarks before highlights, highlights by position.
function chapIndexOf(id) { return chapters.findIndex((c) => c.id === id); }
function renderMarks(el) {
  const h3 = document.createElement('h3');
  h3.textContent = 'Marks';
  el.appendChild(h3);
  const all = bookmarks.map((b) => ({ ...b, kind: 'bm' }))
    .concat(highlights.map((h) => ({ ...h, kind: 'hl' })));
  if (!all.length) {
    const e = document.createElement('div');
    e.className = 'marks-empty'; e.textContent = 'No marks yet — select text to highlight, or 🔖 to bookmark.';
    el.appendChild(e); return;
  }
  all.sort((a, b) => (chapIndexOf(a.chapterId) - chapIndexOf(b.chapterId))
    || ((a.kind === 'bm' ? 0 : 1) - (b.kind === 'bm' ? 0 : 1))
    || ((a.start || 0) - (b.start || 0)));
  for (const m of all) {
    const row = document.createElement('div');
    row.className = 'mark';
    const dot = document.createElement('span');
    dot.className = 'dot ' + (m.kind === 'bm' ? 'bm' : 'c-' + (m.color || 'yellow'));
    const txt = document.createElement('span');
    txt.className = 'txt';
    const q = document.createElement('span'); q.className = 'q';
    q.textContent = m.kind === 'bm' ? (m.label || 'Bookmark') : (m.quote || '(highlight)');
    txt.appendChild(q);
    if (m.kind === 'hl' && m.note && m.note.trim()) {
      const n = document.createElement('span'); n.className = 'n'; n.textContent = '✎ ' + m.note.trim();
      txt.appendChild(n);
    }
    const del = document.createElement('span');
    del.className = 'del'; del.textContent = '×'; del.title = 'Remove';
    del.addEventListener('click', (e) => { e.stopPropagation(); removeMark(m.kind, m.id); });
    row.append(dot, txt, del);
    row.addEventListener('click', () => jumpToMark(m));
    el.appendChild(row);
  }
}
function removeMark(kind, id) {
  if (kind === 'bm') bookmarks = bookmarks.filter((b) => b.id !== id);
  else {
    highlights = highlights.filter((h) => h.id !== id);
    const p = currentPage();
    if (p) { for (const mk of [...p.querySelectorAll('mark.hl[data-id="' + id + '"]')]) mk.replaceWith(...mk.childNodes); p.normalize(); }
    if (_activeMarkId === id) closeNote();
  }
  renderContents(); scheduleSave();
}
async function jumpToMark(m) {
  const idx = chapIndexOf(m.chapterId);
  if (idx < 0) return;
  if (idx !== curIndex) await loadChapter(idx);
  if (m.kind === 'bm' && typeof m.scrollTop === 'number') $('content').scrollTop = m.scrollTop;
  else if (m.kind === 'hl') {
    const mk = currentPage() && currentPage().querySelector('mark.hl[data-id="' + m.id + '"]');
    if (mk) mk.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  setNavOpen(false);
}

// ── Load a chapter ──────────────────────────────────────────────────
async function loadChapter(index, anchor) {
  if (index < 0 || index >= chapters.length) return;
  curIndex = index;
  const chapter = chapters[index];
  const backend = backendFor(chapter.format || 'md');
  $('crumb').textContent = chapter.title || '';
  // active in spine
  for (const d of document.querySelectorAll('.contents .chap')) {
    const on = +d.dataset.idx === index;
    d.classList.toggle('active', on);
    if (on) d.scrollIntoView({ block: 'nearest' });
  }
  const contentEl = $('content');
  if (!backend) {
    contentEl.innerHTML = '<div class="err">This chapter is ' + (chapter.format || '?')
      + ' — a fixed-layout reader backend isn\'t available yet.</div>';
    return;
  }
  let raw;
  try { raw = await vfsRead(resolveInBook(chapter.file)); }
  catch (e) {
    contentEl.innerHTML = '<div class="err">failed to load ' + chapter.file + ': ' + (e.message || e) + '</div>';
    return;
  }
  contentEl.innerHTML = '';
  const page = document.createElement('div');
  page.className = 'page';
  contentEl.appendChild(page);
  backend.render(chapter, raw, page);
  renderMath(page);   // $$…$$ / \(…\) / \[…\] → MathML (before highlights anchor)
  // cross-chapter + in-chapter links
  rewireLinks(page, chapter.file, (resolved, anch) => {
    // resolved is relative to chapter.file's dir; match against a chapter file
    const want = resolveInBook(chapter.file.includes('/') ? chapter.file.slice(0, chapter.file.lastIndexOf('/') + 1) + resolved.split('/').slice(-1)[0] : resolved);
    const idx = chapters.findIndex((c) => resolveInBook(c.file) === resolveInBook(resolved) || resolveInBook(c.file) === want);
    if (idx >= 0) loadChapter(idx, anch);
  });
  // chapter footer prev/next
  const foot = document.createElement('div');
  foot.className = 'chap-foot';
  const prev = document.createElement('a');
  if (index > 0) { prev.textContent = '‹ ' + (chapters[index - 1].title || 'Previous'); prev.addEventListener('click', () => loadChapter(index - 1)); }
  const next = document.createElement('a');
  if (index < chapters.length - 1) { next.textContent = (chapters[index + 1].title || 'Next') + ' ›'; next.addEventListener('click', () => loadChapter(index + 1)); }
  foot.append(prev, Object.assign(document.createElement('span'), { className: 'sp' }), next);
  page.appendChild(foot);

  _toc = buildToc(page, $('toc'));
  applyHighlights(chapter.id);
  closeNote(); hideSelToolbar();
  updateButtons();
  if (anchor && scrollToAnchor(anchor)) { /* anchor wins */ }
  else { contentEl.scrollTop = 0; }
  scheduleSave();
}
function updateButtons() {
  $('prevBtn').disabled = curIndex <= 0;
  $('nextBtn').disabled = curIndex >= chapters.length - 1;
}

// ── Annotation anchoring ────────────────────────────────────────────
// Highlights anchor by [start,end] char offsets into the chapter page's
// rendered textContent + a quote. Re-found on load by walking text nodes —
// stable because the render pipeline (renderMd → decorateHeadings →
// highlightCode) is deterministic, so the same characters land at the same
// offsets every time. Both capture and re-apply happen post-render, so the
// § anchors / token spans (which don't change the TEXT, only its wrapping)
// stay consistent.
function currentPage() { return $('content').querySelector('.page'); }

// Absolute char offset of (node, offset) within root — measured the same way
// wrapRange walks (concatenated text-node values), via a Range's text length.
function charOffset(root, node, offset) {
  const r = document.createRange();
  r.setStart(root, 0);
  r.setEnd(node, offset);
  return r.toString().length;
}

// Current selection as { start, end, quote, rect } if it's a real text range
// inside the chapter page; else null.
function selectionOffsets() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
  const root = currentPage();
  if (!root) return null;
  const range = sel.getRangeAt(0);
  if (!root.contains(range.startContainer) || !root.contains(range.endContainer)) return null;
  const a = charOffset(root, range.startContainer, range.startOffset);
  const b = charOffset(root, range.endContainer, range.endOffset);
  const start = Math.min(a, b), end = Math.max(a, b);
  const quote = sel.toString().replace(/\s+/g, ' ').trim().slice(0, 240);
  if (end <= start || !quote) return null;
  return { start, end, quote, rect: range.getBoundingClientRect() };
}

// Wrap the text in [start,end] within root in <mark> elements (one per
// overlapping text node, so it survives spans crossing element boundaries).
function wrapRange(root, start, end, hl) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  let pos = 0, n;
  const segs = [];
  while ((n = walker.nextNode())) {
    const len = n.nodeValue.length, nodeStart = pos;
    pos += len;
    if (pos <= start || nodeStart >= end) continue;        // no overlap
    segs.push({ node: n, from: Math.max(0, start - nodeStart), to: Math.min(len, end - nodeStart) });
  }
  const cls = 'hl c-' + (hl.color || 'yellow') + (hl.note && hl.note.trim() ? ' has-note' : '');
  for (const { node, from, to } of segs) {
    const range = document.createRange();
    range.setStart(node, from);
    range.setEnd(node, to);
    const mark = document.createElement('mark');
    mark.className = cls;
    mark.dataset.id = hl.id;
    try { range.surroundContents(mark); } catch { /* segment not cleanly wrappable — skip */ }
  }
}

function applyHighlights(chapterId) {
  const root = currentPage();
  if (!root) return;
  for (const h of highlights.filter((x) => x.chapterId === chapterId).sort((a, b) => a.start - b.start)) {
    wrapRange(root, h.start, h.end, h);
  }
  for (const mk of root.querySelectorAll('mark.hl')) {
    mk.addEventListener('click', (e) => { e.stopPropagation(); openNote(mk.dataset.id, mk); });
  }
}

function addHighlight(color, withNote) {
  const sel = selectionOffsets();
  if (!sel) return;
  const h = { id: 'h' + (_markSeq++), chapterId: chapters[curIndex].id, start: sel.start, end: sel.end, quote: sel.quote, color: color || 'yellow', note: '' };
  highlights.push(h);
  window.getSelection().removeAllRanges();
  hideSelToolbar();
  wrapRange(currentPage(), h.start, h.end, h);
  const mk = currentPage().querySelector('mark.hl[data-id="' + h.id + '"]');
  if (mk) mk.addEventListener('click', (e) => { e.stopPropagation(); openNote(h.id, mk); });
  renderContents(); scheduleSave();
  if (withNote && mk) openNote(h.id, mk);
}

// ── Note popover ────────────────────────────────────────────────────
function openNote(id, anchorEl) {
  const h = highlights.find((x) => x.id === id);
  if (!h) return;
  _activeMarkId = id;
  const pop = $('notePop');
  $('noteText').value = h.note || '';
  for (const b of pop.querySelectorAll('.sw')) b.classList.toggle('active', b.dataset.color === h.color);
  const r = anchorEl.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 266)) + 'px';
  pop.style.top = Math.min(r.bottom + 6, window.innerHeight - 140) + 'px';
  pop.classList.add('open');
  $('noteText').focus();
}
function closeNote() { $('notePop').classList.remove('open'); _activeMarkId = null; }

// ── Bookmark ────────────────────────────────────────────────────────
function addBookmark() {
  if (!chapters.length) return;
  const c = chapters[curIndex];
  let label = c.title || ('Chapter ' + (curIndex + 1));
  const root = currentPage();
  if (root) {
    const top = $('content').getBoundingClientRect().top + 60;
    let h = null;
    for (const hd of root.querySelectorAll('h1, h2, h3')) {
      if (hd.getBoundingClientRect().top <= top) h = hd; else break;
    }
    if (h) label = (c.title ? c.title + ' · ' : '') + (h.textContent || '').replace(/^§\s*/, '').trim();
  }
  bookmarks.push({ id: 'b' + (_markSeq++), chapterId: c.id, scrollTop: $('content').scrollTop || 0, label });
  renderContents(); scheduleSave();
}

// ── Selection toolbar ───────────────────────────────────────────────
function showSelToolbar(rect) {
  const tb = $('selToolbar');
  tb.classList.add('open');
  const w = tb.offsetWidth || 170;
  tb.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, window.innerWidth - w - 8)) + 'px';
  tb.style.top = Math.max(8, rect.top - 44) + 'px';
}
function hideSelToolbar() { $('selToolbar').classList.remove('open'); }

// ── Search within the book ──────────────────────────────────────────
// Build a librarian index over every chapter, split into heading-anchored
// sections. md chapters split via docview.splitByHeadings (anchors match the
// rendered slugs); html chapters (epub) split via the DOM (anchor = heading
// id). Built lazily on first open. Each section carries its chapter index so
// a hit can loadChapter() straight to it.
function htmlSections(html, chapterTitle) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const out = [];
  let cur = { heading: chapterTitle, anchor: '', body: '' };
  for (const el of doc.body.querySelectorAll('h1, h2, h3, p, li, pre, blockquote, td')) {
    if (/^H[123]$/.test(el.tagName)) {
      if (cur.body.trim() || cur.heading) out.push(cur);
      cur = { heading: (el.textContent || '').replace(/^§\s*/, '').trim(), anchor: el.id || '', body: '' };
    } else {
      cur.body += ' ' + (el.textContent || '');
    }
  }
  if (cur.body.trim() || cur.heading) out.push(cur);
  return out;
}
async function buildBookIndex() {
  if (bookIndex) return bookIndex;
  const docs = [];
  for (let i = 0; i < chapters.length; i++) {
    const ch = chapters[i];
    let raw = '';
    try { raw = await vfsRead(resolveInBook(ch.file)); } catch { continue; }
    const secs = (ch.format || 'md') === 'html'
      ? htmlSections(raw, ch.title)
      : splitByHeadings(raw, ch.id, ch.title, slugify);
    for (const s of secs) {
      docs.push({
        id: ch.id + '#' + (s.anchor || ''),
        chapterIndex: i, anchor: s.anchor || '',
        fileTitle: ch.title, heading: s.heading || ch.title,
        title: s.heading || ch.title, body: s.body || '',
      });
    }
  }
  bookIndex = Librarian.index({
    docs, fields: { heading: { boost: 4 }, fileTitle: { boost: 2 }, body: { boost: 1 } }, synonyms: {},
  });
  return bookIndex;
}
async function openSearch() {
  $('searchOverlay').classList.add('open');
  const inp = $('searchInput');
  inp.value = ''; inp.focus();
  $('searchResults').innerHTML = '<div class="empty">indexing…</div>';
  await buildBookIndex();
  $('searchResults').innerHTML = '';
  _hitIdx = 0;
}
function closeSearch() { $('searchOverlay').classList.remove('open'); }
function runSearch() {
  if (!bookIndex) return;
  const q = $('searchInput').value;
  const box = $('searchResults');
  if (!q.trim()) { box.innerHTML = ''; return; }
  const hits = Librarian.search(bookIndex, q, { fuzzy: 1, limit: 20 });
  _hitIdx = 0;
  box.innerHTML = '';
  if (!hits.length) { box.innerHTML = '<div class="empty">no matches.</div>'; return; }
  hits.forEach((h, i) => {
    const row = document.createElement('div');
    row.className = 'search-hit' + (i === 0 ? ' active' : '');
    const crumb = document.createElement('div'); crumb.className = 'crumb'; crumb.textContent = h.doc.fileTitle || '';
    const head = document.createElement('div'); head.className = 'h'; head.textContent = h.doc.heading || h.doc.fileTitle || '';
    row.append(crumb, head);
    if (h.snippet) { const sn = document.createElement('div'); sn.className = 'snippet'; sn.innerHTML = h.snippet; row.appendChild(sn); }
    row.addEventListener('click', () => activateHit(h));
    row.addEventListener('mouseenter', () => { _hitIdx = i; for (const r of box.querySelectorAll('.search-hit')) r.classList.remove('active'); row.classList.add('active'); });
    box.appendChild(row);
  });
}
async function activateHit(hit) {
  closeSearch();
  await loadChapter(hit.doc.chapterIndex, hit.doc.anchor || null);
}

// ── Boot ────────────────────────────────────────────────────────────
window.addEventListener('message', async (ev) => {
  if (ev.source !== window.parent) return;
  if (!ev.data || ev.data.type !== 'abus:welcome') return;

  try { bus = await connect(ev.data.port, { client: 'reader-surface' }); }
  catch (e) { document.body.innerHTML = '<div class="err">connect failed: ' + (e.message || e) + '</div>'; return; }
  try { await bus.claim('reader-' + (ev.data.tab && ev.data.tab.id || 'unknown')); } catch {}
  installThemeSubscription(bus);
  bus.expose('/', {
    Surface: {
      methods: { Flush: () => {}, CanClose: () => true, Relocated: () => {} },
      signals: ['DirtyChanged', 'TitleChanged', 'Ready'],
    },
  });

  const tabPath = (ev.data.tab && ev.data.tab.path) || '/';
  // path may be the book.json file itself or the directory holding it.
  const manifestPath = tabPath.endsWith('.json') ? tabPath : (tabPath.replace(/\/$/, '') + '/book.json');
  bookDir = manifestPath.slice(0, manifestPath.lastIndexOf('/'));
  try {
    book = JSON.parse(await vfsRead(manifestPath));
  } catch (e) {
    document.body.innerHTML = '<div class="err">no book.json at ' + manifestPath + ' — ' + (e.message || e) + '</div>';
    return;
  }
  chapters = Array.isArray(book.chapters) ? book.chapters : [];
  // give chapters stable ids if absent
  chapters.forEach((c, i) => { if (!c.id) c.id = 'ch' + (i + 1); });
  slug = book.slug || (bookDir.split('/').pop()) || 'book';
  $('bookTitle').textContent = book.title || slug;

  persister = makeStatePersister(bus, '/home/.books/state/' + slug + '.json');
  const saved = await persister.read();
  if (saved && saved.settings) settings = { ...settings, ...saved.settings };
  if (saved && Array.isArray(saved.bookmarks)) bookmarks = saved.bookmarks;
  if (saved && Array.isArray(saved.highlights)) highlights = saved.highlights;
  // keep the id sequence ahead of restored marks
  for (const m of [...bookmarks, ...highlights]) {
    const num = parseInt(String(m.id).slice(1), 10);
    if (num >= _markSeq) _markSeq = num + 1;
  }
  applySettings();
  renderContents();

  // wire settings popover
  $('setBtn').addEventListener('click', () => $('settingsPop').classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!$('settingsPop').contains(e.target) && e.target !== $('setBtn')) $('settingsPop').classList.remove('open');
  });
  for (const b of document.querySelectorAll('#fontSeg button'))
    b.addEventListener('click', () => { settings.font = b.dataset.font; applySettings(); scheduleSave(); });
  $('sizeRange').addEventListener('input', () => { settings.size = +$('sizeRange').value; applySettings(); scheduleSave(); });
  $('widthRange').addEventListener('input', () => { settings.width = +$('widthRange').value; applySettings(); scheduleSave(); });

  $('navToggle').addEventListener('click', () => setNavOpen(!document.body.classList.contains('nav-open')));
  $('backdrop').addEventListener('click', () => setNavOpen(false));
  $('prevBtn').addEventListener('click', () => loadChapter(curIndex - 1));
  $('nextBtn').addEventListener('click', () => loadChapter(curIndex + 1));
  $('markBtn').addEventListener('click', addBookmark);
  $('searchBtn').addEventListener('click', openSearch);
  $('searchInput').addEventListener('input', runSearch);
  $('searchOverlay').addEventListener('click', (e) => { if (e.target.id === 'searchOverlay') closeSearch(); });

  // Selection → highlight toolbar.
  $('content').addEventListener('mouseup', () => {
    setTimeout(() => {
      const sel = selectionOffsets();
      if (sel) showSelToolbar(sel.rect); else hideSelToolbar();
    }, 0);
  });
  for (const sw of $('selToolbar').querySelectorAll('.sw'))
    sw.addEventListener('mousedown', (e) => { e.preventDefault(); addHighlight(sw.dataset.color, false); });
  $('selNote').addEventListener('mousedown', (e) => { e.preventDefault(); addHighlight('yellow', true); });

  // Note popover: edit text / recolour / delete; close on outside click.
  $('noteText').addEventListener('input', () => {
    const h = highlights.find((x) => x.id === _activeMarkId); if (!h) return;
    h.note = $('noteText').value;
    const on = !!h.note.trim();
    for (const mk of (currentPage() ? currentPage().querySelectorAll('mark.hl[data-id="' + h.id + '"]') : []))
      mk.classList.toggle('has-note', on);
    renderContents(); scheduleSave();
  });
  for (const sw of $('noteSwatches').querySelectorAll('.sw'))
    sw.addEventListener('click', () => {
      const h = highlights.find((x) => x.id === _activeMarkId); if (!h) return;
      h.color = sw.dataset.color;
      const cls = 'hl c-' + h.color + (h.note && h.note.trim() ? ' has-note' : '');
      for (const mk of (currentPage() ? currentPage().querySelectorAll('mark.hl[data-id="' + h.id + '"]') : [])) mk.className = cls;
      for (const s of $('noteSwatches').querySelectorAll('.sw')) s.classList.toggle('active', s === sw);
      renderContents(); scheduleSave();
    });
  $('noteDelete').addEventListener('click', () => { if (_activeMarkId) removeMark('hl', _activeMarkId); });
  document.addEventListener('mousedown', (e) => {
    if ($('notePop').classList.contains('open') && !$('notePop').contains(e.target)
        && !(e.target.closest && e.target.closest('mark.hl'))) closeNote();
  });

  // scroll → TOC active + persist; also dismiss transient popups.
  let raf = 0;
  $('content').addEventListener('scroll', () => {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; _toc.update(); });
    hideSelToolbar();
    scheduleSave();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'k' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); return; }
    if ($('searchOverlay').classList.contains('open')) {
      const rows = $('searchResults').querySelectorAll('.search-hit');
      if (e.key === 'Escape') { closeSearch(); return; }
      if (e.key === 'ArrowDown' && rows.length) { e.preventDefault(); _hitIdx = Math.min(_hitIdx + 1, rows.length - 1); rows.forEach((r) => r.classList.remove('active')); rows[_hitIdx].classList.add('active'); rows[_hitIdx].scrollIntoView({ block: 'nearest' }); return; }
      if (e.key === 'ArrowUp' && rows.length) { e.preventDefault(); _hitIdx = Math.max(_hitIdx - 1, 0); rows.forEach((r) => r.classList.remove('active')); rows[_hitIdx].classList.add('active'); rows[_hitIdx].scrollIntoView({ block: 'nearest' }); return; }
      if (e.key === 'Enter' && rows[_hitIdx]) { e.preventDefault(); rows[_hitIdx].click(); return; }
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (typing) return;
    if (e.key === '\\' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); setNavOpen(!document.body.classList.contains('nav-open')); }
    else if (e.key === 'ArrowLeft') { loadChapter(curIndex - 1); }
    else if (e.key === 'ArrowRight') { loadChapter(curIndex + 1); }
    else if (e.key === 'Escape' && document.body.classList.contains('nav-open')) setNavOpen(false);
  });

  // restore last position
  let startIdx = 0;
  if (saved && saved.chapterId) {
    const i = chapters.findIndex((c) => c.id === saved.chapterId);
    if (i >= 0) startIdx = i;
  }
  await loadChapter(startIdx);
  if (saved && saved.chapterId === (chapters[startIdx] && chapters[startIdx].id) && typeof saved.scrollTop === 'number') {
    requestAnimationFrame(() => { $('content').scrollTop = saved.scrollTop; _toc.update(); });
  }

  bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' }, [book.title || slug]);
  bus.signal({ path: '/', interface: 'Surface', member: 'Ready' }, []);
});
</script>
