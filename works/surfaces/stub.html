<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>stub surface</title>
<style>
  /* @theme-tokens */
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--au-surface-raised); color: var(--au-fg-muted);
    font: 13px/1.5 system-ui, sans-serif;
  }
</style>
</head>
<body>
<!--
  A trivial Auditable Works surface — proves the spawn → handshake →
  contract path. Not a real surface; a test/reference fixture.
-->
<div id="status">stub surface — waiting for welcome…</div>
<script type="module">
import { connect } from '../../ext/abus/index.js';
import { bootSurface } from '../../ext/surface/index.js';

/* @theme-init */

const statusEl = document.getElementById('status');

bootSurface({
  connect,
  client: 'stub',
  onConnect: (bus) => installThemeSubscription(bus),
  // Trivial surface — no document, no dirty state. The default §5.2 methods
  // (Flush → undefined, CanClose → true, Relocated → noop) are exactly right.
  makeHost: () => ({}),
  mount: async ({ bus, tab }) => {
    // Prove the surface → works → VFS path: write a probe file through the
    // `works` service and read it back.
    let vfsOk = false;
    try {
      const probe = '/projects/.stub-probe';
      const payload = 'hello from ' + tab.id;
      await bus.call({ to: 'works', path: '/', interface: 'VFS', member: 'Write' },
        [probe, payload]);
      const back = await bus.call({ to: 'works', path: '/', interface: 'VFS', member: 'Read' },
        [probe]);
      vfsOk = (back === payload);
    } catch (e) {
      statusEl.textContent = 'works/VFS call failed: ' + e.message;
    }

    bus.signal({ path: '/', interface: 'Surface', member: 'TitleChanged' },
      ['Stub ' + tab.id]);
    statusEl.textContent = 'stub surface — ' + bus.uniqueName
      + (vfsOk ? ' · works/VFS OK' : ' · works/VFS failed');
  },
});
</script>
</body>
</html>
