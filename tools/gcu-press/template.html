<div id="gp-menubar" class="gp-menubar"></div>
<div id="gp-main" class="gp-main">
  <div id="gp-editor-pane" class="gp-editor-pane"></div>
  <div id="gp-divider" class="gp-divider"></div>
  <div id="gp-page-pane" class="gp-page-pane">
    <div id="gp-pages" class="gp-pages"></div>
  </div>
</div>
<div class="gp-statusbar">
  <span id="gp-status-msg" class="gp-status-msg">ready</span>
  <div class="gp-status-right">
    <span id="gp-status-pages" class="gp-status-pages">0 pages</span>
    <span id="gp-status-cursor" class="gp-status-cursor">1:1</span>
    <div class="gp-zoom-control">
      <button class="gp-zoom-btn" id="gp-zoom-out" title="Zoom out">&minus;</button>
      <input type="range" id="gp-zoom-slider" class="gp-zoom-slider" min="25" max="300" value="100" step="5">
      <button class="gp-zoom-btn" id="gp-zoom-in" title="Zoom in">+</button>
      <span id="gp-zoom-pct" class="gp-zoom-pct">100%</span>
    </div>
  </div>
</div>
