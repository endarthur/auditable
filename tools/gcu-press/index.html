<!DOCTYPE html>
<!-- GCU Press — typesetting editor -->
<!-- Part of the Auditable project — https://github.com/endarthur/auditable -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#c89b3c">
<title>GCU Press</title>
<style>
/* GCU Press — typesetting editor, dark theme */

:root {
  --bg0: #0a0a0a;
  --bg1: #111;
  --bg2: #1a1a1a;
  --bg3: #222;
  --fg: #aaa;
  --fg-dim: #555;
  --fg-bright: #ccc;
  --accent: #c89b3c;
  --accent-dim: #8a6c2a;
  --err: #a33;
  --ok: #3a7;
  --border: #222;
  --border-hi: #333;
  --mono: 'Courier New', Courier, monospace;
  --editor-font-size: 13px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--fg);
  font: 13px/1.4 var(--mono);
  overflow: hidden;
}

/* -- Menu Bar -- */

.gp-menubar {
  display: flex;
  height: 28px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  user-select: none;
  z-index: 100;
  position: relative;
}

.gp-menu-item {
  position: relative;
}

.gp-menu-label {
  display: block;
  padding: 4px 12px;
  background: none;
  border: none;
  color: var(--fg);
  font: inherit;
  cursor: pointer;
  height: 28px;
}

.gp-menu-label:hover,
.gp-menu-item.open > .gp-menu-label {
  background: var(--bg3);
  color: var(--fg-bright);
}

.gp-dropdown {
  display: none;
  position: absolute;
  top: 28px;
  left: 0;
  min-width: 200px;
  background: var(--bg2);
  border: 1px solid var(--border-hi);
  z-index: 200;
  padding: 4px 0;
}

.gp-menu-item.open > .gp-dropdown {
  display: block;
}

.gp-menu-entry {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 4px 16px;
  background: none;
  border: none;
  color: var(--fg);
  font: inherit;
  cursor: pointer;
  text-align: left;
}

.gp-menu-entry:hover {
  background: rgba(200, 155, 60, 0.15);
  color: var(--fg-bright);
}

.gp-menu-shortcut {
  color: var(--fg-dim);
  margin-left: 24px;
  font-size: 0.85em;
}

.gp-menu-sep {
  height: 1px;
  margin: 4px 8px;
  background: var(--border);
}

/* -- Main Layout -- */

.gp-main {
  display: flex;
  position: absolute;
  top: 28px;
  left: 0;
  right: 0;
  bottom: 24px;
  overflow: hidden;
}

.gp-editor-pane {
  width: 45%;
  min-width: 200px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.gp-editor-pane .cm-editor {
  height: 100%;
}

.gp-divider {
  width: 5px;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  cursor: col-resize;
  flex-shrink: 0;
}

.gp-divider:hover {
  background: var(--accent-dim);
}

.gp-page-pane {
  flex: 1;
  overflow: auto;
  background: #2a2a2a;
  min-width: 200px;
}

/* -- Pages -- */

.gp-pages {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  gap: 16px;
}

.gp-page {
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  line-height: 0;
}

.gp-page canvas {
  display: block;
}

/* -- Status Bar -- */

.gp-statusbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  font-size: 12px;
  z-index: 100;
}

.gp-status-msg {
  color: var(--fg-dim);
}

.gp-status-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.gp-status-pages {
  color: var(--fg-dim);
}

.gp-status-cursor {
  color: var(--fg-dim);
}

.gp-zoom-control {
  display: flex;
  align-items: center;
  gap: 2px;
  border-left: 1px solid var(--border);
  padding-left: 10px;
}

.gp-zoom-btn {
  width: 18px;
  height: 18px;
  background: none;
  border: 1px solid var(--border);
  color: var(--fg-dim);
  font: 12px/1 var(--mono);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.gp-zoom-btn:hover {
  color: var(--fg-bright);
  border-color: var(--accent-dim);
}

.gp-zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 80px;
  height: 4px;
  background: var(--border-hi);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.gp-zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 10px;
  height: 10px;
  background: var(--fg-dim);
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

.gp-zoom-slider::-webkit-slider-thumb:hover {
  background: var(--accent);
}

.gp-zoom-slider::-moz-range-thumb {
  width: 10px;
  height: 10px;
  background: var(--fg-dim);
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

.gp-zoom-slider::-moz-range-thumb:hover {
  background: var(--accent);
}

.gp-zoom-pct {
  color: var(--fg-dim);
  font-size: 11px;
  min-width: 32px;
  text-align: right;
  cursor: pointer;
}

.gp-zoom-pct:hover {
  color: var(--fg-bright);
}

/* -- Page pane scrollbar -- */

.gp-page-pane::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

.gp-page-pane::-webkit-scrollbar-track {
  background: #1a1a1a;
}

.gp-page-pane::-webkit-scrollbar-thumb {
  background: #333;
  border: 2px solid #1a1a1a;
  border-radius: 5px;
}

.gp-page-pane::-webkit-scrollbar-thumb:hover {
  background: #444;
}

/* -- CM6 editor scrollbar -- */

.cm-scroller::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

.cm-scroller::-webkit-scrollbar-track {
  background: #141414;
}

.cm-scroller::-webkit-scrollbar-thumb {
  background: #333;
  border: 2px solid #141414;
  border-radius: 5px;
}

.cm-scroller::-webkit-scrollbar-thumb:hover {
  background: #444;
}

/* -- CM6 search panel -- */

.cm-search {
  background: var(--bg2) !important;
  border-bottom: 1px solid var(--border-hi) !important;
  color: var(--fg) !important;
  font-family: var(--mono) !important;
  font-size: 12px !important;
}

.cm-search input {
  background: var(--bg1) !important;
  border: 1px solid var(--border-hi) !important;
  color: var(--fg-bright) !important;
  font: inherit !important;
  padding: 2px 6px !important;
  outline: none !important;
}

.cm-search input:focus {
  border-color: var(--accent-dim) !important;
}

.cm-search button {
  background: var(--bg3) !important;
  border: 1px solid var(--border-hi) !important;
  color: var(--fg) !important;
  font: inherit !important;
  cursor: pointer !important;
  padding: 2px 8px !important;
}

.cm-search button:hover {
  color: var(--fg-bright) !important;
  border-color: var(--accent-dim) !important;
}

.cm-search label {
  color: var(--fg-dim) !important;
}

.cm-searchMatch {
  background: rgba(200, 155, 60, 0.3) !important;
}

.cm-searchMatch-selected {
  background: rgba(200, 155, 60, 0.5) !important;
}

</style>
</head>
<body>

<div id="gp-menubar" class="gp-menubar"></div>
<div id="gp-main" class="gp-main">
  <div id="gp-editor-pane" class="gp-editor-pane"></div>
  <div id="gp-divider" class="gp-divider"></div>
  <div id="gp-page-pane" class="gp-page-pane">
    <div id="gp-pages" class="gp-pages"></div>
  </div>
</div>
<div class="gp-statusbar">
  <span id="gp-status-msg" class="gp-status-msg">ready</span>
  <div class="gp-status-right">
    <span id="gp-status-pages" class="gp-status-pages">0 pages</span>
    <span id="gp-status-cursor" class="gp-status-cursor">1:1</span>
    <div class="gp-zoom-control">
      <button class="gp-zoom-btn" id="gp-zoom-out" title="Zoom out">&minus;</button>
      <input type="range" id="gp-zoom-slider" class="gp-zoom-slider" min="25" max="300" value="100" step="5">
      <button class="gp-zoom-btn" id="gp-zoom-in" title="Zoom in">+</button>
      <span id="gp-zoom-pct" class="gp-zoom-pct">100%</span>
    </div>
  </div>
</div>

    spaceWidth,
    emWidth,
    measure(text) {
      _metricsCtx.font = font;
      return _metricsCtx.measureText(text).width;
    },
  };
}

// -- linebreak.js --

// Knuth-Plass line breaking algorithm

function box(width, content) {
  return { type: 'box', width, content };
}

function glue(width, stretch, shrink) {
  return { type: 'glue', width, stretch, shrink };
}

function penalty(width, p, flagged) {
  return { type: 'penalty', width, penalty: p, flagged: flagged || false };
}

const INF_PENALTY = 10000;
const NEG_INF_PENALTY = -10000;
const TOLERANCE = 2;

function lineBreak(items, lineWidths) {
  const getWidth = typeof lineWidths === 'number'
    ? () => lineWidths
    : (i) => lineWidths[Math.min(i, lineWidths.length - 1)];

  // Two-pass like TeX: try normal, retry with emergencystretch if last line overflows
  const lines = lineBreakPass(items, getWidth, TOLERANCE, 0);
  if (lines.length > 0) {
    const last = lines[lines.length - 1];
    const lastTarget = getWidth(lines.length - 1);
    if (last.width > lastTarget + 0.5) {
      // Add emergencystretch: ~2em of extra stretch per line
      const emergency = 20;
      const retry = lineBreakPass(items, getWidth, TOLERANCE, emergency);
      if (retry.length > 0) return retry;
    }
  }
  return lines;
}

function lineBreakPass(items, getWidth, tolerance, emergencyStretch) {

  const active = [];
  active.push({
    index: 0, line: 0,
    totalWidth: 0, totalStretch: 0, totalShrink: 0,
    totalDemerits: 0, prev: null,
  });

  let sumWidth = 0, sumStretch = 0, sumShrink = 0;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];

    if (item.type === 'box') {
      sumWidth += item.width;
    } else if (item.type === 'glue') {
      if (i > 0 && items[i - 1].type === 'box') {
        tryBreak(i);
      }
      sumWidth += item.width;
      sumStretch += item.stretch;
      sumShrink += item.shrink;
    } else if (item.type === 'penalty') {
      if (item.penalty < INF_PENALTY) {
        tryBreak(i);
      }
    }
  }

  function computePostBreakSums(breakIndex) {
    let sw = sumWidth, ss = sumStretch, sh = sumShrink;
    // If breaking at a glue, the glue is consumed by the break
    if (items[breakIndex].type === 'glue') {
      sw += items[breakIndex].width;
      ss += items[breakIndex].stretch;
      sh += items[breakIndex].shrink;
    }
    // Skip glue/penalties before the next box
    for (let k = breakIndex + 1; k < items.length; k++) {
      if (items[k].type === 'box') break;
      if (items[k].type === 'glue') {
        sw += items[k].width;
        ss += items[k].stretch;
        sh += items[k].shrink;
      } else if (items[k].type === 'penalty' && items[k].penalty <= NEG_INF_PENALTY) {
        break;
      }
    }
    return { sw, ss, sh };
  }

  function tryBreak(breakIndex) {
    const item = items[breakIndex];
    const isForcedBreak = item.type === 'penalty' && item.penalty <= NEG_INF_PENALTY;

    const len = active.length;
    const toRemove = [];
    const toAdd = [];

    // Track best deactivated node for emergency breaks
    let bestDeactivated = null;
    let bestDeactivatedR = Infinity;

    for (let j = 0; j < len; j++) {
      const node = active[j];
      const lineNum = node.line;
      const targetWidth = getWidth(lineNum);

      let w = sumWidth - node.totalWidth;
      let str = sumStretch - node.totalStretch + emergencyStretch;
      let shr = sumShrink - node.totalShrink;

      if (item.type === 'penalty') w += item.width;

      const diff = targetWidth - w;
      let r;
      if (diff > 0) {
        r = str > 0 ? diff / str : INF_PENALTY;
      } else if (diff < 0) {
        r = shr > 0 ? diff / shr : -INF_PENALTY;
      } else {
        r = 0;
      }

      // Create break if feasible OR forced
      if (Math.abs(r) <= tolerance || isForcedBreak) {
        const clampedR = Math.max(-1, Math.min(r, tolerance));
        const badness = Math.min(Math.pow(Math.abs(clampedR), 3) * 100, INF_PENALTY);
        const p = item.type === 'penalty' ? item.penalty : 0;
        let demerits;
        if (p >= 0) {
          demerits = Math.pow(1 + badness + p, 2);
        } else if (p > NEG_INF_PENALTY) {
          demerits = Math.pow(1 + badness, 2) - p * p;
        } else {
          demerits = Math.pow(1 + badness, 2);
        }

        // Heavily penalize overfull forced breaks (overfull last lines)
        // so KP prefers rearranging earlier lines to avoid them
        if (isForcedBreak && r < -1) {
          demerits += Math.pow(Math.abs(r), 3) * 100000;
        }

        if (item.flagged && node.index > 0 && items[node.index].type === 'penalty' && items[node.index].flagged) {
          demerits += 3000;
        }

        const totalD = node.totalDemerits + demerits;
        const { sw, ss, sh } = computePostBreakSums(breakIndex);

        let merged = false;
        for (const pending of toAdd) {
          if (pending.index === breakIndex && pending.line === lineNum + 1) {
            if (totalD < pending.totalDemerits) {
              pending.totalDemerits = totalD;
              pending.totalWidth = sw;
              pending.totalStretch = ss;
              pending.totalShrink = sh;
              pending.prev = node;
            }
            merged = true;
            break;
          }
        }

        if (!merged) {
          toAdd.push({
            index: breakIndex,
            line: lineNum + 1,
            totalWidth: sw,
            totalStretch: ss,
            totalShrink: sh,
            totalDemerits: totalD,
            prev: node,
          });
        }
      }

      // Mark for deactivation if too tight or forced
      if (r < -1 || isForcedBreak) {
        toRemove.push(j);
        // Track least-bad deactivated node for emergency
        if (Math.abs(r) < Math.abs(bestDeactivatedR)) {
          bestDeactivatedR = r;
          bestDeactivated = node;
        }
      }
    }

    // Remove deactivated nodes (reverse order)
    for (let k = toRemove.length - 1; k >= 0; k--) {
      active.splice(toRemove[k], 1);
    }

    // Add new nodes
    for (const n of toAdd) {
      active.push(n);
    }

    // Emergency: all nodes deactivated, no new breaks created.
    // Force an overfull break from the least-bad node, maintaining the chain.
    if (active.length === 0) {
      const emergency = bestDeactivated || { index: 0, line: 0,
        totalWidth: 0, totalStretch: 0, totalShrink: 0,
        totalDemerits: 0, prev: null };
      const { sw, ss, sh } = computePostBreakSums(breakIndex);
      active.push({
        index: breakIndex,
        line: emergency.line + 1,
        totalWidth: sw,
        totalStretch: ss,
        totalShrink: sh,
        totalDemerits: emergency.totalDemerits + INF_PENALTY * INF_PENALTY,
        prev: emergency,
      });
    }
  }

  // Find best active node
  if (active.length === 0) return [];

  let best = active[0];
  for (let i = 1; i < active.length; i++) {
    if (active[i].totalDemerits < best.totalDemerits) best = active[i];
  }

  // Backtrack to get breakpoints
  const breakpoints = [];
  let node = best;
  while (node) {
    breakpoints.unshift(node.index);
    node = node.prev;
  }

  return buildLines(items, breakpoints, getWidth, emergencyStretch);
}

function buildLines(items, breakpoints, getWidth, emergencyStretch) {
  const lines = [];
  const isLastLine = (b) => b === breakpoints.length - 2;

  for (let b = 0; b < breakpoints.length - 1; b++) {
    const start = breakpoints[b];
    const end = breakpoints[b + 1];
    const targetWidth = getWidth(b);

    const lineItems = [];
    let lineWidth = 0, lineStretch = 0, lineShrink = 0;
    let firstBox = true;

    for (let i = start; i <= end; i++) {
      const item = items[i];

      if (item.type === 'glue' && firstBox) continue;

      if (item.type === 'box') {
        firstBox = false;
        lineWidth += item.width;
        lineItems.push(item);
      } else if (item.type === 'glue' && i < end) {
        lineWidth += item.width;
        lineStretch += item.stretch;
        lineShrink += item.shrink;
        lineItems.push(item);
      } else if (item.type === 'penalty' && i === end) {
        if (item.width > 0) {
          lineWidth += item.width;
          lineItems.push({ type: 'box', width: item.width, content: '-' });
        }
      }
    }

    // Remove trailing glue
    while (lineItems.length > 0 && lineItems[lineItems.length - 1].type === 'glue') {
      const g = lineItems.pop();
      lineWidth -= g.width;
      lineStretch -= g.stretch;
      lineShrink -= g.shrink;
    }

    // Last line: ragged right, but still shrink if overfull
    const diff = targetWidth - lineWidth;
    let ratio = 0;
    // Count glue items for distributing emergency stretch
    const glueCount = lineItems.filter(it => it.type === 'glue').length;
    const esPerGlue = emergencyStretch > 0 && glueCount > 0 ? emergencyStretch / glueCount : 0;
    const totalStretch = lineStretch + (emergencyStretch || 0);
    if (!isLastLine(b)) {
      if (diff > 0 && totalStretch > 0) ratio = Math.min(diff / totalStretch, TOLERANCE);
      else if (diff < 0 && lineShrink > 0) ratio = Math.max(diff / lineShrink, -1);
    } else if (diff < 0 && lineShrink > 0) {
      ratio = Math.max(diff / lineShrink, -1);
    }

    const positioned = [];
    let x = 0;
    for (const item of lineItems) {
      if (item.type === 'box') {
        positioned.push({ x, text: item.content, font: item.font || null });
        x += item.width;
      } else if (item.type === 'glue') {
        let adjustedWidth = item.width;
        if (ratio > 0) adjustedWidth += ratio * (item.stretch + esPerGlue);
        else if (ratio < 0) adjustedWidth += ratio * item.shrink;
        x += adjustedWidth;
      }
    }

    lines.push({ items: positioned, width: x, ratio, lastLine: isLastLine(b) });
  }

  return lines;
}

// -- hyphenate.js --

// Simple English hyphenation
// Finds possible break points in words using vowel/consonant patterns,
// common prefixes/suffixes, and double consonant rules.
// Not as good as Liang's TeX patterns but dramatically improves KP output.

const VOWELS = 'aeiouy';
const isVowel = ch => VOWELS.includes(ch);
const isCons = ch => /[a-z]/.test(ch) && !isVowel(ch);

const PREFIXES = ['over', 'under', 'counter', 'super', 'anti', 'auto', 'inter', 'intro',
  'extra', 'infra', 'ultra', 'semi', 'trans', 'cross', 'multi', 'fore',
  'dis', 'mis', 'pre', 'pro', 'non', 'out', 'sub', 'un', 're'];

const SUFFIXES = ['tion', 'sion', 'ment', 'ness', 'able', 'ible', 'less', 'ence', 'ance',
  'ling', 'ful', 'ous', 'ive', 'ing', 'ist', 'ism', 'ize', 'ise',
  'ity', 'ery', 'ary', 'ory', 'ate', 'ent', 'ant', 'dom'];

// Consonant clusters that should not be broken
const CLUSTERS = new Set(['ch', 'sh', 'th', 'ph', 'wh', 'ck', 'gh', 'gn', 'kn', 'wr',
  'bl', 'br', 'cl', 'cr', 'dr', 'fl', 'fr', 'gl', 'gr', 'pl', 'pr',
  'sc', 'sk', 'sl', 'sm', 'sn', 'sp', 'st', 'sw', 'tr', 'tw',
  'scr', 'spl', 'spr', 'str', 'squ']);

function findHyphenPoints(word) {
  const min = 5; // don't hyphenate short words
  if (word.length < min) return [];
  const lw = word.toLowerCase();
  if (!/^[a-z]+$/.test(lw)) return []; // only pure alphabetic

  const points = new Set();
  const minBefore = 2; // at least 2 chars before hyphen
  const minAfter = 3;  // at least 3 chars after hyphen

  // 1. Prefix breaks
  for (const pfx of PREFIXES) {
    if (lw.startsWith(pfx) && lw.length - pfx.length >= minAfter) {
      // Only if remainder starts with consonant (avoid "re-elect" style but allow "re-mark")
      const after = lw[pfx.length];
      if (isCons(after) || pfx.length >= 3) {
        points.add(pfx.length);
      }
    }
  }

  // 2. Suffix breaks
  for (const sfx of SUFFIXES) {
    const pos = lw.length - sfx.length;
    if (pos >= minBefore && lw.endsWith(sfx)) {
      points.add(pos);
    }
  }

  // 3. Double consonant break (let-ter, run-ning)
  for (let i = minBefore; i < lw.length - minAfter; i++) {
    if (isCons(lw[i]) && lw[i] === lw[i + 1]) {
      points.add(i + 1);
    }
  }

  // 4. V-CV pattern: break before single consonant between vowels
  for (let i = minBefore; i < lw.length - minAfter; i++) {
    if (isVowel(lw[i - 1]) && isCons(lw[i]) && isVowel(lw[i + 1])) {
      // Check it's not part of a cluster
      const pair = lw.slice(i, i + 2);
      if (!CLUSTERS.has(pair)) {
        points.add(i);
      }
    }
  }

  // 5. VC-CV pattern: between two consonants surrounded by vowels
  for (let i = minBefore; i < lw.length - minAfter; i++) {
    if (i >= 2 && isVowel(lw[i - 2]) && isCons(lw[i - 1]) && isCons(lw[i]) && isVowel(lw[i + 1])) {
      const pair = lw.slice(i - 1, i + 1);
      // Don't break consonant clusters
      if (!CLUSTERS.has(pair)) {
        points.add(i);
      }
    }
  }

  // Filter, sort, and enforce minimum 2-char gap between consecutive points
  const sorted = [...points]
    .filter(p => p >= minBefore && p <= lw.length - minAfter)
    .sort((a, b) => a - b);

  const result = [];
  for (const p of sorted) {
    if (result.length === 0 || p - result[result.length - 1] >= 2) {
      result.push(p);
    }
  }

  return result;
}

// -- parse.js --

// Markdown to box/glue/penalty items (M1: plain text + headings)

function parseToItems(text, metrics, headingMetrics) {
  const paragraphs = [];
  const lines = text.split('\n');
  let current = [];

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed === '') {
      if (current.length > 0) {
        paragraphs.push(current.join(' '));
        current = [];
      }
    } else if (trimmed === '---' || trimmed === '***' || trimmed === '___') {
      if (current.length > 0) {
        paragraphs.push(current.join(' '));
        current = [];
      }
      paragraphs.push({ type: 'pagebreak' });
    } else if (trimmed.startsWith('# ')) {
      if (current.length > 0) {
        paragraphs.push(current.join(' '));
        current = [];
      }
      paragraphs.push({ type: 'heading', level: 1, text: trimmed.slice(2) });
    } else if (trimmed.startsWith('## ')) {
      if (current.length > 0) {
        paragraphs.push(current.join(' '));
        current = [];
      }
      paragraphs.push({ type: 'heading', level: 2, text: trimmed.slice(3) });
    } else if (trimmed.startsWith('### ')) {
      if (current.length > 0) {
        paragraphs.push(current.join(' '));
        current = [];
      }
      paragraphs.push({ type: 'heading', level: 3, text: trimmed.slice(4) });
    } else {
      current.push(trimmed);
    }
  }
  if (current.length > 0) {
    paragraphs.push(current.join(' '));
  }

  const allItems = [];

  for (const para of paragraphs) {
    if (para.type === 'pagebreak') {
      allItems.push({ type: 'pagebreak' });
      continue;
    }

    if (para.type === 'heading') {
      const level = para.level;
      const hm = headingMetrics[level - 1] || metrics;
      allItems.push({
        type: 'heading',
        level,
        items: headingToItems(para.text, hm),
        metrics: hm,
      });
      continue;
    }

    const items = paragraphToItems(para, metrics);
    allItems.push({ type: 'paragraph', items });
  }

  return allItems;
}

function wordToItems(word, metrics) {
  const hyphPts = findHyphenPoints(word);

  if (hyphPts.length === 0) {
    return [box(metrics.measure(word), word)];
  }

  // Split word at hyphenation points, insert discretionary hyphens
  const items = [];
  const hyphenWidth = metrics.measure('-');
  let prev = 0;

  for (const pt of hyphPts) {
    const frag = word.slice(prev, pt);
    items.push(box(metrics.measure(frag), frag));
    // Discretionary hyphen: penalty with width of hyphen character, flagged=true
    items.push(penalty(hyphenWidth, 50, true));
    prev = pt;
  }

  // Last fragment
  const last = word.slice(prev);
  items.push(box(metrics.measure(last), last));

  return items;
}

function paragraphToItems(text, metrics) {
  const words = text.split(/\s+/).filter(w => w.length > 0);
  const items = [];
  const sw = metrics.spaceWidth;

  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const wItems = wordToItems(word, metrics);
    items.push(...wItems);

    if (i < words.length - 1) {
      // Inter-word glue: space with stretch and shrink
      // Stretch = 50% of space (allows moderate expansion)
      // Shrink = 33% of space (allows moderate compression)
      items.push(glue(sw, sw * 0.5, sw * 0.33));
    }
  }

  // Paragraph-end: finishing penalty + parfillskip glue + forced break
  items.push(penalty(0, INF_PENALTY, false));
  items.push(glue(0, INF_PENALTY, 0));
  items.push(penalty(0, NEG_INF_PENALTY, false));

  return items;
}

function headingToItems(text, metrics) {
  const words = text.split(/\s+/).filter(w => w.length > 0);
  const items = [];
  const sw = metrics.spaceWidth;

  for (let i = 0; i < words.length; i++) {
    const word = words[i];
    const w = metrics.measure(word);
    const b = box(w, word);
    b.font = metrics.font;
    items.push(b);

    if (i < words.length - 1) {
      items.push(glue(sw, sw * 0.5, sw * 0.33));
    }
  }

  items.push(penalty(0, INF_PENALTY, false));
  items.push(glue(0, INF_PENALTY, 0));
  items.push(penalty(0, NEG_INF_PENALTY, false));

  return items;
}

// -- layout.js --

// Page layout — vertical flow with page breaks

function layoutPages(parsedItems, pageSpec, metrics, headingMetrics) {
  const { w, h, margin } = pageSpec;
  const textWidth = w - margin.l - margin.r;
  const textHeight = h - margin.t - margin.b;
  const lineHeight = metrics.size * 1.5;
  const parSkip = metrics.size * 0.6;
  const indent = metrics.emWidth * 2;

  const pages = [];
  let currentPage = [];
  let y = 0;
  let isFirstPara = true;

  function newPage() {
    pages.push(currentPage);
    currentPage = [];
    y = 0;
  }

  for (const block of parsedItems) {
    if (block.type === 'pagebreak') {
      newPage();
      isFirstPara = true;
      continue;
    }

    if (block.type === 'heading') {
      const level = block.level;
      const hm = block.metrics || headingMetrics[level - 1] || metrics;
      const hLineHeight = hm.size * 1.5;
      const spaceBefore = level === 1 ? hm.size * 1.5 : hm.size;
      const spaceAfter = hm.size * 0.4;

      // Check if heading + at least one line fits
      if (y + spaceBefore + hLineHeight + lineHeight > textHeight && y > 0) {
        newPage();
      }

      y += spaceBefore;

      // Break heading lines
      const hTextWidth = textWidth;
      const hLines = lineBreak(block.items, hTextWidth);

      for (const line of hLines) {
        if (y + hLineHeight > textHeight) {
          newPage();
        }
        currentPage.push({
          type: 'line',
          items: line.items,
          x: margin.l,
          y: margin.t + y,
          font: hm.font,
          size: hm.size,
        });
        y += hLineHeight;
      }

      y += spaceAfter;
      isFirstPara = true;
      continue;
    }

    if (block.type === 'paragraph') {
      // Paragraph spacing
      if (!isFirstPara) {
        y += parSkip;
      }

      // First line of non-first paragraphs gets indent — tell KP about shorter first line
      const hasIndent = !isFirstPara;
      const lineWidths = hasIndent ? [textWidth - indent, textWidth] : textWidth;
      const lines = lineBreak(block.items, lineWidths);

      for (let i = 0; i < lines.length; i++) {
        if (y + lineHeight > textHeight) {
          newPage();
        }

        const xOffset = i === 0 && hasIndent ? indent : 0;

        currentPage.push({
          type: 'line',
          items: lines[i].items,
          x: margin.l + xOffset,
          y: margin.t + y,
          font: metrics.font,
          size: metrics.size,
        });
        y += lineHeight;
      }

      isFirstPara = false;
    }
  }

  // Push final page
  pages.push(currentPage);

  // Remove empty trailing pages
  while (pages.length > 1 && pages[pages.length - 1].length === 0) {
    pages.pop();
  }

  return pages;
}

// -- render.js --

// Render typeset pages to canvases

function renderPage(canvas, page, pageSpec, pageNum, totalPages, defaultFont) {
  const { w, h, margin } = pageSpec;
  const dpr = window.devicePixelRatio || 1;

  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // White page background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);

  // Render lines
  ctx.fillStyle = '#000';
  ctx.textBaseline = 'top';
  for (const line of page) {
    if (line.type !== 'line') continue;

    const font = line.font || defaultFont;
    ctx.font = font;

    for (const item of line.items) {
      if (item.font) ctx.font = item.font;
      else ctx.font = font;
      ctx.fillText(item.text, line.x + item.x, line.y);
    }
  }

  // Page number in footer
  ctx.textBaseline = 'alphabetic';
  ctx.font = '8pt serif';
  ctx.fillStyle = '#666';
  const numText = String(pageNum);
  const numWidth = ctx.measureText(numText).width;
  ctx.fillText(numText, (w - numWidth) / 2, h - margin.b * 0.4);
}

function renderPages(pages, pageSpec, defaultFont) {
  const canvases = [];
  for (let i = 0; i < pages.length; i++) {
    const canvas = document.createElement('canvas');
    renderPage(canvas, pages[i], pageSpec, i + 1, pages.length, defaultFont);
    canvases.push(canvas);
  }
  return canvases;
}

Sometimes the dragon would devour these unfortunate souls upon arrival; sometimes it would lock them up in the mountain where they would wither away for months or years before eventually being consumed.

## The Kingdom's Response

The kingdom had tried many times to fight the dragon. Valiant warriors, brave and true, had been sent to slay it. But the dragon's scales were hard as steel, and no sword or arrow could pierce them. The warriors were swatted aside like flies.

Over time, the kingdom came to accept the dragon as a fact of life. Philosophers argued that the dragon was necessary, that it gave meaning to life. Theologians maintained that the dragon was divine punishment. The people went about their days, tried not to think about the mountain, and consoled themselves with the thought that at least they had not yet been chosen.

### The Cost of Acceptance

But the cost was real. Every day, ten thousand people disappeared into the mountain. Families were torn apart. The old and the sick were often selected first, but no one was truly safe. The dragon's appetite was insatiable, and its demands only grew with time.

Some questioned whether this was truly the best of all possible worlds. A few brave voices whispered that perhaps the dragon could be defeated, if only the kingdom would commit its full resources to the task. But these voices were drowned out by the chorus of resignation.

## A New Hope

Then one day, a young scholar made a discovery. Deep in the ancient archives, she found references to a material harder than the dragon's scales. If enough of it could be gathered and fashioned into a weapon, the dragon might finally be vulnerable.

The scholar presented her findings to the king. At first, there was skepticism. The court advisors pointed out the enormous cost of such an undertaking. The military leaders doubted it would work. But the scholar was persistent, and the evidence was compelling.

After long deliberation, the king authorized the project. Mines were opened, forges were built, and the finest craftsmen in the kingdom set to work. It would take years, perhaps decades, but for the first time in living memory, there was hope.`;

// -- editor.js --

// CM6 markdown editor for GCU Press

function initEditor(container) {
  const {
    EditorView, EditorState, Compartment, Transaction,
    keymap, lineNumbers, highlightActiveLine, highlightSpecialChars,
    drawSelection, history, undo: cm6Undo, redo: cm6Redo,
    bracketMatching, syntaxHighlighting, HighlightStyle,
    closeBrackets,
    indentWithTab, insertNewlineAndIndent,
    indentOnInput,
    tags,
    search, searchKeymap, highlightSelectionMatches,
  } = window.CM6;

  // GCU dark theme
  const theme = EditorView.theme({
    '&': { backgroundColor: 'var(--bg1)', color: 'var(--fg-bright)',
      fontSize: 'var(--editor-font-size)', fontFamily: 'var(--mono)', height: '100%' },
    '.cm-content': { caretColor: 'var(--fg-bright)', lineHeight: '1.6',
      padding: '12px 16px', fontFamily: 'var(--mono)' },
    '.cm-cursor, .cm-dropCursor': { borderLeftColor: 'var(--fg-bright)' },
    '&.cm-focused .cm-selectionBackground, .cm-selectionBackground, .cm-content ::selection': {
      backgroundColor: 'rgba(200,155,60,0.25)' },
    '.cm-activeLine': { backgroundColor: 'rgba(200,155,60,0.05)' },
    '.cm-gutters': { backgroundColor: 'var(--bg1)', color: 'var(--fg-dim)',
      borderRight: '1px solid var(--border)', fontFamily: 'var(--mono)',
      fontSize: 'var(--editor-font-size)' },
    '.cm-activeLineGutter': { backgroundColor: 'rgba(200,155,60,0.08)' },
    '.cm-lineNumbers .cm-gutterElement': { padding: '0 4px 0 8px' },
    '&.cm-focused': { outline: 'none' },
    '.cm-scroller': { overflow: 'auto' },
    '.cm-line': { padding: '0' },
    '.cm-selectionMatch': { backgroundColor: 'rgba(200,155,60,0.15)' },
    '.cm-matchingBracket': { backgroundColor: 'rgba(200,155,60,0.3)', color: 'var(--accent) !important' },
  }, { dark: true });

  // Markdown-like highlight style
  const highlightStyle = HighlightStyle.define([
    { tag: tags.heading1, color: 'var(--accent)', fontWeight: 'bold', fontSize: '1.3em' },
    { tag: tags.heading2, color: 'var(--accent)', fontWeight: 'bold', fontSize: '1.15em' },
    { tag: tags.heading3, color: 'var(--accent)', fontWeight: 'bold' },
    { tag: tags.emphasis, fontStyle: 'italic', color: '#b8a080' },
    { tag: tags.strong, fontWeight: 'bold', color: '#ccc' },
    { tag: tags.link, color: '#7a9ec7', textDecoration: 'underline' },
    { tag: tags.url, color: '#7a9ec7' },
    { tag: tags.monospace, color: '#8cb878' },
    { tag: tags.processingInstruction, color: '#666' },
    { tag: tags.content, color: 'var(--fg-bright)' },
  ]);

  const extensions = [
    theme,
    syntaxHighlighting(highlightStyle),
    lineNumbers(),
    history(),
    bracketMatching(),
    closeBrackets(),
    indentOnInput(),
    highlightActiveLine(),
    highlightSpecialChars(),
    drawSelection(),
    EditorView.lineWrapping,
    search(),
    highlightSelectionMatches(),
    keymap.of(searchKeymap),
    keymap.of([indentWithTab]),
    keymap.of([{ key: 'Enter', run: insertNewlineAndIndent }]),
    keymap.of([{ key: 'Mod-z', run: cm6Undo }, { key: 'Mod-Shift-z', run: cm6Redo }]),
    keymap.of([{ key: 'Mod-s', run: () => { saveProject(); return true; } }]),
    EditorView.updateListener.of(update => {
      if (update.docChanged) {
        GP.source = update.view.state.doc.toString();
        GP.dirty = true;
        scheduleTypeset();
        updateStatus();
      }
    }),
    EditorView.updateListener.of(update => {
      if (update.selectionSet || update.docChanged) {
        const pos = update.view.state.selection.main.head;
        const line = update.view.state.doc.lineAt(pos);
        const cursor = $('#gp-status-cursor');
        if (cursor) cursor.textContent = `${line.number}:${pos - line.from + 1}`;
      }
    }),
  ];

  const state = EditorState.create({ doc: GP.source, extensions });
  const view = new EditorView({ state, parent: container });
  GP.editor = view;

  return view;
}

function setEditorSource(source) {
  if (!GP.editor) return;
  const { Transaction } = window.CM6;
  GP.editor.dispatch({
    changes: { from: 0, to: GP.editor.state.doc.length, insert: source },
    annotations: Transaction.addToHistory.of(false),
  });
}

// -- typeset.js --

// Bridge: editor text -> engine -> canvases

function typeset() {
  const text = GP.source;
  if (!text.trim()) {
    clearPages();
    return;
  }

  const { family, size } = GP.font;
  const metrics = createMetrics(family, size);
  const h1Metrics = createMetrics(family, size * 2, 'bold');
  const h2Metrics = createMetrics(family, size * 1.5, 'bold');
  const h3Metrics = createMetrics(family, size * 1.2, 'bold');
  const headingMetrics = [h1Metrics, h2Metrics, h3Metrics];

  const parsed = parseToItems(text, metrics, headingMetrics);
  const pages = layoutPages(parsed, GP.pageSpec, metrics, headingMetrics);
  const canvases = renderPages(pages, GP.pageSpec, metrics.font);

  GP.pages = canvases;
  displayPages(canvases);
}

function scheduleTypeset() {
  if (GP.typesetTimer) clearTimeout(GP.typesetTimer);
  GP.typesetTimer = setTimeout(typeset, 300);
}

// -- pages.js --

// Page canvas management, scroll, zoom

function displayPages(canvases) {
  const container = $('#gp-pages');
  if (!container) return;
  container.innerHTML = '';

  for (const canvas of canvases) {
    const wrapper = document.createElement('div');
    wrapper.className = 'gp-page';
    wrapper.style.transform = `scale(${GP.zoom})`;
    wrapper.style.transformOrigin = 'top center';
    wrapper.appendChild(canvas);
    container.appendChild(wrapper);
  }

  updatePageCount();
}

function clearPages() {
  const container = $('#gp-pages');
  if (container) container.innerHTML = '';
  GP.pages = [];
  updatePageCount();
}

function updatePageCount() {
  const el = $('#gp-status-pages');
  if (el) el.textContent = GP.pages.length + (GP.pages.length === 1 ? ' page' : ' pages');
}

function setZoom(z) {
  GP.zoom = Math.max(0.25, Math.min(3, z));
  const pages = $$('.gp-page');
  for (const p of pages) {
    p.style.transform = `scale(${GP.zoom})`;
  }
  const pct = $('#gp-zoom-pct');
  if (pct) pct.textContent = Math.round(GP.zoom * 100) + '%';
  const slider = $('#gp-zoom-slider');
  if (slider) slider.value = GP.zoom * 100;
}

function initZoom() {
  const slider = $('#gp-zoom-slider');
  if (slider) {
    slider.addEventListener('input', () => setZoom(slider.value / 100));
  }
  const zoomIn = $('#gp-zoom-in');
  if (zoomIn) zoomIn.addEventListener('click', () => setZoom(GP.zoom + 0.1));
  const zoomOut = $('#gp-zoom-out');
  if (zoomOut) zoomOut.addEventListener('click', () => setZoom(GP.zoom - 0.1));
  const pct = $('#gp-zoom-pct');
  if (pct) pct.addEventListener('click', () => setZoom(1));
}

// -- menu.js --

// File menu: new, open, save, export

function buildMenu() {
  const bar = $('#gp-menubar');
  if (!bar) return;

  bar.innerHTML = '';

  const fileMenu = createMenu('File', [
    { label: 'New', shortcut: 'Ctrl+N', action: newProject },
    { label: 'Open...', shortcut: 'Ctrl+O', action: openProject },
    { sep: true },
    { label: 'Save', shortcut: 'Ctrl+S', action: saveProject },
    { label: 'Save As...', action: saveProjectAs },
    { sep: true },
    { label: 'Import .md...', action: importMarkdown },
    { label: 'Export .md', action: exportMarkdown },
  ]);

  bar.appendChild(fileMenu);

  // Close menus on click outside
  document.addEventListener('click', (e) => {
    if (!bar.contains(e.target)) {
      $$('.gp-menu-item.open').forEach(el => el.classList.remove('open'));
    }
  });
}

function createMenu(label, items) {
  const wrapper = document.createElement('div');
  wrapper.className = 'gp-menu-item';

  const btn = document.createElement('button');
  btn.className = 'gp-menu-label';
  btn.textContent = label;
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = wrapper.classList.contains('open');
    $$('.gp-menu-item.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) wrapper.classList.add('open');
  });

  const dropdown = document.createElement('div');
  dropdown.className = 'gp-dropdown';

  for (const item of items) {
    if (item.sep) {
      const sep = document.createElement('div');
      sep.className = 'gp-menu-sep';
      dropdown.appendChild(sep);
      continue;
    }

    const entry = document.createElement('button');
    entry.className = 'gp-menu-entry';

    const labelSpan = document.createTextNode(item.label);
    entry.appendChild(labelSpan);

    if (item.shortcut) {
      const sc = document.createElement('span');
      sc.className = 'gp-menu-shortcut';
      sc.textContent = item.shortcut;
      entry.appendChild(sc);
    }

    entry.addEventListener('click', () => {
      wrapper.classList.remove('open');
      item.action();
    });

    dropdown.appendChild(entry);
  }

  wrapper.appendChild(btn);
  wrapper.appendChild(dropdown);
  return wrapper;
}

// -- file.js --

// File persistence: localStorage + .md import/export

const STORAGE_KEY = 'gcu-press-projects';

function getProjects() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}

function saveProjects(projects) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}

function newProject() {
  if (GP.dirty && !confirm('Discard unsaved changes?')) return;
  GP.projectId = 'p_' + Date.now();
  GP.projectName = 'untitled';
  GP.source = '';
  GP.dirty = false;
  setEditorSource('');
  typeset();
  updateTitle();
  updateStatus();
}

function openProject() {
  const projects = getProjects();
  const ids = Object.keys(projects);
  if (ids.length === 0) {
    alert('No saved projects.');
    return;
  }

  const names = ids.map(id => projects[id].name);
  const choice = prompt('Open project:\n' + names.map((n, i) => `${i + 1}. ${n}`).join('\n') + '\n\nEnter number:');
  if (!choice) return;

  const idx = parseInt(choice) - 1;
  if (idx < 0 || idx >= ids.length) return;

  const id = ids[idx];
  const proj = projects[id];
  GP.projectId = id;
  GP.projectName = proj.name;
  GP.source = proj.source;
  GP.dirty = false;
  setEditorSource(proj.source);
  typeset();
  updateTitle();
  updateStatus();
}

function saveProject() {
  if (!GP.projectId) GP.projectId = 'p_' + Date.now();
  const projects = getProjects();
  projects[GP.projectId] = {
    name: GP.projectName,
    source: GP.source,
    modified: Date.now(),
  };
  saveProjects(projects);
  GP.dirty = false;
  updateTitle();
  setMsg('saved');
}

function saveProjectAs() {
  const name = prompt('Project name:', GP.projectName);
  if (!name) return;
  GP.projectName = name;
  GP.projectId = 'p_' + Date.now();
  saveProject();
}

function importMarkdown() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.md,.txt,.markdown';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const text = await file.text();
    GP.source = text;
    GP.projectName = file.name.replace(/\.(md|txt|markdown)$/, '');
    GP.projectId = 'p_' + Date.now();
    GP.dirty = false;
    setEditorSource(text);
    typeset();
    updateTitle();
  };
  input.click();
}

function exportMarkdown() {
  const blob = new Blob([GP.source], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = GP.projectName + '.md';
  a.click();
  URL.revokeObjectURL(url);
}

function updateTitle() {
  document.title = (GP.dirty ? '\u2022 ' : '') + GP.projectName + ' \u2014 GCU Press';
}

function setMsg(text) {
  const el = $('#gp-status-msg');
  if (el) el.textContent = text;
  setTimeout(() => { if (el && el.textContent === text) el.textContent = 'ready'; }, 2000);
}

function updateStatus() {
  updateTitle();
}

// -- init.js --

// Bootstrap

(function init() {
  // Load starter text
  GP.source = STARTER;

  // Build menu
  buildMenu();

  // Initialize editor
  const editorPane = $('#gp-editor-pane');
  if (editorPane) initEditor(editorPane);

  // Initialize zoom controls
  initZoom();

  // Initialize divider drag
  initDivider();

  // Initial typeset
  typeset();

  // Update title
  updateTitle();

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey) {
      if (e.key === 'n') { e.preventDefault(); newProject(); }
      if (e.key === 'o') { e.preventDefault(); openProject(); }
    }
  });
})();

function initDivider() {
  const divider = $('#gp-divider');
  const main = $('#gp-main');
  const editorPane = $('#gp-editor-pane');
  if (!divider || !main || !editorPane) return;

  let dragging = false;

  divider.addEventListener('mousedown', (e) => {
    e.preventDefault();
    dragging = true;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const pct = Math.max(15, Math.min(85, (x / rect.width) * 100));
    editorPane.style.width = pct + '%';
  });

  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    }
  });
}
