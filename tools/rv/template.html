<div id="rv-toolbar" class="rv-toolbar">
  <span class="rv-title">rv</span>
  <label class="rv-file-label">
    <input type="file" id="rv-file-input" accept=".bin,.elf,.img,.bz2,.gz">
    Load image
  </label>
  <button id="rv-stop" class="rv-stop" hidden>Stop</button>
  <span id="rv-status" class="rv-status">idle</span>
  <span id="rv-mips" class="rv-mips"></span>
</div>
<div id="rv-terminal" class="rv-terminal"></div>
<div class="rv-statusbar">
  <span id="rv-statusbar-msg" class="rv-statusbar-msg">ready</span>
  <span id="rv-statusbar-pc" class="rv-statusbar-pc"></span>
</div>
