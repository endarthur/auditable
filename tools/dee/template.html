<div id="d3-loader" class="d3-loader">loading...</div>
<div id="d3-menubar" class="d3-menubar"></div>
<div id="d3-main" class="d3-main">
  <div id="d3-viewport" class="d3-viewport"></div>
  <div id="d3-sidebar" class="d3-sidebar hidden">
    <div class="d3-sidebar-header">
      <span class="d3-sidebar-title">controls</span>
      <button class="d3-sidebar-close" onclick="toggleSidebar()">&times;</button>
    </div>
    <div id="d3-sidebar-content" class="d3-sidebar-content"></div>
  </div>
</div>
<div id="d3-perf" class="d3-perf"></div>
<div class="d3-statusbar">
  <span id="d3-status-msg" class="d3-status-msg"></span>
  <div class="d3-status-right">
    <span id="d3-status-blocks"></span>
    <span id="d3-status-column"></span>
  </div>
</div>
