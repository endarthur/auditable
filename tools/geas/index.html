<!DOCTYPE html>
<!-- geas — the GCU shell, standalone terminal -->
<!-- Part of the Auditable project — https://github.com/endarthur/auditable -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0c10">
<title>geas</title>
<style>
/*
 * @gcu/term — structural CSS
 * Required for the renderer to behave correctly. The position,
 * pointer-events, mix-blend-mode, contain, and user-select declarations
 * encode the rendering contract; do not override them. Decorative styling
 * (font, colors, cursor color) lives in term-default.css and is intended
 * to be replaced by the host.
 */

.screen {
  position: relative;
  display: block;
  white-space: pre;
  overflow: hidden;
  user-select: text;
  cursor: text;
}
.screen .row {
  display: block;
  white-space: pre;
  contain: layout style;
}
.screen .cur {
  position: absolute;
  mix-blend-mode: difference;
  pointer-events: none;
  z-index: 2;
}
.screen.app-mouse {
  user-select: none;
  cursor: default;
}

.termhost {
  position: relative;
  display: inline-block;
  line-height: 0;
}

.termhost > textarea {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  margin: 0; padding: 0; border: 0; outline: 0;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  font: inherit;
  pointer-events: none;
  z-index: 1;
  resize: none;
  overflow: hidden;
  white-space: pre;
}

/*
 * @gcu/term — default decorative theme
 * Optional: replace any of these declarations to retheme the terminal.
 * The structural rules in term.css are not overridable; everything below
 * is.
 *
 * The --gcu-term-* custom properties are ALSO read by DomRenderer when
 * constructed with { cssVarTheme: true }. Override them on a parent
 * element + toggle a CSS class to retheme without re-instantiating
 * the renderer.
 */

.screen {
  /* Base font + layout */
  font-family: "JetBrains Mono", "Berkeley Mono", "IBM Plex Mono",
               "Space Mono", ui-monospace, monospace;
  font-size: 14px;
  line-height: 1.35;

  /* Default fg/bg — also exposed as custom properties so cssVarTheme
     consumers see them. */
  --gcu-term-fg: #c8cdd4;
  --gcu-term-bg: #0a0c10;
  color: var(--gcu-term-fg);
  background: var(--gcu-term-bg);

  /* Basic 16-color palette (matches the JS PALETTE constant; muted, not
     the harsh defaults). Overridden by cssVarTheme when set. */
  --gcu-term-color-0:  #1d2128;
  --gcu-term-color-1:  #c0533d;
  --gcu-term-color-2:  #7fa650;
  --gcu-term-color-3:  #cba24b;
  --gcu-term-color-4:  #4a8fb8;
  --gcu-term-color-5:  #9b6ea8;
  --gcu-term-color-6:  #5fa8a3;
  --gcu-term-color-7:  #c8cdd4;
  --gcu-term-color-8:  #3a4049;
  --gcu-term-color-9:  #e26a4f;
  --gcu-term-color-10: #9bc266;
  --gcu-term-color-11: #e6bf66;
  --gcu-term-color-12: #6cb1d8;
  --gcu-term-color-13: #bd8ec8;
  --gcu-term-color-14: #7fcec8;
  --gcu-term-color-15: #f0f4fa;

  --gcu-term-cursor: #d9a85f;
}
.screen .row {
  height: 1.35em;
}
.screen .cur {
  background: var(--gcu-term-cursor);
}

/* geas standalone tool — own styles.
   @gcu/term's term.css (structural) + term-default.css (theme) are
   prepended at build time and provide .screen / .termhost / .row / .cur. */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #0a0c10;
  color: #c8cdd4;
  font-family: "Space Mono", ui-monospace, monospace;
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#titlebar {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 6px 14px;
  background: #11141a;
  border-bottom: 1px solid #1d2128;
  flex: 0 0 auto;
  user-select: none;
}
#titlebar .brand {
  color: #e6bf66;
  font-weight: 700;
  letter-spacing: 0.1em;
  font-size: 13px;
}
#titlebar .tag {
  color: #5a6472;
  font-size: 11px;
  letter-spacing: 0.04em;
}
#titlebar .spacer { flex: 1; }
#titlebar .status {
  color: #6cb1d8;
  font-size: 11px;
}

.termwrap {
  flex: 1;
  min-height: 0;
  padding: 8px 10px;
  overflow: auto;
}

/* The terminal grid is sized to the viewport in JS; this just keeps it
   pinned top-left within the scrollable wrap. */
.termhost {
  display: inline-block;
}

</style>
</head>
<body>

<div id="app">
  <header id="titlebar">
    <span class="brand">geas</span>
    <span class="tag">the GCU shell</span>
    <span class="spacer"></span>
    <span class="status" id="status">starting…</span>
  </header>
  <div class="termwrap" id="termwrap">
    <div class="termhost" id="termhost">
      <div class="screen" id="screen" role="log" aria-live="polite" aria-atomic="false"></div>
      <textarea id="hidden" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    </div>
  </div>
</div>


<script>
const GEAS_BUNDLE_SOURCE = "// ⚠ GENERATED FILE — DO NOT EDIT. Source: ext/geas/src/  Build: node ext/geas/build.js\n// @gcu/geas — the GCU shell. POSIX-syntax with typed-pipe extensions.\n\n// -- ast-nodes.js --\n\n// AST node type tags + factory helpers.\n//\n// Nodes are plain object literals with a `type` discriminator string from\n// the NODE table below. Factories exist purely to centralise the shapes\n// (so a typo in a producer like `{ type: 'Pipline' }` is harder to make);\n// they're optional — consumers should pattern-match on the type field.\n\nconst NODE = Object.freeze({\n  PROGRAM:        'Program',\n  LIST:           'List',\n  AND_OR:         'AndOr',\n  PIPELINE:       'Pipeline',\n  SIMPLE_COMMAND: 'SimpleCommand',\n  BRACE_GROUP:    'BraceGroup',\n  SUBSHELL:       'Subshell',\n  IF_CLAUSE:      'IfClause',\n  FOR_CLAUSE:     'ForClause',\n  WHILE_CLAUSE:   'WhileClause',\n  UNTIL_CLAUSE:   'UntilClause',\n  CASE_CLAUSE:    'CaseClause',\n  CASE_ITEM:      'CaseItem',\n  FUNCTION_DEF:   'FunctionDef',\n  ASSIGNMENT:     'Assignment',\n  REDIRECT:       'Redirect',\n  WORD:           'Word',\n});\n\n// `body` is a List node; List wraps multiple commands separated by ';' / '&' / NEWLINE.\n// `commands` on Pipeline is the segments left-to-right (data flows L→R).\n// `negated` on Pipeline reflects a leading `!` (POSIX: invert the pipeline's exit status).\n// Redirect.fd is null when no explicit file descriptor was given (defaults inferred at exec time).\n\nfunction mkProgram(commands, pos) {\n  return { type: NODE.PROGRAM, commands, pos };\n}\n\nfunction mkList(items, pos) {\n  // items: Array<{ op: ';' | '&' | null, cmd: AndOr | Pipeline | Command }>\n  // The last item's `op` is null when the input didn't end with a terminator.\n  return { type: NODE.LIST, items, pos };\n}\n\nfunction mkAndOr(left, op, right, pos) {\n  // op: '&&' | '||'\n  return { type: NODE.AND_OR, left, op, right, pos };\n}\n\nfunction mkPipeline(commands, negated, pos) {\n  re body then B's body\n// after the trailing newline. The `<<-` variant strips leading TABS (not\n// spaces — POSIX-strict) from each body line and from the closing delimiter.\n//\n// Not yet implemented (TODOs):\n//   - Aliases. POSIX has alias expansion as a lexer-time transform; geas can\n//     defer until aliases are a real feature.\n\n// Multi-char operators MUST come before any single-char prefix to ensure\n// longest-match wins (e.g. `<<-` before `<<` before `<`).\nconst OPERATORS = [\n  '<<-', '&&', '||', ';;', ';&', '|&',\n  '<<', '>>', '<&', '>&', '<>', '>|',\n  '<', '>', '|', '&', ';', '(', ')',\n];\n\n// Characters that end an unquoted word.\nconst WORD_BOUNDARY = new Set([' ', '\\t', '\\n', '|', '&', ';', '<', '>', '(', ')']);\n\nfunction tokenize(input) {\n  const tokens = [];\n  const src = String(input ?? '');\n  let pos = 0;\n  // Queue of here-docs awaiting body capture. Each entry: { delim, quoted,\n  // stripTabs }. Filled when `<<` / `<<-` is emitted; drained when the next\n  // NEWLINE fires.\n  const heredocQueue = [];\n\n  while (pos < src.length) {\n    // Skip horizontal whitespace and line continuations.\n    pos = _skipWS(src, pos);\n    if (pos >= src.length) break;\n\n    const ch = src[pos];\n\n    // Comments: # to end of line. Newline itself stays in the stream.\n    if (ch === '#') {\n      while (pos < src.length && src[pos] !== '\\n') pos++;\n      continue;\n    }\n\n    if (ch === '\\n') {\n      const nlStart = pos;\n      pos++; // consume the newline first — heredoc bodies start on the next char\n\n      // Drain any pending here-docs. Each captures lines until its delimiter.\n      while (heredocQueue.length > 0) {\n        const hd = heredocQueue.shift();\n        const cap = _captureHeredocBody(src, pos, hd.delim, hd.stripTabs);\n        tokens.push({\n          type: 'HEREDOC_BODY',\n          value: cap.body,\n          quoted: hd.quoted,\n          delim: hd.delim,\n          stripTabs: hd.stripTabs,\n          pos: { sta // -- state.js --

// Shared mutable state for the geas standalone tool. The build
// concatenates every module into one classic-script scope, so this
// object is the single place cross-module state lives.

const GS = {
  client:   null,   // GeasClient — the main-thread facade over the worker
  terminal: null,   // @gcu/term Terminal instance
  renderer: null,   // @gcu/term DomRenderer
  input:    null,   // @gcu/term Input
  history:  [],     // command history ring (REPL up/down recall)
};

// -- vfs-setup.js --

// VFS bootstrap for the geas tool. The filesystem is one IndexedDB
// mount at / — everything (including /tmp) persists across reloads,
// which is what you want for a shell you keep coming back to.

const WELCOME_TEXT = `Welcome to geas — the GCU shell.

A real Unix-shape shell running entirely in your browser. The parser,
executor, and ~55 builtins run in a Web Worker; this filesystem is
IndexedDB-backed and persists across reloads.

Things to try:

  ls /home
  cat /home/welcome.txt
  echo "hello, $USER" | tr a-z A-Z
  seq 1 5 | while read n; do echo "line $n"; done
  for f in /home/*; do echo $f; done
  source /home/hello.sh
  find / -name '*.txt'

Up-arrow recalls history. Files you create persist. Have fun.
`;

const HELLO_SCRIPT = `# A tiny geas script — run it with:  source /home/hello.sh

greet() {
  echo "Hello from a geas function, $1!"
}
greet world

# Typed pipes: CSV in, filtered by a predicate, CSV back out.
printf 'name,age\\nada,36\\ngrace,41\\nalan,32\\n' > /tmp/people.csv
echo "people over 35:"
from-csv /tmp/people.csv | where 'age > 35' | to-csv
`;

// Create the VFS and seed /home on first run. Returns the live VFS.
async function setupVfs(vfsMod) {
  const vfs = await vfsMod.VFS.create({ type: 'idb', name: 'geas-fs' });

  // First-run seeding is gated by a marker file so we don't clobber
  // the user's edits to welcome.txt / hello.sh on later visits.
  let seeded = false;
  try { await vfs.stat('/home/.seeded'); seeded = true; }
  catch { /* not seeded yet */ }

  if (!seeded) {
    await vfs.mkdir('/home', { recursive: true });
    await vfs.mkdir('/tmp', { recursive: true });
    await vfs.writeFile('/home/welcome.txt', WELCOME_TEXT);
    await vfs.writeFile('/home/hello.sh', HELLO_SCRIPT);
    await vfs.writeFile('/home/.seeded', '1');
  }
  return vfs;
}

// -- term-setup.js --

// Terminal bootstrap — instantiate @gcu/term's Terminal + DomRenderer +
// Input, size the grid to the viewport, and drive the render loop.

// Measure one monospace cell so the grid columns/rows fit the window.
// A hidden probe inherits the .screen font (term-default.css), so the
// measurement matches what the renderer will actually paint.
function _measureCell() {
  const probe = document.createElement('div');
  probe.className = 'screen';
  probe.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;white-space:pre;';
  probe.textContent = 'X'.repeat(80);
  document.body.appendChild(probe);
  const cellW = probe.getBoundingClientRect().width / 80;
  probe.textContent = 'X';
  const cellH = probe.getBoundingClientRect().height;
  probe.remove();
  return { cellW, cellH };
}

function setupTerminal(termMod) {
  const { Terminal, DomRenderer, Input } = termMod;
  const screen = document.getElementById('screen');
  const hidden = document.getElementById('hidden');
  const wrap = document.getElementById('termwrap');

  const { cellW, cellH } = _measureCell();
  // Leave a little slack so the grid doesn't trip the wrap's scrollbar.
  const availW = wrap.clientWidth - 14;
  const availH = wrap.clientHeight - 14;
  const cols = Math.max(40, Math.min(220, Math.floor(availW / cellW) || 80));
  const rows = Math.max(12, Math.min(80,  Math.floor(availH / cellH) || 24));

  const terminal = new Terminal(cols, rows);
  const renderer = new DomRenderer(terminal, screen);
  const input = new Input(terminal, screen, hidden, renderer);

  // Render tick: blink the cursor at 530 ms, repaint when the model
  // marks itself dirty. requestAnimationFrame keeps it cheap when idle.
  let lastBlink = performance.now();
  function tick(now) {
    if (now - lastBlink > 530) {
      renderer.cursorOn = !renderer.cursorOn;
      lastBlink = now;
      terminal.dirty = true;
    }
    if (terminal.dirty) {
      try { renderer.render(); } catch { /* ignore a transient paint error */ }
      terminal.dirty = false;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Keep keyboard focus on the hidden textarea — that's where @gcu/term's
  // Input layer reads keystrokes from. Clicking the screen refocuses it.
  hidden.focus();
  screen.addEventListener('mousedown', () => {
    setTimeout(() => hidden.focus(), 0);
  });

  GS.terminal = terminal;
  GS.renderer = renderer;
  GS.input = input;
  return terminal;
}

// -- repl.js --

// The REPL loop. Reads a command line via geas's makeLineEditor (with
// up/down history recall wired through onHistory), runs it via the
// worker-hosted shell, repeats. Output streams to the terminal through
// the client's onStdout/onStderr/onBlock sinks set up in init.js.

// geas emits plain \n; a VT terminal needs \r\n to return the carriage.
function _toCRLF(text) {
  return String(text).replace(/\r?\n/g, '\r\n');
}

function startRepl(geas, client, adapter, terminal) {
  const replEdit = geas.makeLineEditor(adapter);
  const history = GS.history;

  // Opening banner.
  terminal.write('\x1b[33mgeas\x1b[0m \x1b[2m— the GCU shell\x1b[0m\r\n');
  terminal.write('\x1b[2mtry \x1b[0mcat /home/welcome.txt\x1b[2m or \x1b[0mls /home\x1b[2m.  up-arrow recalls history.\x1b[0m\r\n\r\n');

  async function loop() {
    // The loop never returns — each iteration reads one command line
    // and runs it. Errors are caught and printed so a single bad
    // command can't kill the REPL.
    for (;;) {
      // Fresh history cursor for each prompt: starts "past the newest
      // entry" so the first up-arrow recalls the most recent command.
      let histPos = history.length;
      const onHistory = (dir) => {
        histPos = Math.max(0, Math.min(history.length, histPos + dir));
        return histPos < history.length ? history[histPos] : '';
      };

      const cwd = client.cwd || '/';
      const prompt = `\x1b[36m${cwd}\x1b[0m \x1b[33m$\x1b[0m `;

      let result;
      try {
        result = await replEdit({ prompt, onHistory });
      } catch {
        terminal.write('\r\n');
        continue;
      }
      // Ctrl+D / Ctrl+C at the prompt: makeLineEditor resolves {eof}.
      // Just draw a fresh prompt — this isn't a session-ending shell.
      if (!result || result.eof) continue;

      const line = (result.line || '').trim();
      if (line === '') continue;
      if (history[history.length - 1] !== line) history.push(line);

      try {
        await client.exec(line + '\n');
      } catch (err) {
        terminal.write('\x1b[31mgeas: ' + _toCRLF(err && err.message || err) + '\x1b[0m\r\n');
      }
    }
  }
  loop();
}

// -- init.js --

// Bootstrap. Wires the four ESM bundles (geas / @gcu/term / @gcu/vfs /
// @gcu/proc) the build embedded as source strings into a running shell:
//
//   - term + vfs + proc are dynamic-imported on the main thread
//   - geas is dynamic-imported on the main thread (for the client API)
//     AND inlined into a proc module-service worker (for the executor side)
//   - the VFS lives on the main thread; the worker reaches it over the
//     RPC proxy that createGeasClient sets up
//   - proc owns the worker's process lifecycle (PID, signals, kill); the
//     geas client talks to it through procToWorker's Worker-shaped adapter
//
// GEAS_BUNDLE_SOURCE / TERM_BUNDLE_SOURCE / VFS_BUNDLE_SOURCE /
// PROC_BUNDLE_SOURCE are injected by build.js (target=geas).

function _setStatus(text) {
  const el = document.getElementById('status');
  if (el) el.textContent = text;
}

function _blobUrl(src) {
  return URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
}

async function boot() {
  try {
    _setStatus('loading…');
    // @gcu/term measures cell metrics from the live font — wait for it
    // so the grid isn't sized against the fallback face.
    if (document.fonts && document.fonts.ready) {
      await document.fonts.ready;
    }

    // Dynamic-import the four bundles off blob URLs.
    const termMod = await import(_blobUrl(TERM_BUNDLE_SOURCE));
    const vfsMod  = await import(_blobUrl(VFS_BUNDLE_SOURCE));
    const procMod = await import(_blobUrl(PROC_BUNDLE_SOURCE));
    const geas    = await import(_blobUrl(GEAS_BUNDLE_SOURCE));

    // The worker module: the geas bundle inlined verbatim, then a default
    // export that runs setupGeasWorker over a proc-ctx-derived target. No
    // cross-blob import — the worker is fully self-contained.
    _setStatus('spawning worker…');
    const workerSource =
      GEAS_BUNDLE_SOURCE +
      '\nexport default geasProcEntry({ createShell, isTyped, setupGeasWorker });\n';
    const workerUrl = _blobUrl(workerSource);

    const pm = new procMod.ProcessManager();
    const proc = await pm.spawn({ module: workerUrl, mode: 'service' });
    const worker = geas.procToWorker(proc);

    // Filesystem (IndexedDB), seeded on first run.
    _setStatus('mounting filesystem…');
    const vfs = await setupVfs(vfsMod);

    // Terminal grid.
    const terminal = setupTerminal(termMod);

    // geas client — bridges the worker to the terminal. The line editor
    // wired as onWantInput handles the interactive `read` builtin;
    // the REPL builds its own editor instance for command lines.
    _setStatus('starting shell…');
    const adapter = geas.createTermAdapter({ terminal });
    const writeOut = (t) => terminal.write(String(t).replace(/\r?\n/g, '\r\n'));
    const client = geas.createGeasClient({
      worker,
      vfs,
      env: { HOME: '/home', PWD: '/home', USER: 'guest', TERM: 'geas' },
      cwd: '/home',
      onStdout: writeOut,
      onStderr: (t) => terminal.write('\x1b[2m' + String(t).replace(/\r?\n/g, '\r\n') + '\x1b[0m'),
      onBlock:  (b) => writeOut(b && b.text ? b.text : ''),
      onWantInput: geas.makeLineEditor(adapter),
    });
    GS.client = client;
    GS.proc = proc;
    GS.pm = pm;
    await client.ready();

    _setStatus('ready');
    startRepl(geas, client, adapter, terminal);
  } catch (err) {
    _setStatus('error');
    const screen = document.getElementById('screen');
    if (screen) {
      screen.textContent = 'geas failed to start:\n\n' + (err && err.stack || String(err));
    }
    // eslint-disable-next-line no-console
    console.error('geas boot failed:', err);
  }
}

// Register the service worker (offline support) — best-effort.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => { /* ignore */ });
  });
}

boot();
</script>
</body>
</html>
