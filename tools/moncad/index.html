<!DOCTYPE html>
<!-- moncad — a small 2D CAD instrument (standalone dev app) -->
<!-- Part of the Auditable project — https://github.com/gentropic/auditable -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Networkless by construction: connect-src 'none' bans all egress. The inlined runtime
     boots as blob: ES modules in the clear (no eval); nothing external loads. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moncad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23121212'/%3E%3Cpath d='M120 392 L120 120 L392 120' fill='none' stroke='%238a9099' stroke-width='28'/%3E%3Cpath d='M150 360 A210 210 0 0 1 360 150' fill='none' stroke='%23d4773e' stroke-width='28'/%3E%3C/svg%3E">
<meta name="theme-color" content="#121212">
<style>
  :root {
    --mono: 'Space Mono', ui-monospace, monospace; --sans: 'Barlow', system-ui, sans-serif;
    --tb: 36px; --ft: 26px; --cl: 28px;
    --bg:#121212; --bg-bar:#1a1a1a; --bg-foot:#161616; --board:#121212;
    --border:#2a2a2a; --bd2:#333; --text:#bbb; --text-hi:#ddd; --muted:#888; --dim:#666; --faint:#555;
    --action:#d4773e; --info:#6aa0cf; --ok:#8cb878; --num:#c0a36e;
    --bg-btn:#242424; --bg-hover:#2e2e2e; --bg-panel:#1c1c1c; --bg-field:#141414;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #topbar {
    position: absolute; left: 0; right: 0; top: 0; height: var(--tb); display: flex; align-items: center;
    gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--bg-bar);
  }
  #topbar .title { font-family: var(--mono); font-size: 14px; color: var(--action); letter-spacing: 0.5px; }
  #topbar .dim { font-family: var(--mono); font-size: 11px; color: var(--dim); }
  #topbar .spacer { flex: 1; }
  #board { position: absolute; left: 0; right: 0; top: var(--tb); bottom: calc(var(--ft) + var(--cl)); background: var(--board); overflow: hidden; }
  #board canvas { position: absolute; inset: 0; display: block; }
  #gl { z-index: 1; }
  #overlay { z-index: 2; cursor: none; }
  #nogl {
    position: absolute; inset: 0; z-index: 3; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: 13px; text-align: center;
  }
  #nogl b { color: var(--text-hi); }
  /* command line — the typed surface (guided prompts + AutoLISP coordinate input) */
  #cmdbar {
    position: absolute; left: 0; right: 0; bottom: var(--ft); height: var(--cl); display: flex; align-items: center;
    gap: 8px; padding: 0 12px; border-top: 1px solid var(--border); background: var(--bg-bar);
  }
  #cmdPrompt { font-family: var(--mono); font-size: 11px; color: var(--info); white-space: nowrap; }
  #cmdInput {
    flex: 1; font-family: var(--mono); font-size: 12px; color: var(--text-hi); background: transparent;
    border: none; outline: none; padding: 0;
  }
  #cmdInput::placeholder { color: var(--faint); }
  #footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--ft); display: flex; align-items: center;
    gap: 10px; padding: 0 12px; border-top: 1px solid var(--border); background: var(--bg-foot);
    font-family: var(--mono); font-size: 11px; color: var(--dim);
  }
  #footer .lbl { color: var(--muted); }
  #footer .ro { color: var(--text-hi); font-variant-numeric: tabular-nums; }
  #footer .sep { width: 1px; height: 14px; background: var(--bd2); }
  #footer .spacer { flex: 1; }
  #footer .dim { color: var(--faint); }
  #footer .snap { color: var(--info); margin-left: 8px; min-width: 48px; }
  /* snap chips — status-bar toggles over the snap registry commands (SPEC §7) */
  #snapchips { display: flex; align-items: center; gap: 3px; }
  .chip {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.5px; color: var(--faint);
    background: transparent; border: 1px solid var(--bd2); border-radius: 3px; padding: 1px 5px; cursor: pointer;
  }
  .chip:hover { border-color: var(--muted); color: var(--text); }
  .chip.on { color: var(--info); border-color: var(--info); }
  .chip.off { color: var(--faint); border-color: var(--bd2); }
  .chip-master { color: var(--ok); border-color: var(--bd2); }
  .chip-master.off { color: var(--faint); text-decoration: line-through; }
  /* toolbar — friendly buttons over the command registry; tooltips teach the key */
  #topbar .toolbar { display: flex; align-items: center; gap: 4px; }
  .tb-btn { font-family: var(--mono); font-size: 11px; color: var(--text); background: var(--bg-btn); border: 1px solid var(--bd2); border-radius: 3px; padding: 3px 9px; cursor: pointer; }
  .tb-btn:hover { background: var(--bg-hover); }
  .tb-btn:disabled { color: var(--faint); opacity: .5; cursor: default; }
  .tb-sep { width: 1px; height: 16px; background: var(--bd2); margin: 0 4px; }
  /* command palette — type-to-find over the same registry */
  .pal { position: absolute; inset: var(--tb) 0 calc(var(--ft) + var(--cl)) 0; z-index: 40; display: none; align-items: flex-start; justify-content: center; background: rgba(10,10,10,0.5); }
  .pal.show { display: flex; }
  .pal-box { margin-top: 12vh; width: min(520px, 88vw); background: var(--bg-panel); border: 1px solid var(--bd2); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); overflow: hidden; }
  .pal-input { width: 100%; box-sizing: border-box; font-family: var(--mono); font-size: 14px; color: var(--text-hi); background: var(--bg-field); border: none; border-bottom: 1px solid var(--border); padding: 12px 14px; outline: none; }
  .pal-list { max-height: 320px; overflow-y: auto; }
  .pal-item { display: flex; align-items: baseline; gap: 12px; padding: 8px 14px; cursor: pointer; }
  .pal-item.sel, .pal-item:hover { background: var(--bg-hover); }
  .pal-t { flex: 1; color: var(--text-hi); font-family: var(--mono); font-size: 13px; }
  .pal-cat { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .pal-k { color: var(--action); font-family: var(--mono); font-size: 11px; min-width: 52px; text-align: right; }
</style>
<!-- Standalone @gcu/* resolution (the single-file build inlines these). -->
<script type="importmap">
{ "imports": {
  "@gcu/frame":  "../../ext/frame/index.js",
  "@gcu/dxf":    "../../ext/dxf/index.js",
  "@gcu/regula": "../../ext/regula/index.js"
} }
</script>
</head>
<body>
  <div id="topbar">
    <span class="title">moncad</span>
    <span id="toolbar" class="toolbar"></span>
    <span class="spacer"></span>
    <span id="status" class="dim"></span>
  </div>

  <div id="board">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div id="nogl"><b>WebGL2 unavailable</b><span>moncad's renderer needs WebGL2 — try a current browser.</span></div>
  </div>

  <div id="cmdbar">
    <span id="cmdPrompt">Command:</span>
    <input id="cmdInput" spellcheck="false" autocomplete="off" placeholder="type a command, or a coordinate while drawing (10,5 · @10,5 · @10&lt;45)">
  </div>

  <footer id="footer">
    <span class="lbl">XY</span><span id="coords" class="ro">—</span><span id="snap" class="snap"></span>
    <span class="sep"></span>
    <span id="zoom" class="ro">—</span>
    <span class="sep"></span>
    <span id="snapchips"></span>
    <span class="spacer"></span>
    <span id="frameInfo" class="dim"></span>
    <span class="sep"></span>
    <span id="build" class="dim">moncad · dev</span>
  </footer>

  <div id="palette" class="pal"><div class="pal-box"><input id="palInput" class="pal-input" placeholder="run a command…" spellcheck="false"><div id="palList" class="pal-list"></div></div></div>
  <input type="file" id="fileInput" accept=".dxf" style="display:none">

  <script type="module" src="./js/app.js"></script>
</body>
</html>
