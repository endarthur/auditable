<!DOCTYPE html>
<!-- strata — auditable column-oriented table surface (standalone dev app) -->
<!-- Part of the Auditable project — https://github.com/endarthur/auditable -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strata</title>
<link rel="stylesheet" href="style.css">
<!-- Standalone @gcu/* resolution (the works build inlines these instead). -->
<script type="importmap">
{ "imports": {
  "@gcu/loom":    "../../ext/loom/index.js",
  "@gcu/strata":  "../../ext/strata/index.js",
  "@gcu/recon":   "../../ext/recon/index.js",
  "@gcu/archive": "../../ext/archive/index.js"
} }
</script>
</head>
<body>
  <div id="toolbar">
    <span class="title">strata</span>
    <button id="btnOpen">Open…</button>
    <button id="btnSave" disabled>Save</button>
    <button id="btnSaveAs" disabled>Save As…</button>
    <button id="btnAddCol" disabled>+ Col</button>
    <button id="btnGroup" disabled>Group…</button>
    <button id="btnUngroup" style="display:none">← Data</button>
    <input id="filter" type="text" placeholder="filter: grade > 2  (Enter)" spellcheck="false">
    <span class="spacer"></span>
    <span class="name" id="fileName">untitled<span class="dot" id="dot" style="visibility:hidden">●</span></span>
  </div>

  <div id="grid"></div>
  <div id="empty">
    <b>open a CSV or .strata</b>
    <span>Open… · or drag a file anywhere</span>
  </div>
  <div id="drop-hint">drop to open</div>

  <footer>
    <span id="meta">no file</span>
    <span>selection: <span id="sel">—</span></span>
    <span>edits: <span id="dirty">0</span></span>
  </footer>

  <script type="module">
    import { createStrataApp } from './js/app.js';
    import { createStandaloneHost } from './js/host.js';
    createStrataApp(createStandaloneHost());
  </script>
</body>
</html>
